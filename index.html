<title>321約翰三書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}

<script>
/* 開機守門員：主程式若沒能在 8 秒內畫出東西，就顯示可診斷的畫面，而不是一片白 */
window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}
setTimeout(function(){
  var m = document.querySelector('main');
  if (!window.__booted && (!m || m.innerHTML.trim().length < 40)){

  }
}, 8000);
</script>

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"一同為真理做工","sub":"行、接、效","lv":"A","arc":"行・接・效","sec":[["1:1--4","我的兒女們按真理而行：長老、該猶與靈魂的興盛"],["1:5--8","我們應該接待這樣的人：為主的名出外的弟兄"],["1:9--10","好為首的丟特腓不接待我們：一扇關上的門"],["1:11--12","只要效法善：行善的屬乎神，低米丟的見證"],["1:13--15","按著姓名問眾位朋友安：筆墨與當面"]],"serm":{"pts":[["真理走在腳上","1:1--4","「我的兒女們按真理而行」——長老為該猶的靈魂興盛而禱告，為兒女按真理而行而喜樂；真理不是放在書架上的，是走在路上的"],["真理打開家門","1:5--8","「所以我們應該接待這樣的人」——該猶向不認識的弟兄所行的都是忠心的；他們為那名出外、一無所取，接待的人就與他們一同為真理做工"],["在開門與關門之間","1:9--15","「不要效法惡，只要效法善」——好為首的人把門關上，長老不以驕傲對抗驕傲；他把朋友的眼目轉向善，轉向有真理作見證的人，轉向當面相見、按著姓名的問安"]]},"q":"這個月，你的信箱裡也許躺著一封宣教士的代禱信，最後一段寫著：「這一季的支持還差一點，請弟兄姊妹記念。」你看了，關掉，心想下次再說。\n同一個星期，教會群組裡有人轉來一張截圖，配上半句話：「某某同工最近怎麼這樣？」底下已經有幾個人回了表情符號；而在同工會上，你發現自己很在意：這一次的決定，是不是照著我的意見走。\n這一章要問的是：我的家門、我的錢包、我的手機、我在教會裡的位子，是在托住為主名出去的人，還是在悄悄地把門關上？而我真正想要坐的，是首位，還是那個「一同做工」的位子？","truth":"「親愛的兄弟啊，不要效法惡，只要效法善。行善的屬乎神；行惡的未曾見過神」（1:11）——面對一個好為首、把門關上的人，長老沒有叫該猶去爭第一，只叫他每天選擇效法誰。\n接待為那名出外的人，就是與他們一同為真理做工（1:8）；面對把門關上的人，我們不去爭首位，只選擇效法善——因為首位是那位作眾人僕人的主的。","mv":{"t":"所以我們應該接待這樣的人，叫我們與他們一同為真理做工。","r":"約參1:8"},"card":["約翰三書只有一章，這一章就是全卷行・接・效的整條路。先是行（1:1--4）：真理先在心裡，再走在腳上，長老最大的喜樂是聽見兒女按真理而行；再是接（1:5--8）：走在真理裡的人自然打開家門，托住為那名出外的弟兄，就與他們一同為真理做工；最後是效（1:9--15）：在一個好為首、把門關上的人面前，選擇效法善，認出有真理作見證的人，盼望當面，按著名字記念朋友。次序不能倒：沒有行在真理裡的接待會被人利用，沒有接待的真理只剩書架上的知識。","這封信裡出現了很多人的名字，真正的主角卻是神。走在路上的弟兄是為「那名」出去的（1:7）——是主的名——原文只說「那名」——把他們從家裡差出去；送行的標準是「配得過神」（1:6），不是配得過人的面子；「行善的屬乎神」（1:11），每一件善事的源頭與歸屬都在祂那裡；連低米丟的見證，最後也是「真理給他作見證」（1:12）——神的真理親自替一個人開口。人可以把門關上，卻關不住神的名在一扇一扇開著的門之間往前走。","1:10「他用惡言妄論我們」，「妄論」原文 φλυαρῶν（phlyarōn），新約只出現這一次，意思是胡說、講沒有根據的閒話；同字根的形容詞在提前 5:13 譯作「說長道短」。丟特腓的武器不是大會上的辯論，是一句一句沒有根據、卻能傷人的話。這改變今天的讀法：群組裡轉傳的一張截圖、一句「聽說」、一個意味深長的表情符號，都可能是一種妄論。按下傳送以前先問：這句話是事實，還是閒話？是要幫助這個人，還是要讓他在眾人面前矮一截？","這一章照出來的我，常常不是該猶，而是一個小小的丟特腓。我也許沒有把誰趕出教會，卻可能是那個只肯接待熟人的人，陌生的弟兄、外地來的宣教士、新來的家庭，我都說「下次再說」；還可能是那個收到代禱信就關掉的人，以為供應是別人的事。兩種樣子，都是自己坐在中間。","「誰願為首，就必作眾人的僕人」（可 10:44）。這是主的話，也是丟特腓那個名號的反面。丟特腓「好為首」，原文是愛作第一；他得著了位子，卻失去了同工，最後只剩一扇只有他能開的門。長老給該猶的路正好倒過來：不是搶到前面，是蹲到底下——「接待」原文就是從底下把人托起來（1:8）。全章最該被記住的翻轉是：在神的國裡，往上爬的人關上了門，往下托的人才是一同做工的人。","這一週，做三件小事。第一，打開信箱，找出一封最近收到的宣教士或傳道人的代禱信，照著上面的事項禱告十分鐘，然後回一封信，讓他知道有人讀了；若神感動，就定下一筆每月固定的支持，不必大，要定期。第二，在群組裡忍住一次轉傳：有關某人的截圖或「聽說」，先私下去問本人，或乾脆不傳。第三，這個月邀請一位新來的、外地來的、或你不熟的弟兄姊妹到家裡吃一頓飯。","最終整合：一個星期天的下午，三點。\n教會後面的小房間裡，宣教支持小組只來了五個人。桌上一壺茶，一盒餅乾，一張影印的世界地圖，上面用紅筆圈了七個點。\n組長把一張名單攤開。每個名字後面，都有一行小字：泰北的一對夫婦，孩子剛生病；在中東教書的姊妹，這一季的支持還差三成；在城市另一頭開線上查經班的年輕傳道，最近很累。\n沒有人上過他們的講台。這五個人裡，有退休的老師，有開計程車的弟兄，有每天接送孫子的阿嬤。\n他們輪流念名字，一個一個地，按著姓名禱告。念到一半，阿嬤停下來，從皮包裡拿出一個信封：「這是我這個月省下來的，給那位姊妹。」\n組長沒有說謝謝你的奉獻。他說：「謝謝你，同工。」\n桌上的手機開著視訊，一位住在外縣市的阿伯在螢幕那頭，跟著一起念名字。\n可是這個小房間的門開著。茶涼了，名單還沒念完。\n他們都沒有出外，卻都在路上：在泰北的病床邊，在中東的教室裡，在一個疲倦的傳道人的螢幕前。\n「所以我們應該接待這樣的人，叫我們與他們一同為真理做工」（1:8）。\n不是贊助者，是同工；不是在前面，是在底下托著。\n而那張名單最上面，其實還有一個看不見的名字——那一位為我們出外、成了客旅的主，祂按著名叫自己的羊，也按著名，把這五個人叫進了祂的工作裡。"],"self":"這一章照出來的「有己」，是一個想坐首位的人：我不一定罵人，也不一定在會議上爭；我用的是更安靜的方法——訊息已讀不回，別人的提議「再研究看看」，新朋友的邀請一句「這次就算了」，把門悄悄關上。\n有己也會穿上「謹慎」的衣服：不接待陌生人是怕麻煩，不供應傳道人是說要「分辨」，其實是不想讓自己的家、自己的錢、自己的時間被打擾；或者在教會裡受了傷，就用同樣的驕傲去對抗驕傲，把自己也變成另一個丟特腓。","t321":{"k":"耶穌是我的榜樣：主耶穌自己就是那被差來的一位：祂本有神的形像，卻取了奴僕的形像（腓 2:6--7），在地上「沒有枕頭的地方」（太 8:20），靠著跟隨、供給祂的人（路 8:3）。祂說：「我給你們作了榜樣，叫你們照著我向你們所做的去做」（約 13:15），那一晚祂蹲下來，為門徒洗腳。首位本來是祂的，祂卻沒有抓住首位，反倒說「誰願為首，就必作眾人的僕人」（可 10:44）。我學的不是長老處理丟特腓的手腕，也不是該猶的熱心本身，是那位從首位下來、托住我們的主。","g":"讓耶穌作王：這一章要人讓出那個丟特腓想坐的位子——教會裡的「首位」。原文 φιλοπρωτεύων 是愛作第一；而保羅說，基督「使他可以在凡事上居首位」（西 1:18）——那張椅子是祂的。讓耶穌作王，就是在同工會、小組、家裡，把那個「凡事要照我的意思」的位子空出來給祂：我的意見可以說，卻不必贏；別人的恩賜被看見，我可以一起歡喜。可以自己檢查：我上一次在會議裡退一步，讓別人的提議通過，是甚麼時候？","p":"建立屬神的體系：這封信讓我們看見，體系是一扇一扇開著的門串起來的網——長老差出弟兄，該猶接待、送行，低米丟帶著信往下一站走，朋友們「按著姓名」彼此問安（1:15）。一個好為首的人可以讓這張網斷線，一群願意托住人的人也可以把它補起來。教會可以定下接待與差派的原則：宣教士與巡迴傳道人有固定的代禱與支持，接待之前一起分辨他傳的是不是那一位基督；有爭議時照主的話先當面、再兩三個人、再在教會中處理。國度321空中團契散在各國，更需要這樣的網：線上把真理送到，每一個名字都有人記得。"},"grp":["【一、破冰】你家裡最常接待的客人是誰？說一次你在外地被人接待、讓你到今天都記得的經驗——一頓飯、一張床，或一個人在車站等你。","【二、扎心】經文說：「但那在教會中好為首的丟特腓不接待我們」（1:9）。請不要說別人，只說自己：最近一次你很在意「這件事要照我的意思」，是在家裡、在工作上，還是在教會的哪一個場合？那時候你做了甚麼，或沒有做甚麼？","【三、福音】讀 1:7：「因他們是為主的名出外，對於外邦人一無所取。」（1:7）最先被差出來的，是主耶穌自己——祂從天上來，取了奴僕的形像，甚麼也沒有向我們取；祂說「你們要彼此接納，如同基督接納你們一樣」（羅 15:7）。如果我是先被祂托住、被祂接待的人，這會怎樣改變我看待接待、供應和「首位」？","【四、行動】說出這一週你要做的一件接待和一件供應：要邀請誰（說出名字）、在哪一天到你家或一起吃飯；要為哪一位宣教士或傳道人禱告、回信，或定下一筆每月的支持。","【五、代禱】為三種人指名禱告：一位在遠方、支持不足或身心疲倦的宣教士或傳道人；一位在教會裡受過傷、被排擠、正在考慮離開的弟兄姊妹，求主保護他，也帶領他找到可信任的人；一位兒女還沒信主、或已經走遠的父母，求主安慰他，親自去找那個孩子。"],"prac":{"main":"這一週，我不爭首位，只作一個開門、托住人的同工：按真理而行，接待為主名出去的人，效法善。","items":["對神：每天早上讀 1:7--8 一次，讀到「為主的名」就停下來，向主說：「你先為我出外，先托住了我。」然後求祂指出，今天有哪一個「首位」是我想要抓住的，請祂坐回那個位子。","對自己：寫下最近一次你很在意「照我的意思」的場景，再寫下一件你因為怕麻煩而沒有接待、沒有回應的事。在兩件事旁邊各寫一句：這件事裡，我保護的是主的名，還是我自己的位子和方便？","對人：這週邀請一位新來的、外地來的、或你不熟的弟兄姊妹吃一頓飯；如果群組裡有關於某人的截圖或閒話，不轉傳、不加表情，必要時私下去問本人，或去陪那個被說的人。","對生活：清點一次你的奉獻與支持：有沒有一位宣教士或傳道人，是你可以定期、按時、帶著代禱去供應的？金額照你的能力，不比較、不勉強；重點是成為同工，不是捐一筆錢就算了。","對使命：在小組或同工會裡提出一個具體安排：建立一份「按著姓名」的宣教士與傳道人代禱名單，每月念一次、回一次信；同時定下接待的分辨原則，並為小組裡一位只能在線上參加的人，安排這個月一次實體探訪或電話問候。"]},"safe":["① 先講 321「驕傲是離開本位抓住權力」，再拿 1:9 的丟特腓當插圖，證明我們的理念對；或把整封信講成一堂「教會領導管理課」。","約翰三書的次序是先有真理走在腳上、先有為那名出外的人，才有接待、才有對好為首的分辨；321 只能在末端認出：謙卑戰勝驕傲，是因為那位本在首位的主先下來作了僕人。把經文當理念的插圖，會眾記得的是一套管理原則，不是那位主。","檢驗標準：講完 1:9--11，會眾記得的第一個畫面，是一張 321 的圖表，還是那位為我們成了客旅、作眾人僕人的主？","② 用 1:2「我願你凡事興盛，身體健壯」宣講成功神學：「神應許每個信徒都富足健康；你生病、缺錢，是信心不夠或奉獻不夠。」","這是古代書信開頭的問安與禱告，不是神簽了名的應許；長老加上「正如你的靈魂興盛一樣」，靈魂在前。以巴弗提病得幾乎要死（腓 2:27），保羅的刺沒有挪去，主說「我的恩典夠你用的」（林後 12:9）；健康財富福音把一句祝福講成一張成績單（全卷立場見〈興盛與靈魂：「凡事興盛，身體健壯」是神的應許嗎？〉）。","檢驗標準：一位忠心卻久病、經濟困難的弟兄姊妹聽完，是被安慰、被陪伴，還是被暗示「你的信心不夠」？","③ 反過來把 1:2 講成「神只在乎你的靈魂，身體、工作、生計都不屬靈，不必為這些禱告」。","長老明明為該猶的身體與一切的事禱告；神造人有身體，看一切所造的都甚好。否定成功神學，不等於否定神的關心——為病人禱告、陪人就醫、幫人找工作，都是愛。","檢驗標準：一位為失業或病痛掙扎的人聽完，是知道可以把身體和生計帶到神面前，還是覺得這些事太俗、不配禱告？","④ 用 1:9--10 把丟特腓貼在某位真實的牧者、長老、教會或宗派身上：「我們教會的某某，就是今天的丟特腓。」","長老寫的是一個具體的歷史人物，不是給我們一張可以拿去對號入座的名單；講台與小組都不點名。丟特腓這面鏡子是用來照自己的——我們每一個人裡面都住著一個想坐首位的人（全卷立場見〈好為首：教會的權柄與屬靈的濫權，怎樣分辨？〉）。","檢驗標準：會眾聽完，是更警覺自己裡面那個好為首的舊人，還是更想回家在群組裡猜「誰是丟特腓」？","⑤ 用 1:10「我若去，必要提說他所行的事」合理化網路爆料、公開羞辱或私下結黨：「長老都公開點名了，我們也可以上網揭發。」","長老的「提說」是他親自去、在教會中、把事實擺出來，這使我們想起主說的次序：先「趁著只有他和你在一處的時候，指出他的錯來」（太 18:15），再帶一兩個人，再告訴教會；網路公審沒有程序、沒有悔改的空間，只有截圖和轉發——很容易滑成 1:10 說的「妄論」。","檢驗標準：一位在教會裡受了委屈的弟兄聽完，是知道該找誰、按甚麼程序說清楚，還是更想把截圖發到臉書上？","⑥ 反過來用「不要效法惡」叫被濫權、被排擠、被趕出的人默默忍受：「你就忍耐吧，說出來就是不屬靈。」","長老沒有叫該猶閉嘴，他自己要去「提說」；屬靈權柄是真實的，濫權也是真實的。講台要明說：受傷的人有程序可走、有人可找；受害者不必先單獨去面對施壓的人；涉及違法的事，可以報警或尋求法律協助；必要時離開一個長期濫權的環境，也不等於背叛主。","檢驗標準：一位在教會裡被長期排擠、被羞辱的姊妹聽完，是更知道自己可以求助、可以被保護，還是更覺得她只能吞下去？","⑦ 用 1:7「對於外邦人一無所取」羞辱接受供應的傳道人：「真正屬靈的傳道人不拿錢，收薪水就是貪財。」","「一無所取」講的是不向還沒信主的人伸手、不讓福音被當成生意；主說「工人得工價是應當的」（路 10:7），保羅也說傳福音的「靠著福音養生」（林前 9:14）——接受神家的供應是正當的。","檢驗標準：一位全職傳道的家人聽完，是知道他們被弟兄姊妹托住是蒙福的，還是覺得自己領的每一分錢都見不得人？","⑧ 用 1:8「我們應該接待」操控奉獻：「你不供應宣教士，就是欠神的債，就是不愛主。」","「應該」原文是欠債的字，講的是神家的榮幸與責任，不是一張催繳單；長老稱供應的人為「同工」，不是贊助者，更不是被勒索的人。用罪疚感逼出來的奉獻，失去了「一同」的喜樂。","檢驗標準：會眾聽完，是更甘心、更有喜樂地成為同工，還是帶著壓力和罪疚掏錢？","⑨ 用 1:8 叫人無限度、不分辨地接待：「凡是自稱傳道的人來，都要供應，問太多就是不愛。」","「這樣的人」是為那名出外、一無所取、配得過神的人；同一位長老在約翰二書說「不要接他到家裡」（約貳 1:10），對象是否認基督成了肉身的教師。早期教會的《十二使徒遺訓》也教人分辨：巡迴的使徒住一天、必要時兩天；住到第三天，或開口要錢，就是假先知。不分辨的接待，會讓弟兄姊妹被利用（全卷立場見〈開門與關門：約翰二書與約翰三書的接待，標準是甚麼？〉）。","檢驗標準：一位樂意接待卻曾經被人騙過的姊妹聽完，是知道可以在愛中分辨、繼續開門，還是更混亂、更不敢開門？","⑩ 用 1:11「行惡的未曾見過神」嚇人：「你還會犯罪，就證明你沒有得救、沒有見過神。」","「行善的」「行惡的」是現在分詞，描寫的是一個人一生的方向，不是一次跌倒的判決；約翰也說「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（約壹 1:9）。確據建立在基督身上，不在自己做得夠不夠（全卷立場見〈行善與見過神：「行惡的未曾見過神」，是說會失去救恩嗎？〉）。","檢驗標準：一位剛跌倒、正在悔改的弟兄聽完，是更安穩地回到基督面前，還是帶著失去救恩的恐懼回家？","⑪ 用 1:4「我聽見我的兒女們按真理而行」責備父母：「孩子沒有走在真理中，就是你們做父母的失敗。」","4 節是一位屬靈父親的喜樂，不是父母的成績單；長老說的是他「聽見」的，有些喜樂要等很久才聽見。信仰不是父母遺傳給兒女的，是神親自去找人；兒女未信或離開信仰的父母，需要的是安慰、盼望和一群人陪著代禱。","檢驗標準：一位為走遠的孩子流淚多年的母親聽完，是更有盼望地繼續為他禱告，還是更確定自己是個失敗的父母？","⑫ 用 1:13--14「不願意用筆墨……當面談論」貶低線上團契：「網路聚會不算數，只能在線上的人，就是不夠投入。」","長老自己正在用筆墨牧養該猶——這封信本身就是遠距的牧養；講台要明說：線上牧養是正當的牧養，「當面」是盼望與邀請，不是門檻；不能到場的人與到場的人同得一樣的真理；這一節對國度321空中團契這樣散在各國的群體特別要講對。","檢驗標準：一位只能用手機參加線上聚會的長輩聽完，是覺得自己也被「按著姓名」記念，還是覺得自己是次等的會友？","⑬ 用處境取消原則：「這是第一世紀巡迴傳道人的事，今天有旅館、有差會，跟我們無關」；或把處境硬搬：「每一個來訪的傳道人都一定要住你家。」","書信三問要走完：處境是福音靠巡迴傳道人一站一站傳開，靠信徒的家接待、送行；原則是為那名出外的人，神的家應該托住他們，接待的人就是同工；今天的落點是宣教士的代禱與支持、差派與送行、對外地來的弟兄姊妹開門——原則照守，落點隨處境。","檢驗標準：會眾聽完，是知道這幾節今天落在自己的家門、奉獻和代禱名單上，還是覺得它太遙遠、或被拿來勉強每一個人？","⑭ 把整章講成長老的手腕示範：「你看約翰多會處理衝突，一封信就把丟特腓擺平了，你們也要學會這種領導技巧。」","長老沒有在信裡擺平誰，他只說「我若去」，並把該猶的眼目轉向「只要效法善」；焦點在為那名出外的主，不在長老的策略，也不在丟特腓的戲劇性。把信講成權謀，會眾學到的是怎樣贏，失去的是怎樣作僕人。","檢驗標準：會眾聽完，是更佩服長老的手腕、更記得丟特腓的壞，還是更愛那位作眾人僕人的主？","⑮ 把 1:9 讀成「丟特腓是異端」，再推論「凡是不接待我們、不同意我們的領袖，就是傳異端」。","經文對丟特腓沒有任何教義的指控，他的問題寫在他的名號旁邊——好為首；這是生命與品格的問題。把不同意見都說成異端，是把一位不聽我們的人變成敵人；也會讓真正的教義分辨失去分量（全卷立場見〈好為首：教會的權柄與屬靈的濫權，怎樣分辨？〉）。","檢驗標準：會眾聽完，是更會分辨「教義的錯」和「生命的驕傲」，還是學會給一切不合己意的人貼上異端的標籤？","⑯ 用 1:12「低米丟有眾人給他作見證」叫人追求好名聲：「要讓大家都說你好，這才是屬靈。」","低米丟的三重見證裡，最重的是中間那一個——「又有真理給他作見證」；眾人的稱讚會變，真理的見證不變。把見證講成形象經營，就是另一種好為首；我們要的不是被人看見，是生命和真理吻合。","檢驗標準：會眾聽完，是更在意自己的生命是否合乎真理，還是更在意別人怎麼看自己？"]}],"txt":{"1":["作長老的寫信給親愛的該猶，就是我誠心所愛的。","親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣。","有弟兄來證明你心裡存的真理，正如你按真理而行，我就甚喜樂。","我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的。","親愛的兄弟啊，凡你向作客旅之弟兄所行的都是忠心的。","他們在教會面前證明了你的愛；你若配得過神，幫助他們往前行，這就好了。","因他們是為主的名出外，對於外邦人一無所取。","所以我們應該接待這樣的人，叫我們與他們一同為真理做工。","我曾略略地寫信給教會，但那在教會中好為首的丟特腓不接待我們。","所以我若去，必要提說他所行的事，就是他用惡言妄論我們。還不以此為足，他自己不接待弟兄，有人願意接待，他也禁止，並且將接待弟兄的人趕出教會。","親愛的兄弟啊，不要效法惡，只要效法善。行善的屬乎神；行惡的未曾見過神。","低米丟行善，有眾人給他作見證，又有真理給他作見證，就是我們也給他作見證。你也知道我們的見證是真的。","我原有許多事要寫給你，卻不願意用筆墨寫給你，","但盼望快快地見你，我們就當面談論。","願你平安。眾位朋友都問你安。請你替我按著姓名問眾位朋友安。"]},"blk":{"1":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.</p><p lang=\"grc\">Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.</p>","lit":"<p>那長老，寫給那蒙愛的該猶——就是我在真理中所愛的。</p><p>蒙愛的啊，在一切事上我禱告你走在順利的路上、身體健康，正如你的靈魂走在順利的路上。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὁ πρεσβύτερος</td><td>Ho presbyteros</td><td>那位長老</td><td>有冠詞；與約翰二書同一個自稱</td></tr><tr><td>Γαΐῳ τῷ ἀγαπητῷ</td><td>Gaiō tō agapētō</td><td>給那蒙愛的該猶</td><td>◆ 該猶是誰：不裁判</td></tr><tr><td>ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ</td><td>hon egō agapō en alētheia</td><td>我在真理中所愛的</td><td>和合本「誠心」；追蹤一、四第一站</td></tr><tr><td>Ἀγαπητέ</td><td>Agapēte</td><td>蒙愛的啊</td><td>第一聲「親愛的」；和合本補「兄弟」</td></tr><tr><td>εὔχομαί σε εὐοδοῦσθαι</td><td>euchomai se euodousthai</td><td>我禱告你一路順利</td><td>◆ 問安的套語：是禱告，不是應許</td></tr><tr><td>καὶ ὑγιαίνειν</td><td>kai hygiainein</td><td>並且身體健康</td><td>長老也為身體禱告</td></tr><tr><td>καθὼς εὐοδοῦταί σου ἡ ψυχή</td><td>kathōs euodoutai sou hē psychē</td><td>正如你的靈魂一路順利</td><td>◆ 約翰的改寫：靈魂在前</td></tr></table>","gram":"<p><strong>Ὁ πρεσβύτερος（Ho presbyteros） 與約翰二書一字不差。</strong>有冠詞，是「那位長老」：該猶一讀就知道是誰。作者不稱使徒，只稱長老；πρεσβύτερος（presbyteros） 可以指年紀，也可以指教會的職分。本系列沿用約翰一書講義的立場：作者是使徒約翰；另並陳帕皮亞（優西比烏《教會史》3.39 所引）提到的長老約翰說，以及約翰群體說，詳見議題頁。</p><p><strong>Γαΐῳ（Gaiō）「該猶」是羅馬世界極普通的名字。</strong>新約至少有三位：馬其頓人該猶（徒 19:29）、特庇人該猶（徒 20:4）、哥林多「那接待我、也接待全教會的該猶」（羅 16:23），大概也就是保羅施洗的那一位（林前 1:14）。後世《使徒憲典》7.46 說約翰立該猶作別迦摩的監督。這些都只是可能，經文沒有給我們足夠的線索把他和任何一位畫上等號；本講義不作裁判，講台只說「一位名叫該猶的弟兄」。</p><p><strong>ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ（hon egō agapō en alētheia） 和合本譯作「誠心」。</strong>與約翰二書 1:1 同一句話。ἐν ἀληθείᾳ（en alētheia） 可以讀成副詞「真誠地」，也可以讀成「在真理的範圍裡」；這封信下面一連五次說到真理，很難只讀成「真心」。本講義兩者並取：愛是真誠的，也是在真理裡的。ἀγαπητῷ（agapētō） 和 ἀγαπῶ（agapō） 緊緊挨著，該猶是「蒙愛的」，也是長老所愛的。</p><p><strong>2 節是古代書信的問安格式。</strong>埃及出土的莎草紙家書，開頭常常是「首先我禱告你身體健康」，然後才說正事。長老用的正是這個格式：περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν（peri pantōn euchomai se euodousthai kai hygiainein）。εὔχομαί（euchomai） 是「禱告、祈願」：這是一句禱告，不是一份神簽了名的應許。περὶ πάντων（peri pantōn） 和合本譯「凡事」；不少解經家認為它相當於書信套語的 πρὸ πάντων（pro pantōn）「最要緊的是」——長老說的是「我首先為你禱告」，不是「我願你樣樣都發達」。εὐοδοῦσθαι（euodousthai） 由 εὖ（好）和 ὁδός（路）組成，字面是「一路順利、走在好路上」，到新約時代多半只是「順利、亨通」的意思；保羅在羅馬書用同一個字：「終能得平坦的道路往你們那裡去」（羅 1:10）。ὑγιαίνειν（hygiainein） 是身體健康，路加說「無病的人用不著醫生」（路 5:31）用的是同一個字。和合本「兄弟」是小字補字，原文只有 Ἀγαπητέ（Agapēte）。</p><p><strong>最要緊的是後半句：καθὼς εὐοδοῦταί σου ἡ ψυχή（kathōs euodoutai sou hē psychē）。</strong>約翰把一句人人會寫的套語改了：外面的順利要「正如」裡面的順利。καθὼς（kathōs） 是「照著、正如」——量尺是靈魂。同一個動詞用了兩次，先求外面，再拿裡面當標準，次序其實是靈魂在前。3 節開頭的 γάρ（gar） 說明長老怎麼知道該猶的靈魂興盛：因為有弟兄來作見證。</p>","exp":"<p>〔約貳〕約貳 1:1--1（約翰二書講義第 1 章）</p><p>「作長老的寫信給親愛的該猶，就是我誠心所愛的」（1:1）。這是新約最短的一卷書，也是少數完全寫給一個人的信。約翰二書寫給「蒙揀選的太太和她的兒女」，是一個家、或一間教會；約翰三書只有一個名字：該猶。</p><p>信的第一句就有兩個愛字：「親愛的」和「所愛的」。長老還沒有說一句正事，先讓該猶知道他是被愛的。而且這份愛有一個所在，就是真理。在一封等一下要寫到丟特腓的信裡，這個開頭很要緊：長老要說的每一句話，包括最難聽的那一段，都是從一個愛他的人口中說出來的。</p><p>「親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣」（1:2）。這一節在華人教會常被引用，也常被講錯。有人把它講成神的應許：信主的人就該富足、健康、凡事順利；病了、窮了，就是信心不夠。這是成功神學、健康財富福音的讀法，不是約翰的意思。</p><p>第一，這是一句禱告。長老用的是古代書信開頭的問安格式，就像我們寫信說「敬祝闔府平安」。禱告是把願望交在神手裡，不是替神簽一張合約。第二，標準是靈魂。外面的順利要「正如」裡面的順利；這句話不是說「信主就會順利」，而是說「願你外面的日子，能配得上你裡面的光景」。第三，新約處處有忠心卻生病的聖徒：以巴弗提「實在是病了，幾乎要死」（腓 2:27）；保羅說「特羅非摩病了，我就留他在米利都」（提後 4:20）；保羅自己身上的刺沒有挪去，主對他說「我的恩典夠你用的」（林後 12:9）。一位忠心卻久病、貧窮的弟兄姊妹讀到這一節，應該被安慰，而不是被暗示信心不夠。</p><p>可是也不能反過來，說神只管靈魂、不管身體。長老確實為該猶的身體禱告，也為他的「凡事」禱告：他的生計、他的家、他接待客人要用的錢與力氣。神造人的身體看為甚好，我們也可以這樣為彼此禱告：為病中的肢體求醫治，為失業的弟兄求工作，為接待人的家求供應。只是次序要對：先問「你的靈魂好嗎」，再問「你的日子好嗎」。</p><p>321 說改變觀點：從屬世的觀點改變成屬神的觀點。屬世的觀點量一個人，看他的帳戶、他的健康、他的位置；屬神的觀點先看他的靈魂是不是走在真理的路上。長老給該猶的祝福，是把這兩把尺放回正確的次序。</p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.</p><p lang=\"grc\">μειζοτέραν τούτων οὐκ ἔχω χαράν ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν τῇ ἀληθείᾳ περιπατοῦντα.</p>","lit":"<p>因為我非常歡喜：弟兄們來了，又為你的真理作見證，正如你在真理中行走。</p><p>比這些更大的喜樂我沒有：就是聽見我的兒女們在真理中行走。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐχάρην γὰρ λίαν</td><td>echarēn gar lian</td><td>因為我非常歡喜</td><td>γάρ 接回 2 節；與約貳 1:4 同一句</td></tr><tr><td>ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων</td><td>erchomenōn adelphōn kai martyrountōn</td><td>弟兄們來了又作見證</td><td>現在分詞：可能是一再地來；追蹤二第一站</td></tr><tr><td>σου τῇ ἀληθείᾳ</td><td>sou tē alētheia</td><td>你的真理</td><td>和合本補成「你心裡存的真理」</td></tr><tr><td>σὺ ἐν ἀληθείᾳ περιπατεῖς</td><td>sy en alētheia peripateis</td><td>你在真理中行走</td><td>追蹤一第二站：真理走在腳上</td></tr><tr><td>μειζοτέραν τούτων οὐκ ἔχω χαράν</td><td>meizoteran toutōn ouk echō charan</td><td>比這些更大的喜樂我沒有</td><td>◆ 雙重比較級；WH 作 χάριν</td></tr><tr><td>τὰ ἐμὰ τέκνα</td><td>ta ema tekna</td><td>我自己的兒女們</td><td>強調的物主形容詞</td></tr></table>","gram":"<p><strong>ἐχάρην γὰρ λίαν（echarēn gar lian） 用 γάρ（gar） 接回 2 節。</strong>長老怎麼知道該猶的靈魂興盛？「因為」有弟兄來作見證。λίαν（lian）「非常」加重語氣；約翰二書 1:4 也是 Ἐχάρην λίαν（Echarēn lian），長老兩封信都為同一件事甚歡喜：有人在真理中行走。ἐρχομένων（erchomenōn） 與 μαρτυρούντων（martyrountōn） 是現在分詞，可能表示弟兄們一再地來、一再地說。</p><p><strong>σου τῇ ἀληθείᾳ（sou tē alētheia） 原文只是「你的真理」。</strong>和合本補成「你心裡存的真理」，把意思說出來了：真理在該猶裡面，有了他的形狀。接著 καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς（kathōs sy en alētheia peripateis） 加了一個強調的 σὺ（sy）：「正如你這個人，在真理中行走」。περιπατέω（peripateō） 是行走，也是過日子；真理先在心裡，再走在腳上。</p><p><strong>μειζοτέραν（meizoteran） 是雙重比較級。</strong>μέγας（megas） 的比較級已經是 μείζων（meizōn），長老又加了一層比較級的字尾，像口語的「更更大」，好像他找不到一個夠大的字。</p><blockquote><p>◆ 經文鑑別：SBLGNT、Treg、NA28、RP 作 χαράν（charan）「喜樂」，和合本照這個讀法；WH 作 χάριν（charin）「恩典」：「我沒有比這更大的恩典」。兩字只差一個字母，意思也相近，聽見兒女行在真理裡，既是喜樂也是恩典。抄本證據以 χαράν（charan） 較強，又與 3 節 ἐχάρην（echarēn） 同字根，本講義從 χαράν（charan）。另外 ἐν τῇ ἀληθείᾳ（en tē alētheia） 的冠詞 τῇ（tē），NA28、RP 沒有，意思不變。</p></blockquote><p>ἵνα ἀκούω（hina akouō） 在這裡說明「這個」是甚麼；ἀκούω（akouō） 是現在式，一再聽見。τὰ ἐμὰ τέκνα（ta ema tekna） 用強調的物主形容詞：「我自己的兒女們」，可能是長老帶信主的人，也可能是他所牧養的人，詳見議題頁。</p>","exp":"<p>〔約貳〕約貳 1:4--4（約翰二書講義第 1 章）</p><p>「有弟兄來證明你心裡存的真理，正如你按真理而行，我就甚喜樂」（1:3）。長老不和該猶住在一處。他對該猶近況的認識，是靠走過那扇門的弟兄帶回來的。他們回來說：那位該猶，心裡有真理，腳上也走在真理裡。</p><p>這句話有兩層，次序很美。先是「你心裡存的真理」，再是「你按真理而行」。真理不是放在書架上的，是走在路上的。一個人可以把真理背得很熟、辯得很好，卻沒有人能從他的生活裡看出來；該猶不是這樣，連過路的客人都看得見。在一個沒有電話、沒有網路的世界，這些客人就是長老的眼睛，他們看見的是一個人怎樣過日子。</p><p>「我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的」（1:4）。這是全卷的第一座高峰。一位年老的長老，一生見過神蹟、異象，也見過教會興衰，他最大的喜樂卻很樸素：聽見他的孩子們還走在真理的路上。不是聽見他們事業有成，也不是聽見他們在教會坐上高位，而是「按真理而行」。</p><p>長老說的是「我的兒女們」，他是一位屬靈的父親，在說他的喜樂；這不是一張發給所有父母的成績單。教會裡有許多父母，兒女還沒有信主，或者曾經信、後來離開了。他們讀到這一節，心裡可能一沉：我沒有這份喜樂，是我的失敗嗎？經文沒有這樣說。長老說的是「聽見」，而有些喜樂要等很久才聽見。浪子的父親「相離還遠」就看見了他（路 15:20），那份等待本身就是愛；為兒女流淚的禱告，在神面前沒有一滴是白流的。我們可以帶著安慰與盼望，繼續為兒女代禱，也繼續愛他們。</p><p>約翰二書說「我見你的兒女，有照我們從父所受之命令遵行真理的，就甚歡喜」（約貳 1:4）；約翰三書說「我的喜樂就沒有比這個大的」（1:4）。兩封信裡，長老的喜樂都落在同一個地方。321 說「3」屬靈父母兒女的關係，這一節使我們想起它：屬靈的父母最大的喜樂，不是孩子仰望自己，是孩子跟隨真理。</p>"},{"a":5,"z":6,"star":2,"grk":"<p lang=\"grc\">Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ τοῦτο ξένους,</p><p lang=\"grc\">οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·</p>","lit":"<p>蒙愛的啊，你行的是忠心的事：凡你為弟兄們所做的，而且他們是作客旅的。</p><p>他們在教會面前為你的愛作了見證；你若配得過神地送他們往前行，你就做得好。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀγαπητέ πιστὸν ποιεῖς</td><td>Agapēte piston poieis</td><td>蒙愛的啊，你行的是忠心的</td><td>第二聲「親愛的」；接待是信實的表現</td></tr><tr><td>ὃ ἐὰν ἐργάσῃ</td><td>ho ean ergasē</td><td>凡你所做的</td><td>ἐργάζομαι：接待是一份工</td></tr><tr><td>καὶ τοῦτο ξένους</td><td>kai touto xenous</td><td>而且他們是作客旅的</td><td>◆ RP 作 καὶ εἰς τοὺς ξένους</td></tr><tr><td>ἐμαρτύρησάν σου τῇ ἀγάπῃ</td><td>emartyrēsan sou tē agapē</td><td>為你的愛作了見證</td><td>追蹤二、四：暗中的愛被公開說出來</td></tr><tr><td>ἐνώπιον ἐκκλησίας</td><td>enōpion ekklēsias</td><td>在教會面前</td><td>無冠詞；從上下文看，多半是長老所在的教會</td></tr><tr><td>προπέμψας</td><td>propempsas</td><td>送他們往前行</td><td>◆ 早期教會送行的專門用語</td></tr><tr><td>ἀξίως τοῦ θεοῦ</td><td>axiōs tou theou</td><td>配得過神地</td><td>送行的標準是神</td></tr></table>","gram":"<p><strong>Ἀγαπητέ（Agapēte） 是第二聲「親愛的」。</strong>πιστὸν ποιεῖς（piston poieis） 直譯「你做的是忠心的事」：接待不是額外的好心，是信實的表現。ὃ ἐὰν ἐργάσῃ（ho ean ergasē） 用 ἐργάζομαι（ergazomai）「做工」，接待是一份工，與 8 節「一同做工」同字根。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 καὶ τοῦτο ξένους（kai touto xenous）「而且是作客旅的」，指同一群弟兄，該猶並不認識他們；RP 作 καὶ εἰς τοὺς ξένους（kai eis tous xenous）「和向客旅」，像是兩群人：弟兄與陌生人。和合本「作客旅之弟兄」兩讀都容得下。較難的 τοῦτο（touto） 讀法較可能是原文（抄寫者容易把它改順），本講義從 SBLGNT：該猶接待的不是熟人。</p></blockquote><p><strong>οἳ ἐμαρτύρησάν（hoi emartyrēsan） 是不定過去式。</strong>這些弟兄回到長老那裡，在聚會中說了。ἐνώπιον ἐκκλησίας（enōpion ekklēsias） 沒有冠詞；從上下文看，多半指長老所在的教會；該猶在自己家裡做的事，在另一間教會被公開記念。</p><p><strong>οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ（hous kalōs poiēseis propempsas axiōs tou theou）。</strong>καλῶς ποιήσεις（kalōs poiēseis）「你會做得好」是書信裡客氣的請求，相當於「請你……」。προπέμψας（propempsas） 是送行，早期教會的專門用語：供應路上所需的食物、盤纏、旅伴與介紹信，讓傳道人走到下一站。路加說「於是教會送他們起行」（徒 15:3）；保羅盼望「然後蒙你們送行」（羅 15:24）；又囑咐提多「你要趕緊給律師西納和亞波羅送行，叫他們沒有缺乏」（多 3:13）。ἀξίως τοῦ θεοῦ（axiōs tou theou） 是副詞「配得過神地」，和合本譯成條件句「你若配得過神」；送行的標準是神，好比保羅說「要叫你們行事對得起那召你們進他國、得他榮耀的神」（帖前 2:12）。</p>","exp":"<p>長老第二次叫「親愛的」，帶出的是一句肯定：「親愛的兄弟啊，凡你向作客旅之弟兄所行的都是忠心的」（1:5）。長老稱讚該猶的，不是他講道講得好，也不是他在教會有甚麼職分，而是他怎樣對待敲門的陌生人。</p><p>原文說這些弟兄「而且是作客旅的」：該猶並不認識他們。要接待老朋友不難，要打開門讓不認識的人進來吃、進來住，需要信心，也需要真理的眼光。新約常常提醒這件事：「不可忘記用愛心接待客旅」（來 13:2）；主說「我作客旅，你們留我住」（太 25:35）。該猶的門口沒有寫「熟人優先」。321 說人比事重要；920 說每一個跟我們有關係的人都是我們的「2」：這一節使我們想起，連昨天才出現在門口的弟兄，也在這個「2」裡面。</p><p>「他們在教會面前證明了你的愛」（1:6）。這是一幅很溫暖的畫面。該猶在自己家裡做的事，沒有人替他宣傳；可是那些受過接待的弟兄回到長老那裡，在聚會中站起來說：我們在路上住過一位弟兄的家，他叫該猶。暗中的接待，在神的家裡有人記得，在神面前更是記得。</p><p>「你若配得過神，幫助他們往前行，這就好了」（1:6）。接待有兩步：先留他們住，再送他們走。「送行」是一整套的照顧：一袋餅、一點盤纏、一封介紹信，也許再找一個認路的人陪一段。接待不是只顧今晚的一頓飯，是讓傳道人能走到下一站。標準也寫在這裡：「配得過神」。這不是看客人配不配得，而是看接待的人怎樣對得起差他們的那一位。「配得過神」說的是送行的方式；要不要接待，另有一把尺：「為主的名」。</p><p>這也是一個伏筆：接待有標準。不是凡來敲門、自稱傳道的，都要供應；約翰二書已經說過「不要接他到家裡」（約貳 1:10）。「配得過神」與下一節「為主的名」，是長老給該猶的兩把尺：看清楚他們是為誰出去的，然後用配得過神的方式送他們上路。</p><p>「配得過神」也在提醒接待的方式。送行不是隨便塞一點零錢，打發人快走；也不是擺出施捨的樣子，讓客人欠一份人情。配得過神的送行，是把客人當作神差來的人：他們代表的是那一位，所以要好好地、體面地、甘心地送他們走。今天差派宣教士、接待過路的傳道人、為短宣隊預備行裝，都可以用這把尺量一量。</p>"},{"a":7,"z":8,"star":3,"grk":"<p lang=\"grc\">ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ἐθνικῶν</p><p lang=\"grc\">ἡμεῖς οὖν ὀφείλομεν ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.</p>","lit":"<p>因為他們是為了那名出去的，從外邦人那裡甚麼也不拿。</p><p>所以我們應當托住這樣的人，好叫我們成為與真理同工的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑπὲρ γὰρ τοῦ ὀνόματος</td><td>hyper gar tou onomatos</td><td>因為是為了那名</td><td>◆ cu89t 註腳：原文是那名</td></tr><tr><td>ἐξῆλθον</td><td>exēlthon</td><td>他們出去了</td><td>◆ 與約貳 1:7「迷惑人的出來」同一個字</td></tr><tr><td>μηδὲν λαμβάνοντες</td><td>mēden lambanontes</td><td>甚麼也不拿</td><td>現在分詞：一路上都不拿</td></tr><tr><td>ἀπὸ τῶν ἐθνικῶν</td><td>apo tōn ethnikōn</td><td>從外邦人那裡</td><td>◆ RP 作 ἐθνῶν</td></tr><tr><td>ἡμεῖς οὖν ὀφείλομεν</td><td>hēmeis oun opheilomen</td><td>所以我們應當</td><td>ὀφείλω：欠、有義務</td></tr><tr><td>ὑπολαμβάνειν τοὺς τοιούτους</td><td>hypolambanein tous toioutous</td><td>托住這樣的人</td><td>◆ 與 λαμβάνοντες 同字根；RP 作 ἀπολαμβάνειν</td></tr><tr><td>συνεργοὶ γινώμεθα τῇ ἀληθείᾳ</td><td>synergoi ginōmetha tē alētheia</td><td>成為與真理同工的</td><td>章題；全卷樞紐</td></tr></table>","gram":"<p><strong>ὑπὲρ γὰρ τοῦ ὀνόματος（hyper gar tou onomatos） 原文只有「那名」。</strong>和合本「為主的名」的「主」是譯者補的，cu89t 註腳：名，原文是那名。在早期教會，「那名」不必再說是誰的名，就是耶穌的名：使徒「心裡歡喜，因被算是配為這名受辱」（徒 5:41）。</p><p><strong>ἐξῆλθον（exēlthon） 與約翰二書 1:7 同一個字。</strong>（SBLGNT；拜占庭抄本 RP 在約貳 1:7 作 εἰσῆλθον（eisēlthon）「進入」。）二書說「因為世上有許多迷惑人的出來」（約貳 1:7），三書說這些弟兄為那名「出外」。同樣是「出去」，一群是出去迷惑人，一群是為那名出去。出去的人很多，標準是為誰的名。</p><p><strong>μηδὲν λαμβάνοντες ἀπὸ τῶν ἐθνικῶν（mēden lambanontes apo tōn ethnikōn）「對於外邦人一無所取」。</strong>ἐθνικός（ethnikos） 在新約指外邦人、不信的人：「就是外邦人不也是這樣行嗎」（太 5:47）。λαμβάνοντες（lambanontes） 是現在分詞，一路上都不拿。ἐθνικοί（ethnikoi） 指誰有兩讀：①指未信的外邦人（多數）：他們不收不信的人的錢，以免被當成當時周遊各地、以講道收費的遊方哲士；②少數人認為指他們所傳福音的外邦信徒，像保羅不收哥林多人的供應（林後 11:7--8）。兩讀的落點相同：福音不能被看成一門生意。保羅也「晝夜做工，傳神的福音給你們」（帖前 2:9），又要人「記念主耶穌的話」：「施比受更為有福」（徒 20:35）。</p><blockquote><p>◆ 經文鑑別：7 節 SBLGNT、WH、Treg、NA28 作 ἐθνικῶν（ethnikōn），RP 作 ἐθνῶν（ethnōn）「列國、外邦」，意思相近。8 節 SBLGNT 作 ὑπολαμβάνειν（hypolambanein）「托住、接待」，RP 作 ἀπολαμβάνειν（apolambanein）「領受」；ἀπολαμβάνειν（apolambanein） 在這裡讀不太通，多半是抄寫時把相近的字頭寫混了，本講義從 SBLGNT。</p></blockquote><p><strong>ἡμεῖς οὖν ὀφείλομεν ὑπολαμβάνειν（hēmeis oun opheilomen hypolambanein） 有三層。</strong>①ἡμεῖς（hēmeis） 強調：他們不拿外邦人的，「我們」就要接。②ὀφείλω（opheilō） 是「欠、有義務」，馬太福音那個「欠他十兩銀子」（太 18:28）的債，就是這個字根；神的家欠這些人一份接待。③ὑπολαμβάνω（hypolambanō） 字面是「從底下托起來」，與 7 節 λαμβάνοντες（lambanontes）「取」同一個字根，是一個文字遊戲：他們不取，我們就托住。</p><p><strong>συνεργοὶ γινώμεθα τῇ ἀληθείᾳ（synergoi ginōmetha tē alētheia） 的與格有兩讀。</strong>可以是「為真理作同工」，真理是目標；也可以是「與真理同工」，真理是同伴。本講義兩者並取，後者更深：接待的人不只是幫傳道人的忙，是和真理本身一起做工。保羅說「因為我們是與神同工的」（林前 3:9），也是同一個 συνεργοί（synergoi） 的家族。</p>","exp":"<p>〔約貳〕約貳 1:10--11（約翰二書講義第 1 章）</p><p>「因他們是為主的名出外，對於外邦人一無所取」（1:7）。這些人是誰？他們不是觀光客，也不是生意人，而是為了「那名」離開家鄉的傳道人。他們走在小亞細亞的路上，從一個城到另一個城，沒有差會給他們薪水，也不向路邊不信的人伸手。他們一無所取，因為他們不要讓福音看起來像一門生意。</p><p>「所以我們應該接待這樣的人，叫我們與他們一同為真理做工」（1:8）。這是全卷的樞紐，也是本章的章題。長老用了一個很重的字「應該」，原文是欠債的那個字：神的家欠這些人一份接待。可是這個「欠」，不是一張催繳單，而是一份榮幸。因為接下去的一句話把接待提升了：接待的人「與他們一同」為真理做工。該猶沒有上路，沒有講道，可是他打開門、擺上餐桌、送他們上路的那一刻，他就成了同工。</p><p>第一，這一節不是叫人羞辱接受供應的傳道人。主說「因為工人得工價是應當的」（路 10:7）；保羅說「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14）；又說「在道理上受教的，當把一切需用的供給施教的人」（加 6:6）。傳道人不向外邦人取，正是因為神的家應該供應他們，配得被供應的人不必羞愧。第二，它也不是拿來操控奉獻、製造罪疚的經文。長老說「應該」，是邀請弟兄姊妹進入一份同工的榮幸，不是說不供應就不愛主。供應的人不是贊助者，是同工。</p><p>第三，接待有分辨。「這樣的人」是有所指的：為那名出外、一無所取、配得過神的人。同一位長老在約翰二書說：「若有人到你們那裡，不是傳這教訓，不要接他到家裡，也不要問他的安」（約貳 1:10）。一封叫人關門，一封叫人開門；標準不是認不認識，也不是誰掌權，是傳不傳那一位基督、是不是為主的名。早期教會的《十二使徒遺訓》11--12 章也這樣分辨：巡迴的使徒住一兩天，若住到第三天、或開口要錢，就是假先知。開門是常態，但開門不等於不分辨；接待不是叫人被利用。</p><p>321 說先生命、再關係、後事工。該猶的次序正是這樣：先「按真理而行」（1:3），再「證明了你的愛」（1:6），然後才「一同為真理做工」（1:8）。321 說無己：為耶穌、為別人、不為自己——出外的人不為自己取，接待的人不為自己留。國度321空中團契在線上傳真理，也需要一群「該猶」：為傳道的人禱告、供應、接待、轉介，一起把真理送到下一站。這不是旁觀，是同工。</p>"},{"a":9,"z":10,"star":3,"grk":"<p lang=\"grc\">Ἔγραψά τι τῇ ἐκκλησίᾳ· ἀλλʼ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.</p><p lang=\"grc\">διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.</p>","lit":"<p>我寫了一點給教會；但那在他們中間愛作第一的丟特腓不接納我們。</p><p>因此，我若來，我要提醒人記得他所做的那些事：用惡的話胡說我們；並且不以這些為足，他自己不接納弟兄們，那些願意的，他也攔阻，又把他們從教會裡丟出去。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἔγραψά τι τῇ ἐκκλησίᾳ</td><td>Egrapsa ti tē ekklēsia</td><td>我寫了一點給教會</td><td>◆ 和合本「略略地」；RP 無 τι</td></tr><tr><td>ὁ φιλοπρωτεύων αὐτῶν</td><td>ho philoprōteuōn autōn</td><td>那在他們中間愛作第一的</td><td>◆ 新約只有這裡</td></tr><tr><td>Διοτρέφης</td><td>Diotrephēs</td><td>丟特腓</td><td>「宙斯所養育的」；不拿名字作文章</td></tr><tr><td>οὐκ ἐπιδέχεται ἡμᾶς</td><td>ouk epidechetai hēmas</td><td>不接納我們</td><td>追蹤三第二站；也可指不承認權柄</td></tr><tr><td>ὑπομνήσω αὐτοῦ τὰ ἔργα</td><td>hypomnēsō autou ta erga</td><td>我要提醒人記得他的作為</td><td>公開把事實擺出來，卻不是羞辱</td></tr><tr><td>λόγοις πονηροῖς φλυαρῶν ἡμᾶς</td><td>logois ponērois phlyarōn hēmas</td><td>用惡的話胡說我們</td><td>◆ φλυαρέω 新約只有這裡</td></tr><tr><td>κωλύει</td><td>kōlyei</td><td>他攔阻</td><td>現在式：可讀作「想要攔阻」</td></tr><tr><td>ἐκ τῆς ἐκκλησίας ἐκβάλλει</td><td>ek tēs ekklēsias ekballei</td><td>從教會裡丟出去</td><td>全卷最低點；追蹤三翻轉</td></tr></table>","gram":"<p><strong>Ἔγραψά τι τῇ ἐκκλησίᾳ（Egrapsa ti tē ekklēsia）「我曾略略地寫信給教會」。</strong>τι（ti） 是「一點、一些」，和合本譯作「略略地」。那封信是哪一封？三讀：①就是約翰二書，但二書處理的是基督論的分辨，不是接待巡迴的弟兄；②一封已經失傳的信，多數解經家這樣看；③約翰一書，可能性較小。本講義不作裁判。那封信多半被丟特腓壓下了，所以長老改寫給該猶。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 Ἔγραψά τι（Egrapsa ti）；RP 沒有 τι（ti），作「我寫了信給教會」。τι（ti） 讓信聽起來不長、不重，較難的讀法可能是原文，也和和合本「略略地」相合；本講義從 SBLGNT。</p></blockquote><p><strong>φιλοπρωτεύων（philoprōteuōn） 新約只有這裡。</strong>由 φίλος（philos）「愛」和 πρῶτος（prōtos）「第一」組成：愛作第一、愛坐首位。現在分詞，這是他的樣子，不是一時失態。保羅說基督「使他可以在凡事上居首位」（西 1:18），那裡的 πρωτεύων（prōteuōn） 與這裡同字根：只有一位配在凡事上居首位。Διοτρέφης（Diotrephēs） 這個名字的意思是「宙斯所養育的」，這個名字不算常見，多見於有地位的家庭，一句帶過即可，不拿名字作文章。αὐτῶν（autōn）「在他們中間」，表示他在那間教會有實權。</p><p><strong>οὐκ ἐπιδέχεται ἡμᾶς（ouk epidechetai hēmas） 是現在式。</strong>一直不接。ἐπιδέχομαι（epidechomai） 是接納，這個字也可以指承認、接受某人的權柄。經文對丟特腓唯一的指控，是品格與行為；沒有一句說他傳錯了教義。各家有三讀：①他傳異端（經文沒有任何教義指控）；②他是抗拒長老權柄、要獨攬地方教會的領袖（多數解經家）；③這是巡迴使徒與地方監督制度交替時的張力（社會史讀法）。本講義的立場見全卷立場：問題在心，不在頭腦。αὐτῶν（autōn）「他們的」也暗示該猶未必屬於那間教會，兩說都有。</p><p><strong>10 節：ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ（hypomnēsō autou ta erga ha poiei）。</strong>ὑπομιμνῄσκω（hypomimnēskō） 是「提醒、使人記起」，把他所行的擺在眾人面前——公開，卻不是羞辱，也不是添油加醋；而且有條件：ἐὰν ἔλθω（ean elthō），「我若去」——當面、在那間教會裡。λόγοις πονηροῖς φλυαρῶν ἡμᾶς（logois ponērois phlyarōn hēmas）：φλυαρέω（phlyareō） 新約只有這裡，意思是胡說、講沒有根據的閒話；同字根的 φλύαρος（phlyaros） 見於提摩太前書「又說長道短」（提前 5:13）。惡言加上空話：沒有內容，卻有殺傷力。接著是一串遞進：καὶ μὴ ἀρκούμενος ἐπὶ τούτοις（kai mē arkoumenos epi toutois）「還不以此為足」，他自己不接待弟兄，κωλύει（kōlyei） 攔阻願意接待的人，最後 ἐκ τῆς ἐκκλησίας ἐκβάλλει（ek tēs ekklēsias ekballei）「把他們從教會裡丟出去」。ἐκβάλλω（ekballō） 是丟出去；κωλύει（kōlyei） 與 ἐκβάλλει（ekballei） 都是現在式，可能是「正想要」的意欲用法，也可能是已經發生的事。被趕出會堂的那個瞎子，經上說「於是把他趕出去了」（約 9:34），用的是同一個動詞。</p>","exp":"<p>「我曾略略地寫信給教會，但那在教會中好為首的丟特腓不接待我們」（1:9）。信寫到這裡，畫面一轉。前面是一扇打開的門：該猶的家；這裡是一扇關上的門：教會的大門，關門的人坐在首位上。</p><p>長老對丟特腓只用了一個詞：「好為首」，愛作第一。他沒有說丟特腓傳了異端，也沒有說他否認基督；他的問題不在頭腦，在心。321 說驕傲是離開本位抓住權力：離開人的本位，抓住神的權力，想要代替神。丟特腓是這句話在新約最清楚的畫像。他離開了僕人的本位，抓住了只屬於基督的「首位」，連長老派來的人都擋在門外。主耶穌的話正好是他的反面：「在你們中間，誰願為首，就必作眾人的僕人」（可 10:44）；「為首領的，倒要像服事人的」（路 22:26）。</p><p>讀到這裡，最容易的反應是在心裡點名：我們教會的某某，就像丟特腓。可是這一面鏡子不是拿來照別人的，是拿來照自己的。所以讀這兩節時，不對號入座，也不要把丟特腓的名字貼在任何一位真實的牧者、長老、教會或宗派身上。我們每一個人裡面，都住著一個丟特腓：在家裡想要說了算，在小組裡想要主導話題，在服事裡不喜歡別人做得比自己好，對威脅自己位置的人不肯接納。好為首不只是講台上的試探，也是餐桌旁、辦公室裡的試探。</p><p>「所以我若去，必要提說他所行的事，就是他用惡言妄論我們。還不以此為足，他自己不接待弟兄，有人願意接待，他也禁止，並且將接待弟兄的人趕出教會」（1:10）。這是全卷最低的谷底。丟特腓做了四件事：用惡言妄論人、自己不接待、禁止別人接待、把接待的人趕出教會。好為首的生命，最後一定變成一扇鎖住的門，而且只有他自己有鑰匙。開門的人，反而被趕到門外。驕傲激起驕傲，最後傷的是整個身體。長老的回應不是隔空回擊，是當面去處理。</p><p>長老怎樣回應？這一點今天的教會尤其要學。他說「我若去」：當面去、到那間教會裡、在眾人面前把事實擺出來。這使我們想起主所教導的次序：先私下指出，再帶一兩個人，再告訴教會（太 18:15--17）。這不是網路爆料、公開羞辱，也不是私下結黨、四處放話。長老沒有用惡言回敬惡言，沒有替丟特腓取綽號，也沒有叫該猶去和他鬥；他只「提說他所行的事」，然後立刻轉向該猶說：只要效法善。</p><p>另一方面，屬靈權柄是真實的，濫權也是真實的。教會裡若有人像那些被趕出去的弟兄，被冤枉、被排擠、被權力傷害，不是叫他默默忍受。長老沒有對被趕出的人說「忍一忍就好」，他說他要去處理。我們也要分辨、要保護受傷的人，按著教會的程序求助，讓事實在光中被說清楚。</p>"},{"a":11,"z":11,"star":2,"grk":"<p lang=\"grc\">Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.</p>","lit":"<p>蒙愛的啊，不要效法那惡的，乃要效法那善的。行善的是出於神；行惡的沒有見過神。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἀγαπητέ μὴ μιμοῦ τὸ κακὸν</td><td>Agapēte mē mimou to kakon</td><td>蒙愛的啊，不要效法那惡的</td><td>第三聲「親愛的」；現在命令式</td></tr><tr><td>ἀλλὰ τὸ ἀγαθόν</td><td>alla to agathon</td><td>乃要效法那善的</td><td>冠詞：抽象的惡與善</td></tr><tr><td>ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν</td><td>ho agathopoiōn ek tou theou estin</td><td>行善的是出於神</td><td>現在分詞：生命的方向</td></tr><tr><td>ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν</td><td>ho kakopoiōn ouch heōraken ton theon</td><td>行惡的沒有見過神</td><td>完成式：至今沒有見過</td></tr></table>","gram":"<p><strong>第三聲 Ἀγαπητέ（Agapēte）。</strong>全卷最直接的一道命令，前面仍是最溫柔的稱呼。μιμοῦ（mimou） 是 μιμέομαι（mimeomai）「模仿、效法」的現在命令式：持續地、天天地選擇效法誰。動詞 μιμέομαι（mimeomai） 新約另見帖後 3:7、9 和「效法他們的信心」（來 13:7）；名詞 μιμητής（mimētēs）「效法的人」見「你們該效法神」（弗 5:1）、「你們該效法我，像我效法基督一樣」（林前 11:1）。τὸ κακὸν（to kakon） 與 τὸ ἀγαθόν（to agathon） 有冠詞，是抽象的「那惡」「那善」；可是這一節夾在丟特腓（惡的樣式）與低米丟（善的樣式）中間，抽象的善惡都有了一張臉。</p><p><strong>ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν（ho agathopoiōn ek tou theou estin）· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν（ho kakopoiōn ouch heōraken ton theon）。</strong>ἀγαθοποιῶν（agathopoiōn）、κακοποιῶν（kakopoiōn） 是現在分詞，描寫的是一個人持續的生命方向與樣式，不是一次跌倒。ἐκ τοῦ θεοῦ（ek tou theou）「出於神」是約翰的說法：「凡不行義的就不屬神」（約壹 3:10）。οὐχ ἑώρακεν（ouch heōraken） 是完成式，「沒有見過，到如今仍沒有」；約翰一書說「凡犯罪的，是未曾看見他，也未曾認識他」（約壹 3:6）。ἑώρακεν（heōraken） 與 14 節 ἰδεῖν（idein）「見你」在字典裡同屬一個動詞「看見」（ὁράω（horaō））：長老盼望見該猶，行惡的卻沒有見過神。</p>","exp":"<p>〔約壹〕約壹 3:6--10（約翰一書講義第 3 章）</p><p>地勢從 10 節的谷底一下子拉回高處，靠的只是一句話：「親愛的兄弟啊，不要效法惡，只要效法善。行善的屬乎神；行惡的未曾見過神」（1:11）。長老剛寫完丟特腓的四件事，語氣卻沒有變硬。他沒有對該猶說「你要站出來對抗他」，也沒有說「你要比他更強」；他只說：親愛的，別效法他。</p><p>這是長老對付「好為首」的方法，這使我們想起 321 說的謙卑戰勝驕傲。驕傲對抗驕傲，兩敗俱傷；你若用丟特腓的方法對付丟特腓，你就成了另一個丟特腓。謙卑帶動謙卑，才能達到雙贏。該猶不需要贏過那個坐首位的人，他只需要繼續作一個開門的人。焦點在耶穌，不在別人：不是天天盯著丟特腓，而是天天選擇效法善。主自己說「我給你們作了榜樣」（約 13:15），善有一張最清楚的臉，就是祂。</p><p>「行惡的未曾見過神」這半句，不是拿來製造恐懼的。現在分詞講的是生命的方向，是一個人一生的樣式，不是一次失敗的判決。一位認真跟隨主、卻在某件事上跌倒的弟兄姊妹，不必讀到這一節就懷疑自己有沒有得救。約翰在同一批書信裡也說：「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督」（約壹 2:1）；「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（約壹 1:9）。確據建立在基督的工作上，不是建立在我們從不失敗。</p><p>可是這一節也不容許另一種錯：說行甚麼都無所謂。見過神的人，生命會有方向；一個長年用惡言傷人、把開門的人趕出去、卻自以為屬靈的人，這一節是給他的警鐘。長老把這面鏡子同時遞給該猶與丟特腓：你在效法誰？你的生命往哪裡走？</p>"},{"a":12,"z":12,"star":1,"grk":"<p lang=\"grc\">Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.</p>","lit":"<p>低米丟已經被眾人作了見證，也被那真理本身作了見證；我們也作見證，而且你知道我們的見證是真的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Δημητρίῳ μεμαρτύρηται</td><td>Dēmētriō memartyrētai</td><td>關於低米丟，已經被作了見證</td><td>◆ 完成式被動；和合本補「行善」</td></tr><tr><td>ὑπὸ αὐτῆς τῆς ἀληθείας</td><td>hypo autēs tēs alētheias</td><td>被那真理本身</td><td>追蹤一第五站：真理自己開口</td></tr><tr><td>καὶ ἡμεῖς δὲ μαρτυροῦμεν</td><td>kai hēmeis de martyroumen</td><td>我們也作見證</td><td>第三重見證</td></tr><tr><td>ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν</td><td>hē martyria hēmōn alēthēs estin</td><td>我們的見證是真的</td><td>◆ RP 作 οἴδατε；這使我們想起約 21:24</td></tr></table>","gram":"<p><strong>「行善」是小字補字。</strong>原文只說 Δημητρίῳ μεμαρτύρηται（Dēmētriō memartyrētai）「關於低米丟，已經被作了見證」，沒有「行善」二字；cu89t 以小字補上，把 12 節接到 11 節「行善的屬乎神」。μεμαρτύρηται（memartyrētai） 是完成式被動：見證已經作成，至今有效。三重見證：ὑπὸ πάντων（眾人）、ὑπὸ αὐτῆς τῆς ἀληθείας（真理本身）、καὶ ἡμεῖς δὲ μαρτυροῦμεν（我們）。這使我們想起律法所說：「總要憑兩三個人的口作見證才可定案」（申 19:15）。</p><blockquote><p>◆ 經文鑑別：SBLGNT、WH、Treg、NA28 作 οἶδας（oidas）「你知道」，和合本照這個讀法；RP 作 οἴδατε（oidate）「你們知道」。全信寫給該猶一人，單數較合上下文，本講義從 SBLGNT。</p></blockquote><p>καὶ οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν（kai oidas hoti hē martyria hēmōn alēthēs estin） 幾乎就是約翰福音的結尾：「我們也知道他的見證是真的」（約 21:24）。</p>","exp":"<p>〔約〕約 21:24--24（約翰福音講義第 21 章）</p><p>丟特腓之後，長老介紹另一個人：「低米丟行善，有眾人給他作見證，又有真理給他作見證，就是我們也給他作見證。你也知道我們的見證是真的」（1:12）。他很可能就是送這封信的人，這封信也等於一封介紹信，就像保羅寫「我對你們舉薦我們的姊妹非比」（羅 16:1）；也可能是下一批要到該猶家的傳道人之一。以弗所有一位造銀龕的銀匠「名叫底米丟」（徒 19:24），和合本譯名不同，有人說是同一人，這只是猜測，本講義不採用。</p><p>丟特腓有位，低米丟有見證。一個人最後被記得的，不是他坐過甚麼位子，而是有沒有真理為他作見證。最動人的是中間那一句：「又有真理給他作見證」。前面都是人為真理作見證，到這裡，真理自己開口了；一個人的生命與真理吻合到一個地步，真理就替他說話。321 說得勝者，這一節使我們想起：得勝者不一定是站在最前面的人，而是有真理為他作見證的人。</p><p>這一節也讓我們看見長老怎樣幫一間受傷的教會。他沒有只寫一封信罵丟特腓，而是送去一個值得接待的人，又為他作保。對付關門最好的方法，是送去一個值得開門的人；對付惡言最好的方法，是讓真實的見證被聽見。該猶若接待低米丟，就又一次站在善的那一邊。我們也可以這樣問自己：別人提到我的時候，真理願不願意站出來替我作見證？</p>"},{"a":13,"z":15,"star":2,"grk":"<p lang=\"grc\">Πολλὰ εἶχον γράψαι σοι, ἀλλʼ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι γράφειν</p><p lang=\"grc\">ἐλπίζω δὲ εὐθέως σε ἰδεῖν, καὶ στόμα πρὸς στόμα λαλήσομεν.</p><p lang=\"grc\">Εἰρήνη σοι. ἀσπάζονταί σε οἱ φίλοι. ἀσπάζου τοὺς φίλους κατʼ ὄνομα.</p>","lit":"<p>我原有許多事要寫給你，卻不願意藉著墨和筆寫給你；</p><p>但我盼望很快見到你，我們就要口對口地說話。</p><p>平安歸你。朋友們問候你。你要按著名字問候朋友們。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Πολλὰ εἶχον γράψαι σοι</td><td>Polla eichon grapsai soi</td><td>我原有許多事要寫給你</td><td>未完成式：我本來有</td></tr><tr><td>διὰ μέλανος καὶ καλάμου</td><td>dia melanos kai kalamou</td><td>藉著墨和筆</td><td>κάλαμος：蘆葦筆</td></tr><tr><td>εὐθέως σε ἰδεῖν</td><td>eutheōs se idein</td><td>很快見到你</td><td>與 11 節 ἑώρακεν 同屬「看見」一詞</td></tr><tr><td>στόμα πρὸς στόμα λαλήσομεν</td><td>stoma pros stoma lalēsomen</td><td>我們要口對口地說話</td><td>◆ 與約貳 1:12 同一個說法</td></tr><tr><td>Εἰρήνη σοι</td><td>Eirēnē soi</td><td>平安歸你</td><td>二書結語說喜樂，三書結語說平安</td></tr><tr><td>ἀσπάζονταί σε οἱ φίλοι</td><td>aspazontai se hoi philoi</td><td>朋友們問候你</td><td>◆ 約翰書信最後一句落在「朋友」與「名字」</td></tr><tr><td>κατʼ ὄνομα</td><td>kat' onoma</td><td>按著名字</td><td>這使我們想起約 10:3</td></tr></table>","gram":"<p><strong>Πολλὰ εἶχον γράψαι σοι（Polla eichon grapsai soi）。</strong>εἶχον（eichon） 是未完成式，「我本來有」。διὰ μέλανος καὶ καλάμου（dia melanos kai kalamou）：μέλαν（melan） 是墨，約翰二書也用它；κάλαμος（kalamos） 新約別處是蘆葦，「要看風吹動的蘆葦嗎」（太 11:7），或量度的葦子（啟 11:1），這裡是削尖的蘆葦筆。約翰二書說「紙墨」（χάρτου καὶ μέλανος（chartou kai melanos）），三書說「筆墨」：兩封信同一個收尾，一封提到紙，一封提到筆。</p><blockquote><p>◆ 經文鑑別：13 節 SBLGNT、WH、Treg、NA28 作 γράψαι σοι（grapsai soi）……γράφειν（graphein），RP 把兩個不定詞的時態對調，作 γράφειν（無 σοι（soi））……γράψαι（grapsai）；14 節 SBLGNT 作 σε ἰδεῖν（se idein），RP 作 ἰδεῖν σε（idein se），只是字序不同。兩處都不影響意思，本講義從 SBLGNT。</p></blockquote><p><strong>στόμα πρὸς στόμα λαλήσομεν（stoma pros stoma lalēsomen） 直譯「口對口說話」。</strong>和合本「當面談論」，與約翰二書 1:12 同一個說法。這使我們想起神論到摩西說「我要與他面對面說話」（民 12:8），七十士譯本作 στόμα κατὰ στόμα（stoma kata stoma），介系詞不同，畫面一樣親近。εὐθέως（eutheōs） 是很快；ἰδεῖν（idein） 與 11 節 ἑώρακεν（heōraken） 在字典裡同屬一個動詞「看見」（ὁράω（horaō））。英王欽定本與部分譯本把 14、15 節合為 14 節，本系列所用的和合本與 SBLGNT 都分作 15 節。</p><p><strong>15 節：Εἰρήνη σοι（Eirēnē soi） 是希伯來人的問安 shalom。</strong>接著 ἀσπάζονταί σε οἱ φίλοι（aspazontai se hoi philoi）。φίλος（philos） 是朋友；約翰的群體可能以「朋友」彼此相稱（這使我們想起約 15:14--15）。最後 ἀσπάζου τοὺς φίλους κατʼ ὄνομα（aspazou tous philous kat' onoma）：κατʼ ὄνομα（kat' onoma）「按著名字」，一個一個地問。約翰福音說好牧人「他按著名叫自己的羊」（約 10:3），是同一個片語。</p>","exp":"<p>〔約〕約 15:13--15（約翰福音講義第 15 章）</p><p>「我原有許多事要寫給你，卻不願意用筆墨寫給你，但盼望快快地見你，我們就當面談論」（1:13--14）。長老寫到這裡停了筆。他還有許多話，卻不想再寫了；他想要的是見面，口對口地說話。約翰二書也是一樣的收尾：「卻不願意用紙墨寫出來，但盼望到你們那裡，與你們當面談論」（約貳 1:12）。</p><p>這兩節對國度321空中團契特別親切。長老自己正在用筆墨牧養該猶，這封信本身就是一份遠距的事工；沒有這張紙，該猶就不知道長老的心意，也不知道低米丟可以接待。所以筆墨不是次等，它是一座橋，把真理送到見不著面的地方。我們不可以用這兩節貶低線上團契、遠距牧養，或因病、因工作、因距離不能到場的弟兄姊妹。「當面」是長老的盼望與邀請，不是一道門檻：線上把真理送到，見面使關係完全，兩者都是同一份愛。</p><p>「願你平安。眾位朋友都問你安。請你替我按著姓名問眾位朋友安」（1:15）。約翰二書的結語說到「喜樂滿足」（約貳 1:12），三書的結語說「願你平安」。主復活以後，走進門都關了的房子，第一句話也是：「願你們平安」（約 20:19）。門外有人把門關上，長老卻把平安送給那個仍然開著門的人。</p><p>然後是「朋友」。約翰書信的最後一句，落在「朋友」和「名字」上。主說：「人為朋友捨命，人的愛心沒有比這個大的」（約 15:13）；又說：「我乃稱你們為朋友」（約 15:15）。約翰的群體可能以「朋友」彼此相稱；保羅在西頓也被准「往朋友那裡去」（徒 27:3），可作旁證。而且長老要該猶「按著姓名」去問，不是在聚會結束時說一聲「大家好」，而是一個一個叫出名字。7 節的傳道人為「那名」出外，15 節的弟兄姊妹被「按著名」問候；好牧人也是「按著名叫自己的羊」（約 10:3）。在主那裡，每一個人都有名字。</p><p>321 說建立屬神的體系。這一節使我們想起：屬神的體系不是一張組織圖，而是一張寫滿名字的朋友名單；235 裡「2」屬靈同伴的關係，也從記得一個人的名字開始。</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《一同為真理做工》"],["p","弟兄姊妹平安。今天這一章很短，只有十五節。我想先請你看兩扇門。"],["p","這是一個想像的畫面，經文沒有記下這些細節；可是信裡的事，就發生在這樣的兩扇門前。"],["q","小亞細亞，一座城，同一個晚上。"],["p","第一扇門，在一條石板巷子的盡頭。"],["p","門開著。屋裡的燈還亮著，桌上有熱湯，有餅。"],["p","幾個陌生人剛坐下。鞋上是灰，背上是行囊，走了很遠的路。"],["p","主人叫該猶。這幾個人，他以前沒有見過。"],["q","第二扇門，在城的另一頭。"],["p","那是教會聚會的地方，房子比較大。"],["p","門口站著一個人，手裡拿著一封長老寄來的信。"],["p","他看了一眼，把信放到一邊。然後，把門關上。"],["p","他的名字叫丟特腓。"],["q","畫面，就停在這兩扇門上。"],["p","一扇門後面，有燈、有湯、有陌生人的笑聲。"],["p","一扇門後面，有權柄、有位子，還有一封沒有被讀出來的信。"],["p","今天我想問你一個問題，請你不要急著回答。"],["q","你住在哪一扇門後面？"],["p","先說清楚：這封信不是給我們拿來找人的。"],["p","信裡有三個人：該猶、丟特腓、低米丟。像三面鏡子。"],["p","鏡子是用來照自己的，不是拿來指著別人的。"],["p","我們每一個人裡面，都住著一個該猶，也住著一個丟特腓。"],["p","這一章有三個字：行，接，效。"],["p","我們走三步：真理走在腳上；真理打開家門；在開門與關門之間。"],["q","第一步：真理走在腳上。"],["q","「作長老的寫信給親愛的該猶，就是我誠心所愛的。」（1:1）"],["p","這是一封寫給一個人的信。新約裡，這樣私人的信不多。"],["p","「誠心」兩個字，原文是：在真理中。"],["p","約翰二書的第一節，也是同一句話。長老愛人，都是在真理裡愛。"],["p","該猶是誰？新約裡叫該猶的人至少有三位，這是當時很普通的名字。"],["p","是不是同一個人，我們不知道，也不必猜。"],["p","我們只知道，他是一位被長老叫做「親愛的」的弟兄。"],["q","「親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣。」（1:2）"],["p","第一聲「親愛的兄弟啊」，是禱告。"],["p","這一節，大概是整封信最常被引用的一節，也最常被講錯。"],["p","有人說：你看，神要每個信徒都富足健康。"],["p","慢一點。"],["p","那時候的人寫信，開頭常常就是這一句：首先，我禱告你一切平安、身體健康。"],["p","考古挖出來的莎草紙家書，很多都是這樣起頭。"],["p","「我願」，原文是一個禱告的字。這是一句禱告，不是一張保證書。"],["p","可是長老在這句老套的問候後面，加了一句不老套的話。"],["q","正如你的靈魂興盛一樣。"],["p","「興盛」，原文是走在好路上，一路順利。"],["p","長老的意思是：願你外面的路，走得像你裡面的路一樣好。"],["p","次序是靈魂在前。"],["p","所以，生病的人、清貧的人，請不要從這一節聽出：你的信心不夠。"],["p","以巴弗提病得幾乎要死，特羅非摩病了被留在米利都，保羅身上的刺沒有挪去。"],["p","主對保羅說的是："],["q","「我的恩典夠你用的」（林後 12:9）"],["p","可是也不要反過來說，神只管靈魂，不管身體。"],["p","長老為該猶的身體禱告。我們也可以為彼此的身體、工作、生計禱告。"],["p","只是先問一句：我的靈魂，興盛嗎？"],["p","長老怎麼知道該猶的靈魂興盛？"],["q","「有弟兄來證明你心裡存的真理，正如你按真理而行，我就甚喜樂。」（1:3）"],["p","長老沒有住在該猶家。他是聽來的。"],["p","有人從該猶家門口走過，吃過他的飯，回到長老那裡，一次又一次地說。"],["p","「心裡存的真理」，原文只是：你的真理。"],["p","真理到了該猶身上，就有了該猶的樣子。"],["p","然後長老補一句：正如你按真理而行。"],["p","真理先在心裡，然後走在腳上。"],["p","我們很會把真理放在書架上，放在筆記裡，放在講台上。"],["p","可是別人來作見證的時候，說的不是你書架上有甚麼，是你家門口發生了甚麼。"],["q","「我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的。」（1:4）"],["p","「沒有比這個大的」，原文用了一個比較級的比較級，像是說：更更大。"],["p","好像長老找不到一個夠大的字，來裝他的喜樂。"],["p","一位年老的屬靈父親，最大的喜樂不是事工多大，是孩子走在真理裡。"],["p","可是我知道，今天坐在這裡的人當中，有父母心裡正痛著。"],["p","孩子還沒有信主；或者曾經信，後來走開了。"],["p","請你聽清楚：這一節是長老的喜樂，不是父母的成績單。"],["p","長老說「聽見」。有些喜樂，要等很久才聽見。"],["p","你為孩子流的眼淚，在神面前沒有一滴白流。"],["p","你能做的，是愛他，是活給他看，是為他代禱。結果，在神的手裡。"],["p","今天還沒有聽見的好消息，不是故事的結尾。"],["p","真理走在腳上，走著走著，就走到一扇門前面。"],["p","門外有人敲門。這一次，是不認識的人。"],["q","第二步：真理打開家門。"],["q","「親愛的兄弟啊，凡你向作客旅之弟兄所行的都是忠心的。」（1:5）"],["p","第二聲「親愛的兄弟啊」，是肯定。"],["p","「作客旅的」，原文是陌生人。該猶接待的，不是老朋友。"],["p","那個時代沒有給基督徒住的可靠旅店。傳道人一站一站地走，靠的是一扇一扇打開的門。"],["p","長老說：你這樣做，是忠心的。"],["p","接待不是額外的好心。在神眼中，那是忠心。"],["p","我們常以為，忠心是講台上的事，是禱告會的事。"],["p","長老說，忠心也是一碗湯、一張床、半夜幫人開門。"],["q","「他們在教會面前證明了你的愛」（1:6）"],["p","你在自己家裡做的，你沒有拿出去講。"],["p","也許是在長老那裡的聚會中，有人站起來說：該猶怎樣待我們。"],["p","你關起門來做的，神的家記得。"],["q","「你若配得過神，幫助他們往前行，這就好了。」（1:6）"],["p","「幫助他們往前行」，是早期教會的一個專門用語：送行。"],["p","給他們路上吃的、路上用的，也許派人陪一段，寫一封介紹信，好讓他們走到下一站。"],["p","標準是甚麼？配得過神。"],["p","不是配得過我的面子，是配得過差他們出去的那一位。"],["q","「因他們是為主的名出外，對於外邦人一無所取。」（1:7）"],["p","「主的名」，原文只有兩個字：那名。"],["p","那名，就是耶穌的名。"],["p","這裡有一個字，我想請你記住：出外。"],["p","約翰二書說，世上有許多迷惑人的「出來」。原文是同一個字。"],["p","出去的人很多。差別在於，為誰的名出去。"],["p","他們「一無所取」。不向還沒信主的人伸手要錢。"],["p","當時有些哲士四處講道收費。"],["p","這些傳道人不願被當成那一類：福音不是生意。"],["p","可是人總要吃飯。那怎麼辦？"],["q","「所以我們應該接待這樣的人，叫我們與他們一同為真理做工。」（1:8）"],["p","「應該」，原文是欠債的那個字。"],["p","神的家，欠這些人一份接待。"],["p","「接待」，原文是從底下把人托起來。"],["p","上一節說，他們不「取」。這一節說，我們要「托」。原文是同一個字根。"],["p","他們不向外面拿，神的家就從底下托住他們。"],["p","最後那一句是：叫我們與他們一同為真理做工。"],["q","同工。"],["p","接待的人沒有上講台，卻和傳道的人一同做工。"],["p","原文還可以讀成：與真理一同做工。真理是同伴。"],["p","這是整封信的最高點，也是今天的題目。"],["p","我們是一個空中團契，在許多國家的人，每天在線上一起讀經。"],["p","在遠方、在線上傳真理的宣教士和同工，也需要一群該猶：為他們禱告，供應他們，把他們介紹給朋友，接待他們。"],["p","我說這話，不是為講台上的這個人。"],["p","所以要說清楚兩件事。"],["p","第一，傳道人接受神家的供應，是正當的。主說："],["q","「工人得工價是應當的」（路 10:7）"],["p","所以，不要用「一無所取」去羞辱接受供應的傳道人。"],["p","第二，也不要用「應該接待」去逼人奉獻。"],["p","這一句「應該」，是神家的榮幸，不是一張催繳單。"],["p","供應的人不是贊助者，是同工。"],["p","還有，「這樣的人」三個字很要緊。"],["p","這樣的人，是為那名出外、一無所取、配得過神的人。"],["p","同一位長老在約翰二書說："],["q","「不要接他到家裡」（約貳 1:10）"],["p","那是對否認耶穌基督成了肉身的教師說的。"],["p","二書關門，三書開門。標準不是認不認識，也不是喜不喜歡，是傳不傳那一位基督。"],["p","所以接待要分辨，不是凡來敲門的，都要無限度地供應。"],["p","可是開門是常態，關門是例外。"],["p","該猶的次序很清楚。"],["p","先是按真理而行，那是生命。再是證明了你的愛，那是關係。最後是一同為真理做工，那是事工。"],["p","這使我們想起：先生命，再關係，後事工。"],["p","如果信寫到這裡就停，該有多好。"],["p","可是長老接著寫的，是那第二扇門。"],["q","第三步：在開門與關門之間。"],["q","「我曾略略地寫信給教會，但那在教會中好為首的丟特腓不接待我們。」（1:9）"],["p","長老寫過信給那間教會。那封信大概沒有被讀出來。"],["p","是哪一封信？學者有不同的看法，我們不必在這裡定案。"],["p","丟特腓名字旁邊，只有三個字：好為首。"],["p","原文是一個字，新約只出現這一次。愛作第一，愛坐首位。"],["p","經文沒有說他傳錯了道。"],["p","他的問題，不在頭腦，在心。"],["p","他離開僕人的本位，想抓住只屬於基督的首位。"],["p","保羅說到基督："],["q","「使他可以在凡事上居首位」（西 1:18）"],["p","居首位，和好為首，原文是同一個字根。"],["p","首位只有一張椅子。那張椅子，是主的。"],["p","這使我們想起我們常說的：驕傲，是離開本位抓住權力。"],["q","「所以我若去，必要提說他所行的事，就是他用惡言妄論我們。」（1:10）"],["p","「妄論」，原文也是新約只出現一次的字：胡說，講沒有根據的話。"],["q","「還不以此為足，他自己不接待弟兄，有人願意接待，他也禁止，並且將接待弟兄的人趕出教會。」（1:10）"],["p","惡言，不接待，禁止，趕出。四件事，一件比一件重。"],["p","最後一件最諷刺：開門的人，被趕出了門外。"],["p","驕傲不知足。有己的生命，最後常常變成一扇鎖住的門。"],["p","這是整封信的谷底。"],["p","現在，請把鏡子轉過來。"],["p","不是要你想：我們教會裡誰像丟特腓。這封信不給我們點名的權利。"],["p","是要你問：我裡面，有沒有一個想坐首位的人？"],["p","別人提的意見，因為不是我提的，我就擋下來。"],["p","一個新來的人做得比我好，我心裡就不舒服。"],["p","群組裡有人想介紹一位新朋友，我就不回應，讓事情冷掉。"],["p","丟特腓不是一個遠方的人。他常常就在我們心裡。"],["p","那長老怎麼回應？"],["p","他沒有回罵一句，也沒有發動該猶去對付他；他只把事實寫下來，然後說：我若去。"],["p","當面，在教會裡，把他所行的事提出來。"],["p","這使我們想起主教導的次序：先單獨去說，再帶一兩個人，再告訴教會。"],["p","所以，這一節不是上網爆料的許可證，也不是私下結黨的理由。"],["p","可是如果你曾被濫權的人排擠、被趕出去，也請聽見：你不必默默忍受。"],["p","長老沒有叫該猶閉嘴。你可以找可信任的牧者、屬靈長輩，按程序把事情說清楚。"],["p","你不必先獨自去面對傷害你的人；先找可信任的牧者或長執陪你。"],["p","若涉及違法，報警或尋求法律協助，也不是不屬靈。"],["p","然後，長老做了一件很美的事。他轉身，對該猶說："],["q","「親愛的兄弟啊，不要效法惡，只要效法善。」（1:11）"],["p","第三聲「親愛的兄弟啊」，是勸勉。整封信最直接的命令，前面仍是最溫柔的稱呼。"],["p","長老沒有說：該猶，你去和他拚。"],["p","他說：別變成他。"],["p","驕傲對抗驕傲，兩敗俱傷。謙卑帶動謙卑，才能雙贏。"],["p","對付好為首最好的方法，不是自己也去搶第一，是繼續作一個開門的人。"],["p","「效法」，原文是現在式。每一天都在選：今天，我要學誰。"],["q","「行善的屬乎神；行惡的未曾見過神。」（1:11）"],["p","有人聽到這一句就害怕：我昨天才跌倒，是不是沒有見過神？"],["p","這裡也是持續的說法，講的是一個人一生走的方向，不是一次跌倒的判決。"],["p","我們的確據，不在自己做得夠不夠，在那位為我們捨命的基督。"],["p","可是也請記得：一個真正見過神的人，他的門，會慢慢打開。"],["q","「低米丟行善，有眾人給他作見證，又有真理給他作見證，就是我們也給他作見證。你也知道我們的見證是真的。」（1:12）"],["p","「行善」兩個字，是和合本補上的。原文只說：低米丟，已經有眾人給他作了見證。"],["p","低米丟很可能就是送這封信的人，也許此刻正走在去該猶家的路上。"],["p","三重見證：眾人，真理，長老。"],["p","最特別的是中間那一個：真理親自給他作見證。"],["p","他的生命和真理吻合，真理就替他開口。"],["p","丟特腓坐著位子，低米丟帶著見證。"],["p","到最後，人記得的不是誰坐過首位，是誰的生命有真理替他說話。"],["q","「我原有許多事要寫給你，卻不願意用筆墨寫給你，」（1:13）"],["q","「但盼望快快地見你，我們就當面談論。」（1:14）"],["p","「當面」，原文是：口對口。和約翰二書的結尾一樣。"],["p","我們是空中團契，聽到這裡，也許有人心裡一緊：那我們算不算？"],["p","請看長老自己在做甚麼。他正在用筆墨牧養該猶。"],["p","這封信，本身就是遠距的牧養。"],["q","筆墨是橋，不是次等。"],["p","因病、因工作、因距離不能到場的人，沒有少得真理。"],["p","當面，是盼望，是邀請，不是門檻。"],["q","「願你平安。眾位朋友都問你安。請你替我按著姓名問眾位朋友安。」（1:15）"],["p","願你平安。這使我們想起：主復活以後，在關著門的屋子裡，對門徒說的第一句話，也是「願你們平安」（約 20:19）。"],["p","約翰書信的最後一句，落在兩個字上：朋友，和名字。"],["p","主說過："],["q","「我乃稱你們為朋友」（約 15:15）"],["p","而且長老說：按著姓名。一個一個地問。"],["p","這使我們想起好牧人："],["q","「他按著名叫自己的羊」（約 10:3）"],["p","第七節，他們為那名出去。第十五節，每一個人都被按著名字記念。"],["p","屬神的體系，是一個一個被叫出名字的人，連在一起。"],["q","我們再看一眼那兩扇門。"],["p","聚會所的門還關著。可是巷子盡頭的那扇門，燈一直亮著。"],["p","低米丟拿著信，敲了門。該猶打開門，就像他每一次那樣。"],["p","弟兄姊妹，讀完這封信，請你不要更記得丟特腓，也不要更佩服長老的手腕。"],["p","請你更記得那一位。"],["p","首位是祂的。祂卻沒有坐在首位上不動。"],["p","祂從天上來，甚至把自己算在客旅中間：「我作客旅，你們留我住」（太 25:35）。"],["p","祂也說：我給你們作了榜樣。"],["p","主說："],["q","「誰願為首，就必作眾人的僕人」（可 10:44）"],["p","讓耶穌作王，就是把那張椅子還給祂，自己去作僕人。"],["p","所以，今天你住在哪一扇門後面？"],["p","這個禮拜想一想：有誰，是你可以接待、可以托住、可以一同做工的？"],["p","有誰的名字，你很久沒有叫了？"],["p","也許是一位在遠方事奉的傳道人，也許是一個很久沒來聚會的朋友，也許是你自己的孩子。"],["p","在主那裡，我們每一個人都有名字。"],["p","打一通電話，說一句：我記得你。"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"作者、收信人與處境：長老、該猶、丟特腓與低米丟各是誰？","r":"1:1--1；1:9--12；羅 16:23","ch":[],"why":"一、一位長老、一位朋友、一扇被關上的門——本講義的全卷立場之一（沿用約翰一書講義的議題「作者、年代與處境」，本卷補）。約翰三書只有十五節，卻點了三個人的名字：收信的該猶、在教會中好為首的丟特腓、有眾人作見證的低米丟；寫信的人仍只稱「作長老的」。若不在開卷講定這幾個人是誰、這封信落在甚麼處境裡，全卷很容易被講偏：有人把該猶考據成某一位保羅的同工，好像非如此不可；有人把丟特腓當成故事裡的反派，拿來對號入座；更多人看不見第一世紀巡迴傳道人靠信徒的家一站一站往前走的處境，就讀不懂「接待」為甚麼是這封信的心臟。","pos":[["【一】經文問的是甚麼","","<p>信的開頭，格式和約翰二書幾乎相同：「作長老的寫信給親愛的該猶，就是我誠心所愛的。」（1:1）原文 Ὁ πρεσβύτερος 有冠詞——「那位長老」，讀信的人一看就知道是誰，不必報名字，也不稱使徒。收信的 Γάϊος 是羅馬世界極普通的名字。信裡還有兩個名字：「那在教會中好為首的丟特腓」（1:9），和「低米丟行善，有眾人給他作見證」（1:12）——和合本「行善」二字是小字補上的，原文只說關於低米丟，已有眾人作見證。</p><p>信的骨架是一條路：有弟兄從該猶那裡回來，說他「按真理而行」（1:3）；這些弟兄是「為主的名出外」（1:7）的巡迴傳道人，長老請該猶「幫助他們往前行」（1:6）。另一方面，長老曾「略略地寫信給教會」（1:9），丟特腓卻不接待。<strong>經文問的是：寫信的長老是誰？該猶是誰？丟特腓與低米丟又是甚麼人？這封信落在一個甚麼樣的教會處境裡？</strong></p>"],["使徒約翰說（長老就是西庇太的兒子約翰）","","<p>約翰一書從第二世紀起就普遍被歸給使徒約翰（愛任紐等）；二書在第二世紀已有人引用，三書的早期見證較少。到第四世紀，教會傳統普遍把三封信都歸給使徒約翰。三封信的用字與約翰福音高度相近：「真理」「愛」「作見證」「按真理而行」；12 節「你也知道我們的見證是真的」（1:12），幾乎就是約翰福音結尾那一句「我們也知道他的見證是真的」（約 21:24）。使徒在晚年自稱「長老」並不奇怪：彼得也自稱「我這作長老」（彼前 5:1）。這派的優點是有早期的傳統與內證支持，也能解釋為甚麼長老對一間教會說話有那樣的份量——他說「我若去」（1:10），就要處理事情。</p><p><strong>難處：</strong>信裡沒有自稱使徒；丟特腓竟敢「不接待我們」（1:9），有人因此懷疑：若這位長老是十二使徒之一，一位地方領袖怎麼敢這樣待他？不過，保羅身為使徒，也在哥林多被人輕看與挑戰；權柄被抗拒，不等於權柄不存在。</p>"],["長老約翰說（帕皮亞提到的另一位約翰）","","<p>第四世紀的優西比烏在《教會史》3.39 引了第二世紀帕皮亞的一段話，提到使徒約翰之外，還有一位「長老約翰」。有學者據此主張：二書、三書的作者是這位長老約翰，他是使徒的門徒、在以弗所一帶受人敬重的牧者。這派的優點是解釋了自稱「作長老的」，也解釋了為甚麼早期教會對二書、三書的作者有過遲疑。</p><p><strong>難處：</strong>帕皮亞那段話本身可以讀成兩個人，也可以讀成同一個人被提了兩次；而且三封信的用字、神學與約翰福音一脈相承，硬分成兩個作者，反而要多解釋許多相似之處。</p>"],["約翰群體說（一位領袖、一個圈子）","","<p>近代有學者把約翰福音與三封書信看成一個「約翰群體」的作品：一個以使徒約翰為源頭、在小亞細亞幾間教會之間往來的圈子，由一位被稱為「那長老」的領袖寫信。這派的優點是看見了信裡的網絡：長老所在的教會、該猶的家、丟特腓的教會、來來去去的巡迴弟兄、送信的低米丟，還有末了「眾位朋友」（1:15）——這是一群彼此認識、彼此作見證的人。</p><p><strong>難處：</strong>「群體」是一個重建的模型，經文沒有直接說；它容易把焦點從一位見證人，挪到一個看不見的團體。</p>"],["該猶、丟特腓與低米丟（三個名字的幾種猜測）","","<p><strong>該猶</strong>：新約至少有馬其頓人該猶（徒 19:29）、特庇人該猶（徒 20:4），還有哥林多那位「那接待我、也接待全教會的該猶」（羅 16:23）——大概也就是保羅施洗的那一位（林前 1:14）。哥林多的該猶也以接待聞名，很容易讓人想到約翰三書；但時間、地點都差得遠，這個名字又太普通。後世的《使徒憲典》說約翰立該猶作別迦摩的監督，這是第四世紀的傳說。<strong>丟特腓</strong>：名字的意思是「宙斯所養育的」，這個名字不算常見，多見於有地位的家庭；他在那間教會「好為首」（1:9），有實權，能把人「趕出教會」（1:10）。<strong>低米丟</strong>：很可能是送這封信的人，或是下一批要到該猶家的巡迴傳道人；以弗所那位造亞底米神銀龕的銀匠底米丟（徒 19:24）譯名不同，把兩人等同只是猜測。</p><p><strong>難處：</strong>三個名字都可能有更多故事，但經文只給了我們它要給的——該猶的家門是開的、丟特腓把門關上、低米丟有真理為他作見證。考據得越熱鬧，越容易忘了鏡子是拿來照自己的。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者沿用約翰一書講義——使徒約翰，並陳長老約翰說與約翰群體說；講台上稱「長老說」「約翰說」都可以。該猶是誰，三種可能並陳、不裁判，講台只說「一位名叫該猶的弟兄」。</strong></p><p>處境要先擺出來。第一世紀小亞細亞（傳統：以弗所一帶，約主後 85--95 年），福音靠巡迴傳道人一站一站傳開；沒有給基督徒住的可靠旅店，傳道人靠信徒的家供應食宿、送行的盤纏與介紹信。「幫助他們往前行」的 προπέμψας 是早期教會的專門用語：「教會送他們起行」（徒 15:3）、「然後蒙你們送行」（羅 15:24）、「你要趕緊給律師西納和亞波羅送行，叫他們沒有缺乏」（多 3:13）。長老寫給教會的信，多半被丟特腓壓了下來；長老於是寫信給該猶，很可能由低米丟帶去。</p><p><strong>這封信與約翰二書是一組。</strong>二書寫給一個家，叫她不要給否認基督的教師講台（約貳 1:10）；三書寫給一位朋友，叫他繼續接待為主名出外的弟兄（1:8），也責備把門關上的人（1:10）。同一位長老、同一個標準：門開或關，看的是那一位基督。</p>"],["【四】這件事該不該影響你的信心","","<p>不知道該猶究竟是哪一位、長老是使徒約翰還是另一位約翰，不會減少這封信的份量。早期教會把這封短信留下來，不是因為它告訴我們某個名人的軼事，而是因為它把一種生命寫得很清楚：一個人按真理而行，就會打開家門；一個人好為首，就會關上教會的門。</p><p>該問自己的是：<strong>如果長老今天寫信給我，他會在信裡怎麼稱呼我？</strong>是「親愛的」、「按真理而行」、「凡你所行的都是忠心的」，還是要被「提說他所行的事」？我們不必知道該猶的生平，但我們每個人都會被寫進某一封信裡。</p>"]],"con":[],"say":"本講義的全卷立場：作者沿用約翰一書講義（使徒約翰；並陳長老約翰與約翰群體說）。該猶是誰三讀並陳、不裁判；丟特腓、低米丟只照經文所說的講，不加油添醋。處境是巡迴傳道人靠信徒的家接待、送行（徒 15:3；羅 15:24；多 3:13）；本卷與約翰二書是一組：二書關門、三書開門，標準都是那一位基督。","care":"席上會有在家裡接待人、卻覺得沒人看見的弟兄姊妹；也會有曾被教會領袖排擠、聽到「丟特腓」三個字就想起某個人的人。牧者講三個人物時，要讓開門的人得著肯定，讓受過傷的人得著安慰，但不在講台上把任何真實的人比作丟特腓；也不要把作者與該猶的考據講成信心的門檻——會眾不必記得帕皮亞，只要記得自己要作一個打開門的人。"},{"id":"ISS00_2","t":"興盛與靈魂：「凡事興盛，身體健壯」是神的應許嗎？","r":"1:2--2；腓 2:27；提後 4:20；林後 12:9","ch":[],"why":"二、一句禱告，不是一份合約——本講義的全卷立場之二（本卷新立）。「我願你凡事興盛，身體健壯」可能是整本新約被引用最多、也被誤用最多的一句問安。它被印在卡片上、貼在店門口，也被一些講台當成「神應許每個信徒都要富足健康」的證據；反過來，有人為了避開成功神學，乾脆把這節跳過，好像神只管靈魂、不管身體。兩種講法都會傷人：前者讓忠心卻久病、貧窮的弟兄姊妹以為是自己信心不夠，後者讓正在為身體與生計掙扎的人覺得神不在乎。這一題必須在開卷講定：這句話在第一世紀是甚麼，約翰又改了甚麼。","pos":[["【一】經文問的是甚麼","","<p>經文說：「親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣。」（1:2）「我願」的 εὔχομαι 是「禱告、祈願」；「興盛」εὐοδοῦσθαι 字面是「一路順利、走在好路上」（εὖ 好＋ὁδός 路），新約另見保羅求神叫他「照神的旨意，終能得平坦的道路」往羅馬去（羅 1:10），以及「照自己的進項」抽出來留著（林前 16:2）；「身體健壯」ὑγιαίνειν 是身體健康。句子後半 καθὼς εὐοδοῦταί σου ἡ ψυχή，「正如你的靈魂興盛一樣」，下一節的「因為」接著說明長老怎麼知道：有弟兄來證明該猶「按真理而行」（1:3）。</p><p><strong>經文問的是：這是一份神給所有信徒的應許，還是長老為一位朋友的禱告？「凡事興盛」包不包括財富？「正如你的靈魂」這一句，是條件、是比較，還是標準？</strong></p>"],["應許說（神應許每個信徒都要興盛健康）","","<p>二十世紀興起的「信心話語」與成功神學運動，常以這一節為核心經文：既然長老「願」該猶凡事興盛、身體健壯，神的心意就是每個信徒都富足、健康；若還沒有，是因為信心不夠、宣告不夠、奉獻不夠。這派的優點是提醒人：神不是只管靈魂的神，祂造身體、看顧日用飲食，信徒可以為身體與生計向神祈求。</p><p><strong>難處：</strong>這一節是一個人為另一個人的禱告，不是神簽了名的合約；用它推出「凡沒有富足健康的人都是信心不夠」，等於把一句祝福講成一張成績單。新約處處有忠心卻患病的聖徒：以巴弗提「實在是病了，幾乎要死」（腓 2:27）；保羅說「特羅非摩病了，我就留他在米利都」（提後 4:20）；保羅身上的刺沒有挪去，主卻對他說：「我的恩典夠你用的」（林後 12:9）。把這一節當應許，就說不通這些經文。</p>"],["客套說（只是書信開頭的套語，不必解經）","","<p>另一派從古代書信格式讀：埃及出土的大量莎草紙家書，開頭常是「首先我禱告你身體健康」一類的問候，就像今天的「近來好嗎」「祝身體健康」。所以 2 節只是禮貌，沒有甚麼神學內容，講台可以略過。這派的優點是讀出了處境：長老不是在頒布一條教義，是在寫一封真實的信。</p><p><strong>難處：</strong>它看見了套語，卻沒看見長老把套語改了。一般書信只說「願你身體健康」，約翰加上了「正如你的靈魂興盛一樣」——外面的順利要「正如」裡面的順利。而且整封信的第一個真正的內容，就是長老為一位朋友禱告；略過這一節，也就略過了長老的心。</p>"],["靈魂標準說（禱告是真的，標準是靈魂）","","<p>第三派兩邊都接住：2 節確實是書信格式，也確實是一句真誠的禱告；但約翰在套語上加了一個標準——「正如你的靈魂興盛一樣」。長老知道該猶的靈魂興盛，因為他「按真理而行」（1:3）；所以他求神讓該猶身體與日子的順利，跟得上他靈魂的順利。次序是靈魂在前：靈魂興盛是確知的事，外在的興盛是所求的事。這派的優點是不把禱告講成合約，也不把身體講成不重要。</p><p><strong>難處：</strong>「靈魂」ψυχή 在新約常指整個人的生命，不只是和身體相對的「靈」；講這一派時要小心，不要把它講成「身體不重要、只有靈魂重要」——長老明明也為該猶的身體禱告。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：取靈魂標準說——2 節是一句問安與禱告，不是一份應許；約翰把書信套語改成「正如你的靈魂興盛一樣」，靈魂在前。神在乎身體，但神不欠我們一份富足健康的合約。</strong></p><p><strong>「凡事興盛」包不包括財富？</strong>περὶ πάντων 和合本譯「凡事」；不少解經家認為它相當於書信套語的 πρὸ πάντων「最要緊的是」——長老說的是「我首先為你禱告」，不是「我願你樣樣都發達」。即使讀作「在一切事上」，它也是一句禱告：長老為該猶的生計、接待客人的力氣與一切日子禱告，神也樂意聽這樣的禱告；但經文沒有應許每個信徒都會富足，更沒有拿財富量信心。</p><p>講台上要說清楚三件事。第一，可以這樣為彼此禱告：長老為該猶的身體禱告，我們也可以為弟兄姊妹的病、工作、生計向神祈求；神看著「一切所造的都甚好」（創 1:31），身體不是次等的。第二，不可把禱告講成合約：說「信心夠就會健康」「生病是因為信心不夠」，是把成功神學的謊言放在一位長老的禱告裡。第三，看懂次序：長老先確知該猶的靈魂興盛，再求外面的順利跟上——一個人可能外面樣樣順利，靈魂卻乾枯；也可能身體軟弱、日子艱難，靈魂卻正在興盛。</p><p>321 說改變觀點：<strong>從屬世的觀點改變成屬神的觀點</strong>——世界以外面的順利量一個人，長老以「按真理而行」量一個人。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你一直在禱告，病卻沒有好、工作卻沒有起色，不要因為有人拿這一節對你說「你的信心不夠」，就懷疑神是否愛你。以巴弗提、特羅非摩、保羅都經歷過。神的恩典在軟弱上顯得完全，祂沒有離開病床，也沒有離開失業的人。</p><p>如果你日子順利，也要問自己：<strong>我的身體與事業，是不是跑得比我的靈魂快？</strong>長老願該猶的外面「正如」他的靈魂；有些人卻需要倒過來禱告——求主讓我的靈魂趕得上我的房子、我的職位、我的帳戶。</p>"]],"con":[],"say":"本講義的全卷立場：2 節是古代書信的問安與禱告（εὔχομαι），不是神應許每個信徒富足健康；約翰把套語改成「正如你的靈魂興盛一樣」——靈魂在前。神在乎身體，可以為身體與生計禱告；但不教成功神學，也不說生病貧窮是信心不夠（腓 2:27；提後 4:20；林後 12:9）。","care":"席上會有久病多年、仍天天禱告的弟兄姊妹；有剛失業、或做小生意一直撐不下去的人；也有曾在別的教會被說「你病了是因為信心不夠」而受傷的人。牧者講這一節，先讓他們聽見長老的溫柔：他為朋友的身體禱告。不要在講台上說「信心夠就會好」，也不要把疾病或貧窮連到某個人的罪；若有人正在病中，邀請教會為他代禱、探訪、實際幫補，這才是 2 節的心。"},{"id":"ISS00_3","t":"開門與關門：約翰二書與約翰三書的接待，標準是甚麼？","r":"1:5--10；約貳 1:10--11；路 10:7；林前 9:14","ch":[],"why":"三、同一位長老，一封叫人關門，一封叫人開門——本講義的全卷立場之三（本卷新立，接約翰二書講義的議題「接待、問安與界線：10--11 節的處境與今日應用」）。約翰二書說「不要接他到家裡」，約翰三書說「我們應該接待這樣的人」。若只讀二書，教會容易變得多疑、封閉；若只讀三書，教會容易對每一個自稱傳道的人都打開錢包與講台，甚至被利用。更深的危險是丟特腓的方式：用權力決定誰可以進門。這一題要把兩封信放在一起讀，講定開門與關門的標準，也講定神家供應傳道人的正當與界線。","pos":[["【一】經文問的是甚麼","","<p>約翰二書說：「若有人到你們那裡，不是傳這教訓，不要接他到家裡，也不要問他的安；」（約貳 1:10）約翰三書說：「因他們是為主的名出外，對於外邦人一無所取。」（1:7）「所以我們應該接待這樣的人，叫我們與他們一同為真理做工。」（1:8）又說丟特腓「他自己不接待弟兄，有人願意接待，他也禁止，並且將接待弟兄的人趕出教會」（1:10）。</p><p>兩封信用的是同一個動詞「出去」：二書說「世上有許多迷惑人的出來」（約貳 1:7），三書說這些弟兄「為主的名出外」（1:7）——原文都是 ἐξῆλθον（SBLGNT；拜占庭抄本 RP 在約貳 1:7 作 εἰσῆλθον「進入」）。出去的人很多，有的為那名，有的迷惑人。<strong>經文問的是：開門與關門的標準是甚麼？「這樣的人」是誰？接待包括甚麼——飯、床、講台、盤纏？今天又落在哪裡？</strong></p>"],["人際說（認識的、可靠的就接待）","","<p>最自然的做法是看關係：認識的、有人介紹的、合得來的，就接待；陌生的就小心。這派的優點是實際：第一世紀的巡迴弟兄多半帶著介紹信（這使我們想起徒 18:27「並寫信請門徒接待他」、羅 16:1--2 保羅舉薦非比），12 節長老也為低米丟作見證，等於一封推薦信。</p><p><strong>難處：</strong>該猶接待的偏偏是陌生人——「凡你向作客旅之弟兄所行的都是忠心的」（1:5），原文「而且是作客旅的」，他並不認識他們。若只看關係，該猶的忠心就不算數了；而且只接待自己人的教會，很快就會變成一個小圈子。</p>"],["權柄說（由教會領袖決定誰可以進門）","","<p>另一派認為：為了保護會眾，誰可以上講台、誰可以住在信徒家、誰可以募款，應該由教會領袖統一決定。這派的優點是嚴肅看待牧養的責任：保羅也要提多「堵住」那些「因貪不義之財，將不該教導的教導人，敗壞人的全家」的人（多 1:11）。</p><p><strong>難處：</strong>這正是丟特腓的做法——他有權柄，卻用權柄擋住長老派來的人、禁止弟兄接待、把開門的人趕出去。權柄本身不是問題，問題是權柄拿甚麼作標準；若標準是「會不會威脅我的位置」，守門就變成了霸佔。</p>"],["基督標準說（看他傳不傳那一位基督）","","<p>第三派把兩封信合起來讀：關門的標準是二書的「不是傳這教訓」——不認耶穌基督是成了肉身來的（約貳 1:7）；開門的標準是三書的「為主的名出外」「配得過神」「一無所取」（1:6--7）。早期教會也照這個方向立規矩：《十二使徒遺訓》11--12 章說，巡迴的使徒要像主一樣被接待，但只住一天，必要時兩天；住三天、或開口要錢，就是假先知；過路的弟兄要幫，要住下來就要做工。一面接待，一面分辨。這派的優點是把開門與關門放在同一把尺上，而那把尺是基督。</p><p><strong>難處：</strong>「傳不傳基督」需要教會在真理上下功夫，也需要時間觀察生命；它不能被簡化成一張表格，也不能交給任何一個人說了算。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：取基督標準說——二書關門、三書開門，標準不是認不認識、喜不喜歡，也不是誰掌權，是傳不傳那一位基督。開門是常態，關門是例外；一個只會關門的教會，就走上了丟特腓的路。</strong></p><p>「這樣的人」（1:8）有三個記號：為那名出外，不是為自己的名；「對於外邦人一無所取」，福音不是生意；送他們要「配得過神」，標準是差他們的那一位。接待的人因此不是贊助者，而是同工：「叫我們與他們一同為真理做工」（1:8）。</p><p><strong>供應傳道人是正當的。</strong>主說「工人得工價是應當的」（路 10:7）；保羅說「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14），又說「在道理上受教的，當把一切需用的供給施教的人」（加 6:6）。所以不可羞辱接受神家供應的傳道人。但「應該」（ὀφείλομεν）是神家的榮幸，不是一張催繳單：不可用 8 節操控奉獻、製造罪疚；也不是無限度、不分辨：這一節也不是說凡來敲門的都要供應，要看他是不是為那名出外。</p>"],["【四】這件事該不該影響你的信心","","<p>教會之間對怎樣接待、怎樣供應傳道人，做法各有不同，這不該動搖你的信心。各派都同意：神的家要接待為主作工的人，也要分辨那些借著福音取利的人（這使我們想起彼後 2:3）。</p><p>但要問自己：<strong>我的家、我的錢包、我的轉發鍵，是對誰開、對誰關？</strong>國度321空中團契在線上傳真理，也需要一群「該猶」——為同工禱告、供應、轉介、接待。同時，看見有人打著主的名義向弟兄姊妹斂財，也要按程序提醒、不轉發、不背書。開門與關門，都是為了那一位。</p>"]],"con":[],"say":"本講義的全卷立場：約翰二書關門、約翰三書開門，標準不是人際、也不是權力，是傳不傳那一位基督；開門是常態，關門是例外。「這樣的人」是為那名出外、一無所取、配得過神的人；接待的人是同工（1:8）。供應傳道人是正當的（路 10:7；林前 9:14；加 6:6），不可羞辱，也不可用 8 節操控奉獻；接待要分辨，不是無限度、不分辨地供應。與約翰二書講義〈接待、問安與界線〉合看。","care":"席上會有多年在家裡接待人、卻被利用過而心寒的弟兄姊妹；有靠會眾供應、聽到「傳道人要錢」就羞愧的傳道同工；也有曾被逼著奉獻、一聽到「應該」兩個字就緊張的人。牧者要同時保護這三種人：肯定接待的忠心，承認被利用的傷，讓傳道人有尊嚴地接受供應，也讓奉獻回到甘心。不要在講台上點名任何傳道人或機構，也不要把 8 節講成催繳單。"},{"id":"ISS00_4","t":"好為首：教會的權柄與屬靈的濫權，怎樣分辨？","r":"1:9--10；1:11；太 18:15--17；可 10:44","ch":[],"why":"四、問題不在頭腦，在心——本講義的全卷立場之四（本卷新立）。丟特腓是新約裡少數被點名批評的教會領袖，而他的問題寫在他名字的旁邊：「好為首」。這兩節最容易被講成兩種錯：一種是拿丟特腓當武器，在講台上、在網路上影射某位牧者或某間教會；另一種是為了維護權柄，把一切對領袖的提醒都說成「悖逆」，叫被濫權、被趕出的人默默忍受。這一題要講定：丟特腓錯在哪裡、長老怎樣回應、今天的教會怎樣分辨權柄與濫權，而且要把鏡子轉向自己。","pos":[["【一】經文問的是甚麼","","<p>經文說：「我曾略略地寫信給教會，但那在教會中好為首的丟特腓不接待我們。」（1:9）「好為首」φιλοπρωτεύων 新約只出現這一次，由「愛」φίλος 與「第一」πρῶτος 組成：愛作第一、愛坐首位；現在分詞，是他的樣子，不是一時失態。接著是四件事：「他用惡言妄論我們」、「他自己不接待弟兄」、「有人願意接待，他也禁止」、「並且將接待弟兄的人趕出教會」（1:10）。長老的回應是：「所以我若去，必要提說他所行的事」（1:10），然後立刻對該猶說：「不要效法惡，只要效法善。」（1:11）</p><p><strong>經文問的是：丟特腓的問題是教義還是品格？長老的「提說」是甚麼樣的處理？今天的教會怎樣分辨真實的權柄與屬靈的濫權？被趕出的人該怎麼辦？</strong></p>"],["異端說（丟特腓傳了錯誤的教訓）","","<p>有些解經家把三書接在二書後面讀：二書警告迷惑人的教師，三書的丟特腓大概就是那一派的人，所以他才拒絕長老與長老派去的弟兄。這派的優點是把兩封信連起來，也提醒我們錯誤的教導常常和權力綁在一起。</p><p><strong>難處：</strong>經文沒有一句指控丟特腓的教義。長老在二書對否認基督的人說得非常明白（約貳 1:7），若丟特腓也是如此，長老大可直說；三書卻只說他「好為首」、說閒話、不接待、趕人。把他講成異端，等於替經文加了一個罪名。</p>"],["權柄之爭說（抗拒使徒、獨攬地方教會的領袖）","","<p>多數解經家認為：丟特腓是那間教會的實權人物，不肯承認長老的權柄，要把教會變成只由他決定的地方。「不接待」的 ἐπιδέχεται 也有「不承認對方權柄」的意思；他壓下長老的信，又擋住長老派來的人。這派的優點是貼近經文：問題是權力與品格，不是教義。</p><p><strong>難處：</strong>若只看成權力之爭，容易把長老與丟特腓講成兩個爭位子的人，好像誰贏誰就對；其實長老沒有用同樣的手段回敬，他的回應本身就是對丟特腓的對照。</p>"],["制度轉換說（巡迴使徒與地方監督之間的張力）","","<p>社會史的讀法認為：第一世紀末，教會正從巡迴的使徒、先知帶領，轉向由地方長老、監督帶領；丟特腓可能是早期「一位監督」模式的代表，覺得外來的巡迴者干擾了地方教會。這派的優點是提醒我們：教會的組織會變，不同的領導方式之間有真實的張力，不是每一次衝突都是善惡之爭。</p><p><strong>難處：</strong>制度的轉換可以解釋張力，卻不能替「惡言妄論」「把人趕出教會」開脫；長老並沒有說「你的制度不對」，而是說「你所行的事」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：經文對丟特腓唯一的描述是「好為首」——他的問題不在頭腦，在心；不是教義的問題，是生命的問題。教會權柄是真實的，濫權也是真實的；分辨的標準不是位置有多高，而是那位置用來開門還是關門。</strong></p><p>這正是 321 說的：<strong>驕傲是離開本位抓住權力</strong>——離開人的本位，抓住神的權力。在教會裡，就是要坐上只屬於基督的首位：「使他可以在凡事上居首位」（西 1:18），πρωτεύων 與 φιλοπρωτεύων 同字根。主說的正好相反：「在你們中間，誰願為首，就必作眾人的僕人。」（可 10:44）</p><p><strong>長老的回應有三個記號。</strong>第一，當面：「我若去」——不是隔空放話，不是網路爆料。第二，在教會中、按程序：「提說他所行的事」，ὑπομνήσω 是使人記起、把事實擺出來，這使我們想起主的教導：先私下，再帶一兩個人，再告訴教會（太 18:15--17），也使我們想起「控告長老的呈子，非有兩三個見證就不要收」（提前 5:19）。第三，不以惡報惡：長老沒有用「惡言」回敬「惡言」，也沒有叫該猶去和丟特腓爭第一，只說「只要效法善」（1:11）。所以今天被濫權、被排擠、被趕出的人，不必默默忍受，可以向更大的教會群體、可信任的屬靈長輩、按程序求助；但也不要以爆料、公審、結黨來處理，那樣只是另一個丟特腓。</p>"],["【四】這件事該不該影響你的信心","","<p>教會裡出現丟特腓，不代表教會是假的，也不代表信仰是假的。長老的時代就有，他沒有因此離開教會，也沒有叫該猶離開；他把事情交給「我若去」，把朋友的眼睛轉向善。</p><p>更要問自己：<strong>我裡面的丟特腓長甚麼樣子？</strong>我是否也想坐首位、不接納威脅我位置的人、在背後說長道短、攔阻別人去做我沒有帶頭的善事？這面鏡子不是拿來指著別人的。施洗約翰說：「他必興旺，我必衰微。」（約 3:30）願我們都學會讓出那個位子。</p>"]],"con":[],"say":"本講義的全卷立場：丟特腓的問題是「好為首」——生命與品格的問題，經文沒有教義指控。教會權柄是真實的，濫權也是真實的；長老的回應是當面、在教會中、按程序（太 18:15--17；提前 5:19），不以惡報惡，並轉向「只要效法善」。不把丟特腓貼在任何真實的人身上，不以網路爆料處理；被濫權的人可按程序求助。321：驕傲是離開本位抓住權力。","care":"席上會有曾被教會領袖羞辱、排擠，甚至被「請出去」的人；也有正在帶領、被會眾誤會為丟特腓而心力交瘁的牧者與同工。牧者講這兩節，不要點名任何人或教會，也不要讓受傷的人覺得自己的傷不算數；要清楚說明可以求助的管道與程序。同時把鏡子轉向自己與講台上的人：最先要問「我是不是好為首」的，是拿著麥克風的那一位。若涉及性侵、暴力或其他違法的事，要協助當事人尋求法律與專業的協助，不能只在教會內部處理。"},{"id":"ISS00_5","t":"行善與見過神：「行惡的未曾見過神」，是說會失去救恩嗎？","r":"1:11--11；約壹 3:6；約壹 1:9","ch":[],"why":"五、一條路的方向，不是一次跌倒的判決——本講義的全卷立場之五（沿用約翰一書講義的議題「罪與確據」）。「行惡的未曾見過神」這一句很重。敏感的信徒讀了會害怕：我昨天才發了脾氣、說了不該說的話，是不是就證明我從來沒有見過神？也有人反過來，拿這一節去判斷別人：某某人做了這件事，他一定不是真基督徒。這一題要講定：約翰說的「行善」「行惡」是甚麼意思，與確據是甚麼關係，而且要和約翰一書一起讀。","pos":[["【一】經文問的是甚麼","","<p>經文說：「親愛的兄弟啊，不要效法惡，只要效法善。行善的屬乎神；行惡的未曾見過神。」（1:11）「效法」μιμοῦ 是現在命令式：持續地選擇效法誰；「行善的」ἀγαθοποιῶν、「行惡的」κακοποιῶν 都是現在分詞；「屬乎神」原文是「出於神」；「未曾見過」οὐχ ἑώρακεν 是完成式：沒有見過，至今仍沒有。這一節夾在丟特腓（1:9--10）與低米丟（1:12）之間，像一道轉軸。</p><p>約翰一書有同樣的說法：「凡住在他裡面的，就不犯罪；凡犯罪的，是未曾看見他，也未曾認識他。」（約壹 3:6）可是同一封信也說：「我們若說自己無罪，便是自欺，真理不在我們心裡了。」（約壹 1:8）<strong>經文問的是：基督徒還會行惡嗎？一次的惡行，是否證明一個人沒有見過神？確據建立在哪裡？</strong></p>"],["行為判決說（行了惡就證明沒有得救）","","<p>有人照字面讀：凡行惡的，就是沒有見過神、不屬神；所以一個基督徒若做了惡事，就證明他不是真信徒，或失去了救恩。這派的優點是嚴肅：約翰確實不允許人一面說認識神、一面在惡裡過日子（這使我們想起約壹 1:6）。</p><p><strong>難處：</strong>這樣讀會和約翰自己衝突。他說「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督」（約壹 2:1），又說「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（約壹 1:9）。若一次犯罪就證明沒有見過神，這些話就是寫給沒有人的。這種讀法會讓敏感的人活在恐懼裡，也會讓人拿來論斷別人。</p>"],["生命方向說（現在分詞描寫一生的樣式）","","<p>多數解經家從語法讀：現在分詞「行善的」「行惡的」描寫的是生命持續的方向與樣式，像在說「以行善為生的人」「以行惡為生的人」。約壹 3:9 的「不犯罪」也是現在式，講的是不在罪中持續生活。所以 11 節不是說「行過一次惡的人沒有見過神」，而是說「一個人一生的方向若是惡，就顯明他沒有見過神」。這派的優點是同時接住約翰的嚴肅與約翰的安慰。</p><p><strong>難處：</strong>語法本身不能單獨承擔整個解釋；現在式也可以只是一般的描述。而且「方向」若講得太鬆，也會被人拿來為長期的惡找藉口：「我只是偶爾。」</p>"],["樣式效法說（重點在效法，不在判斷）","","<p>第三派從上下文讀：11 節的前半是命令「不要效法惡，只要效法善」，後半是理由；長老剛寫完丟特腓的惡、正要寫低米丟的善，所以這一節的作用是叫該猶選對樣式，而不是給他一把量別人得救與否的尺。這派的優點是讀出了經文的牧養語氣——前面還有一聲「親愛的兄弟啊」。</p><p><strong>難處：</strong>它若只講效法，可能會淡化後半句的份量；「未曾見過神」不只是修辭，是約翰真實的警告。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：合取後兩派——11 節的現在分詞講生命的方向，不是一次跌倒的判決；它的作用是叫人選擇效法善，不是給人一把量別人得救與否的尺。確據建立在基督身上，沿用約翰一書講義〈罪與確據〉的立場。</strong></p><p>約翰同時說兩件事。第一，真的見過神的人，生命會被改變方向：他會越來越像那位善的神，會打開門、會接待人；長期以惡為業、毫不悔改的生命，顯明他並沒有認識神。第二，見過神的人仍會跌倒，跌倒時有一位中保，認罪就蒙赦免；他的確據不在自己今天表現多好，而在「信奉神兒子之名的人」可以「知道自己有永生」（約壹 5:13）。</p><p>所以不可用 11 節製造失去救恩的恐懼，也不可反過來說行甚麼都無所謂。321 的落點是「謙卑戰勝驕傲」：對付惡最好的方法，不是先去判斷別人，而是自己選擇效法善——不以驕傲對抗驕傲。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你讀到這一節就害怕，因為你清楚記得自己最近做錯的事，那麼這份害怕本身就是一個記號：你在乎神，你不想離開祂。回到十字架，向主認罪，祂是信實的。你的確據不在你今天有沒有失手，而在那位為你死而復活的主。</p><p>但也要誠實問自己：<strong>我這一生的方向是甚麼？我在效法誰？</strong>如果我發現自己正一步一步變得像丟特腓——愛首位、說閒話、關門，就該停下來、轉回來。長老用「親愛的」開頭，就是在等我們轉回來。</p>"]],"con":[],"say":"本講義的全卷立場：11 節「行善的」「行惡的」是現在分詞，講生命的方向，不是一次跌倒的判決；作用是叫人選擇效法善，不是拿來論斷別人。確據建立在基督身上（約壹 1:9；2:1；5:13），沿用約翰一書講義〈罪與確據〉。不製造失去救恩的恐懼，也不說行甚麼都無所謂。","care":"席上會有良心特別敏感、一失手就懷疑自己有沒有得救的人；也會有家人做了很傷人的事，被人斷言「他一定不是基督徒」而心碎的人。牧者講這一節，要先講確據，再講方向；不要在講台上說「基督徒犯罪就失去救恩」，也不要用這一節替任何人下判決。對正在悔改中掙扎的人，給他十字架與時間；對還在惡裡的人，給他真話與回頭的路。"},{"id":"ISS00_6","t":"寫作年代與地點：約翰三書寫於何時、何地？","r":"1:1--15","ch":[],"why":"六、知道它大約寫在甚麼時候，就看得見那條路——本講義的全卷立場之六（全卷通用）。約翰三書沒有寫日期，也沒有寫地點。年代與地點不會改變它的信息，但會影響我們怎樣想像那個處境：巡迴的弟兄走在哪些路上、長老在哪一間教會裡、丟特腓的教會離他有多遠。這一題簡短交代各派看法，並說明本講義為甚麼不在這裡多花力氣。","pos":[["【一】經文問的是甚麼","","<p>經文給的線索很少：長老說「我曾略略地寫信給教會」（1:9），又說「所以我若去」（1:10），末了說「但盼望快快地見你，我們就當面談論」（1:14）——可見長老與該猶、丟特腓的教會相隔不太遠，能夠來往，也有一群巡迴的弟兄在幾間教會之間行走（1:3、5--7）。信裡沒有提到聖殿、羅馬皇帝或任何可以定年的事件。</p><p><strong>經文問的是：這封信大約寫在甚麼時候、從哪裡寄出？這些線索能告訴我們多少？</strong></p>"],["以弗所晚期說（約主後 85--95 年）","","<p>傳統認為使徒約翰晚年住在以弗所，在那裡牧養小亞細亞一帶的教會；約翰一、二、三書與約翰福音大約寫在主後 85--95 年。三書的處境——一位長者在一個區域的幾間教會之間有影響力、巡迴的弟兄來往、地方教會的領袖開始有自己的權勢——很符合這個時期。這派的優點是有早期教會的傳統支持（愛任紐、優西比烏），也和三封信的內容相合。</p><p><strong>難處：</strong>這個年代主要靠傳統與推論；三書本身沒有直接的證據。</p>"],["較早說（主後 70 年以前）","","<p>少數學者認為約翰書信可能寫得更早，與保羅晚期的書信同時；他們指出巡迴傳道與家庭接待在保羅的時代就已經很普遍（徒 15:3；羅 15:24）。這派的優點是提醒我們：三書描寫的接待文化並不是很晚才有的。</p><p><strong>難處：</strong>三封信與約翰福音的關係，以及長老在一個區域裡的地位，比較符合較晚的時期；早期的證據也不支持這麼早的年代。</p>"],["存疑說（經文沒有說，就不要定）","","<p>第三派主張：既然信裡沒有可以定年的線索，就誠實地說「不知道」，把力氣放在信的內容上。這派的優點是謙卑，也不讓年代的爭論掩蓋了信息。</p><p><strong>難處：</strong>完全不談處境，會讓讀者失去想像的地圖；適度的推論，對理解巡迴傳道與接待仍有幫助。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採傳統的以弗所晚期說——約主後 85--95 年，小亞細亞一帶；但承認這是推論，不作為信心的根據。</strong></p><p>這個處境幫助我們看見三件事：一位年老的長老，仍為遠方的朋友禱告、仍盼望親自去；一群不知名的弟兄，為主的名走在羅馬的大道上，靠一扇一扇打開的門往前；一間地方教會，已經出現了想把權力抓在自己手裡的人。這三件事，今天的教會都認得。</p>"],["【四】這件事該不該影響你的信心","","<p>不知道確切的年份，不影響這封信是真的。長老寫的是一位朋友、一扇門、一個好為首的人——這些事不需要年份就能認出來。</p><p>倒是要問：<strong>如果這封信是寫給今天的我，它會寄到哪裡？</strong>寄到我的家，問我有沒有打開門；寄到我的教會，問我們有沒有人在搶首位；寄到我的手機，問我最近按著姓名問候了誰。</p>"]],"con":[],"say":"本講義的全卷立場：採以弗所晚期說，約主後 85--95 年、小亞細亞一帶，但承認這是傳統與推論，不作為信心的根據；講台只用它幫助會眾想像巡迴傳道與接待的處境，不展開考據。","care":"有些弟兄姊妹一聽到「年代不確定」就不安，好像聖經不可靠；也有人喜歡在年代上鑽研而忽略了經文要他打開的門。牧者講這一題要短，讓人知道各派的看法都在信仰之內，然後把注意力帶回信的內容：真理要走在腳上，門要為主的名打開。"},{"id":"ISS00_7","t":"約翰一、二、三書是甚麼關係？「略略地寫信」是哪一封？","r":"1:9--9；約貳 1:7；約貳 1:12","ch":[],"why":"七、三封信，一個聲音——本講義的全卷立場之七（全卷通用）。約翰三書提到長老「曾略略地寫信給教會」，許多人立刻問：那封信是不是約翰二書？三封信的次序、彼此的關係，也影響我們怎樣讀二書的「關門」與三書的「開門」。這一題簡短並陳各說，並講定本講義怎樣把三封信一起讀。","pos":[["【一】經文問的是甚麼","","<p>經文說：「我曾略略地寫信給教會，但那在教會中好為首的丟特腓不接待我們。」（1:9）「略略地」原文是 τι，「一點、一些」；拜占庭多數抄本沒有這個字。那封信大概被丟特腓壓下來了，所以長老改寫給該猶。</p><p>三封信的相似之處很多：二書、三書都自稱「作長老的」，開頭都有「就是我誠心所愛的」（1:1；約貳 1:1），結尾都說不願用紙墨或筆墨、盼望當面談論（1:13--14；約貳 1:12）；一書與三書都說「行惡的未曾見過神」一類的話（1:11；約壹 3:6）。<strong>經文問的是：9 節那封信是哪一封？三封信寫作的次序如何？二書與三書是甚麼關係？</strong></p>"],["二書說（9 節的信就是約翰二書）","","<p>有學者認為：長老寫給「教會」的那封信，就是寫給「蒙揀選的太太」的約翰二書；二書的「太太」若是指一間教會，就更吻合。這派的優點是把兩封短信連成一個故事。</p><p><strong>難處：</strong>二書的主題是不要接待否認基督的教師，三書提到的那封信卻似乎是請教會接待長老派去的弟兄；內容方向不同。若二書就是那封信，丟特腓拒絕的就不太像是二書的內容。</p>"],["失傳說（那是一封已經不存在的信）","","<p>多數解經家認為：那封信很可能是一封介紹巡迴弟兄的短信，被丟特腓壓下、沒有流傳下來。早期教會的書信很多，並不是每一封都被保存；保羅也提到給哥林多人的一封更早的信（林前 5:9）。這派的優點是最貼近 9--10 節的內容：問題正是接待。</p><p><strong>難處：</strong>一封不存在的信無法被檢驗，只能是合理的推測。</p>"],["一書說（那是約翰一書）","","<p>少數人認為那封信是約翰一書。一書篇幅長，像是寫給一群教會的講章，也談到愛弟兄與分辨。這派的優點是看見了三封信共同的語言。</p><p><strong>難處：</strong>一書不像是一封寄給某一間特定教會、可以被一個人壓下的信，而且「略略地」寫的「一點」，也和一書的篇幅不合。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：9 節那封信是哪一封，三說並陳、不裁判，以失傳說最貼近上下文；三封信出於同一個聲音，次序大概是一書在先，二書、三書是寫給個別的家與人的短信。</strong></p><p>更要緊的是二書與三書成為一組：二書寫給一個家，叫她不給否認基督的教師講台與祝福；三書寫給一位朋友，叫他繼續接待為主名出外的弟兄，也責備把門關上的人。連用字都在對話：二書的迷惑人的「出來」與三書的弟兄「出外」，SBLGNT 原文同是 ἐξῆλθον（約貳 1:7；1:7；拜占庭抄本在約貳 1:7 作 εἰσῆλθον）。讀二書不讀三書，教會會變得封閉；讀三書不讀二書，教會會失去分辨（見〈開門與關門：約翰二書與約翰三書的接待，標準是甚麼？〉）。另見約翰一書講義的議題「約翰一、二、三書是甚麼關係？」。</p>"],["【四】這件事該不該影響你的信心","","<p>我們不知道那封被壓下的信寫了甚麼，這反而讓人安慰：一個好為首的人可以擋下一封信，卻擋不住真理。長老改寫一封給該猶，這封信今天在我們手裡。</p><p>可以問自己：<strong>我是不是曾經壓下過一封「信」？</strong>一個提醒、一個建議、一個別人想做的善事，因為不是我提的，我就讓它停在我的桌上。願我們作傳信的人，不作擋信的人。</p>"]],"con":[],"say":"本講義的全卷立場：9 節「略略地寫信給教會」是哪一封，二書說、失傳說、一書說並陳，以失傳說最貼近上下文，不裁判；三封信出於同一個聲音。二書與三書要一起讀：二書關門、三書開門，標準都是那一位基督（約貳 1:7、10；1:7--8）。","care":"這一題容易變成考據的遊戲。牧者只需讓會眾知道：三封信是一家人，二書與三書要一起讀；不要讓「那封信是哪一封」佔去講台的時間，也不要把任何一說講成信心的門檻。"},{"id":"ISS00_8","t":"這封私人短信為甚麼被收進正典？","r":"1:1--15","ch":[],"why":"八、一封寫給朋友的短信，為甚麼是神的話——本講義的全卷立場之八（全卷通用）。約翰三書是新約最短的一卷，沒有一句直接講福音的內容，連「耶穌」「基督」這兩個名字都沒有出現；它是一封私人信，提到三個名字、一場教會裡的衝突。有人因此問：這樣的信為甚麼被收進聖經？這一題簡述早期教會的討論，並說明本講義怎樣看這封信的地位。","pos":[["【一】經文問的是甚麼","","<p>全信十五節，最接近福音的一句是「因他們是為主的名出外」（1:7）——原文只是「那名」，和合本註腳說明：「原文是那名」；還有「行善的屬乎神；行惡的未曾見過神」（1:11）。信的結尾是：「願你平安。眾位朋友都問你安。請你替我按著姓名問眾位朋友安。」（1:15）</p><p><strong>經文問的是：一封這麼短、這麼私人的信，早期教會為甚麼接納它為正典？我們今天怎樣讀它的權威？</strong></p>"],["遲疑的聲音（篇幅短、作者自稱長老、流傳不廣）","","<p>早期教會對二書、三書確實有過遲疑。優西比烏（《教會史》3.25.3）把它們列在「有爭議，但為多數人所熟知」的書卷中；有些地區的教會較晚才普遍使用。原因很實際：篇幅短、少被引用、作者只自稱長老、內容又很私人。這派的優點是誠實：正典的形成有一段歷史，不是從天上掉下一份目錄。</p><p><strong>難處：</strong>遲疑不等於拒絕；多數的遲疑是因為流傳不廣，而不是因為內容有問題。</p>"],["接納的理由（同一個聲音、早期的見證、教會普遍使用）","","<p>最後教會普遍接納這封信，理由有三：它與約翰一書、約翰福音出於同一個聲音；它所見證的，正是使徒的教導——真理要行出來、要接待為主作工的人、要拒絕好為首的驕傲；它在教會裡被使用，牧養了一代又一代的人。第四世紀的教會會議與亞他那修的書信（主後 367 年）都把它列在新約二十七卷之中。</p><p><strong>難處：</strong>「被普遍使用」本身不是權威的來源；權威來自神，教會只是承認。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：約翰三書是神所默示的正典，與新約其他書卷有同樣的權威；早期教會的遲疑是歷史，也是教會謹慎分辨的見證，不是減損它的理由。</strong></p><p>這封信雖然沒有寫出「耶穌」的名字，卻處處是祂：為那名出外的人、接待就是同工、不要效法惡只要效法善、真理自己作見證、按著名字問候朋友——這使我們想起好牧人「按著名叫自己的羊」（約 10:3）。神把一封私人短信放進聖經，是告訴我們：福音不只在講台上，也在一扇門、一頓飯、一個名字裡。</p>"],["【四】這件事該不該影響你的信心","","<p>知道早期教會曾經遲疑，反而可以讓人放心：教會沒有隨便把任何書信收進來，而是經過時間與分辨。</p><p>可以問自己：<strong>如果神把一封寫給朋友的信放進聖經，我寫給人的訊息，是不是也帶著真理與愛？</strong>一則問候、一句「親愛的」、一個「按著姓名」的記念，都可能是神用來建立祂體系的一扇門。</p>"]],"con":[],"say":"本講義的全卷立場：約翰三書是神所默示的正典，與新約其他書卷同有權威；早期教會的遲疑（篇幅短、流傳不廣、作者自稱長老）是歷史，最後普遍接納。它雖沒有寫出耶穌的名字，卻處處為「那名」作見證。","care":"有人聽到「正典曾有爭議」就動搖，有人反而拿來懷疑整本聖經。牧者講這一題要平穩：說明歷史，也說明教會為甚麼接納；不要在講台上把正典史講成陰謀論，也不要把它講得好像沒有發生過。重點放回這封信要我們打開的門。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:1--15","ch":[],"why":"九、爭議是書房裡的事，門是今天要開的——本講義的全卷立場之九（全卷通用）。一封十五節的信，卻有這麼多爭議：作者是誰、該猶是誰、2 節是不是應許、那封信是哪一封、丟特腓是甚麼人、11 節是不是說會失去救恩。有人聽了覺得聖經很難，乾脆不讀；有人反而喜歡在爭議裡打轉，忘了經文要他做的事。這一題收束全卷的爭議，說明本講義怎樣看待它們。","pos":[["【一】經文問的是甚麼","","<p>這封信最清楚的命令只有幾句：「所以我們應該接待這樣的人」（1:8）、「不要效法惡，只要效法善」（1:11）、「請你替我按著姓名問眾位朋友安」（1:15）。這些命令一點都不難懂。</p><p><strong>經文問的是：那些我們弄不清楚的細節，會不會擋住我們去做那些清清楚楚的事？爭議該放在甚麼位置？</strong></p>"],["迴避說（這些事不必知道，單純信就好）","","<p>有人主張講台不必提任何爭議，免得擾亂會眾；單純相信、照著做就好。這派的優點是保護了軟弱的人，也把重點放在順服上。</p><p><strong>難處：</strong>不提爭議，會眾一旦在網路上看見別的說法，就以為教會隱瞞了甚麼；而且有些爭議（例如 2 節與成功神學）若不講清楚，正會傷到最單純的人。</p>"],["全盤懷疑說（爭議這麼多，聖經就不可靠）","","<p>另一種反應是：連作者、收信人都不能確定，這封信還可信嗎？這派的優點是誠實地面對問題，不假裝沒有困難。</p><p><strong>難處：</strong>不確定的是細節，不是信息；學者對該猶是誰有不同看法，對「為主的名」「只要效法善」卻沒有爭議。把細節的不確定，擴大成整本聖經的不可靠，是一個邏輯上的跳躍。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：爭議要誠實陳列，讓讀者看見各派的根據與難處，再給本講義的判斷；但爭議的位置在書房，不在門口——弄不清楚的細節，不可以擋住清清楚楚的命令。</strong></p><p>本卷的每一條爭議都附上「本講義站在哪裡」：作者沿用使徒約翰，並陳長老約翰說與約翰群體說；該猶是誰，並陳、不裁判；2 節是禱告不是應許；開門與關門以基督為標準；丟特腓的問題是好為首；11 節講生命的方向；年代採傳統；那封信以失傳說最貼近；正典的地位是確定的。這些判斷都可以討論，但沒有一條需要等到解決了，才能去接待一個為主名出外的弟兄。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這封信最難的地方不是學術，而是生命：開門很難，不爭首位很難，按著姓名記念人很難。如果一個人把所有爭議都弄清楚了，卻仍然好為首，他就比一個甚麼爭議都不懂、卻天天打開家門的該猶離神更遠。</p><p>可以問自己：<strong>我是用爭議來逃避命令，還是用研究來更深地順服？</strong>願我們像該猶一樣，心裡存著真理，腳下按真理而行。</p>"]],"con":[],"say":"本講義的全卷立場：爭議要誠實陳列各派根據與難處，再給本講義判斷；但爭議的位置在書房，不在門口——弄不清楚的細節，不可以擋住清清楚楚的命令：應該接待（1:8）、只要效法善（1:11）、按著姓名問朋友安（1:15）。","care":"席上會有喜歡
