追問、也容易被問題困住的人，也有一聽到爭議就緊張的人。牧者要讓兩種人都安心：提問不是不敬虔，研究也不是越過；同時把他們帶回這封信最簡單的命令——今天就去開一扇門、問候一個名字。"},{"id":"ISS01_1","t":"該猶是誰？與保羅書信裡的該猶是同一人嗎？","r":"1:1--1；羅 16:23；林前 1:14；徒 19:29；徒 20:4","ch":[1],"why":"約翰三書是寫給一個有名有姓的人：「作長老的寫信給親愛的該猶」（1:1）。讀者很自然想知道他是誰——是不是哥林多那位「接待全教會」的該猶？這一題看起來只是考據，其實會影響講台：有人把幾位該猶的生平拼成一位，講出經文沒有的故事；也有人因此把該猶講成一位大人物，忘了長老稱讚他的，只是一扇打開的門。所以要先把能知道的和不能知道的分清楚。","pos":[["【一】經文問的是甚麼","","<p>約翰三書只告訴我們幾件事：該猶是長老「誠心所愛的」（1:1）；有弟兄來證明他「按真理而行」（1:3）；他接待作客旅的弟兄，而且「所行的都是忠心的」（1:5）；他所在的地方有一間教會，教會裡有一位好為首的丟特腓（1:9）。信沒有說他住在哪一城、作甚麼職分、是不是長老帶信主的。Γάϊος 在羅馬世界是最普通的名字之一。經文問的不是「他是哪一位名人」，而是：一個按真理而行的人，在一間有人把門關上的教會裡，怎樣繼續開門。</p>"],["與保羅書信、使徒行傳中的某一位該猶是同一人","","<p>新約至少還有三位該猶：與保羅同行的「馬其頓人該猶」（徒 19:29），陪保羅往亞細亞去的「特庇人該猶」（徒 20:4），哥林多那位「那接待我、也接待全教會的該猶問你們安」（羅 16:23），以及保羅說「除了基利司布並該猶以外，我沒有給你們一個人施洗」（林前 1:14）的那一位——後兩位多半是同一人。有人認為約翰三書的該猶就是哥林多那一位：同樣以接待著名，同樣開門讓教會進來。</p><p><strong>難處：</strong>哥林多的該猶與保羅同時代，約翰三書多半寫在主後一世紀末（傳統約 85--95 年），地點在小亞細亞；相隔三、四十年、又隔著愛琴海，同名卻未必同人。「接待」是早期教會許多家庭共同的美德，不能只憑這一點把兩人疊在一起。</p>"],["後世傳說：約翰立他作別迦摩的監督","","<p>四世紀的《使徒憲典》（7.46）列出使徒所立的監督，說約翰在別迦摩立了一位該猶。若這個傳說可靠，約翰三書的該猶後來成了地方教會的領袖，長老在信裡對他的肯定，也帶著一份託付。</p><p><strong>難處：</strong>《使徒憲典》成書晚，名單裡有不少推想；它的作者很可能正是讀了約翰三書，才把該猶放進名單。這樣的傳說可以介紹，不能當作經文的註腳。</p>"],["一位只在這封信裡出現的弟兄","","<p>多數解經家認為：約翰三書的該猶，是長老所牧養的教會網絡中的一位信徒，新約別處沒有再提到他。他可能是長老帶信主的（4 節「我的兒女們」可以包括他），也可能只是長老認識、看重的一位弟兄。這一讀的好處是誠實：經文給多少，就講多少。</p><p><strong>難處：</strong>這一讀其實是「不知道」的另一種說法，依據是新約的沉默；它沒有排除前兩讀，只是不再往前推。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義三種可能並陳，不作裁判；講台只說「一位名叫該猶的弟兄」。</strong>不把哥林多的該猶、別迦摩的傳說拼進約翰三書的經文裡，也不替他編出經文沒有的身分。可以說的只有經文說的：他按真理而行，他向不認識的弟兄打開家門，他的愛在教會面前被人說出來。本講義的全卷立場見議題「作者、收信人與處境：長老、該猶、丟特腓與低米丟各是誰？」。</p><p>這一題其實是一面鏡子：神記得的不是頭銜，是忠心。長老要該猶記得的，也不是他是誰，而是他做的事「都是忠心的」（1:5）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。我們不知道該猶住在哪裡、作甚麼職分，卻清楚知道他怎樣活。福音書與書信裡許多名字都只出現一次，神卻把他們寫進正典。你在別人眼中也許只是「一位普通的弟兄姊妹」，但你為主的名打開的每一扇門，在神面前都有名字——這封信最後一句說的就是「按著姓名」（1:15）。</p>"]],"con":[],"say":"本講義的立場：該猶是誰，經文沒有交代；與哥林多的該猶、後世別迦摩監督的傳說，都只是可能，三種說法並陳、不作裁判。講台只說「一位名叫該猶的弟兄」，把焦點放在經文說的：他按真理而行，向作客旅的弟兄打開家門。","care":"講這一題時，不要把考據講成炫學，也不要為了故事好聽，替該猶編出經文沒有的生平。會眾席上多的是沒有頭銜、沒有人記得名字的弟兄姊妹——他們開車接送、煮飯招待、打掃聚會的地方。讓他們聽見：神記得忠心，不記得頭銜；你的名字在神那裡。"},{"id":"ISS01_2","t":"「凡事興盛，身體健壯」——是神的應許嗎？","r":"1:2--2；1:3；腓 2:27；提後 4:20；林後 12:9；雅 5:14","ch":[1],"why":"這是全卷最常被誤用的一節。有人把它當作神給每個信徒的保證：信得夠，就會發達、健康；也有人反過來說，這只是客套話，神只在乎靈魂、不在乎身體。兩種講法都會傷人——前者讓久病、貧窮的弟兄姊妹自責，後者讓人不敢為身體和生計禱告。全卷立場已經處理成功神學；本章要多走一步：既然這是一句禱告，我們今天可以怎樣照著它為彼此禱告？","pos":[["【一】經文問的是甚麼","","<p>原文的動詞是 εὔχομαι，「禱告、祈願」：「親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣」（1:2）。古代的家書開頭，常有一句「首先我禱告你身體健康」，約翰用了這個格式，卻加上一個比較：外面的順利，要「正如」裡面的順利。εὐοδόω 字面是「一路順利、走在好路上」，同一個字也出現在保羅的禱告裡：「或者照神的旨意，終能得平坦的道路往你們那裡去」（羅 1:10）。接著 3 節用 γάρ「因為」說明長老怎麼知道該猶的靈魂興盛：有弟兄來證明他「按真理而行」（1:3）。經文問的是：這句話是一份應許、一句客套，還是一個真誠的禱告？</p>"],["成功神學讀法：神應許信徒凡事興盛","","<p>這一讀把 2 節當作神的心意與應許：長老既然這樣禱告，表示神要每一位信徒凡事順利、身體健康；若沒有，就是信心或奉獻出了問題。支持的人常引「我的神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足」（腓 4:19）來配合。</p><p><strong>難處：</strong>這是長老對一個人的祈願，不是神對所有人簽下的合約，尺度是靈魂，不是銀行戶口；新約有忠心卻生病的聖徒（腓 2:27；提後 4:20；林後 12:9），全卷立場已詳述。</p>"],["純屬客套讀法：只是書信開頭的寒暄","","<p>這一讀強調古代書信的格式：「願你安好健康」是寫信的人都會寫的一句，像今天信末的「敬祝平安」，不必讀出任何神學意義。好處是把成功神學的根拔掉。</p><p><strong>難處：</strong>約翰改寫了套語，加上「正如你的靈魂興盛一樣」——一句真正的寒暄不會帶著這樣的比較。而且把它讀成客套，容易滑向另一個極端：好像神只在乎靈魂、不在乎身體，禱告只能談屬靈的事。雅各卻說「你們中間有病了的呢，他就該請教會的長老來」（雅 5:14），為病人禱告是教會的本分。</p>"],["真誠的禱告、以靈魂為尺度（本講義的讀法）","","<p>這一讀同時接受兩件事：它的格式是書信套語，它的內容是真誠的禱告。長老真心為該猶的身體與「凡事」禱告——旅途、家計、接待客旅需要的一切；但他把尺度放在靈魂上，因為他已經聽見該猶「按真理而行」。這給我們今天的禱告一個次序：可以為彼此的健康、工作、生計禱告，而且要具體；同時記得，最值得感恩的興盛，是一個人走在真理的路上。</p><p><strong>難處：</strong>這一讀需要分寸：既不能把禱告講成交易，也不能把身體的需要講成不夠屬靈。講台要同時說兩句話，比只說一句難。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採第三讀：2 節是一句以靈魂為尺度的真誠禱告，不是神簽了名的應許，也不是空洞的客套。</strong>所以本講義不用這一節教成功神學、健康財富福音，也不說神不在乎身體。我們可以學長老這樣為人禱告：先為他走在真理裡感恩；再具體地為他的身體、工作和生計求——說出那個病、那份工作、那筆帳單；最後不只是禱告，還要陪伴：一通電話、一次陪診、一頓飯。本講義的全卷立場見議題「興盛與靈魂：『凡事興盛，身體健壯』是神的應許嗎？」。</p><p>這使我們想起 321 常說的改變觀點：從屬世的觀點（興盛就是外在順利），改變成屬神的觀點（靈魂先興盛）。這不是叫人輕看身體，而是把身體的需要放在一位愛我們的神手中。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑神的愛。你若正在病中，或生活拮据，2 節不是指著你說「你信心不夠」；它是一位長老為所愛的人的禱告，今天也可以是弟兄姊妹為你的禱告。神的恩典夠你用，祂也聽你為身體、為家計的每一句呼求。真正的興盛，是在任何光景裡仍然按真理而行。</p>"]],"con":[],"say":"本講義的立場：1:2 是長老以靈魂為尺度的真誠禱告，不是神應許每個信徒富足健康，也不是空洞的客套。不教成功神學，也不說神不在乎身體；可以照著它，為彼此的靈魂、身體與生計具體地禱告。","care":"會眾席上有長年臥病的長輩、失業的父親、為醫藥費發愁的家庭。講這一節，最怕的是一句「你只要信，就會好」——那句話會壓垮他們。要讓他們聽見：你的病不是信心不夠的證明；教會要為你禱告，也要陪你就醫、陪你走過。神看你的靈魂，比看你的帳簿更清楚。"},{"id":"ISS01_3","t":"「我的兒女們」——是長老帶信主的人，還是他所牧養的人？","r":"1:4--4；約貳 1:4；林前 4:15；加 4:19；約壹 2:1","ch":[1],"why":"「我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的」（1:4）是全卷最溫柔的一句，也是父母、牧者最常引用的一句。「我的兒女們」指誰，會影響我們怎樣聽這份喜樂：是一位傳福音的人看見屬靈後代的喜樂，還是一位牧者看見群羊的喜樂？更要緊的是，這一節常被拿來對照自己的家——兒女還沒信主的父母，聽到這一節，往往不是喜樂，而是心痛。","pos":[["【一】經文問的是甚麼","","<p>原文是 τὰ ἐμὰ τέκνα，用了強調的物主形容詞「我自己的」兒女。μειζοτέραν 是雙重比較級，好像長老找不到夠大的字來形容這份喜樂。ἀκούω 是現在式：他一再「聽見」——長老不住在這些兒女身邊，是靠來往的弟兄帶回消息。兩封短信都有同樣的喜樂：「我見你的兒女，有照我們從父所受之命令遵行真理的，就甚歡喜」（約貳 1:4）。經文問的是：這些「兒女」是誰？長老與他們是甚麼關係？</p>"],["長老親自帶信主的人","","<p>這一讀照保羅的用法：「因我在基督耶穌裡用福音生了你們」（林前 4:15），又稱阿尼西謀是「我在捆鎖中所生的兒子」（門 1:10），也說「我小子啊，我為你們再受生產之苦，直等到基督成形在你們心裡」（加 4:19）。照這一讀，該猶也許就是長老帶信主的，長老的喜樂是一位屬靈父親看見自己所生的孩子長大。</p><p><strong>難處：</strong>約翰的著作用「兒女」「小子」的範圍很寬：「我小子們哪，我將這些話寫給你們」（約壹 2:1），對象是一整群讀者，很難說都是他親自帶信主的。單憑 4 節，看不出該猶是不是長老的屬靈兒子。</p>"],["長老所牧養的眾人","","<p>這一讀認為「我的兒女們」是長老所牧養的教會網絡中的信徒——像一位老牧者稱整個會眾為「孩子們」。約翰一書也這樣稱呼整群讀者：「小子們哪，我寫信給你們，因為你們的罪藉著主名得了赦免」（約壹 2:12）。照這一讀，長老的喜樂是牧者的喜樂：聽見群羊在各地「按真理而行」。</p><p><strong>難處：</strong>τὰ ἐμὰ「我自己的」帶著親密，讀成一個籠統的稱呼，可能把這份親密說淡了。</p>"],["兩者兼有：一個屬靈家庭","","<p>不少解經家認為兩讀不必二選一：長老晚年身邊有一個屬靈的家，有些是他帶信主的，有些是他多年牧養的，都被他稱為「我的兒女」。這樣讀，4 節描寫的是一種關係，而不是一份名單。</p><p><strong>難處：</strong>這一讀最寬，也最不容易出錯，卻也最難在講台上具體化；要小心不要把它講成空泛的「我們都是一家人」。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義三讀並陳，不作裁判；講台上可以說「長老屬靈的兒女們——他帶信主的、他牧養的」。</strong>更要緊的是這一節的性質：<strong>它是一位屬靈父親的喜樂，不是給父母的成績單。</strong>本講義不用 4 節責備兒女還沒信主、或離開信仰的父母，也不推論沒有「按真理而行」的兒女就是父母失敗的證據。</p><p>321 講屬靈父母與兒女的關係；這一節使我們想起那份關係裡最深的喜樂。長老「聽見」的喜樂，有些要等很多年才聽見——為兒女流淚的父母，眼淚在神面前沒有白流。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你自責。你若是一位父親或母親，孩子還沒有回到主面前，這一節不是在你傷口上撒鹽，而是給你一個盼望：有一天，你也可能「聽見」——從一通電話、一位朋友、一個你沒有想到的地方。繼續為他禱告，繼續愛他；把他交在那位比你更愛他的父手中。</p>"]],"con":[],"say":"本講義的立場：「我的兒女們」可能是長老帶信主的人、他所牧養的人，或兩者兼有，三讀並陳、不作裁判。1:4 是屬靈父親的喜樂，不是給父母的成績單；不用它責備兒女還沒信主的父母，而要為他們保留安慰、盼望與代禱。","care":"會眾席上有為兒女心碎的父母——孩子不再來教會、不再禱告、甚至反對信仰。講這一節時，不要說「好父母的孩子都會按真理而行」。要陪他們禱告，告訴他們：長老的喜樂是「聽見」的，有些聽見要等很久；你的代禱沒有落空，神沒有放棄你的孩子。"},{"id":"ISS01_4","t":"「配得過神，幫助他們往前行」——接待巡迴傳道人的標準是甚麼？","r":"1:6--6；1:5；1:7；約貳 1:10；徒 15:3；多 3:13；帖前 2:12","ch":[1],"why":"長老請該猶「幫助他們往前行」，而且要「配得過神」（1:6）。這一句是早期教會差派與接待的規矩，也是今天每一間教會都會遇到的問題：誰來敲門、誰來募款、誰說自己是傳道人，我們該怎樣接待？接待到甚麼程度？標準是誰定的？這一題若講偏，一邊會讓教會對真正的傳道人關門，另一邊會讓弟兄姊妹被假冒的人利用。","pos":[["【一】經文問的是甚麼","","<p>原文是 οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ：「你若配得過神，幫助他們往前行，這就好了」（1:6）。καλῶς ποιήσεις「你會做得好」，是書信裡客氣的請求；προπέμπω 是早期教會的專門用語，意思是送行，並供應路上所需——「於是教會送他們起行」（徒 15:3），「你要趕緊給律師西納和亞波羅送行，叫他們沒有缺乏」（多 3:13）。ἀξίως τοῦ θεοῦ「配得過神地」，和保羅說的「要叫你們行事對得起那召你們進他國、得他榮耀的神」（帖前 2:12）同一個說法。經文問的是：這個「配得過神」，是在說接待的方式，還是在說被接待的人？</p>"],["標準在接待的方式：要對得起差他們的神","","<p>這一讀把重點放在該猶怎樣送行：既然這些人是為神的名出去的，送他們的時候就要像在服事神——不是隨便打發，而是慷慨、周到，讓他們能走到下一站。這使我們想起主說「人接待你們就是接待我」（太 10:40）。照這一讀，「配得過神」是在提高接待的品質。</p><p><strong>難處：</strong>若只看方式，不看對象，就和約翰二書衝突：同一位長老說「若有人到你們那裡，不是傳這教訓，不要接他到家裡」（約貳 1:10）。接待的慷慨，不能沒有分辨。</p>"],["標準在被接待的人：為那名出外、一無所取","","<p>這一讀注意 7 節的「因」：該猶要送行的，是「因他們是為主的名出外，對於外邦人一無所取」（1:7）的人。「配得過神」先篩選了對象：他們出去，是為那名，不是為自己的名；他們不向不信的人拿錢，不把福音當生意。早期教會的《十二使徒遺訓》（11--12 章）也這樣分辨：巡迴的使徒住一兩天要接待，住三天、或開口要錢，就是假先知。</p><p><strong>難處：</strong>ἀξίως τοῦ θεοῦ 是副詞，文法上修飾「送行」這個動作，不是描寫被送的人；篩選對象的根據其實來自 7 節的「因」。而且若只強調篩選，教會容易變得多疑，對每一位來的人都先查證、先懷疑，忘了該猶接待的正是「作客旅」的、他原本不認識的弟兄（1:5）。</p>"],["兩者並行：先分辨對象，再慷慨送行（本講義的讀法）","","<p>這一讀把 5 至 7 節連在一起：對象要分辨——為那名出外、傳的是那一位基督、不為自己取；方式要慷慨——像服事神一樣送他們往前行。開門是常態，關門是例外；但開門之前，要知道門外站的是誰。</p><p><strong>難處：</strong>今天沒有使徒寫的介紹信，分辨需要時間、需要牧者、需要群體一起判斷；這比一條簡單的規則麻煩，卻比較接近經文。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採第三讀：接待的標準有兩面——對象要「為主的名」、方式要「配得過神」。</strong>所以本講義不叫弟兄姊妹無限度、不分辨地供應，也不叫教會對陌生的傳道人一律關門。今天的應用可以很具體：差派與接待透過教會，而不只是個人；了解對方傳的是甚麼、為誰的名出去；供應路上所需，讓他們「沒有缺乏」，而不是讓人藉著接待謀利。本講義的全卷立場見議題「開門與關門：約翰二書與約翰三書的接待，標準是甚麼？」。</p><p>約翰二書與約翰三書在這裡合成一扇門：同一位長老，一封叫人關門，一封叫人開門；標準不是認不認識、也不是誰掌權，是傳不傳那一位基督。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你害怕接待。你若曾經被人利用、借錢不還、被假冒的人騙過，這不是你愛心錯了，而是分辨需要群體一起做。下一次，帶著牧者、帶著教會一起開門。神仍然看重每一次為主的名打開的門。</p>"]],"con":[],"say":"本講義的立場：1:6 接待的標準有兩面——被接待的人是「為主的名出外、一無所取」的，接待的方式要「配得過神」；開門是常態，關門是例外，接待要分辨，並與約翰二書 1:10 合讀。不叫人無限度、不分辨地供應，也不對陌生的弟兄一律關門。","care":"教會裡有被人利用過的弟兄姊妹——借出去的錢要不回來，接待過的人原來是騙子；他們從此不敢再開門。也有熱心的長輩，誰來都給。講這一節時，兩種人都要照顧：不要羞辱受騙的人，也不要讓熱心的人孤軍奮戰；把接待放回群體裡，讓牧者與同工一起分辨、一起送行。"},{"id":"ISS01_5","t":"「對於外邦人一無所取」——今天的傳道人能不能接受供應？","r":"1:7--8；路 10:7；林前 9:14；加 6:6；帖前 2:9；徒 18:3","ch":[1],"why":"7 節說這些傳道人「對於外邦人一無所取」，8 節接著說「所以我們應該接待這樣的人」。這兩節常被兩邊拿來用：有人說真正屬靈的傳道人不應該收錢，用它羞辱接受教會供應的同工；也有人用「應該」兩個字向會眾施壓，好像不奉獻就是虧欠神。兩種講法都離開了經文的處境，也都傷害人。","pos":[["【一】經文問的是甚麼","","<p>「因他們是為主的名出外，對於外邦人一無所取」（1:7）。ἐθνικός 在新約指「外邦人、不信的人」；μηδὲν λαμβάνοντες 是現在分詞，一路上都不拿。接著：「所以我們應該接待這樣的人，叫我們與他們一同為真理做工」（1:8）。ὀφείλομεν「應該」是「欠、有義務」的字；ὑπολαμβάνειν 字面是「從底下托起來」，和 7 節的「取」λαμβάνοντες 同一個字根：他們不向外邦人取，神的家就托住他們。經文問的是：傳道人不拿的，是誰的錢？神的家「應該」的，又是甚麼？「一無所取」有兩種讀法：一是他們不向不信的人募款；一是連不信的人主動給的也不收，免得福音被看成買賣。兩讀都說明：他們不拿的，是外邦人的錢；托住他們的，是神的家。</p>"],["傳道人應當自給，不接受供應","","<p>這一讀以保羅為榜樣：他在哥林多「本是製造帳棚為業」（徒 18:3），「晝夜做工，傳神的福音給你們，免得叫你們一人受累」（帖前 2:9）。照這一讀，最清潔的事奉是不靠任何人，約翰三書的「一無所取」也是在讚美這種自給。</p><p><strong>難處：</strong>7 節說的是「對於外邦人」一無所取，不是對神的家一無所取；8 節正要神的家接待他們。保羅也說他放下這權柄，是「這並不是因我們沒有權柄」（帖後 3:9）。把自給講成唯一屬靈的路，就與經文相反。</p>"],["神的家供應傳道人是正當的","","<p>這一讀把 7 與 8 節合讀：傳道人不向不信的人拿，正因為信徒要托住他們。主差門徒時說「因為工人得工價是應當的」（路 10:7），保羅說「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14），又說「在道理上受教的，當把一切需用的供給施教的人」（加 6:6）。照這一讀，約翰三書保護了兩件事：福音不被看成生意，傳道人也不被丟在路上。</p><p><strong>難處：</strong>若只說「應當供應」，不說「為主的名」「配得過神」，這一讀可能被濫用——有人打著事奉的名，向會眾要求無止境的奉獻。</p>"],["供應的人是同工，不是贊助者（本講義的讀法）","","<p>這一讀注意 8 節的目的：「叫我們與他們一同為真理做工」（1:8）。συνεργοί 是「同工」。接待、供應的人沒有上講台，卻和出外的人一同做工；供應不是一筆交易，是一同有分。所以「應該」不是一張催繳單，而是神的家的榮幸：我們有分於那名傳出去的工作。</p><p><strong>難處：</strong>同工的關係需要彼此透明：傳道人怎樣用供應，會眾怎樣參與，都要在神面前誠實；這需要教會建立好的制度，不能只靠感動。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採第三讀，並以第二讀為根據：神的家供應為主名出外的人是正當的，而供應的人是同工。</strong>所以本講義不用 7 節羞辱接受教會供應的傳道人，也不用 8 節操控奉獻、製造罪疚。「一無所取」保護的是福音的清潔——不向不信的人收費、不把信仰當生意；「應該接待」保護的是出外的人——不讓他們缺乏。本講義的全卷立場見議題「開門與關門：約翰二書與約翰三書的接待，標準是甚麼？」。</p><p>這使我們想起 321 常說的無己：為耶穌、為別人、不為自己。出外的人不為自己取，接待的人不為自己留——兩邊都是無己，才「一同」成了同工。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你心裡有壓力，也不該讓你看輕傳道人。你若奉獻，是同工，不是買保險；你若暫時沒有能力奉獻，你的禱告、你的接待、你一頓飯，也是同工。你若是傳道人，接受神家的供應不是羞恥；把它用在那名上，就配得過神。</p>"]],"con":[],"say":"本講義的立場：1:7 的「一無所取」是不向不信的人取，保護福音不被當成生意；1:8 的「應該接待」是神的家托住為主名出外的人，供應的人是同工。不用這兩節羞辱接受供應的傳道人，也不用它們操控奉獻、製造罪疚。","care":"教會裡有收入微薄、覺得自己奉獻太少而不敢來聚會的人，也有被人在背後說「領薪水的」而心灰意冷的傳道同工。講這兩節時，不要用「應該」壓人，也不要用「一無所取」刺人。讓會眾知道：每一份托住都是同工；讓傳道人知道：神的家托住你，是神的心意。"},{"id":"ISS01_6","t":"「我曾略略地寫信給教會」——那封信是哪一封？","r":"1:9--9；1:10；約貳 1:1；約貳 1:10","ch":[1],"why":"長老說「我曾略略地寫信給教會」（1:9），接著說丟特腓不接待他們。這一句讓人好奇：那封信寫了甚麼？是新約裡的某一卷嗎？為甚麼沒有效果？三封信的整體關係已在全卷立場處理；本章只處理這一句多出來的幾件事：τι 這個小字、那封信的下落，以及長老為甚麼改寫信給該猶。","pos":[["【一】經文問的是甚麼","","<p>原文是 Ἔγραψά τι τῇ ἐκκλησίᾳ，「我寫了一點給教會」；τι 是不定代名詞「一點、一些」，和合本譯成「略略地」。拜占庭多數抄本（RP）沒有 τι，就成了「我寫了信給教會」。緊接著是「但那在教會中好為首的丟特腓不接待我們」（1:9）——「但」字說明那封信被擋下了。經文問的是：那封信是哪一封？它到哪裡去了？</p>"],["就是約翰二書","","<p>這一讀認為「寫信給教會」就是寫給「蒙揀選的太太和她的兒女」（約貳 1:1），也就是約翰二書；二書與三書長短相近，結尾幾乎同一句，很像同一時期寫的。</p><p><strong>難處：</strong>二書是叫人對否認基督成了肉身的教師關門：「不要接他到家裡」（約貳 1:10）；長老在 9 節提到的信，卻是要教會接待他派去的弟兄，內容方向相反。</p>"],["一封已經失傳的信","","<p>多數解經家認為那是一封沒有留下來的信，很可能是長老替巡迴的弟兄寫的介紹信或請求信。丟特腓不接待長老，也就不讓這封信在教會中被宣讀，信也許因此沒有流傳下來。長老只好改寫給該猶，請他私下接待，並預告「我若去，必要提說他所行的事」（1:10）。</p><p><strong>難處：</strong>這一讀是從經文的空白推想的，沒有直接證據；它只是最能解釋上下文的說法。</p>"],["就是約翰一書","","<p>少數人認為那封寫給教會的信是約翰一書：一封寫給一個教會網絡的長信。</p><p><strong>難處：</strong>約翰一書沒有書信的開頭與問安，也沒有提到接待巡迴弟兄的事，與「略略地寫信」的「一點」也不相稱；可能性較小。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義三讀並陳，不作裁判；傾向「一封已經失傳的信」最能解釋上下文。</strong>講台不必花時間猜信的內容，只要看見一件事：一位長老的信可以被壓下，但神的工作不會被壓下——長老改寫給一位願意開門的弟兄，這一封短信反而被收進正典。本講義的全卷立場見議題「約翰一、二、三書是甚麼關係？『略略地寫信』是哪一封？」。</p><p>τι「一點」也透露長老的分寸：那封信大概很短，是一封請求或介紹，不是長篇的教訓。被擋下以後，長老沒有再寫一封給同一間教會去硬碰，而是寫給一位會開門的弟兄，並把當面處理留到「我若去」——換一條路，繼續為真理做工。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約提到過幾封沒有留下來的信，正典沒有因此缺少甚麼；神保存了祂要教會讀的話。你若曾經寫過一封信、說過一句話卻被擋下來，這一節提醒你：不必用驕傲回應驕傲，換一扇開著的門，繼續做。</p>"]],"con":[],"say":"本講義的立場：「略略地寫信」的那封信，是約翰二書、一封失傳的信，還是約翰一書，三讀並陳、不作裁判，傾向失傳的信最能解釋上下文；重點不在信的內容，而在長老被擋之後沒有以驕傲回應，改寫給一位願意開門的弟兄。","care":"教會裡有些同工提過建議、寫過信，卻被擋下、被冷處理，心裡積著委屈。講這一節時，不要鼓勵他們去爭、去翻舊帳，也不要叫他們把委屈吞下去裝作沒事。可以陪他們學長老：把事情交給適當的時候、適當的場合，同時繼續找一扇開著的門事奉。"},{"id":"ISS01_7","t":"丟特腓：是異端、是抗拒使徒的地方領袖，還是一場權力之爭？","r":"1:9--10；1:11；約貳 1:10；可 10:44；彼前 5:3","ch":[1],"why":"丟特腓是新約裡少數被點名的反面人物，也是講台上最容易被拿來「借題發揮」的人。他到底錯在哪裡，決定我們怎樣講這兩節：若他是傳異端的，這是一場教義之爭；若他是濫權的領袖，這是一場品格之爭；若只是體制轉換的張力，這兩節就沒有那麼黑白分明。全卷立場已處理權柄與濫權；本章只把關於丟特腓本人的三種讀法擺出來。","pos":[["【一】經文問的是甚麼","","<p>經文對丟特腓的描述只有一個詞：「好為首的」，φιλοπρωτεύων，愛作第一（1:9）；新約只出現這一次。接著是四件事：「他用惡言妄論我們」、「他自己不接待弟兄」、「有人願意接待，他也禁止」、「並且將接待弟兄的人趕出教會」（1:10）。長老沒有說他傳錯了甚麼，也沒有用約翰二書「迷惑人的」那類說法形容他。經文問的是：丟特腓的問題，是教義、是權柄，還是體制？</p>"],["他是傳異端的人","","<p>這一讀認為丟特腓屬於約翰一書、二書所說那群從教會出去的人，或至少傾向他們；他不接待長老，是因為神學立場不同。</p><p><strong>難處：</strong>經文沒有任何教義的指控。若丟特腓是傳另一個基督的人，長老大可像約翰二書那樣說「不要接他到家裡」（約貳 1:10），但他沒有；他只說丟特腓的品格與行為。從經文的沉默推出異端，是替經文說了它沒說的。</p>"],["他是抗拒使徒權柄、要獨攬地方教會的領袖","","<p>多數解經家的讀法：丟特腓在那間教會有實權（「在教會中」原文是「在他們中間」），他不承認長老的權柄，也不讓長老派去的人在教會中有立足之地。ἐπιδέχομαι 除了「接待」，也有「接受、承認」的意思。他的問題寫在他的名字旁邊：要坐首位。這使我們想起主說「在你們中間，誰願為首，就必作眾人的僕人」（可 10:44），也想起彼得勸長老「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）。</p><p><strong>難處：</strong>我們只聽見長老這一方的說法；丟特腓若有自己的理由，經文沒有記下。所以講台要守住經文的界線，不替他加罪名。</p>"],["一場體制轉換期的張力","","<p>有學者從社會史讀：一世紀末，教會正從使徒與巡迴同工帶領，轉向地方的監督與長老治理；丟特腓也許是一位地方領袖，想保護會眾不受外來者打擾，與長老的巡迴網絡起了衝突。</p><p><strong>難處：</strong>這一讀提醒我們看見處境，卻容易淡化經文的判斷——長老明說他「用惡言妄論」，又把接待的人「趕出教會」，這不是單純的體制分歧，而是傷害了人。下一節「不要效法惡」也把他的行為放在「惡」那一邊。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採第二讀：丟特腓的問題不在頭腦，在心——經文對他唯一的描述是「好為首」，是生命的問題，不是教義的問題。</strong>同時，本講義不替他加上經文沒有的罪名，也不把他貼在任何真實的牧者、長老、教會或宗派身上。這兩節要先照自己：我們每一個人裡面都住著一個想坐首位的人。本講義的全卷立場見議題「好為首：教會的權柄與屬靈的濫權，怎樣分辨？」。</p><p>丟特腓的「好為首」，使我們想起 321 常說的：驕傲是離開本位抓住權力——離開僕人的本位，抓住只屬於基督的首位；而長老的回應，是不以驕傲對抗驕傲。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你對教會絕望。從一世紀起，教會裡就有好為首的人；聖經沒有隱藏這件事，反而把它寫下來、把該猶和低米丟放在旁邊。神的教會不是靠沒有丟特腓存在，而是靠那位在凡事上居首位的主。你若曾被這樣的人傷過，這兩節證明：神看見了。</p>"]],"con":[],"say":"本講義的立場：經文對丟特腓唯一的描述是「好為首」，沒有任何教義的指控；他的問題是生命，不是教義。本講義不替他加上經文沒有的罪名，也不把丟特腓貼在任何真實的人、教會或宗派身上，而是先把鏡子轉向自己。","care":"講這一題時，會眾心裡很容易浮出某一個人的臉——某位長執、某位牧者、某個過去的教會。不要讓講台變成點名的地方。要讓會眾先問自己：我在家裡、在小組、在同工會，有沒有想坐首位？也要讓曾經受傷的人知道：他們的傷是真的，神看見了，教會也願意陪他們按程序處理。"},{"id":"ISS01_8","t":"「將接待弟兄的人趕出教會」——教會紀律與屬靈濫權怎麼分？","r":"1:10--10；太 18:15--17；林前 5:13；提前 5:19；約 9:34","ch":[1],"why":"新約有教會紀律：「你們應當把那惡人從你們中間趕出去」（林前 5:13）。丟特腓卻把「接待弟兄的人」趕出教會。同樣是趕出去，一個是教會的本分，一個是權力的濫用。今天許多受過傷的人問：我被教會排擠，是不是丟特腓那一類？也有領袖擔心：一講濫權，就沒有人敢執行紀律。這一題需要分清楚，而且要保護人。","pos":[["【一】經文問的是甚麼","","<p>原文 ἐκ τῆς ἐκκλησίας ἐκβάλλει，「把他們從教會裡丟出去」；ἐκβάλλω 是很重的字，約翰福音用它描寫瞎子被趕出去：「於是把他趕出去了」（約 9:34）。現在式也可以讀作「想要趕出」。被趕的不是犯罪的人，而是「接待弟兄的人」——他們做了長老認為對的事。長老的回應是「所以我若去，必要提說他所行的事」（1:10）。經文問的是：怎樣分辨合乎聖經的紀律，與屬靈的濫權？</p>"],["正式的開除：丟特腓動用了教會的懲戒","","<p>這一讀認為丟特腓真的有權執行開除，他把接待的人從聚會、甚至從聖餐中除名。這顯示早期教會已有紀律的程序，丟特腓是把程序用錯了地方。</p><p><strong>難處：</strong>一世紀末的家庭教會是否已有正式的開除程序，能否由一人執行，我們不知道。</p>"],["意欲的現在式：他想要把人趕出去","","<p>這一讀注意希臘文的現在式可以表達「企圖、想要」：丟特腓正在想辦法把人排擠出去——冷落、施壓、散布惡言、讓他們在教會裡待不下去。這比正式的開除更常見，也更難察覺。</p><p><strong>難處：</strong>文法上兩讀都通，無法確定；但兩讀的結果相同：願意開門的人，被關門的人推到門外。</p>"],["不必二選一：從經文提出分辨的三個問題（本講義的讀法）","","<p>這一讀不在兩種文法之間選邊，而是從經文提出分辨的問題：①被處理的是犯罪，還是做了對的事？丟特腓趕的是接待弟兄的人。②程序是當面、在教會中、有見證，還是惡言與私下施壓？主給的程序是先私下、再帶一兩個人、再告訴教會（太 18:15--17），保羅也說「控告長老的呈子，非有兩三個見證就不要收」（提前 5:19）。③動機是保護羊群，還是保護自己的位置？丟特腓的名字旁邊寫著「好為首」。</p><p><strong>難處：</strong>這三個問題要在群體裡、在時間裡才看得清楚；當下受傷的人和執行紀律的人，往往各說各話。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採第三讀：教會紀律是真實的，濫權也是真實的；分辨看三件事——被處理的是不是犯罪、程序是不是當面、在教會中、有見證、動機是不是保護羊群。</strong>長老自己的回應就是榜樣：「我若去」——當面、在教會中、按程序；他沒有用惡言回敬惡言，也沒有叫該猶私下結黨。所以本講義不用 10 節合理化網路爆料、公開羞辱或私下結黨；也不叫被濫權、被趕出的人默默忍受：要分辨、要保護、要按程序求助。本講義的全卷立場見議題「好為首：教會的權柄與屬靈的濫權，怎樣分辨？」。</p>"],["【四】這件事該不該影響你的信心","","<p>你若曾被教會排擠、被人以屬靈的名義趕出去，你的痛是真的，不必假裝沒有發生；這一節證明神看見這種事，也不認可這種事。但不要因此離開那位主。找一位可信任的牧者或屬靈長輩，按程序把事情說出來；同時把你的心交給主，不讓苦毒在裡面作王。</p>"]],"con":[],"say":"本講義的立場：教會紀律與屬靈濫權都是真實的，分辨看被處理的是否犯罪、程序是否當面、在教會中、有見證、動機是否保護羊群；1:10 長老的「提說」是當面、在教會中、按程序，不是網路爆料或私下結黨；被濫權、被趕出的人要被保護，可以按程序求助。","care":"會眾席上可能有被前一間教會傷過、帶著委屈來的人，也可能有正在執行紀律、壓力很大的同工。講這一節時，兩邊都要照顧：不要把所有紀律都說成濫權，也不要叫受傷的人「順服就好」。教會要有可以申訴、可以被聽見的管道，讓受傷的人知道他們不必上網，也有地方可以說話。"},{"id":"ISS01_9","t":"「行惡的未曾見過神」——基督徒還會行惡嗎？","r":"1:11--11；約壹 3:6；約壹 3:9；約壹 1:8；約壹 4:12；約 1:18","ch":[1],"why":"「行善的屬乎神；行惡的未曾見過神」（1:11）。敏感的良心讀到這一句會害怕：我還會犯罪、還會發脾氣、還會有惡念，是不是我從來沒有見過神？也有人用這一句審判別人：「他做了那種事，一定沒有得救。」全卷立場已處理罪與確據；本章只多走一步：「見過神」在約翰的話語裡是甚麼意思？","pos":[["【一】經文問的是甚麼","","<p>原文的兩個主詞都是現在分詞：ὁ ἀγαθοποιῶν「那行善的人」、ὁ κακοποιῶν「那行惡的人」——描寫的是一個人持續的樣式。οὐχ ἑώρακεν τὸν θεόν 是完成式：「沒有見過、至今仍沒有見過神」。同一位作者說「從來沒有人看見神，只有在父懷裡的獨生子將他表明出來」（約 1:18），又說「從來沒有人見過神，我們若彼此相愛，神就住在我們裡面」（約壹 4:12）。經文問的是：既然從來沒有人看見神，「見過神」指的是甚麼？</p>"],["屬靈的認識：見過神就是真認識神","","<p>這一讀照約翰一書的平行句：「凡犯罪的，是未曾看見他，也未曾認識他」（約壹 3:6）——「看見」與「認識」並列。「見過神」不是眼睛看見，而是在基督裡認識了神；一個持續以惡為生命方向的人，顯出他還沒有真正認識神。</p><p><strong>難處：</strong>這一讀若不小心，會被讀成「凡有惡行的就沒有認識神」；但同一位作者也說「我們若說自己無罪，便是自欺」（約壹 1:8）。</p>"],["生命的方向：講的是樣式，不是一次失敗","","<p>這一讀強調現在分詞：長老描寫的是兩種生命的方向——一種以行善為樣式，一種以行惡為樣式。正如約翰一書說「凡從神生的，就不犯罪」（約壹 3:9），講的是生命的方向，不是說信徒一次都不會跌倒；因為同一封信又說「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（約壹 1:9）。</p><p><strong>難處：</strong>這一讀若講過頭，會讓人覺得行甚麼都無所謂；但經文的語氣是嚴肅的：方向是真實的，果子會顯出來。</p>"],["針對丟特腓的提醒","","<p>這一讀把 11 節放回上下文：它緊接在丟特腓的四件事之後，又在低米丟之前。長老是在對該猶說：不要以為一個在教會中坐首位的人就一定認識神；看他的果子。這使我們想起主說「所以，憑著他們的果子就可以認出他們來」（太 7:20）。</p><p><strong>難處：</strong>這一讀容易讓人拿 11 節去判斷別人得救與否；但長老說這話的目的，是叫該猶「不要效法惡」，不是叫他審判丟特腓的靈魂。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義三讀合讀：「見過神」是在基督裡真認識神；現在分詞描寫生命的方向；上下文是在提醒該猶選擇效法誰。</strong>所以本講義不用 11 節製造失去救恩的恐懼，也不用它判斷某個人有沒有得救；確據建立在基督身上，不在我們從不跌倒。同時，本講義也不把它講成行甚麼都無所謂——方向是真實的，愛弟兄、行善是見過神的人自然結出的果子。本講義的全卷立場見議題「行善與見過神：『行惡的未曾見過神』，是說會失去救恩嗎？」。</p><p>這使我們想起 321 常說的焦點在耶穌：見過神，是看見了「在父懷裡的獨生子」；越看見祂，生命的方向就越轉向善。</p>"],["【四】這件事該不該影響你的信心","","<p>你會為自己的軟弱害怕、願意回到主面前，這份敏感本身就是聖靈在你裡面工作的記號。到主面前認罪，祂是信實的；然後再一次選擇效法善。你的確據不在你今天表現得多好，而在那位為你死而復活的主。</p>"]],"con":[],"say":"本講義的立場：1:11 的「見過神」是在基督裡真認識神；現在分詞描寫的是生命的方向，不是一次跌倒的判決。不用這一節製造失去救恩的恐懼或判斷別人是否得救；確據建立在基督身上，同時方向是真實的，行善是見過神的人的果子。","care":"會眾席上有良心特別敏感、常常懷疑自己有沒有得救的人；也有喜歡拿經文判斷別人的人。講這一節時，對前者要先安慰，帶他們看約翰一書 1:9 的應許；對後者要溫柔地提醒：長老叫該猶「不要效法惡」，不是叫他宣判誰沒有見過神。"}],"terrain":{"points":[[0.6,70,2,"正如你的靈魂興盛一樣",null],[0.733,92,4,"我的喜樂就沒有比這個大的","top"],[0.8,74,5,"都是忠心的",null],[0.933,80,7,"是為主的名出外",null],[1.0,96,8,"一同為真理做工","top"],[1.067,14,9,"好為首的丟特腓不接待我們","bot"],[1.133,6,10,"將接待弟兄的人趕出教會","bot"],[1.2,90,11,"只要效法善","top"],[1.267,84,12,"你也知道我們的見證是真的",null],[1.467,94,15,"按著姓名問眾位朋友安","top"]]},"tracks":[{"gk":"ἀλήθεια","tr":"alētheia","gl":"真理（和合本 1:1 作「誠心」）","code":"G225","root":"ἀλήθεια——真實、真理；字根的意思是「不被遮蓋、沒有隱藏」。十五節裡出現六次，另有形容詞 ἀληθής（真的）一次。約翰幾乎不談真理的「內容」，只談真理的腳步：在真理中愛、按真理而行、為真理做工、真理作見證","ins":"第一站，真理是愛的所在：「就是我誠心所愛的」（1:1），原文是「我在真理中所愛的」（ἐν ἀληθείᾳ）——和約翰二書第一節同一句話。第二站，真理落到一個人身上，而且有兩層：弟兄們證明的是「你心裡存的真理」（原文只說「你的真理」，σου τῇ ἀληθείᾳ），長老補一句「正如你按真理而行」（1:3）——真理先在心裡，再走在腳上。第三站，真理成了一家人的走法：「我聽見我的兒女們按真理而行」（1:4），περιπατοῦντα 是現在分詞，走路是一種持續的生活樣式。第四站是第一個翻轉：真理需要同工——「叫我們與他們一同為真理做工」（1:8）；τῇ ἀληθείᾳ 可以讀成「為真理」，也可以讀成「與真理一同」：接待的人不只是幫傳道人的忙，是和真理本身一起做工。第五站是第二個翻轉：前面都是人為真理作見證，到 12 節，真理自己開口了——低米丟「又有真理給他作見證」（1:12）。真理從愛的所在，到心裡存的、腳上走的，到一同做工的對象，最後成了一位見證人。被真理找到的人，最後被真理認出來。","stops":[["1:1","就是我誠心所愛的",""],["1:3","有弟兄來證明你心裡存的真理，正如你按真理而行","top"],["1:4","我聽見我的兒女們按真理而行",""],["1:8","叫我們與他們一同為真理做工","top"],["1:12","又有真理給他作見證","top"]]},{"gk":"μαρτυρέω／μαρτυρία","tr":"martyreō / martyria","gl":"證明、作見證；見證","code":"G3140","root":"μαρτυρέω——作見證、證明；μαρτυρία——見證、證詞。約翰最愛的字之一（約翰福音三十多次）。這封信是在一個沒有電話、沒有網路的世界裡，靠人來人往的口頭見證認識彼此：有弟兄來證明、在教會面前證明、眾人作見證、真理作見證、我們作見證","ins":"第一站，見證從路上回來：「有弟兄來證明你心裡存的真理」（1:3）——ἐρχομένων καὶ μαρτυρούντων 是現在分詞，弟兄們一批一批來，一次一次說。長老不認識該猶家裡的每一件事，是靠走過那扇門的人回來說的。第二站，見證被說在全會眾面前：「他們在教會面前證明了你的愛」（1:6）——該猶在自己家裡接待陌生人，那份愛卻在另一間教會被公開說出來；暗中的接待，在神的家裡有人記得。第三站，見證疊成三層：低米丟「有眾人給他作見證，又有真理給他作見證，就是我們也給他作見證」（1:12）——這使我們想起律法說「要憑兩三個人的口作見證」（申 19:15）；長老給低米丟的不是一張介紹信，是三重的保證。μεμαρτύρηται 是完成式被動：見證已經作成，至今有效。第四站是翻轉：「你也知道我們的見證是真的」（1:12）——見證的人自己也要被見證。這使我們想起約翰福音的結尾：「我們也知道他的見證是真的」（約 21:24）。前面的人為該猶、為低米丟作見證；最後長老請該猶為長老的見證作見證——真理的群體，就是一群互相作真見證的人。","stops":[["1:3","有弟兄來證明你心裡存的真理",""],["1:6","他們在教會面前證明了你的愛","top"],["1:12","有眾人給他作見證，又有真理給他作見證，就是我們也給他作見證","top"],["1:12","你也知道我們的見證是真的","top"]]},{"gk":"ὑπολαμβάνω／ἐπιδέχομαι／ἐκβάλλω","tr":"hypolambanō / epidechomai / ekballō","gl":"接待；（反面）不接待、趕出","code":"G1926","root":"ὑπολαμβάνω——從底下托起來、承接、接待；ἐπιδέχομαι——接納、接待，也有「承認對方的權柄」的意思；ἐκβάλλω——丟出去、趕出去。中文都譯作「接待」，原文是兩個字：8 節長老用的是「托起來」，9--10 節丟特腓「不接納」，最後把人「丟出去」","ins":"第一站，門打開：「所以我們應該接待這樣的人」（1:8）——ὑπολαμβάνειν 原意是「從底下托起來」，和上一節的 λαμβάνοντες（「一無所取」的「取」）是同一個字根：出外的人不向外邦人「取」，神的家就「托住」他們。第二站，門關上，而且關的是長老：「好為首的丟特腓不接待我們」（1:9）——ἐπιδέχεται 是現在式，不是一次，是一直不接；這個字在當時的信件裡也有「不承認對方的權柄」的意思。第三站，關門的人連別人的門也要關：「他自己不接待弟兄，有人願意接待，他也禁止」（1:10）。第四站是翻轉：「並且將接待弟兄的人趕出教會」（1:10）——開門的人被趕出門外。最想作第一的人，最後把教會變成只有一扇門、而且只有他能開的地方。這條線要和約翰二書對讀：二書說「不要接他到家裡」（約貳 1:10），三書說「我們應該接待這樣的人」（1:8）。同一位長老，一封叫人關門，一封叫人開門；標準不是認不認識，也不是誰掌權，是傳不傳那一位基督。","stops":[["1:8","所以我們應該接待這樣的人","top"],["1:9","但那在教會中好為首的丟特腓不接待我們",""],["1:10","他自己不接待弟兄，有人願意接待，他也禁止",""],["1:10","並且將接待弟兄的人趕出教會",""]]},{"gk":"ἀγαπητός／ἀγαπάω／ἀγάπη","tr":"agapētos / agapaō / agapē","gl":"親愛的、所愛的、愛","code":"G27","root":"ἀγαπητός——蒙愛的、親愛的；ἀγαπάω——愛；ἀγάπη——愛。長老每一次轉到新的一段，都先叫一聲 Ἀγαπητέ「親愛的」（2、5、11 節）——和合本補了「兄弟」兩個小字。這封信的骨架，是三聲「親愛的」","ins":"第一站，信一開頭就兩次愛：「親愛的該猶，就是我誠心所愛的」（1:1）——ἀγαπητῷ 和 ἀγαπῶ 緊緊挨著，該猶是「蒙愛的」，也是長老「在真理中所愛的」。第二站，第一聲「親愛的」帶出一句禱告：「親愛的兄弟啊，我願你凡事興盛」（1:2）。第三站，第二聲「親愛的」帶出一句肯定：「凡你向作客旅之弟兄所行的都是忠心的」（1:5）。第四站，長老被愛，該猶也在愛人：「他們在教會面前證明了你的愛」（1:6）——被愛的人，成了愛人的人。第五站是翻轉：全卷最直接的一道命令，前面仍是最溫柔的稱呼——「親愛的兄弟啊，不要效法惡，只要效法善」（1:11）。長老剛寫完丟特腓的四件事，語氣卻沒有變硬；他沒有對該猶說「你要站起來對抗他」，只說「親愛的，別效法他」。三聲「親愛的」排成一條線：禱告、肯定、勸勉——在約翰三書裡，真理和愛依然手牽著手。","stops":[["1:1","作長老的寫信給親愛的該猶，就是我誠心所愛的",""],["1:2","親愛的兄弟啊，我願你凡事興盛",""],["1:5","親愛的兄弟啊，凡你向作客旅之弟兄所行的都是忠心的",""],["1:6","他們在教會面前證明了你的愛",""],["1:11","親愛的兄弟啊，不要效法惡，只要效法善","top"]]}],"lesson":{"1":{"no":1,"vol":"《321約翰三書講義》第一課·約翰三書第一章","title":"一同為真理做工——第一名、托住、名字","chars":5147,"min":60,"deep":8,"dchars":1688,"tchars":1556,"blocks":[["h","一、名字旁邊的三個字"],["p","弟兄姊妹平安。你小時候第一次想當第一名，是為了甚麼？是為了一張獎狀，為了爸爸媽媽在親戚面前多說一句話，還是因為不想再被人問：你這次考第幾名？我們很多人是聽著這一句長大的。第一名讓人被看見，第二名常常就沒有人記得了。"],["p","我們說一個情境。志明在新加坡長大，從小每一次考完試，回家第一句被問的就是考第幾名。後來他信了主，很熱心，當上小組長。小組做得不錯，可是慢慢地，組裡每一件事都要經過他：誰來分享、誰帶詩歌、要不要邀請新朋友，都由他決定。有一次，一位新來的姊妹提議到醫院探訪一位組員，他沒有說不好，只說再看看，事情就停在那裡了。他自己也說不出為甚麼，只是心裡不太舒服：這件事不是我想到的。"],["p","新約裡有一封很短的信，寫到一個人的時候，名字旁邊只放了三個字：「但那在教會中好為首的丟特腓不接待我們。」（1:9）好為首。經文沒有說他傳錯了道，也沒有說他不熱心；名字旁邊只說他愛作第一。"],["p","這就是約翰三書，一章十五節，以原文字數算，是新約最短的一卷。信裡有三個人：寫給一位叫該猶的弟兄，提到一位叫丟特腓的領袖，又推薦一位叫低米丟的人。三個人像三面鏡子，可是請先說清楚：鏡子是用來照自己的，不是拿來指著別人的。這一課，我們用三個詞把它教一遍：第一名、托住、名字。"],["h","二、行：真理先走在自己腳上"],["p","「作長老的寫信給親愛的該猶，就是我誠心所愛的。」（1:1）作長老的，本系列沿用約翰一書講義的立場：使徒約翰。誠心，原文是在真理中；「我在真理中所愛的」，和約翰二書第一節幾乎是同一句話，只是二書愛的是一群人，這裡是一個人。該猶是誰？新約裡叫該猶的至少有三位，這是當時很普通的名字，是不是同一個人，我們不知道，也不必猜。"],["p","第二節是全卷最常被引用、也最常被講錯的一節：「親愛的兄弟啊，我願你凡事興盛，身體健壯，正如你的靈魂興盛一樣。」（1:2）請你想一想我們自己寫信、寫賀卡的習慣：開頭或結尾常常是敬祝身體健康、萬事如意。沒有人會把這一句當成合約，拿去要求寫卡片的人負責。長老用的，正是他那個時代寫信的這一句。不少解經家還認為，和合本譯作凡事的那兩個字，相當於書信套語的「最要緊的是」：長老是說，我首先為你禱告。所以這是一句問安和禱告，不是神簽了名、保證每個信徒都富足健康的合約。不同的是，長老在套語後面加了一句：正如你的靈魂興盛一樣。標準放在靈魂。"],["p","所以這一班裡，若有人正在化療，若有人剛剛失業，請不要從這一節聽出你的信心不夠；主對一位禱告三次身上的刺仍沒有挪去的使徒說：「我的恩典夠你用的」（林後 12:9）。也不要倒過來說神只管靈魂、不管身體。長老為該猶的身體禱告；我們也可以為彼此的身體、工作、生計開口求，也可以去看醫生。"],["p","長老怎麼知道？「有弟兄來證明你心裡存的真理，正如你按真理而行，我就甚喜樂。」（1:3）請注意他的消息來源：不是該猶自己寫的報告，是在他家住過的客人。他們回來說的，不是該猶懂多少，是他怎樣過日子。真理先在心裡，再走在腳上。"],["p","「我聽見我的兒女們按真理而行，我的喜樂就沒有比這個大的。」（1:4）這是一位屬靈父親的喜樂；長老說的兒女，是他在信仰裡帶大的屬靈兒女。若你是孩子還沒信主、或者走開了的父母，讀到這裡心裡一陣刺痛，請先把這份刺痛放著。第六節，我們用美玲姊的故事，專門回來陪你。"],["d",["「我願你凡事興盛，身體健壯」，不是神應許基督徒會健康富足嗎？","興盛這個字，εὐοδοῦσθαι（euodousthai），由好和路兩個字合成，字面是走在好路上，到新約時代多半就是順利、亨通的意思。保羅求神讓他去羅馬時用的也是它：「終能得平坦的道路往你們那裏去」（羅 1:10）。保羅後來真的到了羅馬，卻是戴著鎖鍊去的；神給的平坦道路，不一定是舒服的道路。所以為病人禱告時，可以求：主啊，求你醫治他，也在這條路上與他同在；而不是說：你只要信心夠，病就會好。前一句把結果交給神，後一句把擔子壓回病人身上。這一週為一位病人禱告時，可以先問他：你最希望我為你求甚麼？"]],["h","三、接與效：一扇為那名打開的門，一扇被首位關上的門"],["p","「親愛的兄弟啊，凡你向作客旅之弟兄所行的都是忠心的。」（1:5）作客旅的，原文是陌生人。請你想像：晚上九點，一位素未謀面的傳道人拿著介紹信站在你家門口。該猶開了門。長老說，這叫忠心：忠心不只是對熟人守信，也是對神所差來的陌生人守信。"],["p","「他們在教會面前證明了你的愛；你若配得過神，幫助他們往前行，這就好了。」（1:6）幫助他們往前行，是早期教會的專門用語：送行，給路上吃的、用的，也許寫一封介紹信，讓他們走到下一站。標準是配得過神，配得過差他們出去的那一位。"],["p","「因他們是為主的名出外，對於外邦人一無所取。」（1:7）原文只說那名。他們不向還沒信主的人伸手，免得福音被看成一門生意。那他們靠甚麼走下去？「所以我們應該接待這樣的人，叫我們與他們一同為真理做工。」（1:8）這一節就是本課的題目。應該，原文是欠的意思：神的家欠這些人一份接待。接待的人沒有上講台，卻成了同工。"],["p","兩件事要分清。第一，傳道人接受神家的供應是正當的（路 10:7）；不要拿一無所取去羞辱接受供應的傳道人，也不要拿應該接待去逼人奉獻；應該是神家的榮幸，不是催繳單。第二，這樣的人，是為那名出外、配得過神的人。同一位長老在約翰二書說：「不要接他到家裡」（約貳 1:10），那是對否認耶穌基督成了肉身的教師說的。二書關門，三書開門，標準是傳不傳那一位基督；接待要分辨，不是任誰來敲門都要無限度地供應。"],["p","然後是那第二扇門。請你拿筆，在第十節的動作下面畫線：「所以我若去，必要提說他所行的事，就是他用惡言妄論我們。還不以此為足，他自己不接待弟兄，有人願意接待，他也禁止，並且將接待弟兄的人趕出教會。」（1:10）你畫到幾個？用惡言妄論、自己不接待、禁止別人接待、把接待的人趕出教會：四個動作，一個比一個往外推。最後被推出門外的，正是開門的人。"],["p","長老怎麼回應？他說我若去：當面，在教會裡，把事情擺出來。這使我們想起主教導的次序：「倘若你的弟兄得罪你，你就去，趁著只有他和你在一處的時候，指出他的錯來。」（太 18:15）先單獨說，再帶一兩個人，再告訴教會。這不是上網爆料的許可證。"],["p","接著長老轉身，對該猶說：「親愛的兄弟啊，不要效法惡，只要效法善。行善的屬乎神；行惡的未曾見過神。」（1:11）長老接著寫的，不是對丟特腓的反擊，是對該猶的勸勉。這是全信最直接的一道命令；長老在意的不是誰贏，是該猶會不會在這場風波裡，慢慢也變成另一個丟特腓。"],["p","最後，長老推薦一個人。請在白板上寫三行：眾人、真理、我們。「低米丟行善，有眾人給他作見證，又有真理給他作見證，就是我們也給他作見證。你也知道我們的見證是真的。」（1:12）三行都替低米丟說話，這使我們想起律法要憑兩三個人的口定案（申 19:15）。行善兩個字是和合本補上的小字，原文只說他有見證。請你想一想：你的名字旁邊，會寫上甚麼？"],["p","信的結尾很短：「我原有許多事要寫給你，卻不願意用筆墨寫給你，」（1:13）「但盼望快快地見你，我們就當面談論。」（1:14）事可以寫，人要見。當面，原文是口對口。可是長老自己正在用筆墨牧養該猶，這封信本身就是一份遠距的牧養；筆墨是橋，不是次等。因病、因工作、因距離只能在線上相聚的人，沒有少得一點真理；當面是盼望與邀請，不是門檻。"],["d",["傳道人可以接受奉獻嗎？「一無所取」是不是說他們不該收錢？","新約對供應傳道人講得很直接：「主也是這樣命定，叫傳福音的靠著福音養生。」（林前 9:14）提摩太前書也引主的話：「工人得工價是應當的。」（提前 5:18）所以問題不在可不可以收，而在供應的人怎樣成為同工。同工長甚麼樣子？第一，知道他的需要：問一問傳道人這個月最缺的是甚麼，是書、是車資，還是有人陪他探訪。第二，固定代禱：把他的名字寫在禱告本上，每週一次，不是想起來才求。第三，甘心而不張揚：不為面子，不附帶要求，也不因為給了就以為可以指揮他。第七節的傳道人不向還沒信主的人伸手；第八節的神家就主動伸手。這不是施捨，是一同做工。"]],["d",["約翰二書說「不要接他到家裡」，約翰三書說「應該接待」，到底要開門還是關門？","兩封信是同一位長老寫的，標準也是同一個。約翰二書關門的對象，是否認耶穌基督成了肉身、出去傳另一個基督的教師，所禁的是給他講台、住處、背書。約翰三書開門的對象，是為那名出外、一無所取、配得過神的弟兄。所以標準不是認不認識、是不是自己人，也不是誰在教會裡有權，是傳不傳那一位基督。早期教會的《十二使徒遺訓》也一面接待、一面分辨：巡迴的人住一兩天可以，住到第三天、或開口要錢，就是假先知。開門是常態，關門是例外；丟特腓的錯，是把例外變成了常態。"]],["h","四、原文亮光：愛作第一、從底下托住、按著名字"],["p","回到開場的問題：第一名。請和我一起拆三個原文。"],["p","第一個字：φιλοπρωτεύων（philoprōteuōn），和合本譯作好為首。這個字新約只出現這一次，前半是愛，後半是作第一：愛作第一，愛坐首位。它和歌羅西書說到基督的那一句同一個字根：「使他可以在凡事上居首位」（西 1:18）。教會裡只有一個首位，而那個位子早就有人坐了。我們說驕傲是離開本位抓住權力；丟特腓就是離開了僕人的本位，伸手去抓那張只屬於基督的椅子。主耶穌的話正好是它的反面：「在你們中間，誰願為首，就必作眾人的僕人。」（可 10:44）"],["p","第二個詞是一對字：λαμβάνοντες（lambanontes）和 ὑπολαμβάνειν（hypolambanein）。第七節說傳道人一無所取，取就是前一個字；第八節說我們應該接待，接待就是後一個字，字面意思是從底下托起來。同一個字根，長老像是有意讓兩個字互相呼應：出外的人不伸手，神的家就伸手托住。好為首的人站在上面往下看，接待的人蹲在下面往上托。"],["p","第三個詞：κατʼ ὄνομα（kat' onoma），按著名字。信的最後一句：「願你平安。眾位朋友都問你安。請你替我按著姓名問眾位朋友安。」（1:15）第七節的「那名」和第十五節的「姓名」，原文是同一個字 ὄνομα：信從主的名出發，停在朋友的名字上。"],["p","這使我們想起好牧人：「他按著名叫自己的羊，把羊領出來。」（約 10:3）那裡也是同一個片語。在主那裡，沒有第一名和其餘的人，只有一個一個被叫出名字的人。"],["p","所以答案是：丟特腓要的是第一名，長老給該猶的是一個名字。好為首的人要被看見；托住別人的人，反而被按著名字記念。"],["d",["丟特腓是傳異端的人嗎？為甚麼長老這麼嚴厲？","經文對丟特腓沒有任何教義的指控，只說他好為首，用惡言妄論、不接待、禁止別人接待、把接待的人趕出教會。學者有三種看法，議題頁並陳。本講義的看法是，他的問題不在頭腦，在心，詳見議題〈好為首：教會的權柄與屬靈的濫權，怎樣分辨？〉。長老也沒有罵他，只說我若去，要提說他所行的事：當面、在教會中、照事實說。教會的權柄是真實的，濫權也是真實的；分辨兩者，看的是那個人在保護羊，還是在保護自己的位子。"]],["d",["第十一節說「行惡的未曾見過神」，我還常常跌倒，是不是根本沒有見過神？","不是。行善的、行惡的，原文都是現在分詞，描寫的是一個人一生走的方向和樣式，不是一次跌倒的判決。約翰一書一面說凡犯罪的是未曾看見他，一面又說：「若有人犯罪，在父那裡我們有一位中保，就是那義者耶穌基督。」（約壹 2:1）我們的確據不在自己做得夠不夠，在那位為我們捨命的基督。可是也不要倒過來說行甚麼都無所謂；一個真正見過神的人，生命會慢慢轉向善。本講義的立場見議題〈行善與見過神：「行惡的未曾見過神」，是說會失去救恩嗎？〉。今晚睡前可以做一件事：把今天的一次跌倒具體說給神聽，然後謝謝祂的赦免。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把這封信當成一堂教會人事管理課，焦點落在長老怎樣處理丟特腓，忘了這封信的中心是「為主的名」的那一位。先有按真理而行，先有為那名出外的人，我們才談得上怎樣待人。"],["p","第二個偏差，是錯拿第二節教成功神學；那是一句問安和禱告，標準是靈魂。"],["p","第三個偏差，是錯把丟特腓貼在某一位真實的牧者、長老、教會或宗派身上，或拿第十節合理化在網上公開爆料、私下結黨。這封信不給我們點名的權利；長老的提說是當面、在教會中、按程序，而且他立刻轉向效法善。"],["p","第四個偏差，是錯拿第七、八節羞辱接受供應的傳道人、製造奉獻的壓力，或要人對每一個來敲門的人無限度供應；二書的分辨仍在。"],["p","第五個偏差，是錯拿第十一節嚇唬跌倒的人，或拿第四節責備兒女還沒信主的父母；第十一節講的是一生的方向，確據在基督；第四節是屬靈父親的喜樂。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：教會裡遇到好為首的人，我該怎麼辦？先分清楚，是小摩擦，還是真正的濫權。回到志明的小組：那位姊妹的探訪提議被擱置了，這是小摩擦，不必上綱。她其實有一條最簡單的路：自己約兩位組員先去醫院。該猶接待弟兄，不必等丟特腓批准。之後，她可以私下約志明喝杯茶，溫和地說：那次探訪很好，下次我們一起去。華人講面子，常常寧可在背後說，也不肯當面說；長老卻說，我若去，當面。"],["p","可是若真的被濫權、被排擠、被趕出團契，那就不是小摩擦。你不必默默忍受，也不必一個人先去面對有權的人；先找一位可信任的牧者或屬靈長輩陪你，照教會的程序處理。若牽涉人身安全或違法的事，就要尋求法律與專業的協助，這不是不屬靈，也不是不順服。"],["p","第二個問題：兒女不信主的父母。美玲姊的兒子在台北工作，小時候在主日學背過經文，長大就不來了。她讀到第四節，心裡想：長老的兒女都按真理而行，我呢？請先聽清楚：長老說的兒女，是他在信仰裡帶大的屬靈兒女；這一節不是拿來和你的家比較的。華人父母很容易把兒女的信仰當成自己的成績單，也怕被人問你兒子還有沒有去教會。經文沒有這樣說。第四節是長老的喜樂，不是父母的考卷；信仰不是父母遺傳的，是神親自去找人。父母能做的，是愛、是活出來、是代禱，結果在神手裡。長老說聽見；美玲姊還在等那一個消息，等的時候，她可以每個星期給兒子打一通不講道的電話。"],["d",["在教會受到排擠或被濫權，我可以把事情公開在網路上嗎？","長老遇到丟特腓，沒有寫公開信罵他，也沒有發動別人去對付他，而是說我若去：當面，在那間教會裡處理。這使我們想起主教導的次序：先單獨去說，再帶一兩個人，再告訴教會（太 18:15--17）。所以第一步不是上網，是找一位可信任的牧者或屬靈長輩，把事實說清楚；若教會內的程序走不通，可以尋求更大的教會團體或其他可信的協助。若牽涉人身安全或違法的事，就要直接尋求法律與專業的保護，這不是不屬靈。不鼓勵網路公審，不是叫受傷的人閉嘴，是讓真相在對的地方被處理。"]],["h","七、活出321——一張椅子、一扇門"],["p","經文講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：「只要效法善」（1:11）。效法誰？最終是那一位，祂說要作眾人的僕人，自己就先拿起手巾洗門徒的腳。對付好為首，不是靠意志，是靠眼睛看著祂。"],["p","聖經是我的準則：「正如你按真理而行」（1:3）。準則不是放在書架上，是在一週七天的生活裡被人看見的。"],["p","聖靈是我的引導：「又有真理給他作見證」（1:12）。這使我們想起約翰一書稱聖靈就是真理（約壹 5:6）。經文沒有直接說聖靈；可是叫一個人的生命替他作見證的，是住在裡面的那一位。"],["p","讓耶穌作王：「因他們是為主的名出外」（1:7）。出去是為祂的名，不是為自己的名；那個首位只屬於「在凡事上居首位」的那一位（西 1:18）。讓祂作王，就是自己回到僕人的本位。謙卑是放下權力回到本位，讓人作人，讓神作神。"],["p","讓耶穌得到一切的榮耀：「行善的屬乎神」（1:11）。善行的歸屬是神，不是行善的人；接待的人也不為自己留名，長老卻把該猶的名字寫進了聖經。"],["p","建立屬神的體系：「叫我們與他們一同為真理做工」（1:8）。屬神的體系，是一扇一扇開著的門連起來的網；該猶的次序是先生命、再關係、後事工。國度321空中團契散在各國，在線上傳真理的人，也需要一群該猶。"],["d",["我們是一個線上團契，長老說「我們就當面談論」，我們的聚會還算數嗎？","算數。長老自己正在用筆墨牧養該猶，這一封信就是遠距的牧養，把真理一字不漏地送到那一家。筆墨是橋，不是次等。當面，原文是口對口，是盼望與邀請，不是一道門檻；因病、因工作、因距離不能到場的人，沒有少得一點真理。線上把真理送到，見面使關係更完全，兩者是同一份愛。所以可以做一件具體的事：這個月替小組裡一位只在螢幕上見過的弟兄姊妹，安排一次見面或一通長長的電話，開口先叫他的名字。"]],["h","八、四種心，各自想坐哪一張椅子"],["p","驕傲型的心，像志明，事情一定要經過我，別人想到的好主意就不太舒服；或者反過來，拿這封信去找教會裡的丟特腓，覺得自己是該猶。第九節照出兩種人同一個病：都想坐那張椅子。可是首位只屬於「在凡事上居首位」的那一位（西 1:18）。請你今天把手從那張椅子上拿開。"],["p","恐懼型的心，怕被利用，所以誰來都不敢開門；又怕得罪人，所以誰都不敢拒絕。請你聽第六節的標準：配得過神。接待不是看你的膽量，是看所差的那一位；門可以和同工一起守，也可以和同工一起開。"],["p","羞恥型的心，也許曾經就是那個擋下別人提議、在群組裡說過重話的人；也許曾經轉身離開了一間教會。請你記得，第十一節那一句最直接的命令，前面仍然是親愛的；效法，原文是現在式，每一天都可以重新選。曾經關上的門，今天可以去敲開；確據在那位為我們捨命的基督，不在你過去做得夠不夠。"],["p","受傷型的心，也許曾被一位好為首的人排擠、被說成不順服，甚至被趕出一個團契；也許是為孩子流淚多年的父母，或因病只能在螢幕上聚會的人。這封信不是要你把那些傷吞下去；長老沒有叫該猶閉嘴，也沒有把線上的人算成次等。若心裡的重擔已經壓得睡不著，請找一位信得過的人陪你，必要時尋求專業協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀 1:5–8 一次，讀到一同為真理做工就停下來，向主說：我願意作一個從底下托住人的人。"],["p","第二，想一想你最近擋下了誰的一個提議，或者心裡不太舒服的一件好事，因為不是你想到的。這一週找那個人，說一句：你那個主意很好，我們一起做。"],["p","第三，為一位傳道人或宣教士做一件具體的事：寫一封感謝的信、按時代禱、或在神家裡甘心奉獻一份供應；不為面子，也不帶壓力。"],["p","第四，如果你心裡對教會裡某一位有怨氣，這一週不在群組、不在背後說，先為他禱告三天，再決定要不要照太 18 章私下去談；若你是受了傷害的人，先找一位可信任的牧者陪你。"],["p","第五，這個月為小組裡一位只能在線上聚會的人，安排一次探訪或一通長長的電話；寫一張卡片，開頭叫出他的名字。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：首位只有一張椅子，是主的；我回到僕人的本位。"],["p","我宣告：我要按真理而行，讓真理先走在我的腳上。"],["p","我宣告：我的家門向為主的名出外的人打開，我要與他們一同為真理做工。"],["p","我宣告：在主那裡，我和我所愛的人都有名字。"],["d",["我覺得自己就是那個想作主的組長，這一週可以怎樣開始改變？","先恭喜你，能在鏡子裡看見自己，就已經走了一步。可以從三件小事開始。第一，這一週在小組裡至少一次，把決定權交出去：請別人選詩歌、請別人帶分享，你只負責鼓勵。第二，下一次小組，等三個人說完再發表你的意見。第三，每天早上禱告時說：主，首位是你的，今天我回到僕人的本位。不要用自責代替改變；第十一節最直接的命令，前面仍是親愛的；效法是現在式，往善那邊走一步就好。"]],["h","十、結語"],["p","這一課從第一名開始。丟特腓要的是第一名，結果把教會的門關上，把開門的人趕出去。志明後來在小組裡做了一件小事：他打電話給那位姊妹，說我們一起去醫院吧。那天去探訪的時候，沒有人在意誰是組長；病床上的那位組員只記得，有好幾個人叫著他的名字為他禱告。"],["p","這一課的焦點，不在長老處理人事有多高明，也不在丟特腓有多可惡，焦點在「因他們是為主的名出外」（1:7）的那一位。是祂的名差人出去，我們才接待（1:8），才一同為真理做工；是祂坐在首位，我們才不必搶那張椅子，只要效法善（1:11）；最後，我們被按著名字問安（1:15），這使我們想起那位按著名叫自己羊的好牧人。願我們離開這裡記得的，不是丟特腓的戲劇性，而是那位作了眾人僕人的主。"],["p","我們一起低頭禱告。天父，謝謝你，首位那張椅子是你兒子的，我們不必再去搶。求你赦免我們裡面那個想作第一的人，教我們回到僕人的本位，從底下托住為你的名奔走的人。求你安慰被好為首的人傷過的弟兄姊妹，也求你親自去找那些還沒有回家的孩子，讓等待的父母有一天聽見好消息。求你使只能在線上相聚的人知道，自己沒有少得你一點真理。也求你讓我們有一天當面相見，按著名字彼此問安。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不比誰最謙卑，也不找誰像丟特腓，是讓每一個人說出自己心裡想坐的那張椅子、這一週要托住的那一個人，和要叫出的一個名字；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是第一名、托住、名字。席上可能有被教會傷過的人、為孩子流淚的父母、只能在線上參加的人，請先讀第二化的帶領提醒；任何人都不在組裡被比作丟特腓。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：第二節是禱告不是合約，靈魂在前；接待為那名出外的人就是同工，接待要分辨；首位只屬於基督，對付好為首的方法是效法善。"],["n","1. ★ 你小時候第一次想當第一名，是為了甚麼？那時候，你最怕被誰問「你考第幾名」？"],["n","2. ★★★ 請用自己的話說：為甚麼第二節「凡事興盛，身體健壯」是一句禱告，不是一份應許？「正如你的靈魂興盛一樣」把標準放在哪裡？"],["n","3. ★★ 第七節的「取」和第八節的「接待」，原文是同一個字根。長老用這兩個字說了一件甚麼事？這怎樣改變你對供應傳道人的看法？"],["n","4. ★★ 約翰二書說「不要接他到家裡」，約翰三書說「應該接待這樣的人」。兩封信的標準是同一個嗎？說出那個標準。"],["m","帶領提醒：該猶是誰、那封信是哪一封、丟特腓是不是異端，這些問題一句指向講義的議題頁，不在組裡辯論；不點名任何牧者、教會或組裡的人。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出自己心裡想坐的那張椅子，或曾被誰關在門外，並說出這一週要走的一小步。"],["t","【看】看見自己"],["n","5. ★★★ 在該猶、丟特腓、低米丟三面鏡子裡，你最近最像哪一個？說出一件具體的事：你開了誰的門，或擋下了誰的一個好主意。"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:9--11 兩遍。哪一句讓你停下來：好為首、還不以此為足、親愛的兄弟啊，還是只要效法善？"],["t","【想】想通關卡"],["n","7. ★★★ 你心裡最想坐的是哪一張椅子：被看見、有決定權、被稱讚，還是不被人超越？那張椅子是從甚麼時候開始對你這麼重要的？"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說出一句真話：「我最想坐的那張椅子是＿＿。」聽的人只回一句：「主按著名字認識你。」不評論、不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走的一小步：哪一天、對哪一個人、交出哪一個決定，或托住哪一位傳道人。若你正被教會的事傷著，這一步可以只是約一位可信任的牧者談一談。"],["m","帶領提醒：這一化可能碰到在教會被排擠、被濫權、被趕出團契的傷，家庭傷害、兒女離開信仰的痛，以及長期無望感。不追問細節，不要求任何人原諒誰，也不要求和好，不對正在流淚的人說「你要有信心」，不說孩子不信是你沒做好，也不讓任何人在組裡指名批評別人。不在組裡處理，會後單獨關心，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個交出去的決定、一份給傳道人的供應、一通叫出名字的電話、一位 920 的「2」、一位朋友。"],["n","10. ★★ 這一週在小組、家裡或工作上，你要把哪一個決定交給別人？說出是誰、哪一天。"],["n","11. ★★ 這個月你要為哪一位傳道人或宣教士做一件具體的事：一封感謝信、一段固定的代禱，還是一份甘心的供應？說出他的名字和日期。"],["n","12. ★ 小組裡有沒有一位只能在線上相聚的人？這一週你要哪一天打電話給他，開口第一句先叫出他的名字？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，也許是一位被你擋下過的同工，或一位走開了的朋友、一個還在路上的孩子。當場說出來，可以說名字，也可以只用代稱（例如「組裡那位新來的姊妹」「我的小兒子」）。說出這一週哪一天、用甚麼方式（見面、電話、手寫卡片）向他分享這一課。若那一位曾經傷害過你，這一週只為他禱告就好。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，兩千年前有一封很短的信，寫到一個愛作第一的人，名字旁邊只有三個字：好為首。第二句，寫信的長老沒有叫人去鬥他，只說：不要效法惡，只要效法善。第三句，我在學著不搶第一，因為我相信神按著名字認識我，也認識你。說出這位朋友是誰、哪一天說，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收我會更謙卑這類答案。920 的那一位可以只用代稱，不強迫說出名字，尤其不強迫說出曾經傷害自己的人。碰到教會傷害、家庭傷害、兒女離開信仰或長期無望感時，不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求專業協助。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週要交出去的那一個決定，和要叫出的那一個名字。"],["p","然後彼此代禱，為三種人指名禱告：一位在教會裡受過傷、或被排擠過的弟兄姊妹，求主醫治他，也帶領他找到可信任的人陪伴；一位兒女還沒信主的父母，求主安慰他，也親自去找那個孩子；一位為主的名在外奔走的傳道人，求主透過我們托住他。"],["p","最後由組長慢慢讀一遍：「所以我們應該接待這樣的人，叫我們與他們一同為真理做工。」（1:8）"]]}}}</script>

<script>/* ===== 321約翰三書講義 ===== */

/* ═══ 繁 → 簡：對照表由 scripts/make_scmap.py 從本檔自動推導並驗證過 ═══
   逐字表 m ＝ [繁體字串, 簡體字串]；詞組表 p 用來處理一對多的字（計畫→计划、甚好→甚好）。
   演算法：由左到右掃一次，先試最長的詞組，沒中才套逐字表——詞組是覆蓋，不是先替換。
   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();
const SC_M = new Map(), SC_P = new Map(), SC_HEAD = new Set();
let SC_LENS = [];
if (SCMAP) {
  const [tc, sc] = SCMAP.m;
  for (let i = 0; i < tc.length; i++) SC_M.set(tc[i], sc[i]);
  const L = new Set();
  for (const pr of (SCMAP.p || [])) { SC_P.set(pr[0], pr[1]); L.add(pr[0].length); SC_HEAD.add(pr[0][0]); }
  SC_LENS = [...L].sort((a, b) => b - a);
}
function toSC(s){
  if (!s || !SCMAP) return s;
  let out = '', i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (SC_HEAD.has(c)) {
      let hit = false;
      for (const L of SC_LENS) {
        const r = SC_P.get(s.substr(i, L));
        if (r !== undefined) { out += r; i += L; hit = true; break; }
      }
      if (hit) continue;
    }
    const m = SC_M.get(c);
    out += (m === undefined ? c : m);
    i++;
  }
  return out;
}
const SC_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1 };
function scWalk(n){
  if (!n) return;
  if (n.nodeType === 3) { const t = n.nodeValue, v = toSC(t); if (v !== t) n.nodeValue = v; return; }
  if (n.nodeType !== 1 || SC_SKIP[n.tagName]) return;
  for (const a of ['placeholder', 'title', 'alt']) {
    if (n.hasAttribute && n.hasAttribute(a)) { const t = n.getAttribute(a), v = toSC(t); if (v !== t) n.setAttribute(a, v); }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) scWalk(c);
}
function scApply(){ if (S.set.sc) scWalk(document.body); }
/* 之後每一次重繪都會被這個觀察器接住；toSC 是冪等的，重複轉換不會出事 */
try {
  new MutationObserver(ms => {
    if (!S.set.sc) return;
    for (const m of ms) {
      if (m.type === 'characterData') scWalk(m.target);
      else m.addedNodes.forEach(scWalk);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
} catch(e){}

function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

/* ===== 地形圖 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 1;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // 單章十點：c 是章內位置（章中心＝整數）
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // ── 標籤排版：以方框做二維避讓，放不下就往外推 ──
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 10 ? 6.6 : (lab.length > 6 ? 7.4 : 8.5);
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // 圓點與「目前所在」的圈也是障礙物，標籤不壓在線上
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="約翰三書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">行 · 接 · 效</p></div>`;
}

/* ── 講義朗讀：跳過卷名、提詞機與目錄，直接從本文開始 ──
   節標題、想更深、三個化的段落，都用口語的方式帶進去，
   聽起來像一位老師在講，不像螢幕在念版面。 */
const DEEP_LEAD = [
  '我們在這裡想更深一點。有人會問，',
  '這裡容我多說一句。可能有人心裡正在問，',
  '我知道有人讀到這裡會停下來問，',
  '讓我們把這一段再往裡走一步。有人問，',
];
const DEEP_ANS = ['我的回答是這樣。', '我是這樣看的。', '我們可以這樣想。', '這一題我會這樣回答。'];
/* 把純文字切成句子（與畫面上的 .mks 完全同一套規則，這樣才對得起來）*/
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));

/* 朗讀單位：一句一個，並且記著它在畫面上是哪一塊的第幾句
   { t:要念的字, i:區塊序號, part:'t'|'a', j:句序（-1 表示整塊） }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* 一整塊：第一句套用口語的帶入詞，其餘照念，句序與畫面對得起來 */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // 一、xxx → 第一段，xxx。
        const p = String(t).split('、');
        push(p.length > 1 ? `第${p[0]}段，${p.slice(1).join('、')}。` : String(t) + '。', i, 't', -1);
        break;
      }
      case 'd':                                     // 想更深：一問一答
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // 三個化的段標（括號裡的分鐘數不念）
        const s = String(t).replace(/（[^）]*）/g, '').replace(/｜/g, '，').trim();
        push(/^收尾/.test(s) ? '我們來收尾。' : `接下來是${s}。`, i, 't', 0);
        break;
      }
      case 't': {                                   // 【看】【聽】【想】【講】【行】
        const m = String(t).match(/^【(.+?)】(.*)$/);
        push(m ? `這一步是「${m[1]}」，${m[2]}。` : String(t) + '。', i, 't', 0);
        break;
      }
      case 'm':                                     // 帶領說明／提醒：本身已自帶稱謂
        if (/優先順序標示/.test(t)) break;           // 星號是印在紙上的記號，念出來沒有意義
        block(t, i, 't');
        break;
      case 'n': {                                   // 1. ★★★ 題目 → 第一題。題目
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /【必做】/.test(String(t));
        block(t, i, 't', `第${cnNum(qi)}題。${must ? '這一題必做。' : ''}`, /^\d+\.\s*(★+)?\s*(【必做】)?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* 把單位併成「一次抓一段語音」的段落：同一塊之內合併到 60 字以上再切，
   太碎會一直等網路，太大又會遲遲不開口。每一段記著它涵蓋畫面上的哪幾句。 */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 60 && last.t.length + u.t.length <= 240){
      last.t += u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `第${cnNum(n)}課　${String(L.title).split('——')[0]}` : '講義';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  playSegs(segs, lesTitle(n), n);
}
/* 預先下載：把整課的語音抓進 IndexedDB，之後離線也能聽 */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('本章尚未收錄教學講義');
  if (!S.set.human) return toast('目前用的是裝置語音，不需要下載');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ 下載中 ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ 預先下載' : '✓ 已下載';
  toast(fail ? `有 ${fail} 段沒下載到，請再試一次` : '整課語音已存進這台裝置，可以離線聽了');
}
/* 進到講義頁時，看看這一課是不是已經下載過了 */
function lesDlCheck(n){
  const b = $('#lesDl' + n);
  if (!b || !S.set.human) return;
  const segs = lesSegs(n); if (!segs.length) return;

    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
/* 這些段落已經下載了幾段？（一次交易查完，不逐段開連線）*/
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.yunfan).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* 原文（希伯來文／希臘文）中文語音念不出來。
   後面若跟著括號裡的拼音，就只念那個拼音；沒有拼音就整段略過——只念一遍，不重複。 */
const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';
const ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + "\\s'\u2019\\-\u05be\u05f3\u05f4\u00b7]*";
const RE_ORIG_ROMAN = new RegExp(ORIG_RUN + "\\s*[（(]\\s*([A-Za-z][A-Za-z'\u2019\u0101\u0113\u012b\u014d\u016b\\- ]*)\\s*[）)]", 'g');
const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* 讀音修正：只改送去語音的字，畫面上的字完全不動。
   「地」在天地、地球、地是……應讀 ㄉㄧˋ，語音引擎常誤讀成輕聲的 ㄉㄜ˙；
   換成同音的「帝」就讀得對（聽起來一模一樣）。要再加字就往這張表加。 */
const TTS_SAY = [
  [/天地/g, '天帝'],
  [/地球/g, '帝球'],
  [/地是/g, '帝是'],
];

/* 朗讀前的文字整理 */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, '和').replace(/&lt;|&gt;/g, ' ');
  // 原文只念一遍：有拼音就只念拼音，沒有拼音就整段略過
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  // 略過原文之後，把「……原文是。」這種懸在半空的接續詞一起收乾淨
  t = t.replace(/[（(]\s*\u0000\s*[）)]/g, '\u0000');
  t = t.replace(/[是叫作為的]?\s*\u0000\s*(?=[，。；、！？])/g, '');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/[（(]\s*[）)]/g, ' ');
  t = t.replace(/\*\*/g, '').replace(/[《》「」『』【】]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|·/g, ' ');
  // 經節寫法口語化：8:28 → 八章二十八節
  t = t.replace(/(\d{1,3}):(\d{1,3})(?:[–-](\d{1,3}))?/g, (m, a, b, c) =>
    cnNum(a) + '章' + cnNum(b) + (c ? '到' + cnNum(c) : '') + '節');
  t = t.replace(/321/g, '三二一').replace(/920/g, '九二零').replace(/235/g, '二三五');
  t = t.replace(/[：]/g, '，');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([，。！？；、])/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
function cnNum(n){
  n = parseInt(n, 10); const d = '零一二三四五六七八九';
  if (n < 10) return d[n];
  if (n < 20) return '十' + (n % 10 ? d[n % 10] : '');
  if (n < 100) return d[Math.floor(n / 10)] + '十' + (n % 10 ? d[n % 10] : '');
  return String(n);
}
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('。！？；\n'.includes(ch) && buf.length >= 110){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  const fin = [];
  out.forEach(s => { while (s.length > 300){ fin.push(s.slice(0, 300)); s = s.slice(300); } if (s) fin.push(s); });
  return fin.length ? fin : [t];
}
async function ttsFetch(piece){
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  const res = await fetch(SVC.tts, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  ttsPut(key, blob);
  return blob;
}

let AUP = null, SPK = { on:false, pause:false, tok:0, list:[], i:0, title:'', prep:0, total:0 };
/* 兩個播放器輪流用：一個在播，另一個先把下一段 load 好，接起來不會卡 */
function audioPair(){
  if (!AUP){
    AUP = [0, 1].map(() => {
      const a = new Audio(); a.preload = 'auto'; a.loop = false;
      a.setAttribute('playsinline', '');
      /* 背景播放：鎖屏／切到別的 App 時，系統的播放控制列要能操作 */
      a.addEventListener('play',  () => { mediaState('playing'); });
      a.addEventListener('pause', () => { if (!SPK.on) mediaState('paused'); });
      return a;
    });
  }
  return AUP;
}
const audioEl = () => audioPair()[0];
/* 鎖屏／耳機／車機的播放控制 */
function mediaState(st){
  try { if (navigator.mediaSession) navigator.mediaSession.playbackState = st; } catch(e){}
}
function appIcon(){
  const l = document.querySelector('link[rel="apple-touch-icon"], link[rel="icon"]');
  return (l && l.getAttribute('href')) || '';
}
function mediaSetup(title){
  if (!navigator.mediaSession || !window.MediaMetadata) return;
  try {
    const ic = appIcon();
    navigator.mediaSession.metadata = new MediaMetadata({
      title: title || '朗讀中',
      artist: '321約翰三書講義',
      album: '國度321空中團契',
      artwork: ic ? [{ src: ic, sizes:'180x180', type:'image/png' }] : [],
    });
    navigator.mediaSession.setActionHandler('play',  () => { if (SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!SPK.pause) togglePause(); });
    navigator.mediaSession.setActionHandler('stop',  () => stopSpeak());
    navigator.mediaSession.setActionHandler('previoustrack', () => spkStep(-1));
    navigator.mediaSession.setActionHandler('nexttrack',     () => spkStep(1));
    navigator.mediaSession.setActionHandler('seekbackward',  () => spkStep(-1));
    navigator.mediaSession.setActionHandler('seekforward',   () => spkStep(1));
  } catch(e){}
}
/* ── 串流播放器 ───────────────────────────────────────────
   一段一段抓、一段一段播：抓到前兩段就開始播，其餘邊播邊抓。
   兩個 <audio> 輪流用（下一段先 load 好），所以段與段之間不會卡住。
   每一段都記著它對應到畫面上的哪幾句，播到那一段就把那幾句標起來、捲過去。  */
const PRE_START = 2;      // 抓到幾段就開播
const PRE_AHEAD = 8;      // 播放中隨時往前多抓幾段
const SILENT_MP3 = 'data:audio/mpeg;base64,//uQxAAAAAAAAAAAAAAAAAAAAAAAWGluZwAAAA8AAAACAAACcQCA';

let PL = null;
function playSegs(segs, title, lesson){
  if (!segs.length) return;
  if (!S.set.human) return sayNative(segs.map(s => s.t).join('\n'));
  stopSpeak();
  const my = ++SPK.tok;
  SPK = { on:true, pause:false, tok:my, list:segs, i:0, title:title || '朗讀中', prep:0, total:segs.length };
  PL = { tok:my, segs, blobs:new Array(segs.length), pend:new Array(segs.length).fill(0),
         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  /* 使用者按下按鈕的這一刻，把兩個播放器都解鎖（iOS 只認手勢當下的 play）*/
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);
  mediaSetup(SPK.title);
  drawBar();
  plPump();
  plWaitAndStart();
}
function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (PL.blobs[k] || PL.pend[k]) return;
  PL.pend[k] = 1; PL.running++;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },
                               () => { if (PL){ PL.fail++; PL.try[k] = (PL.try[k] || 0) + 1; } })
    .then(() => {
      if (!PL || PL.tok !== SPK.tok) return;
      PL.pend[k] = 0; PL.running--;
      SPK.prep = PL.blobs.filter(Boolean).length; drawBar(); plPump();
    });
}
/* 從正在播的那一段往前看幾段，缺的就補抓（抓壞的也會自動重試）*/
function plPump(){
  if (!PL || PL.tok !== SPK.tok) return;
  const end = Math.min(PL.segs.length, Math.max(PRE_START, PL.i + 1 + PRE_AHEAD));
  for (let k = PL.i; k < end && PL.running < 4; k++){
    if ((PL.try[k] || 0) < 3) plFetch(k);
  }
}
function plWaitAndStart(){
  const my = SPK.tok;
  const tick = () => {
    if (!PL || PL.tok !== my || !SPK.on) return;
    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');
      stopSpeak(); toast('真人語音連不上，改用裝置語音'); return sayNative(txt);
    }
    setTimeout(tick, 120);
  };
  tick();
}
function plPlay(k){
  if (!PL || PL.tok !== SPK.tok) return;
  if (k >= PL.segs.length) return stopSpeak();
  const b = PL.blobs[k];
  if (!b){
    if ((PL.try[k] || 0) >= 3){              // 這一段真的抓不到，跳過去，不要卡住整課
      PL.i = k; SPK.i = k; return plPlay(k + 1);
    }
    SPK.buffering = true; SPK.i = k; drawBar(); plPump();   // 還沒到，等一下再播（不跳過）
    return setTimeout(() => plPlay(k), 150);
  }
  SPK.buffering = false;
  PL.i = k; SPK.i = k;
  const els = audioPair(), a = els[PL.cur];
  a.src = URL.createObjectURL(b);
  a.onended = () => {
    if (!PL || PL.tok !== SPK.tok) return;
    try { URL.revokeObjectURL(a.src); } catch(e){}
    PL.cur = 1 - PL.cur;
    plPlay(k + 1);
  };
  a.onerror = () => { if (PL && PL.tok === SPK.tok){ PL.cur = 1 - PL.cur; plPlay(k + 1); } };
  const p = a.play(); if (p && p.catch) p.catch(() => {});
  spkMark(PL.segs[k]);
  drawBar();
  plPump();
  /* 下一段先 load 好，接得上 */
  const nb = PL.blobs[k + 1];
  if (nb){ const nx = els[1 - PL.cur];
    try { nx.src = URL.createObjectURL(nb); nx.load(); } catch(e){} }
}
async function speak(text, title){
  const chunks = ttsChunks(text);
  if (!chunks.length) return;
  playSegs(chunks.map(t => ({ t })), title);
}
function sayNative(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(sanitize(t));
  u.lang = 'zh-TW'; u.rate = 0.94 + S.set.rate * 0.05;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
function stopSpeak(){
  SPK.tok++; SPK.on = false; SPK.pause = false; SPK.buffering = false;
  PL = null;
  try { audioPair().forEach(a => { a.pause(); a.onended = null; a.onerror = null; }); } catch(e){}
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  spkClear();
  drawBar();
}
function plCurEl(){ const els = audioPair(); return els[PL ? PL.cur : 0]; }
function togglePause(){
  const a = plCurEl();
  if (SPK.pause){ const p = a.play(); if (p && p.catch) p.catch(() => {}); SPK.pause = false; }
  else { a.pause(); SPK.pause = true; }
  drawBar();
}
/* 往前／往後跳一句 */
function spkStep(d){
  if (!PL) return;
  const k = Math.max(0, Math.min(PL.segs.length - 1, PL.i + d));
  try { plCurEl().pause(); plCurEl().onended = null; } catch(e){}
  PL.i = k; SPK.pause = false;
  plPump(); plPlay(k);
}
function drawBar(){
  let el = $('#spkbar');
  if (!SPK.on){ if (el) el.remove(); return; }
  if (!el){
    el = document.createElement('div'); el.id = 'spkbar'; el.className = 'spkbar';
    document.body.appendChild(el);
  }
  const st = SPK.buffering ? `<span class="pv">緩衝中…</span>`
    : SPK.total ? `<span class="pv">${(SPK.i || 0) + 1}/${SPK.total}</span>` : '';
  const follow = PL && PL.lesson
    ? `<button class="${S.set.follow === 0 ? '' : 'on'}" title="自動捲動"
         onclick="toggleFollow()">${S.set.follow === 0 ? '⇕' : '⇳'}</button>` : '';
  el.innerHTML = `<span class="dot"></span><b>${esc(SPK.title)}</b>${st}
    <button onclick="spkStep(-1)" title="上一句">⏮</button>
    <button onclick="togglePause()">${SPK.pause ? '▶' : '⏸'}</button>
    <button onclick="spkStep(1)" title="下一句">⏭</button>${follow}
    <button onclick="stopSpeak()">✕</button>`;
}
function toggleFollow(){
  S.set.follow = S.set.follow === 0 ? 1 : 0; save(); drawBar();
  if (S.set.follow && PL) spkMark(PL.segs[PL.i]);
  toast(S.set.follow ? '朗讀時自動捲動' : '不自動捲動，畫面由你控制');
}

/* ── 標示正在讀的那一句，並且捲到它 ── */
let SPK_LAST = [];
function spkClear(){
  document.querySelectorAll('.spk-now').forEach(e => e.classList.remove('spk-now'));
  SPK_LAST = [];
}
function spkMark(seg){
  if (!seg || !PL || !PL.lesson) return;
  if (R.tab !== 'course' || R.ch !== PL.lesson || R.sub !== 'lesson') return;  // 不在這一頁就不動畫面
  spkClear();
  const n = PL.lesson;
  const els = [];
  if (seg.js && seg.js.length){
    seg.js.forEach(j => {
      const e = document.querySelector(`.les .mks[data-k="l|${n}|${seg.i}|${seg.part}|${j}"]`);
      if (e) els.push(e);
    });
  }
  if (!els.length){
    const blk = document.getElementById(`lb${n}_${seg.i}`);
    if (blk) els.push(blk);
  }
  if (!els.length) return;
  /* 想更深是收起來的，讀到它就打開 */
  const dt = els[0].closest('details.deeper');
  if (dt && !dt.open) dt.open = true;
  els.forEach(e => e.classList.add('spk-now'));
  SPK_LAST = els;
  if (S.set.follow === 0) return;
  if (Date.now() < (SPK.holdScroll || 0)) return;      // 使用者剛剛自己捲過，先別搶
  SPK.autoScrolling = true;
  clearTimeout(SPK.asT);
  SPK.asT = setTimeout(() => { SPK.autoScrolling = false; }, 900);
  try { els[0].scrollIntoView({ behavior:'smooth', block:'center' }); } catch(e){ els[0].scrollIntoView(); }
}
/* 使用者自己動手捲動時，先讓畫面歸他，六秒後再接手 */
(function(){
  const hold = () => { if (SPK.on) SPK.holdScroll = Date.now() + 6000; };
  ['wheel', 'touchstart', 'touchmove', 'pointerdown'].forEach(ev =>
    window.addEventListener(ev, hold, { passive:true }));
  window.addEventListener('keydown', e => {
    if (/^(Arrow|Page)|^(Home|End|Space)$/.test(e.key || '')) hold();
  });
})();

/* ═══════ ② 畫線與領受 ═══════ */
/* key 格式：  v|8:1          一節經文
              x|8:1|exp|3     某段解經的第 3 段
              l|8|41|t|2      第 8 課講義第 41 個區塊、第 2 句
                              （part：t 本文／q 想更深的問題／a 想更深的回答）*/
const mkHas = k => Object.prototype.hasOwnProperty.call(S.mk, k);
const mkNote = k => (S.mk[k] && S.mk[k].n) || '';
const mkColor = k => (S.mk[k] && S.mk[k].c) || '';
/* 七種顏色，與《321領導力》同一組 */
const HL_COLORS = [

  { k:'charcoal', label:'炭灰' },

function mkTap(k, el){

/* 只刪領受，畫線留著 */
function mkDrop(k){
  if (!mkHas(k)) return;
  S.mk[k].n = ''; save();
  const sh = $('#sheet'); if (sh) sh.classList.remove('on');
  mkKeep(k, render); toast('領受已刪除');
}
/* 改完之後畫面停在原位：以那一句為錨，重畫後把它挪回同一個位置 */
function mkKeep(k, fn){
  const sel = '[data-k="' + k + '"]';
  const before = document.querySelector(sel);
  const top = before ? before.getBoundingClientRect().top : null;
  fn();
  if (top === null) return;
  const after = document.querySelector(sel);
  if (!after) return;
  const now = after.getBoundingClientRect().top;

/* 依句號切句；HTML 標籤不會被切斷，句末的引號跟著前一句走 */
const EN_SENT = false;
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;
      if (ch === '>'){
        inTag = false;
        if (/^<\//.test(tag)) depth--;
        else if (!/\/>$/.test(tag) && !/^<(br|img|hr|input|wbr)\b/i.test(tag)) depth++;
      }
      continue;
    }
    cur += ch;
    if (depth !== 0) continue;                       // 標籤內不切
    let brk = '。！？'.includes(ch);
    if (!brk && EN_SENT && '.!?'.includes(ch)){      // 英文：句點後須接空白
      const nx = html[i + 1];
      brk = (nx === undefined || nx === ' ' || nx === '\n') && !/\b[A-Z]$/.test(cur.slice(-2, -1));
    }
    if (!brk) continue;
    while (i + 1 < html.length && '」』）”"\''.includes(html[i + 1])){ i++; cur += html[i]; }
    while (i + 1 < html.length && html[i + 1] === ' '){ i++; cur += html[i]; }
    out.push(cur); cur = '';
  }
  if (cur.replace(/<[^>]*>|\s|&nbsp;/g, '').length) out.push(cur);
  else if (cur && out.length) out[out.length - 1] += cur;
  return out.length ? out : [html];
}

}

function xzSavedIdx(i){

  let q = '';
  for (let p = i - 1; p >= 0; p--) if (XZ.msgs[p].role === 'user'){ q = XZ.msgs[p].text; break; }

/* ===== 全螢幕模式：講台提詞機 ＋ 小組帶領 ===== */
let F = null, FT = null, WAKE = null;
function fOpen(mode, n){
  F = { mode, n, i:0, run:true, left:0, tele:mode !== 'live' };
  document.documentElement.setAttribute('data-tele', F.tele ? '1' : '0');
  if (mode === 'lesson'){                       // 教學講義逐字稿
    const s = (D.lesson || {})[n];
    // 「想更深」是備而不用的問答，不上提詞機
    F.pages = s ? telePages(s.blocks.filter(b => b[0] !== 'd')) : outlinePages(n);
    F.total = (s ? s.min : 40) * 60;
    F.left = F.total;
    // 標題列只放主標題，副標題太長會擠成兩行
    $('#ftitle').textContent = '《' + (s ? s.title.split('——')[0] : meta(n).t) + '》';
  } else if (mode === 'tele'){
    const s = D.serm[n];
    F.pages = s ? telePages(s.blocks) : outlinePages(n);
    F.total = (s ? s.min : 35) * 60;
    F.left = F.total;
    $('#ftitle').textContent = '《' + meta(n).t + '》';
  } else {
    F.pages = livePages(n);
    F.total = F.pages.reduce((a, p) => a + p.sec, 0);
    F.left = F.pages[0].sec;
    $('#ftitle').textContent = '第' + n + '章 · 小組';
  }
  $('#full').classList.add('on');
  keepAwake(true);
  fDraw(); fTick();
}
function fClose(){
  F = null; clearInterval(FT); FT = null;
  document.documentElement.setAttribute('data-tele', '0');
  $('#full').classList.remove('on'); keepAwake(false);
}
async function keepAwake(on){
  try {
    if (on && navigator.wakeLock) WAKE = await navigator.wakeLock.request('screen');
    else if (WAKE) { WAKE.release(); WAKE = null; }
  } catch(e){}
}
function telePages(bl){
  const pages = []; let cur = [];
  const push = () => { if (cur.length){ pages.push(cur); cur = []; } };
  bl.forEach(b => {
    if (b[0] === 'h' || b[0] === 's'){ push(); cur = [b]; return; }
    if (b[0] === 'w'){ cur.push(b); push(); return; }   // 稿中的停頓 ＝ 換頁
    cur.push(b);
    const chars = cur.reduce((a, x) => a + (typeof x[1] === 'string' ? x[1].length : 0), 0);
    if (cur.length >= 6 || chars > 190) push();
  });
  push();
  return pages.map(p => ({ blocks:p }));
}
function outlinePages(n){
  const m = meta(n), ps = [{ blocks:[['h','《' + m.t + '》'], ['p', m.sub], ['q', m.mv.t + '　' + m.mv.r]] }];
  m.serm.pts.forEach(p => ps.push({ blocks:[['h', p[0]], ['p', '經文　' + p[1]], ['p', p[2]]] }));
  ps.push({ blocks:[['h','結論'], ['p', m.truth]] });
  return ps;
}
function livePages(n){
  const m = meta(n), ps = [];
  ps.push({ sec:600, ttl:'① 破冰　10 分鐘', q:m.grp[0], tip:'讓每個人都說一句。組長先說自己的。' });
  ps.push({ sec:900, ttl:'② 經文共讀　15 分鐘', q:'「' + m.mv.t + '」　' + m.mv.r,
            tip:'逐人讀本章核心經文。讀完，先安靜三十秒，不急著解釋。' });
  m.grp.slice(1).forEach((q, i) => ps.push({
    sec:450, ttl:'③ 討論　第 ' + (i + 2) + ' 題', q,
    tip: i === 1 ? '這是最深的一題。組長先說自己的。不要追問細節；若有人哭，停下來為他禱告，不要接著問下一題。'
       : i === 3 ? '請小組成員在第七天問他一次。' : '' }));
  ps.push({ sec:900, ttl:'④ 操練與代禱　15 分鐘', q:m.prac.main,
            tip:'一人只選一項。彼此指定第七天要問的同伴，然後為彼此禱告。' });
  return ps;
}
function fDraw(){
  if (!F) return;
  const p = F.pages[F.i], b = $('#fbody');
  if (F.tele){
    b.className = 'fbody tele';
    b.innerHTML = p.blocks.map(x =>
      x[0] === 'h' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 's' ? `<h5>${esc(x[1])}</h5>` :
      x[0] === 't' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'm' ? `<p class="pause">${esc(x[1])}</p>` :
      x[0] === 'q' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'w' ? `<p class="pause">停　<b>${x[1]}</b>　秒</p>` :
      `<p>${esc(x[1])}</p>`).join('');
  } else {
    b.className = 'fbody live';
    b.innerHTML = `<h5>${esc(p.ttl)}</h5><p class="qq">${esc(p.q)}</p>` +
      (p.tip ? `<div class="tipbox"><b>💡 帶領提醒</b><br>${esc(p.tip)}</div>` : '');
    F.left = p.sec;
  }
  b.scrollTop = 0;
  $('#frail').style.width = ((F.i + 1) / F.pages.length * 100) + '%';
  $('#fplay').textContent = F.run ? '暫停' : '繼續';
  fClock();
}
function fClock(){
  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;
  const i = F.i + d;
  if (i < 0) return;
  if (i >= F.pages.length){ toast('已經是最後一段'); return; }
  F.i = i; fDraw();
}

$('#fprev').onclick = () => fGo(-1);

function vSearch(){
  setTitle('搜尋', false);
  const q = (R.q || '').trim();
  let h = `<div class="sect"><p class="eyebrow">搜尋</p>
    <input class="sbox" id="sq" placeholder="經節、原文、關鍵字…（例：1:8、接待、φιλοπρωτεύων）" value="${esc(q)}">
    <p class="xs muted" style="margin:8px 0 0">搜尋全卷講義、教學講義逐字稿、重點節解經、原文軌跡與爭議地圖。</p></div>`;
  if (q.length >= 1){
    const hit = (t) => t && t.indexOf(q) >= 0;
    const mk = (t) => esc(t).split(esc(q)).join('<mark>' + esc(q) + '</mark>');
    let r = '';
    // 經節
    const vs = [];
    Object.keys(D.txt).forEach(c => (D.txt[c] || []).forEach((t, i) => {
      const ref = c + ':' + (i + 1);
      if (hit(t) || hit(ref)) vs.push([ref, t]);
    }));
    const ex = [];
    Object.keys(BLK).forEach(c => BLK[c].forEach(b => {
      if (hit(b.exp) || hit(b.gram) || hit(b.grk) || hit(b.key) || hit(b.lit)) ex.push(b);
    }));
    if (vs.length){ r += `<h3 class="sec">經文　${vs.length}</h3>`;

      if (vs.length > 15) r += `<p class="xs muted">（只顯示前 15 筆）</p>`; }
    const my = Object.keys(S.mk).filter(k => hit(mkText(k)) || hit(mkNote(k)));
    if (my.length){ r += `<h3 class="sec">我的畫線　${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 40))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 30))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">解經　${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 38))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 章
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(hit) || c.grp.some(hit) || c.safe.some(hit) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">講義　${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">
        <span class="chn">${String(c.n).padStart(2,'0')}</span>
        <span style="flex:1"><b>${mk(c.t)}</b><span class="s">${mk(c.truth)}</span></span></button>`); }
    // 教學講義逐字稿
    const ls = [];
    Object.keys(D.lesson || {}).forEach(k => {
      const L = D.lesson[k];
      if (hit(L.title)) { ls.push([k, L.title]); return; }
      for (const x of L.blocks){
        const parts = Array.isArray(x[1]) ? x[1] : [x[1]];   // 想更深是一問一答
        const p = parts.find(hit);
        if (p) { ls.push([k, p]); break; }

    });
    if (ls.length){ r += `<h3 class="sec">教學講義　${ls.length}</h3>`;

      if (ls.length > 12) r += `<p class="xs muted">（只顯示前 12 筆）</p>`; }
    // 軌跡
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">原文軌跡　${tk.length}</h3>`;
      tk.forEach(t => r += `<button class="chrow" onclick="go('tools',0,'tracks')">
        <span class="chn">原</span><span style="flex:1"><b>${mk(t.gk)}</b><span class="s">${mk(t.gl)}　·　${mk(t.ins)}</span></span></button>`); }
    // 爭議
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">爭議　${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">約參 ${esc(i.r)}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">找不到「${esc(q)}」。試試經節（1:8）、原文（φιλοπρωτεύων）或關鍵字（接待、同工、朋友）。</p>`;
  }
  return h;
}
function bindSearch(){
  const el = $('#sq'); if (!el) return;
  el.oninput = () => { R.q = el.value; const p = el.selectionStart; render(); const e2 = $('#sq'); if (e2){ e2.focus(); try { e2.setSelectionRange(p, p); } catch(x){} } };
}

function setRole(r){

  if (r === 'preach') S.set.grk = 1;
  save(); go(r === 'read' ? 'today' : 'course');
  toast('設定好了，隨時可在「我的」更改');
}

/* ===== 品牌：圖示、manifest、啟動畫面 ===== */
(function brand(){
 try {
  const icon = document.querySelector('link[rel="apple-touch-icon"]');
  const src = (icon && icon.getAttribute) ? icon.getAttribute('href') : '';
  const b = $('#brand'), sp = $('#splashIcon');
  if (b && src) b.src = src;
  if (sp && src) sp.src = src;

  // manifest（單檔版動態產生，讓「加到主畫面」用正確的名稱與圖示）
  // 若已經指到真正的 manifest 檔（GitHub Pages 版），就不要覆蓋它。
  try {
    const el0 = $('#MF');
    if (el0 && el0.getAttribute('href')) throw 0;
    const i192el = document.querySelector('link[sizes="192x192"]');
    const i192 = i192el ? i192el.getAttribute('href') : src;
    const mf = {
      name: '321約翰三書講義',
      short_name: '321約翰三書講義',
      description: '約翰三書全書一章：逐節原文解經、講章逐字稿、321生命應用。',
      start_url: '.', scope: '.', display: 'standalone',
      orientation: 'portrait', background_color: '#12305E', theme_color: '#1F4D3D',
      lang: 'zh-Hant',
      icons: [
        { src: src, sizes: '180x180', type: 'image/png', purpose: 'any' },
        { src: i192, sizes: '192x192', type: 'image/png', purpose: 'any' },
      ],
    };
    const el = $('#MF');
    if (el) el.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
  } catch(e){}

  // 啟動畫面：至少停留一會兒，讓 logo 被看見
  const s = $('#splash');
  if (s){
    const off = () => { s.classList.add('gone'); setTimeout(() => { try { s.remove(); } catch(e){} }, 500); };
    setTimeout(off, 1100);
    if (s.addEventListener) s.addEventListener('click', off);
  }
 } catch(e){}
})();
</script>
