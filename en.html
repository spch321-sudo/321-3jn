<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"Fellow Workers for the Truth","sub":"Walk, Welcome, Imitate","lv":"A","arc":"Walk · Welcome · Imitate","sec":[["1:1--4","To Hear About My Children Walking in Truth: The Elder, Gaius and a Prospering Soul"],["1:5--8","We Therefore Ought to Receive Such: The Brothers Who Went Out for the Sake of the Name"],["1:9--10","Diotrephes, Who Loves to Be First, Doesn’t Accept What We Say: A Door Shut Tight"],["1:11--12","Imitate That Which Is Good: He Who Does Good Is of God, and the Witness to Demetrius"],["1:13--15","Greet the Friends by Name: Ink and Pen, and Face to Face"]],"serm":{"pts":[["Truth in Our Feet","1:1--4","“to hear about my children walking in truth” — the elder prays for Gaius as his soul prospers, and rejoices that his children walk in truth; the truth is not something kept on a bookshelf but something walked out on the road"],["Truth Opens the Door","1:5--8","“We therefore ought to receive such” — all that Gaius does for brothers he has never met is faithful work; they went out for the sake of the Name, taking nothing, and those who receive them become fellow workers for the truth"],["Between Opening the Door and Closing It","1:9--15","“don’t imitate that which is evil, but that which is good” — the man who loves to be first shuts the door, and the elder does not answer pride with pride; he turns his friend’s eyes toward what is good, toward the one to whom the truth bears witness, and toward meeting face to face and greeting friends by name"]]},"q":"This month there may be a prayer letter from a missionary sitting in your inbox. The last paragraph says, “Our support for this quarter is still a little short; please remember us.” You read it, close it, and think: next time.\nThe same week, someone in the church group chat forwards a screenshot with half a sentence: “What’s going on with so-and-so lately?” A few people have already replied with emojis. And at the coworkers’ meeting you notice how much it matters to you whether this decision goes the way you said.\nThe question this chapter asks is this: my front door, my wallet, my phone, my place in the church — are they holding up the people who have gone out for the sake of the Name, or are they quietly shutting the door? And the seat I really want — is it the first place, or the seat of one who “works together”?","truth":"“Beloved, don’t imitate that which is evil, but that which is good. He who does good is of God. He who does evil hasn’t seen God.” (1:11) — faced with a man who loves to be first and shuts the door, the elder does not tell Gaius to fight for first place; he only tells him to choose, day by day, whom he will imitate.\nTo receive those who go out for the sake of the Name is to be fellow workers with them for the truth (1:8); faced with those who shut the door, we do not fight for the first place — we simply choose to imitate what is good, because the first place belongs to the Lord who became the servant of all.","mv":{"t":"We therefore ought to receive such, that we may be fellow workers for the truth.","r":"3 John 1:8"},"card":["3 John has only one chapter, and that chapter is the whole road of the letter: Walk · Welcome · Imitate. First comes Walk (1:1–4): the truth is first in the heart and then in the feet, and the elder’s greatest joy is to hear that his children walk in truth. Then Welcome (1:5–8): those who walk in the truth naturally open their doors; holding up the brothers who went out for the sake of the Name, they become fellow workers with them for the truth. Last comes Imitate (1:9–15): in front of a man who loves to be first and shuts the door, we choose to imitate what is good, recognise the one to whom the truth bears witness, hope to meet face to face, and remember our friends by name. The order cannot be reversed: welcome without walking in the truth will be exploited, and truth without welcome is only knowledge on a bookshelf.","Many names appear in this letter, but its real subject is God. The brothers on the road went out for “the Name” (1:7) — it is the Lord’s name (the Greek says only “the Name”) that sends them out from their homes; the standard for sending them on is “worthy of God” (1:6), not worthy of anyone’s reputation; “he who does good is of God” (1:11) — every good deed has its source and its home in him; even the witness to Demetrius ends with the testimony “of the truth itself” (1:12) — God’s truth opens its own mouth on someone’s behalf. People can shut a door, but they cannot shut out God’s name as it moves on from one open door to the next.","In 1:10, “unjustly accusing us with wicked words,” the word rendered in the Chinese Union Version as “talking nonsense against us” is φλυαρῶν (phlyarōn) in the Greek. It occurs only here in the New Testament and means to talk nonsense, to spread groundless chatter; the adjective from the same root is rendered “gossips” in 1 Tim 5:13. Diotrephes’ weapon is not debate in an open meeting but one groundless, wounding remark after another. That changes how we read today: a screenshot forwarded in a group chat, a “so I heard,” an emoji heavy with meaning — any of these can be that kind of talk. Before you press send, ask: is this a fact, or is it gossip? Is it meant to help this person, or to make them smaller in front of everyone?","The me this chapter exposes is often not Gaius but a little Diotrephes. I may never have thrown anyone out of the church, but I may be the one who will only welcome people I already know: to the brother who is a stranger, the missionary from far away, the family who has just arrived, I say “next time.” Or I may be the one who closes every prayer letter as soon as it arrives, assuming that support is someone else’s job. Both are the same thing: me sitting in the middle.","“Whoever of you wants to become first among you, shall be bondservant of all.” (Mark 10:44) These are the Lord’s words, and they are the exact opposite of the name Diotrephes earned. He “loves to be first” — in the Greek, he loves being number one. He gained the seat but lost his fellow workers, and in the end all he had left was a door that only he could open. The road the elder gives Gaius runs the other way: not pushing to the front but crouching down at the bottom — “receive” in the Greek means literally to take someone up from underneath (1:8). The reversal this chapter most needs us to remember is this: in God’s kingdom, those who climb up shut the door, and those who lift from underneath are the ones who work together.","This week, do three small things. First, open your inbox, find a prayer letter you have recently received from a missionary or minister, pray through its requests for ten minutes, and then write back so that they know someone has read it; if God moves you, set up a fixed monthly gift — it need not be large, but let it be regular. Second, hold back once from forwarding something in a group chat: a screenshot or a “so I heard” about someone — ask the person privately first, or simply do not pass it on. Third, this month invite a brother or sister who is new, from out of town or someone you do not know well, to your home for a meal.","Final integration: a Sunday afternoon, three o’clock.\nIn the small room at the back of the church, only five people have come to the mission support group. On the table are a pot of tea, a box of biscuits and a photocopied world map with seven places circled in red.\nThe leader spreads out a list. After every name there is a line of small writing: a couple in northern Thailand whose child has just fallen ill; a sister teaching in the Middle East whose support this quarter is still thirty per cent short; a young minister on the other side of the city who runs an online Bible study and has been very tired lately.\nNone of them has ever preached from these people’s pulpits. Among the five are a retired teacher, a brother who drives a taxi and a grandmother who takes her grandchildren to school and back every day.\nThey take turns reading the names, one by one, praying for each by name. Halfway through, the grandmother stops and takes an envelope out of her handbag: “This is what I saved this month — for that sister.”\nThe leader does not say, “Thank you for your offering.” He says, “Thank you, fellow worker.”\nA phone on the table is on a video call; an older brother who lives in another county reads the names along with them from the screen.\nAnd the door of that little room is open. The tea has gone cold, and the list is not finished yet.\nNone of them has gone out, yet all of them are on the road: beside a sickbed in northern Thailand, in a classroom in the Middle East, in front of a tired minister’s screen.\n“We therefore ought to receive such, that we may be fellow workers for the truth.” (1:8)\nNot sponsors, but fellow workers; not out in front, but holding up from underneath.\nAnd at the very top of that list there is in fact one more name no one can see — the Lord who went out for us and became a stranger, who calls his own sheep by name, and who has called these five people by name into his work."],"self":"The “self-centred life” this chapter exposes is someone who wants the first place. I do not necessarily shout at people, and I do not necessarily argue in meetings; I use quieter methods — leaving messages on “read” without replying, saying of someone else’s proposal, “let’s look into it further,” answering a newcomer’s invitation with “let’s skip it this time” — and quietly shutting the door.\nThe self-centred life can also dress up as “caution”: not welcoming strangers because it is a nuisance, not supporting ministers because I say I must “discern,” when really I do not want my home, my money or my time disturbed. Or, after being hurt in the church, I answer pride with the same pride and turn myself into another Diotrephes.","t321":{"k":"Jesus is my role model: the Lord Jesus himself is the One who was sent. “Existing in the form of God,” he took “the form of a servant” (Phil 2:6–7); on earth he “has nowhere to lay his head” (Matt 8:20) and was provided for by those who followed him and gave from their own means (Luke 8:3). He said, “For I have given you an example, that you should also do as I have done to you.” (John 13:15) — that night he knelt down and washed his disciples’ feet. The first place was his by right, yet he did not grasp it; instead he said, “Whoever of you wants to become first among you, shall be bondservant of all.” (Mark 10:44) What I learn from is not the elder’s skill in handling Diotrephes, nor Gaius’ zeal in itself, but the Lord who came down from the first place to hold us up.","g":"Let Jesus be King: this chapter asks us to give up the seat Diotrephes wanted — the “first place” in the church. The Greek φιλοπρωτεύων means loving to be first; and Paul says of Christ, “that in all things he might have the preeminence” (Col 1:18) — that chair is his. Letting Jesus be King means leaving empty for him, at the coworkers’ meeting, in the small group and at home, the seat of “everything must go my way”: I may say what I think, but I do not have to win; when others’ gifts are seen, I can rejoice with them. Here is a check you can make for yourself: when did I last step back in a meeting and let someone else’s proposal pass?","p":"Establish God’s system: this letter shows us that the system is a net strung together by one open door after another — the elder sends brothers out, Gaius welcomes them and sends them on, Demetrius carries the letter on to the next stop, and the friends greet one another “by name” (1:15). One person who loves to be first can break that net; a group of people willing to hold others up can mend it. A church can set out principles for welcoming and sending: missionaries and travelling preachers receive regular prayer and support; before we welcome someone, we discern together whether the Christ he preaches is the one Christ; when there is a dispute, we follow the Lord’s words — first in person, then with two or three, then in the church. Kingdom 321 Online Fellowship, scattered across many countries, needs this kind of net all the more: online, the truth is delivered; and every name is remembered by someone."},"grp":["[1. Icebreaker] Who is the guest your home welcomes most often? Tell of a time you were welcomed somewhere far from home that you still remember today — a meal, a bed, or someone waiting for you at the station.","[2. Heart check] The text says, “but Diotrephes, who loves to be first among them, doesn’t accept what we say.” (1:9) Please don’t talk about anyone else; talk only about yourself: when did it last matter a great deal to you that “this has to go my way” — at home, at work, or in some setting at church? What did you do then, or fail to do?","[3. Gospel] Read 1:7: “because for the sake of the Name they went out, taking nothing from the Gentiles.” (1:7) The first one sent out was the Lord Jesus himself — he came from heaven, took the form of a servant, and took nothing from us; he says, “Therefore accept one another, even as Christ also accepted you” (Rom 15:7). If I am someone the Lord first held up and welcomed, how does that change the way I see hospitality, support and the “first place”?","[4. Action] Name one act of welcome and one act of support you will do this week: whom you will invite (say their name) and on which day they will come to your home or share a meal with you; and which missionary or minister you will pray for, write back to, or set up a monthly gift for.","[5. Intercession] Pray by name for three kinds of people: a missionary or minister far away whose support is short or who is worn out in body or spirit; a brother or sister who has been hurt in the church, pushed out, and is thinking of leaving — ask the Lord to protect them and lead them to someone they can trust; and a parent whose child has not yet come to faith, or has wandered far away — ask the Lord to comfort them, and to go himself and find that child."],"prac":{"main":"This week I will not fight for the first place; I will simply be a fellow worker who opens the door and holds others up: walking in truth, receiving those who go out for the Lord’s name, and imitating what is good.","items":["Toward God: each morning read 1:7–8 once. When you reach “for the sake of the Name,” stop and say to the Lord, “You went out for me first; you held me up first.” Then ask him to show you which “first place” you want to grab today, and ask him to take his seat again.","Toward yourself: write down the last time it mattered a great deal to you that things went “my way,” and then one thing you failed to welcome or respond to because it was a nuisance. Next to each, write one sentence: in this, was I protecting the Lord’s name, or my own position and convenience?","Toward others: this week invite a brother or sister who is new, from out of town or someone you do not know well to share a meal; if a screenshot or gossip about someone turns up in a group chat, do not forward it or add an emoji — if necessary, ask the person privately, or go and stand with the one being talked about.","Toward daily living: take stock of your giving and support: is there a missionary or minister you can support regularly, on time, and with prayer? Let the amount match your means, without comparison or pressure; the point is to become a fellow worker, not to give a lump sum and be done.","Toward the mission: in your small group or coworkers’ meeting, propose one concrete arrangement: draw up a prayer list of missionaries and ministers “by name,” read it through once a month and write back once a month; at the same time agree on principles for discerning whom to welcome, and arrange for someone in the group who can only join online to receive an in-person visit or a phone call this month."]},"safe":["① First present the 321 line “pride is leaving our proper place and grasping power,” then use Diotrephes in 1:9 as an illustration to prove our idea right; or preach the whole letter as a class in “church leadership and management.”","The order in 3 John is first the truth walked out in our feet, first those who went out for the Name, and only then hospitality and discernment about the man who loves to be first; 321 can only be recognised at the end: humility overcomes pride because the Lord who was in the first place came down first and became a servant. Turn the text into an illustration of an idea, and the congregation will remember a set of management principles rather than the Lord.","The test: after preaching 1:9–11, is the first picture the congregation remembers a 321 diagram, or the Lord who became a stranger for us and the servant of all?","② Using 1:2, “I pray that you may prosper in all things and be healthy,” to preach the prosperity gospel: “God promises every believer wealth and health; if you are ill or short of money, it is because your faith or your giving is not enough.”","This is the greeting and prayer that opened ancient letters, not a promise God has signed; the elder adds “even as your soul prospers” — the soul comes first. Epaphroditus “was sick, nearly to death” (Phil 2:27), Paul’s thorn was not removed, and the Lord said, “My grace is sufficient for you” (2 Cor 12:9); health-and-wealth teaching turns a blessing into a report card (for where these notes stand on the whole letter, see “Prospering and the soul: is “prosper in all things and be healthy” a promise from God?”).","The test: when a faithful brother or sister who has long been ill, or is struggling financially, has heard this, are they comforted and accompanied, or are they being told by implication that “your faith is not enough”?","③ Reversing 1:2 and preaching that “God cares only about your soul; your body, your work and your livelihood are not spiritual, and there is no need to pray about them.”","The elder plainly prays for Gaius’ health and for all things; God made human beings with bodies and saw that everything he had made was very good. Rejecting the prosperity gospel does not mean denying God’s care — praying for the sick, going with someone to the doctor, helping someone find a job are all love.","The test: when someone struggling with unemployment or illness has heard this, do they know they can bring their body and their livelihood before God, or do they feel these things are too worldly and not worth praying about?","④ Using 1:9–10 to pin Diotrephes on a real pastor, elder, church or denomination: “So-and-so in our church is today’s Diotrephes.”","The elder is writing about a particular historical person, not handing us a list we can match to people; neither the pulpit nor the small group names anyone. Diotrephes is a mirror for looking at ourselves — inside every one of us lives someone who wants the first place (for where these notes stand on the whole letter, see ““Loves to be first”: how do we tell church authority from spiritual abuse?”).","The test: when the congregation has heard this, are they more alert to the old self within them that loves to be first, or more eager to go home and guess in the group chat “who is Diotrephes”?","⑤ Using 1:10, “if I come, I will call attention to his deeds,” to justify exposing people online, public shaming or forming factions in private: “The elder named him publicly, so we can expose people online too.”","The elder’s “calling attention” means going in person and setting out the facts within the church; this reminds us of the order the Lord taught: first “show him his fault between you and him alone” (Matt 18:15), then take one or two others, then tell the church. Trial by social media has no process and no room for repentance — only screenshots and shares — and it slides very easily into the “wicked words” and groundless talk of 1:10.","The test: when a brother who has been wronged in the church has heard this, does he know whom to go to and what process to follow to set things right, or does he want even more to post the screenshot on Facebook?","⑥ Reversing it and using “don’t imitate that which is evil” to tell people who have been abused by those in authority, pushed out or thrown out to suffer in silence: “Just be patient; speaking up is unspiritual.”","The elder did not tell Gaius to keep quiet; he himself intends to “call attention” to what was done. Spiritual authority is real, and its abuse is real too. The pulpit must say plainly: those who are hurt have a process they can follow and people they can turn to; a victim does not have to go alone first to face the one putting pressure on them; where the law has been broken, they may report it to the police or seek legal help; and, if necessary, leaving an environment of long-term abuse is not betraying the Lord.","The test: when a sister who has been pushed out and humiliated in the church for a long time has heard this, does she know better that she can ask for help and be protected, or does she feel even more that she just has to swallow it?","⑦ Using 1:7, “taking nothing from the Gentiles,” to shame ministers who receive support: “Truly spiritual ministers don’t take money; drawing a salary is greed.”","“Taking nothing” means not reaching out a hand to those who do not yet believe, not letting the gospel be treated as a business; the Lord said, “the laborer is worthy of his wages” (Luke 10:7), and Paul too says that “those who proclaim the Good News should live from the Good News” (1 Cor 9:14) — receiving support from God’s household is right.","The test: when the family of a full-time minister has heard this, do they know that being held up by the brothers and sisters is a blessing, or do they feel that every cent they receive is something to be ashamed of?","⑧ Using 1:8, “we therefore ought to receive,” to manipulate giving: “If you don’t support missionaries, you owe God a debt — you don’t love the Lord.”","“Ought” in the Greek is the word for owing a debt, but it speaks of the privilege and responsibility of God’s household, not a demand for payment; the elder calls those who give support “fellow workers,” not sponsors, still less people being blackmailed. Giving squeezed out by guilt loses the joy of working “together.”","The test: when the congregation has heard this, are they more willing and more joyful to become fellow workers, or do they reach for their wallets under pressure and guilt?","⑨ Using 1:8 to tell people to welcome without limit and without discernment: “Whenever anyone who calls himself a preacher comes, you must support him; asking too many questions is unloving.”","“Such” are those who went out for the Name, taking nothing, and who are sent on in a way worthy of God; the same elder says in 2 John, “don’t receive him into your house” (2 John 1:10), speaking of teachers who deny that Christ came in the flesh. The early church’s Didache also taught discernment: a travelling apostle stays one day, two if necessary; if he stays a third day, or asks for money, he is a false prophet. Welcome without discernment leaves brothers and sisters open to being exploited (for where these notes stand on the whole letter, see “Opening the door and closing it: what is the standard for hospitality in 2 John and 3 John?”).","The test: when a sister who loves to welcome people, but has been deceived before, has heard this, does she know she can discern in love and keep opening her door, or is she more confused and more afraid to open it?","⑩ Using 1:11, “he who does evil hasn’t seen God,” to frighten people: “You still sin — that proves you are not saved and have never seen God.”","“He who does good” and “he who does evil” are present participles describing the direction of a person’s life, not a verdict on a single fall; John also says, “If we confess our sins, he is faithful and righteous to forgive us the sins” (1 John 1:9). Assurance rests on Christ, not on whether we have done enough (for where these notes stand on the whole letter, see “Doing good and seeing God: does “he who does evil hasn’t seen God” mean we can lose our salvation?”).","The test: when a brother who has just fallen and is repenting has heard this, does he come back to Christ more securely, or does he go home with the fear of losing his salvation?","⑪ Using 1:4, “to hear about my children walking in truth,” to blame parents: “If your children aren’t walking in the truth, you have failed as parents.”","Verse 4 is the joy of a spiritual father, not a report card for parents; the elder speaks of what he “hears,” and some joys take a long time to be heard. Faith is not passed down by parents to their children; God himself goes out to find people. Parents whose children do not yet believe, or have left the faith, need comfort, hope and a group of people praying alongside them.","The test: when a mother who has wept for years over a child who has wandered far away has heard this, does she keep praying for him with more hope, or is she more certain that she has failed as a parent?","⑫ Using 1:13–14, “I am unwilling to write to you with ink and pen … we will speak face to face,” to belittle online fellowship: “Online meetings don’t count; people who can only be there online just aren’t committed enough.”","The elder himself is shepherding Gaius with ink and pen — this letter is itself pastoral care at a distance. The pulpit must say plainly: online pastoral care is real pastoral care; “face to face” is a hope and an invitation, not a threshold; those who cannot be there in person receive the same truth as those who can; and this passage must be preached especially carefully to a community like Kingdom 321 Online Fellowship, scattered across many countries.","The test: when an older believer who can only join meetings online on a phone has heard this, do they feel that they too are remembered “by name,” or that they are a second-class member?","⑬ Using the setting to cancel the principle — “This was about first-century travelling preachers; today we have hotels and mission agencies, so it has nothing to do with us” — or transplanting the setting wholesale: “Every visiting preacher must stay in your home.”","The three questions for an epistle must be followed all the way through: the setting is that the gospel spread station by station through travelling preachers, who depended on believers’ homes to welcome them and send them on; the principle is that God’s household ought to hold up those who go out for the Name, and those who welcome them are fellow workers; where it lands today is prayer and support for missionaries, sending and seeing off, and opening our doors to brothers and sisters from elsewhere — the principle is kept, and where it lands changes with the setting.","The test: when the congregation has heard this, do they know that these verses land today on their own front doors, their giving and their prayer lists, or do they feel it is too remote — or that it is being used to pressure everyone?","⑭ Preaching the whole chapter as a demonstration of the elder’s skill: “Look how well John handles conflict — one letter, and Diotrephes is sorted out. You must learn this leadership technique too.”","The elder sorts no one out in this letter; he says only, “if I come,” and turns Gaius’ eyes toward “imitate … that which is good”; the focus is on the Lord for whose Name they went out, not on the elder’s strategy, nor on Diotrephes’ drama. Preach the letter as power politics, and the congregation will learn how to win and lose how to serve.","The test: when the congregation has heard this, do they admire the elder’s skill more and remember Diotrephes’ wickedness more, or do they love more the Lord who became the servant of all?","⑮ Reading 1:9 as “Diotrephes was a heretic,” and then inferring that “any leader who doesn’t welcome us or doesn’t agree with us is teaching heresy.”","The text makes no doctrinal charge against Diotrephes at all; his problem is written next to his name — he loves to be first; it is a problem of life and character. Calling every difference of opinion heresy turns someone who will not listen to us into an enemy, and it also robs real doctrinal discernment of its weight (for where these notes stand on the whole letter, see ““Loves to be first”: how do we tell church authority from spiritual abuse?”).","The test: when the congregation has heard this, are they better able to tell “an error in doctrine” from “pride in a life,” or have they learned to stick the label “heretic” on everyone who does not suit them?","⑯ Using 1:12, “Demetrius has the testimony of all,” to tell people to chase a good reputation: “You have to get everyone to speak well of you — that is what it means to be spiritual.”","Of Demetrius’ threefold witness, the weightiest is the middle one — “and of the truth itself”; the praise of everyone can change, but the witness of the truth does not. Preach witness as image management, and it becomes another way of loving to be first; what we want is not to be seen, but for our lives to match the truth.","The test: when the congregation has heard this, do they care more about whether their lives match the truth, or more about what other people think of them?"]}],"txt":{"1":["The elder to Gaius the beloved, whom I love in truth.","Beloved, I pray that you may prosper in all things and be healthy, even as your soul prospers.","For I rejoiced greatly when brothers came and testified about your truth, even as you walk in truth.","I have no greater joy than this: to hear about my children walking in truth.","Beloved, you do a faithful work in whatever you accomplish for those who are brothers and strangers.","They have testified about your love before the assembly. You will do well to send them forward on their journey in a way worthy of God,","because for the sake of the Name they went out, taking nothing from the Gentiles.","We therefore ought to receive such, that we may be fellow workers for the truth.","I wrote to the assembly, but Diotrephes, who loves to be first among them, doesn’t accept what we say.","Therefore if I come, I will call attention to his deeds which he does, unjustly accusing us with wicked words. Not content with this, neither does he himself receive the brothers, and those who would, he forbids and throws out of the assembly.","Beloved, don’t imitate that which is evil, but that which is good. He who does good is of God. He who does evil hasn’t seen God.","Demetrius has the testimony of all, and of the truth itself; yes, we also testify, and you know that our testimony is true.","I had many things to write to you, but I am unwilling to write to you with ink and pen;","but I hope to see you soon. Then we will speak face to face.","Peace be to you. The friends greet you. Greet the friends by name."]},"blk":{"1":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">Ὁ πρεσβύτερος Γαΐῳ τῷ ἀγαπητῷ, ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ.</p><p lang=\"grc\">Ἀγαπητέ, περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν, καθὼς εὐοδοῦταί σου ἡ ψυχή.</p>","lit":"<p>The elder, to Gaius the beloved — whom I love in the truth.</p><p>Beloved, concerning all things I pray that you may travel a prosperous road and be in good health, just as your soul travels a prosperous road.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Ὁ πρεσβύτερος</td><td>Ho presbyteros</td><td>the elder</td><td>Has the article; the same self-designation as in 2 John</td></tr><tr><td>Γαΐῳ τῷ ἀγαπητῷ</td><td>Gaiō tō agapētō</td><td>to Gaius the beloved</td><td>◆ Who Gaius was: no verdict</td></tr><tr><td>ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ</td><td>hon egō agapō en alētheia</td><td>whom I love in the truth</td><td>CUV: “sincerely”; Tracks 1 and 4, first stop</td></tr><tr><td>Ἀγαπητέ</td><td>Agapēte</td><td>beloved</td><td>The first “Beloved”; CUV adds “brother”</td></tr><tr><td>εὔχομαί σε εὐοδοῦσθαι</td><td>euchomai se euodousthai</td><td>I pray that you may have a prosperous road</td><td>◆ A formula of greeting: a prayer, not a promise</td></tr><tr><td>καὶ ὑγιαίνειν</td><td>kai hygiainein</td><td>and be in good health</td><td>The elder prays for the body too</td></tr><tr><td>καθὼς εὐοδοῦταί σου ἡ ψυχή</td><td>kathōs euodoutai sou hē psychē</td><td>just as your soul has a prosperous road</td><td>◆ John’s rewrite: the soul comes first</td></tr></table>","gram":"<p><strong>Ὁ πρεσβύτερος (Ho presbyteros) is word for word the same as in 2 John.</strong> It has the article — “the elder”: Gaius would know at once who was writing. The author does not call himself an apostle, only the elder; πρεσβύτερος (presbyteros) can refer to age, or to an office in the church. This series keeps the position of the 1 John Study Notes: the author is the apostle John; alongside it we set out the view, based on Papias (as quoted by Eusebius, Ecclesiastical History 3.39), that this was “John the Elder,” and the Johannine-community view — see the issues pages.</p><p><strong>Γαΐῳ (Gaiō), “Gaius,” was an extremely common name in the Roman world.</strong> The New Testament has at least three: Gaius of Macedonia (Acts 19:29), Gaius of Derbe (Acts 20:4), and the Corinthian “Gaius, my host and host of the whole assembly” (Rom 16:23), probably the same man Paul baptised (1 Cor 1:14). The later Apostolic Constitutions (7.46) says John appointed Gaius bishop of Pergamum. All of these are only possibilities; the text gives us too little to identify him with any one of them. These notes give no verdict, and the pulpit need only say “a brother named Gaius.”</p><p><strong>ὃν ἐγὼ ἀγαπῶ ἐν ἀληθείᾳ (hon egō agapō en alētheia) is rendered “sincerely” in the Chinese Union Version.</strong> It is the same phrase as in 2 John 1:1. ἐν ἀληθείᾳ (en alētheia) can be read as an adverb, “truly,” or as “within the sphere of the truth”; since the letter goes on to speak of the truth five more times, it is hard to read it only as “from the heart.” These notes hold both: the love is sincere, and it is love in the truth. ἀγαπητῷ (agapētō) and ἀγαπῶ (agapō) stand side by side: Gaius is “beloved,” and he is the one the elder loves.</p><p><strong>Verse 2 follows the greeting formula of ancient letters.</strong> Family letters on papyrus found in Egypt often begin, “Before all else I pray that you are in good health,” and only then come to business. The elder uses exactly this form: περὶ πάντων εὔχομαί σε εὐοδοῦσθαι καὶ ὑγιαίνειν (peri pantōn euchomai se euodousthai kai hygiainein). εὔχομαί (euchomai) means “to pray, to wish”: this is a prayer, not a promise God has signed. περὶ πάντων (peri pantōn) is rendered “in all things”; many commentators think it is equivalent to the letter formula πρὸ πάντων (pro pantōn), “above all” — the elder is saying “first of all I pray for you,” not “I wish that everything you touch may flourish.” εὐοδοῦσθαι (euodousthai) is made of εὖ (“well”) and ὁδός (“road”), literally “to have a good journey, to travel a good road,” though by New Testament times it mostly meant simply “to prosper, to go well”; Paul uses the same word in Romans: “if by any means now at last I may be prospered by the will of God to come to you” (Rom 1:10). ὑγιαίνειν (hygiainein) is bodily health; Luke uses the same word in “Those who are healthy have no need for a physician” (Luke 5:31). In the Chinese Union Version “brother” is added in small type; the Greek has only Ἀγαπητέ (Agapēte).</p><p><strong>What matters most is the second half: καθὼς εὐοδοῦταί σου ἡ ψυχή (kathōs euodoutai sou hē psychē).</strong> John has altered a formula everyone wrote: outward prospering is to be “even as” inward prospering. καθὼς (kathōs) means “according to, even as” — the measuring rod is the soul. The same verb is used twice: first he prays for the outward, then he takes the inward as the standard, so the real order puts the soul first. The γάρ (gar) at the start of verse 3 explains how the elder knows that Gaius’ soul is prospering: brothers have come and testified.</p>","exp":"<p>[2 John] 2 John 1:1 (2 John Study Notes, chapter 1)</p><p>“The elder to Gaius the beloved, whom I love in truth.” (1:1) This is the shortest book of the New Testament, and one of the few letters written entirely to one person. 2 John was written to “the chosen lady and her children” — a household, or a church; 3 John has just one name: Gaius.</p><p>The very first sentence contains love twice: “beloved” and “whom I love.” Before the elder says a single word of business, he lets Gaius know he is loved. And that love has a home: the truth. In a letter that will soon speak of Diotrephes, this opening matters: everything the elder is about to say, including the hardest part, comes from the mouth of someone who loves him.</p><p>“Beloved, I pray that you may prosper in all things and be healthy, even as your soul prospers.” (1:2) This verse is quoted often in Chinese churches, and often preached wrongly. Some turn it into a promise from God: believers should be wealthy, healthy and successful in everything; if you are sick or poor, your faith is not enough. That is the reading of the prosperity gospel, health-and-wealth teaching — it is not what John meant.</p><p>First, this is a prayer. The elder uses the greeting formula that opened ancient letters, much as we might end a letter with “wishing the whole family well.” A prayer places a wish in God’s hands; it does not sign a contract on God’s behalf. Second, the standard is the soul. Outward prospering is to be “even as” inward prospering; the sentence does not say “believe and you will prosper,” but “may your outward days be worthy of the state of your soul.” Third, the New Testament is full of faithful saints who were ill: Epaphroditus “was sick, nearly to death” (Phil 2:27); Paul says, “I left Trophimus at Miletus sick” (2 Tim 4:20); the thorn in Paul’s own flesh was not removed, and the Lord said to him, “My grace is sufficient for you” (2 Cor 12:9). A faithful brother or sister who has long been ill or poor should be comforted by this verse, not given the hint that their faith is lacking.</p><p>Yet we must not swing the other way and say God cares only for the soul and not the body. The elder really does pray for Gaius’ body, and for his “all things”: his livelihood, his household, the money and strength his hospitality required. God made the human body and saw that it was very good, and we may pray for one another in the same way: for healing for members who are ill, for work for a brother who has lost his job, for provision for a home that welcomes others. Only the order must be right: first ask, “How is your soul?” and then, “How are your days?”</p><p>321 speaks of changing our perspective: from the world’s perspective to God’s. The world’s perspective measures a person by their bank account, their health, their position; God’s perspective first asks whether their soul is walking on the road of truth. The blessing the elder gives Gaius puts these two measuring rods back in the right order.</p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">ἐχάρην γὰρ λίαν ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων σου τῇ ἀληθείᾳ, καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς.</p><p lang=\"grc\">μειζοτέραν τούτων οὐκ ἔχω χαράν ἵνα ἀκούω τὰ ἐμὰ τέκνα ἐν τῇ ἀληθείᾳ περιπατοῦντα.</p>","lit":"<p>For I rejoiced greatly: brothers came, and bore witness to your truth, just as you walk in the truth.</p><p>A greater joy than these I do not have: to hear that my children are walking in the truth.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>ἐχάρην γὰρ λίαν</td><td>echarēn gar lian</td><td>for I rejoiced greatly</td><td>γάρ links back to verse 2; the same words as 2 John 1:4</td></tr><tr><td>ἐρχομένων ἀδελφῶν καὶ μαρτυρούντων</td><td>erchomenōn adelphōn kai martyrountōn</td><td>brothers coming and testifying</td><td>Present participles: perhaps coming again and again; Track 2, first stop</td></tr><tr><td>σου τῇ ἀληθείᾳ</td><td>sou tē alētheia</td><td>your truth</td><td>CUV fills it out: “the truth kept in your heart”</td></tr><tr><td>σὺ ἐν ἀληθείᾳ περιπατεῖς</td><td>sy en alētheia peripateis</td><td>you walk in the truth</td><td>Track 1, second stop: truth in the feet</td></tr><tr><td>μειζοτέραν τούτων οὐκ ἔχω χαράν</td><td>meizoteran toutōn ouk echō charan</td><td>greater joy than these I do not have</td><td>◆ A double comparative; WH reads χάριν</td></tr><tr><td>τὰ ἐμὰ τέκνα</td><td>ta ema tekna</td><td>my own children</td><td>An emphatic possessive adjective</td></tr></table>","gram":"<p><strong>ἐχάρην γὰρ λίαν (echarēn gar lian) uses γάρ (gar) to link back to verse 2.</strong> How did the elder know that Gaius’ soul was prospering? “Because” brothers had come and testified. λίαν (lian), “greatly,” adds emphasis; 2 John 1:4 also has Ἐχάρην λίαν (Echarēn lian) — in both letters the elder rejoices greatly over the same thing: someone walking in the truth. ἐρχομένων (erchomenōn) and μαρτυρούντων (martyrountōn) are present participles and may mean that the brothers kept coming and kept telling.</p><p><strong>σου τῇ ἀληθείᾳ (sou tē alētheia) in the Greek is simply “your truth.”</strong> The Chinese Union Version fills it out as “the truth kept in your heart,” which brings out the sense: the truth is inside Gaius and has taken on his shape. Then καθὼς σὺ ἐν ἀληθείᾳ περιπατεῖς (kathōs sy en alētheia peripateis) adds an emphatic σὺ (sy): “even as you — you yourself — walk in the truth.” περιπατέω (peripateō) means to walk, and also to live one’s life; the truth is first in the heart, then in the feet.</p><p><strong>μειζοτέραν (meizoteran) is a double comparative.</strong> The comparative of μέγας (megas) is already μείζων (meizōn); the elder adds a second comparative ending, like saying “more greater” in speech, as if he could not find a word big enough.</p><blockquote><p>◆ Textual note: SBLGNT, Tregelles, NA28 and RP read χαράν (charan), “joy,” which the Chinese Union Version follows; Westcott–Hort reads χάριν (charin), “grace”: “I have no greater grace than this.” The two words differ by one letter and the senses are close — hearing that one’s children walk in the truth is both joy and grace. The manuscript evidence for χαράν (charan) is stronger, and it shares its root with ἐχάρην (echarēn) in verse 3; these notes follow χαράν (charan). In addition, the article τῇ (tē) in ἐν τῇ ἀληθείᾳ (en tē alētheia) is absent from NA28 and RP; the meaning is unchanged.</p></blockquote><p>ἵνα ἀκούω (hina akouō) here explains what “this” is; ἀκούω (akouō) is present tense — to hear again and again. τὰ ἐμὰ τέκνα (ta ema tekna) uses the emphatic possessive: “my own children,” which may mean those the elder led to faith or those he shepherded — see the issues page.</p>","exp":"<p>[2 John] 2 John 1:4 (2 John Study Notes, chapter 1)</p><p>“For I rejoiced greatly when brothers came and testified about your truth, even as you walk in truth.” (1:3) The elder does not live in the same place as Gaius. What he knows of Gaius’ life now has been carried back by brothers who passed through his door. They came back and said: that Gaius has the truth in his heart, and his feet walk in it too.</p><p>The sentence has two layers, in a lovely order: first “the truth kept in your heart” (as the Chinese Union Version puts it), then “you walk in truth.” The truth is not something kept on a bookshelf; it is something walked on a road. A person can know the truth by heart and argue it well, yet no one can see it in the way they live; Gaius was not like that — even passing guests could see it. In a world without telephones or the internet, these guests were the elder’s eyes, and what they saw was the way a man lived.</p><p>“I have no greater joy than this: to hear about my children walking in truth.” (1:4) This is the book’s first summit. An old elder, who in his lifetime had seen miracles and visions, and churches rise and fall, has a very plain greatest joy: to hear that his children are still walking on the road of truth. Not that they have done well in their careers, nor that they have risen to high positions in the church, but that they are “walking in truth.”</p><p>The elder says “my children”: he is a spiritual father speaking of his own joy; this is not a report card handed to every parent. There are many parents in the church whose children have not yet come to faith, or who once believed and later left. Reading this verse, their hearts may sink: I don’t have this joy — is it my failure? The text does not say so. The elder speaks of “hearing,” and some joys take a long time to be heard. The prodigal’s father “saw him while he was still far off” (as the Chinese Union Version puts it; Luke 15:20), and the waiting itself was love; not one tear prayed for a child is wasted before God. We can keep praying for our children with comfort and hope, and keep loving them.</p><p>2 John says, “I rejoice greatly that I have found some of your children walking in truth, even as we have been commanded by the Father” (2 John 1:4); 3 John says, “I have no greater joy than this” (1:4). In both letters the elder’s joy rests in the same place. 321 speaks of the “3” — the relationship of spiritual parents and children — and this verse reminds us of it: the greatest joy of spiritual parents is not that their children look up to them, but that their children follow the truth.</p>"},{"a":5,"z":6,"star":2,"grk":"<p lang=\"grc\">Ἀγαπητέ, πιστὸν ποιεῖς ὃ ἐὰν ἐργάσῃ εἰς τοὺς ἀδελφοὺς καὶ τοῦτο ξένους,</p><p lang=\"grc\">οἳ ἐμαρτύρησάν σου τῇ ἀγάπῃ ἐνώπιον ἐκκλησίας, οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ·</p>","lit":"<p>Beloved, you do a faithful thing in whatever you do for the brothers — and they strangers at that.</p><p>They have borne witness to your love before the church; you will do well to send them on their way in a manner worthy of God.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Ἀγαπητέ πιστὸν ποιεῖς</td><td>Agapēte piston poieis</td><td>beloved, you do a faithful thing</td><td>The second “Beloved”; hospitality as an act of faithfulness</td></tr><tr><td>ὃ ἐὰν ἐργάσῃ</td><td>ho ean ergasē</td><td>whatever you do</td><td>ἐργάζομαι: hospitality is a work</td></tr><tr><td>καὶ τοῦτο ξένους</td><td>kai touto xenous</td><td>and that, strangers</td><td>◆ RP reads καὶ εἰς τοὺς ξένους</td></tr><tr><td>ἐμαρτύρησάν σου τῇ ἀγάπῃ</td><td>emartyrēsan sou tē agapē</td><td>they bore witness to your love</td><td>Tracks 2 and 4: hidden love spoken aloud</td></tr><tr><td>ἐνώπιον ἐκκλησίας</td><td>enōpion ekklēsias</td><td>before the church</td><td>No article; from the context, most likely the elder’s own church</td></tr><tr><td>προπέμψας</td><td>propempsas</td><td>sending them on their way</td><td>◆ The early church’s technical term for sending travellers on</td></tr><tr><td>ἀξίως τοῦ θεοῦ</td><td>axiōs tou theou</td><td>in a manner worthy of God</td><td>The standard for sending them on is God</td></tr></table>","gram":"<p><strong>Ἀγαπητέ (Agapēte) is the second “Beloved.”</strong> πιστὸν ποιεῖς (piston poieis) literally means “you do a faithful thing”: hospitality is not an extra kindness; it is an expression of faithfulness. ὃ ἐὰν ἐργάσῃ (ho ean ergasē) uses ἐργάζομαι (ergazomai), “to work”: hospitality is a work, sharing its root with “fellow workers” in verse 8.</p><blockquote><p>◆ Textual note: SBLGNT, Westcott–Hort, Tregelles and NA28 read καὶ τοῦτο ξένους (kai touto xenous), “and that, strangers,” referring to the same group of brothers — Gaius did not know them; RP reads καὶ εἰς τοὺς ξένους (kai eis tous xenous), “and to the strangers,” which sounds like two groups: brothers and strangers. The Chinese Union Version’s “brothers who are travellers” can hold either reading. The harder reading with τοῦτο (touto) is more likely original (scribes would tend to smooth it), and these notes follow SBLGNT: the people Gaius welcomed were not acquaintances.</p></blockquote><p><strong>οἳ ἐμαρτύρησάν (hoi emartyrēsan) is aorist.</strong> These brothers went back to the elder and spoke in the gathering. ἐνώπιον ἐκκλησίας (enōpion ekklēsias) has no article; from the context it most likely means the elder’s own church: what Gaius did in his own home was publicly remembered in another church.</p><p><strong>οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ (hous kalōs poiēseis propempsas axiōs tou theou).</strong> καλῶς ποιήσεις (kalōs poiēseis), “you will do well,” is a polite request in letters, equivalent to “please….” προπέμψας (propempsas) means to send on one’s way, a technical term in the early church: supplying food, money, travelling companions and letters of introduction for the road, so that the preachers could reach their next stop. Luke writes, “They, being sent on their way by the assembly” (Acts 15:3); Paul hopes “to be helped on my way there by you” (Rom 15:24); and he instructs Titus, “Send Zenas, the lawyer, and Apollos on their journey speedily, that nothing may be lacking for them” (Titus 3:13). ἀξίως τοῦ θεοῦ (axiōs tou theou) is an adverb, “in a manner worthy of God,” which the Chinese Union Version turns into a conditional clause, “if you are worthy of God”; the standard for sending them on is God, just as Paul says, “that you should walk worthily of God, who calls you into his own Kingdom and glory” (1 Thess 2:12).</p>","exp":"<p>When the elder says “Beloved” for the second time, it introduces an affirmation: “Beloved, you do a faithful work in whatever you accomplish for those who are brothers and strangers.” (1:5) What the elder praises in Gaius is not that he preaches well, nor that he holds some office in the church, but how he treats strangers who knock at his door.</p><p>The Greek says these brothers were “strangers at that”: Gaius did not know them. Welcoming old friends is not hard; opening the door so that people you do not know can come in, eat and stay, takes faith — and the eyes of truth. The New Testament often reminds us of this: “Don’t forget to show hospitality to strangers” (Heb 13:2); the Lord says, “I was a stranger, and you took me in” (Matt 25:35). Gaius’ door had no sign saying “acquaintances first.” 321 says people matter more than tasks; 920 says that everyone we are connected with is our “2”: this verse reminds us that even the brother who first appeared at the door yesterday is part of that “2.”</p><p>“They have testified about your love before the assembly.” (1:6) It is a very warm picture. No one advertised what Gaius did in his own home; but the brothers who had been welcomed went back to the elder and stood up in the gathering to say: on the road we stayed in the home of a brother named Gaius. Hidden hospitality is remembered in God’s household — and remembered still more before God.</p><p>“You will do well to send them forward on their journey in a way worthy of God.” (1:6) Hospitality has two steps: first you take them in, then you send them on. “Sending on” is a whole package of care: a bag of bread, a little money, a letter of introduction, perhaps someone who knows the way to walk with them for a stretch. Hospitality is not only about tonight’s meal; it is about helping the preachers reach the next stop. The standard is written here too: “worthy of God.” This is not about whether the guests are worthy, but about how those who welcome them can do justice to the One who sent them. “Worthy of God” describes the way they are sent on; whether to welcome them at all is measured by another rod: “for the sake of the Name.”</p><p>This also foreshadows something: hospitality has a standard. Not everyone who knocks and claims to be a preacher is to be supported; 2 John has already said, “don’t receive him into your house” (2 John 1:10). “Worthy of God” and, in the next verse, “for the sake of the Name” are the two measuring rods the elder gives Gaius: see clearly for whose sake they went out, and then send them on their way in a manner worthy of God.</p><p>“Worthy of God” is also a reminder about the manner of hospitality. Sending someone on is not slipping them some loose change to hurry them along; nor is it putting on an air of charity so that the guest feels indebted. Sending people on in a manner worthy of God means treating guests as people God has sent: they represent him, so we send them off well, decently and gladly. Sending out missionaries today, receiving visiting preachers, or getting a short-term mission team ready for the road can all be measured by this rod.</p>"},{"a":7,"z":8,"star":3,"grk":"<p lang=\"grc\">ὑπὲρ γὰρ τοῦ ὀνόματος ἐξῆλθον μηδὲν λαμβάνοντες ἀπὸ τῶν ἐθνικῶν</p><p lang=\"grc\">ἡμεῖς οὖν ὀφείλομεν ὑπολαμβάνειν τοὺς τοιούτους, ἵνα συνεργοὶ γινώμεθα τῇ ἀληθείᾳ.</p>","lit":"<p>For it was for the sake of the Name that they went out, taking nothing from the Gentiles.</p><p>We therefore ought to support such people, so that we may become fellow workers with the truth.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>ὑπὲρ γὰρ τοῦ ὀνόματος</td><td>hyper gar tou onomatos</td><td>for it was for the sake of the Name</td><td>◆ CUV footnote: the Greek is “the Name”</td></tr><tr><td>ἐξῆλθον</td><td>exēlthon</td><td>they went out</td><td>◆ The same word as “deceivers have gone out” in 2 John 1:7</td></tr><tr><td>μηδὲν λαμβάνοντες</td><td>mēden lambanontes</td><td>taking nothing</td><td>Present participle: taking nothing all along the way</td></tr><tr><td>ἀπὸ τῶν ἐθνικῶν</td><td>apo tōn ethnikōn</td><td>from the Gentiles</td><td>◆ RP reads ἐθνῶν</td></tr><tr><td>ἡμεῖς οὖν ὀφείλομεν</td><td>hēmeis oun opheilomen</td><td>we therefore ought</td><td>ὀφείλω: to owe, to be obliged</td></tr><tr><td>ὑπολαμβάνειν τοὺς τοιούτους</td><td>hypolambanein tous toioutous</td><td>to support such people</td><td>◆ Shares its root with λαμβάνοντες; RP reads ἀπολαμβάνειν</td></tr><tr><td>συνεργοὶ γινώμεθα τῇ ἀληθείᾳ</td><td>synergoi ginōmetha tē alētheia</td><td>become fellow workers with the truth</td><td>The chapter title; the hinge of the book</td></tr></table>","gram":"<p><strong>ὑπὲρ γὰρ τοῦ ὀνόματος (hyper gar tou onomatos): the Greek has only “the Name.”</strong> The “Lord’s” in the Chinese Union Version’s “for the Lord’s name” was supplied by the translators; its footnote says, “name: the original is ‘the Name’.” In the early church, “the Name” needed no explanation — it was the name of Jesus: the apostles left the council “rejoicing that they were counted worthy to suffer dishonor for Jesus’ name” (Acts 5:41; where WEB has “Jesus’ name,” the critical Greek text has simply “the Name”).</p><p><strong>ἐξῆλθον (exēlthon) is the same word as in 2 John 1:7.</strong> (SBLGNT; the Byzantine RP text reads εἰσῆλθον (eisēlthon), “entered,” in 2 John 1:7.) 2 John says, “For many deceivers have gone out into the world” (2 John 1:7); 3 John says these brothers “went out” for the sake of the Name. Both “went out” — one group went out to deceive, the other went out for the Name. Many people go out; the test is whose name they go out for.</p><p><strong>μηδὲν λαμβάνοντες ἀπὸ τῶν ἐθνικῶν (mēden lambanontes apo tōn ethnikōn), “taking nothing from the Gentiles.”</strong> ἐθνικός (ethnikos) in the New Testament means Gentiles, unbelievers; the same word appears in the Greek of Matt 5:47 (where WEB, following other manuscripts, reads ‘tax collectors’). λαμβάνοντες (lambanontes) is a present participle: they took nothing all along the way. There are two readings of whom ἐθνικοί (ethnikoi) refers to: ① unbelieving Gentiles (the majority view): they would not take money from unbelievers, so as not to be mistaken for the wandering philosophers of the day who charged for their talks; ② a minority think it refers to the Gentile believers to whom they preached, as Paul would not take support from the Corinthians (2 Cor 11:7–8). Both readings land in the same place: the gospel must not look like a business. Paul too was “working night and day, that we might not burden any of you” (1 Thess 2:9), and he urged people “to remember the words of the Lord Jesus, that he himself said, ‘It is more blessed to give than to receive’” (Acts 20:35).</p><blockquote><p>◆ Textual note: in verse 7, SBLGNT, Westcott–Hort, Tregelles and NA28 read ἐθνικῶν (ethnikōn); RP reads ἐθνῶν (ethnōn), “nations, Gentiles,” with a similar sense. In verse 8, SBLGNT reads ὑπολαμβάνειν (hypolambanein), “to support, to receive,” and RP reads ἀπολαμβάνειν (apolambanein), “to receive back”; ἀπολαμβάνειν (apolambanein) makes little sense here and is probably a scribal confusion of similar prefixes. These notes follow SBLGNT.</p></blockquote><p><strong>ἡμεῖς οὖν ὀφείλομεν ὑπολαμβάνειν (hēmeis oun opheilomen hypolambanein) has three layers.</strong> ① ἡμεῖς (hēmeis) is emphatic: they take nothing from the Gentiles, so “we” must take them in. ② ὀφείλω (opheilō) means “to owe, to be obliged”; it is the root of the debt in Matthew’s parable, where a fellow servant “owed him one hundred denarii” (Matt 18:28) — God’s household owes these people hospitality. ③ ὑπολαμβάνω (hypolambanō) literally means “to take up from underneath,” sharing its root with λαμβάνοντες (lambanontes), “taking,” in verse 7 — a play on words: they take nothing, so we take them up.</p><p><strong>The dative in συνεργοὶ γινώμεθα τῇ ἀληθείᾳ (synergoi ginōmetha tē alētheia) can be read two ways.</strong> It can mean “fellow workers for the truth,” with the truth as the goal; or “fellow workers with the truth,” with the truth as the partner. These notes hold both, and the second goes deeper: those who give hospitality are not merely helping the preachers; they are working together with the truth itself. Paul says, “For we are God’s fellow workers” (1 Cor 3:9) — the same family as συνεργοί (synergoi).</p>","exp":"<p>[2 John] 2 John 1:10–11 (2 John Study Notes, chapter 1)</p><p>“Because for the sake of the Name they went out, taking nothing from the Gentiles.” (1:7) Who were these people? Not tourists, nor traders, but preachers who had left home for the sake of “the Name.” They walked the roads of Asia Minor from city to city; no mission agency paid them, and they did not hold out their hands to unbelievers by the roadside. They took nothing, because they would not let the gospel look like a business.</p><p>“We therefore ought to receive such, that we may be fellow workers for the truth.” (1:8) This is the hinge of the whole book, and the chapter title. The elder uses a heavy word, “ought” — in the Greek, the word for a debt: God’s household owes these people hospitality. Yet this “owing” is not a demand for payment; it is a privilege. For the next words lift hospitality higher: those who welcome become fellow workers “with them” for the truth. Gaius did not take to the road, nor did he preach; but the moment he opened his door, laid his table and sent them on their way, he became a fellow worker.</p><p>First, this verse is not for shaming preachers who receive support. The Lord says, “for the laborer is worthy of his wages” (Luke 10:7); Paul says, “Even so the Lord ordained that those who proclaim the Good News should live from the Good News” (1 Cor 9:14); and, “But let him who is taught in the word share all good things with him who teaches” (Gal 6:6). The preachers took nothing from the Gentiles precisely because God’s household ought to support them, and those who rightly receive support need feel no shame. Second, it is not a verse for manipulating giving or manufacturing guilt either. When the elder says “ought,” he is inviting brothers and sisters into the privilege of working together, not saying that those who do not give do not love the Lord. Those who give support are not sponsors; they are fellow workers.</p><p>Third, hospitality involves discernment. “Such” people means particular people: those who went out for the Name, taking nothing, worthy of God. The same elder says in 2 John, “If anyone comes to you, and doesn’t bring this teaching, don’t receive him into your house, and don’t welcome him” (2 John 1:10). One letter tells people to close the door, the other to open it; the test is not whether we know someone, nor who holds power, but whether they bring the one Christ, whether they come for the sake of the Name. The early church’s Didache (chapters 11–12) made the same kind of discernment: an itinerant apostle should stay a day or two; if he stays a third day, or asks for money, he is a false prophet. Opening the door is the norm, but an open door does not mean no discernment; hospitality does not mean letting oneself be exploited.</p><p>321 says life first, then relationships, then ministry. Gaius’ order is exactly this: first “you walk in truth” (1:3), then “they have testified about your love” (1:6), and only then “fellow workers for the truth” (1:8). 321 speaks of selflessness: for Jesus, for others, not for ourselves — those who go out take nothing for themselves, and those who welcome keep nothing back for themselves. Kingdom 321 Online Fellowship passes on the truth online, and it too needs a company of people like Gaius: praying for those who preach, supporting, welcoming and connecting them, carrying the truth together to the next stop. This is not watching from the side; it is working together.</p>"},{"a":9,"z":10,"star":3,"grk":"<p lang=\"grc\">Ἔγραψά τι τῇ ἐκκλησίᾳ· ἀλλʼ ὁ φιλοπρωτεύων αὐτῶν Διοτρέφης οὐκ ἐπιδέχεται ἡμᾶς.</p><p lang=\"grc\">διὰ τοῦτο, ἐὰν ἔλθω, ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ, λόγοις πονηροῖς φλυαρῶν ἡμᾶς, καὶ μὴ ἀρκούμενος ἐπὶ τούτοις οὔτε αὐτὸς ἐπιδέχεται τοὺς ἀδελφοὺς καὶ τοὺς βουλομένους κωλύει καὶ ἐκ τῆς ἐκκλησίας ἐκβάλλει.</p>","lit":"<p>I wrote something to the church; but Diotrephes, who loves to be first among them, does not accept us.</p><p>For this reason, if I come, I will bring to remembrance the deeds he does: talking nonsense against us with evil words; and not content with these things, he himself does not accept the brothers, and those who want to, he hinders, and throws them out of the church.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Ἔγραψά τι τῇ ἐκκλησίᾳ</td><td>Egrapsa ti tē ekklēsia</td><td>I wrote something to the church</td><td>◆ CUV: “I wrote briefly”; RP lacks τι</td></tr><tr><td>ὁ φιλοπρωτεύων αὐτῶν</td><td>ho philoprōteuōn autōn</td><td>who loves to be first among them</td><td>◆ Only here in the New Testament</td></tr><tr><td>Διοτρέφης</td><td>Diotrephēs</td><td>Diotrephes</td><td>“Nourished by Zeus”; we do not build an argument on the name</td></tr><tr><td>οὐκ ἐπιδέχεται ἡμᾶς</td><td>ouk epidechetai hēmas</td><td>does not accept us</td><td>Track 3, second stop; can also mean refusing to recognise authority</td></tr><tr><td>ὑπομνήσω αὐτοῦ τὰ ἔργα</td><td>hypomnēsō autou ta erga</td><td>I will bring his deeds to remembrance</td><td>Setting the facts out openly — but not shaming</td></tr><tr><td>λόγοις πονηροῖς φλυαρῶν ἡμᾶς</td><td>logois ponērois phlyarōn hēmas</td><td>talking nonsense against us with evil words</td><td>◆ φλυαρέω only here in the New Testament</td></tr><tr><td>κωλύει</td><td>kōlyei</td><td>he hinders</td><td>Present tense: possibly “tries to hinder”</td></tr><tr><td>ἐκ τῆς ἐκκλησίας ἐκβάλλει</td><td>ek tēs ekklēsias ekballei</td><td>throws them out of the church</td><td>The book’s lowest point; Track 3’s reversal</td></tr></table>","gram":"<p><strong>Ἔγραψά τι τῇ ἐκκλησίᾳ (Egrapsa ti tē ekklēsia), “I wrote briefly to the church” in the Chinese Union Version.</strong> τι (ti) means “something, a little,” which the Chinese Union Version renders “briefly.” Which letter was it? Three readings: ① 2 John itself — but 2 John deals with discernment about Christ, not with receiving travelling brothers; ② a letter now lost, as most commentators hold; ③ 1 John, which is less likely. These notes give no verdict. The letter was most likely suppressed by Diotrephes, which is why the elder now writes to Gaius.</p><blockquote><p>◆ Textual note: SBLGNT, Westcott–Hort, Tregelles and NA28 read Ἔγραψά τι (Egrapsa ti); RP lacks τι (ti): “I wrote to the church.” τι (ti) makes the letter sound short and light; the harder reading is probably original, and it fits the Chinese Union Version’s “briefly.” These notes follow SBLGNT.</p></blockquote><p><strong>φιλοπρωτεύων (philoprōteuōn) occurs only here in the New Testament.</strong> It is made of φίλος (philos), “love,” and πρῶτος (prōtos), “first”: loving to be first, loving the first seat. It is a present participle — this was what he was like, not a momentary lapse. Paul says of Christ, “that in all things he might have the preeminence” (Col 1:18), and the πρωτεύων (prōteuōn) there shares its root with this word: only one is worthy to be first in all things. The name Διοτρέφης (Diotrephēs) means “nourished by Zeus”; it was not a common name and was found mostly in families of standing — mention it in a sentence and build nothing on it. αὐτῶν (autōn), “among them,” shows that he held real power in that church.</p><p><strong>οὐκ ἐπιδέχεται ἡμᾶς (ouk epidechetai hēmas) is present tense.</strong> He keeps refusing. ἐπιδέχομαι (epidechomai) means to receive, and the word can also mean to acknowledge or accept someone’s authority. The only charge the text brings against Diotrephes concerns his character and conduct; not one sentence says he taught false doctrine. There are three readings: ① he was a heretic (the text makes no doctrinal charge); ② he was a leader resisting the elder’s authority and trying to control the local church on his own (most commentators); ③ this reflects tension in the transition from itinerant apostles to local overseers (a social-historical reading). These notes take the position set out in the book-wide positions: the problem lay in his heart, not his head. αὐτῶν (autōn), “their,” also hints that Gaius may not have belonged to that church; both views are held.</p><p><strong>Verse 10: ὑπομνήσω αὐτοῦ τὰ ἔργα ἃ ποιεῖ (hypomnēsō autou ta erga ha poiei).</strong> ὑπομιμνῄσκω (hypomimnēskō) means “to remind, to bring to remembrance”: setting out what he has done before everyone — openly, but without shaming him and without embellishment; and it comes with a condition: ἐὰν ἔλθω (ean elthō), “if I come” — in person, in that church. λόγοις πονηροῖς φλυαρῶν ἡμᾶς (logois ponērois phlyarōn hēmas): φλυαρέω (phlyareō) occurs only here in the New Testament and means to talk nonsense, to spread groundless gossip; the related φλύαρος (phlyaros) appears in 1 Timothy, “gossips” (1 Tim 5:13). Evil words plus empty talk: no substance, yet able to wound. Then comes a mounting series: καὶ μὴ ἀρκούμενος ἐπὶ τούτοις (kai mē arkoumenos epi toutois), “not content with this,” he himself does not receive the brothers, κωλύει (kōlyei) — he hinders those who want to receive them — and finally ἐκ τῆς ἐκκλησίας ἐκβάλλει (ek tēs ekklēsias ekballei), “throws them out of the church.” ἐκβάλλω (ekballō) means to throw out; κωλύει (kōlyei) and ἐκβάλλει (ekballei) are both present tense, which may express an attempt (“is trying to”) or something that has already happened. Of the blind man thrown out of the synagogue, Scripture says, “Then they threw him out” (John 9:34) — the same verb.</p>","exp":"<p>“I wrote to the assembly, but Diotrephes, who loves to be first among them, doesn’t accept what we say.” (1:9) At this point in the letter the scene changes. Before, there was an open door: Gaius’ home; here there is a closed door: the door of the church, and the one who closed it sits in the first seat.</p><p>The elder uses only one word for Diotrephes: “loves to be first.” He does not say that Diotrephes taught heresy, nor that he denied Christ; his problem was not in his head but in his heart. 321 says pride is leaving our proper place and grasping power: leaving the place of a human being, grasping the power of God, wanting to take God’s place. Diotrephes is the clearest picture of this in the New Testament. He left the proper place of a servant and grasped the “first place” that belongs to Christ alone, shutting out even the people the elder had sent. The words of the Lord Jesus are the exact opposite: “Whoever of you wants to become first among you, shall be bondservant of all” (Mark 10:44); “one who is governing, as one who serves” (Luke 22:26).</p><p>Reading this, the easiest reaction is to name someone silently: so-and-so in our church is just like Diotrephes. But this mirror is not for looking at others; it is for looking at ourselves. So when reading these two verses, do not match the description to anyone, and do not pin Diotrephes’ name on any real pastor, elder, church or denomination. Inside every one of us lives a Diotrephes: wanting the final word at home, wanting to steer the conversation in the small group, not liking it when someone else serves better than we do, refusing to accept anyone who threatens our position. Loving to be first is not only a temptation of the pulpit; it is a temptation at the dinner table and in the office.</p><p>“Therefore if I come, I will call attention to his deeds which he does, unjustly accusing us with wicked words. Not content with this, neither does he himself receive the brothers, and those who would, he forbids and throws out of the assembly.” (1:10) This is the deepest valley in the book. Diotrephes did four things: he spoke against people with wicked words, he would not receive the brothers himself, he forbade others to receive them, and he threw those who did out of the church. A life that loves to be first always ends as a locked door — and he alone has the key. Those who opened their doors end up thrown outside. Pride provokes pride, and in the end the whole body is wounded. The elder’s response is not to strike back from a distance but to deal with it in person.</p><p>How does the elder respond? On this point today’s church especially needs to learn. He says, “if I come”: going in person, to that church, setting out the facts before everyone. This reminds us of the order the Lord taught: first point it out privately, then take one or two others, then tell the church (Matt 18:15–17). This is not exposing someone online or shaming them in public, nor forming a faction behind the scenes and spreading talk. The elder does not answer wicked words with wicked words, gives Diotrephes no nickname, and does not tell Gaius to fight him; he simply “calls attention to his deeds,” and then turns at once to Gaius: imitate what is good.</p><p>At the same time, spiritual authority is real — and so is its abuse. If anyone in the church, like the brothers who were thrown out, is falsely accused, excluded or hurt by those in power, they are not being told to suffer in silence. The elder did not say to those who were thrown out, “Just put up with it”; he said he would come and deal with it. We too must discern, protect those who are hurt, seek help through the church’s proper process, and let the facts be spoken clearly in the light.</p>"},{"a":11,"z":11,"star":2,"grk":"<p lang=\"grc\">Ἀγαπητέ, μὴ μιμοῦ τὸ κακὸν ἀλλὰ τὸ ἀγαθόν. ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν· ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν.</p>","lit":"<p>Beloved, do not imitate what is evil, but what is good. The one who does good is from God; the one who does evil has not seen God.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Ἀγαπητέ μὴ μιμοῦ τὸ κακὸν</td><td>Agapēte mē mimou to kakon</td><td>beloved, do not imitate what is evil</td><td>The third “Beloved”; present imperative</td></tr><tr><td>ἀλλὰ τὸ ἀγαθόν</td><td>alla to agathon</td><td>but what is good</td><td>The article: evil and good in the abstract</td></tr><tr><td>ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν</td><td>ho agathopoiōn ek tou theou estin</td><td>the one who does good is from God</td><td>Present participle: the direction of a life</td></tr><tr><td>ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν</td><td>ho kakopoiōn ouch heōraken ton theon</td><td>the one who does evil has not seen God</td><td>Perfect: has not seen, and still has not</td></tr></table>","gram":"<p><strong>The third Ἀγαπητέ (Agapēte).</strong> The most direct command in the whole book is still prefaced by the tenderest form of address. μιμοῦ (mimou) is the present imperative of μιμέομαι (mimeomai), “to imitate, to copy”: keep choosing, day by day, whom you imitate. The verb μιμέομαι (mimeomai) appears elsewhere in the New Testament in 2 Thess 3:7, 9 and in “imitate their faith” (Heb 13:7); the noun μιμητής (mimētēs), “imitator,” appears in “Be therefore imitators of God” (Eph 5:1) and “Be imitators of me, even as I also am of Christ” (1 Cor 11:1). τὸ κακὸν (to kakon) and τὸ ἀγαθόν (to agathon) have the article — “the evil,” “the good” in the abstract; yet this verse stands between Diotrephes (a pattern of evil) and Demetrius (a pattern of good), so abstract good and evil have each been given a face.</p><p><strong>ὁ ἀγαθοποιῶν ἐκ τοῦ θεοῦ ἐστιν (ho agathopoiōn ek tou theou estin) · ὁ κακοποιῶν οὐχ ἑώρακεν τὸν θεόν (ho kakopoiōn ouch heōraken ton theon).</strong> ἀγαθοποιῶν (agathopoiōn) and κακοποιῶν (kakopoiōn) are present participles, describing the ongoing direction and pattern of a life, not a single fall. ἐκ τοῦ θεοῦ (ek tou theou), “of God,” is John’s idiom: “Whoever doesn’t do righteousness is not of God” (1 John 3:10). οὐχ ἑώρακεν (ouch heōraken) is perfect, “has not seen, and to this day has not”; 1 John says, “Whoever sins hasn’t seen him and doesn’t know him” (1 John 3:6). ἑώρακεν (heōraken) and ἰδεῖν (idein), “to see you,” in verse 14 belong in the dictionary to the same verb, “to see” (ὁράω (horaō)): the elder hopes to see Gaius, while the one who does evil has not seen God.</p>","exp":"<p>[1 John] 1 John 3:6–10 (1 John Study Notes, chapter 3)</p><p>The terrain is lifted from the valley of verse 10 straight back to the heights by a single sentence: “Beloved, don’t imitate that which is evil, but that which is good. He who does good is of God. He who does evil hasn’t seen God.” (1:11) The elder has just written the four things Diotrephes did, yet his tone has not hardened. He does not say to Gaius, “You must stand up and oppose him,” nor “You must be stronger than he is”; he only says: beloved, don’t imitate him.</p><p>This is the elder’s way of dealing with someone who “loves to be first,” and it reminds us of 321’s saying that humility overcomes pride. When pride opposes pride, both sides are wounded; if you deal with Diotrephes by Diotrephes’ methods, you become another Diotrephes. Only humility that draws out humility leads to a win for both. Gaius did not need to beat the man in the first seat; he only needed to go on being a man who opens his door. The focus is on Jesus, not on others: not watching Diotrephes day after day, but choosing day after day to imitate what is good. The Lord himself said, “For I have given you an example” (John 13:15) — the good has a face that is clearest of all, and it is his.</p><p>The half-sentence “He who does evil hasn’t seen God” is not there to create fear. The present participles speak of the direction of a life, the pattern of a person’s whole life, not a verdict on one failure. A brother or sister who earnestly follows the Lord and has fallen in some matter need not read this verse and doubt their salvation. In the same letters John also says, “If anyone sins, we have a Counselor with the Father, Jesus Christ, the righteous” (1 John 2:1); “If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness” (1 John 1:9). Assurance rests on the work of Christ, not on our never failing.</p><p>Yet this verse does not allow the opposite error either: saying that it does not matter what we do. Those who have seen God have a direction in their lives; for someone who for years has wounded people with wicked words, thrown those who open their doors out of the church, and still thinks himself spiritual, this verse is a warning bell. The elder holds this mirror out to Gaius and to Diotrephes alike: whom are you imitating? Which way is your life going?</p>"},{"a":12,"z":12,"star":1,"grk":"<p lang=\"grc\">Δημητρίῳ μεμαρτύρηται ὑπὸ πάντων καὶ ὑπὸ αὐτῆς τῆς ἀληθείας· καὶ ἡμεῖς δὲ μαρτυροῦμεν, καὶ οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν.</p>","lit":"<p>To Demetrius witness has been borne by all, and by the truth itself; and we also bear witness, and you know that our witness is true.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Δημητρίῳ μεμαρτύρηται</td><td>Dēmētriō memartyrētai</td><td>to Demetrius witness has been borne</td><td>◆ Perfect passive; CUV adds “does good”</td></tr><tr><td>ὑπὸ αὐτῆς τῆς ἀληθείας</td><td>hypo autēs tēs alētheias</td><td>by the truth itself</td><td>Track 1, fifth stop: the truth itself speaks</td></tr><tr><td>καὶ ἡμεῖς δὲ μαρτυροῦμεν</td><td>kai hēmeis de martyroumen</td><td>and we also bear witness</td><td>The third witness</td></tr><tr><td>ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν</td><td>hē martyria hēmōn alēthēs estin</td><td>our witness is true</td><td>◆ RP reads οἴδατε; this reminds us of John 21:24</td></tr></table>","gram":"<p><strong>“Does good” is a small-type addition.</strong> The Greek says only Δημητρίῳ μεμαρτύρηται (Dēmētriō memartyrētai), “witness has been borne to Demetrius,” without the words “does good”; the Chinese Union Version (cu89t) supplies them in small type, linking verse 12 to “he who does good is of God” in verse 11. μεμαρτύρηται (memartyrētai) is a perfect passive: the witness has been given and still stands. A threefold witness: ὑπὸ πάντων (all people), ὑπὸ αὐτῆς τῆς ἀληθείας (the truth itself), καὶ ἡμεῖς δὲ μαρτυροῦμεν (we). This reminds us of what the law says: “At the mouth of two witnesses, or at the mouth of three witnesses, shall a matter be established” (Deut 19:15).</p><blockquote><p>◆ Textual note: SBLGNT, Westcott–Hort, Tregelles and NA28 read οἶδας (oidas), “you know,” which the Chinese Union Version follows; RP reads οἴδατε (oidate), “you all know.” Since the whole letter is written to Gaius alone, the singular fits the context better; these notes follow SBLGNT.</p></blockquote><p>καὶ οἶδας ὅτι ἡ μαρτυρία ἡμῶν ἀληθής ἐστιν (kai oidas hoti hē martyria hēmōn alēthēs estin) is almost the ending of John’s Gospel: “We know that his witness is true” (John 21:24).</p>","exp":"<p>[John] John 21:24 (John Study Notes, chapter 21)</p><p>After Diotrephes, the elder introduces another man: “Demetrius has the testimony of all, and of the truth itself; yes, we also testify, and you know that our testimony is true.” (1:12) He was very probably the one who carried this letter, so that the letter served as a letter of introduction, just as Paul writes, “I commend to you Phoebe, our sister” (Rom 16:1); or he may have been one of the next group of preachers due to arrive at Gaius’ home. At Ephesus there was a silversmith who made shrines, “a certain man named Demetrius” (Acts 19:24) — the Chinese Union Version spells his name differently; some say they are the same man, but this is only a guess, and these notes do not adopt it.</p><p>Diotrephes had a position; Demetrius had a testimony. What a person is finally remembered for is not the seats they have sat in, but whether the truth bears witness for them. The most moving phrase is the one in the middle: “and of the truth itself.” Until now people have borne witness to the truth; here the truth itself speaks. When a person’s life matches the truth closely enough, the truth speaks up for them. 321 speaks of overcomers, and this verse reminds us that an overcomer is not necessarily the one who stands at the front, but the one for whom the truth bears witness.</p><p>This verse also shows how the elder helps a wounded church. He does not simply write a letter attacking Diotrephes; he sends someone worth welcoming and vouches for him. The best answer to a closed door is to send someone worth opening it for; the best answer to wicked words is to let true testimony be heard. If Gaius welcomes Demetrius, he once again stands on the
