side of the good. We can ask ourselves the same question: when people speak of me, would the truth be willing to stand up and bear witness for me?</p>"},{"a":13,"z":15,"star":2,"grk":"<p lang=\"grc\">Πολλὰ εἶχον γράψαι σοι, ἀλλʼ οὐ θέλω διὰ μέλανος καὶ καλάμου σοι γράφειν</p><p lang=\"grc\">ἐλπίζω δὲ εὐθέως σε ἰδεῖν, καὶ στόμα πρὸς στόμα λαλήσομεν.</p><p lang=\"grc\">Εἰρήνη σοι. ἀσπάζονταί σε οἱ φίλοι. ἀσπάζου τοὺς φίλους κατʼ ὄνομα.</p>","lit":"<p>I had many things to write to you, but I do not wish to write to you with ink and pen;</p><p>but I hope to see you soon, and we will speak mouth to mouth.</p><p>Peace to you. The friends greet you. Greet the friends by name.</p>","key":"<table><tr><th>Greek</th><th>Transliteration</th><th>Literal</th><th>Here</th></tr><tr><td>Πολλὰ εἶχον γράψαι σοι</td><td>Polla eichon grapsai soi</td><td>I had many things to write to you</td><td>Imperfect: I had</td></tr><tr><td>διὰ μέλανος καὶ καλάμου</td><td>dia melanos kai kalamou</td><td>with ink and pen</td><td>κάλαμος: a reed pen</td></tr><tr><td>εὐθέως σε ἰδεῖν</td><td>eutheōs se idein</td><td>to see you soon</td><td>The same dictionary verb “to see” as ἑώρακεν in verse 11</td></tr><tr><td>στόμα πρὸς στόμα λαλήσομεν</td><td>stoma pros stoma lalēsomen</td><td>we will speak mouth to mouth</td><td>◆ The same expression as 2 John 1:12</td></tr><tr><td>Εἰρήνη σοι</td><td>Eirēnē soi</td><td>peace to you</td><td>2 John closes on joy; 3 John closes on peace</td></tr><tr><td>ἀσπάζονταί σε οἱ φίλοι</td><td>aspazontai se hoi philoi</td><td>the friends greet you</td><td>◆ The last sentence of John’s letters rests on “friends” and “name”</td></tr><tr><td>κατʼ ὄνομα</td><td>kat' onoma</td><td>by name</td><td>This reminds us of John 10:3</td></tr></table>","gram":"<p><strong>Πολλὰ εἶχον γράψαι σοι (Polla eichon grapsai soi).</strong> εἶχον (eichon) is imperfect: “I had.” διὰ μέλανος καὶ καλάμου (dia melanos kai kalamou): μέλαν (melan) is ink, a word 2 John also uses; κάλαμος (kalamos) elsewhere in the New Testament is a reed — “A reed shaken by the wind?” (Matt 11:7) — or a measuring rod (Rev 11:1); here it is a sharpened reed pen. 2 John says “paper and ink” (χάρτου καὶ μέλανος (chartou kai melanos)), 3 John “ink and pen”: the two letters end the same way, one mentioning the paper, the other the pen.</p><blockquote><p>◆ Textual note: in verse 13, SBLGNT, Westcott–Hort, Tregelles and NA28 read γράψαι σοι (grapsai soi) … γράφειν (graphein); RP reverses the tenses of the two infinitives, reading γράφειν (without σοι (soi)) … γράψαι (grapsai). In verse 14, SBLGNT reads σε ἰδεῖν (se idein) and RP ἰδεῖν σε (idein se), a difference only of word order. Neither affects the meaning; these notes follow SBLGNT.</p></blockquote><p><strong>στόμα πρὸς στόμα λαλήσομεν (stoma pros stoma lalēsomen) literally means “speak mouth to mouth.”</strong> The Chinese Union Version renders it “talk face to face,” the same expression as in 2 John 1:12. This reminds us of God’s words about Moses: “With him, I will speak mouth to mouth” (Num 12:8; the Chinese Union Version has “face to face”); the Septuagint reads στόμα κατὰ στόμα (stoma kata stoma) — a different preposition, but the same closeness. εὐθέως (eutheōs) means soon; ἰδεῖν (idein) and ἑώρακεν (heōraken) in verse 11 belong in the dictionary to the same verb, “to see” (ὁράω (horaō)). The King James Version and some other translations combine verses 14 and 15 into one verse 14; the Chinese Union Version and SBLGNT used in this series both have fifteen verses.</p><p><strong>Verse 15: Εἰρήνη σοι (Eirēnē soi) is the Hebrew greeting shalom.</strong> Then ἀσπάζονταί σε οἱ φίλοι (aspazontai se hoi philoi). φίλος (philos) means friend; John’s community may have called one another “friends” (this reminds us of John 15:14–15). Finally ἀσπάζου τοὺς φίλους κατʼ ὄνομα (aspazou tous philous kat' onoma): κατʼ ὄνομα (kat' onoma), “by name,” one by one. John’s Gospel says that the good shepherd “calls his own sheep by name” (John 10:3) — the same phrase.</p>","exp":"<p>[John] John 15:13–15 (John Study Notes, chapter 15)</p><p>“I had many things to write to you, but I am unwilling to write to you with ink and pen; but I hope to see you soon. Then we will speak face to face.” (1:13–14) Here the elder lays down his pen. He still has much to say, but he does not want to write any more; what he wants is to meet, to speak mouth to mouth. 2 John ends the same way: “I don’t want to do so with paper and ink, but I hope to come to you, and to speak face to face” (2 John 1:12).</p><p>These two verses are especially dear to Kingdom 321 Online Fellowship. The elder himself is shepherding Gaius with pen and ink; this letter is itself a ministry at a distance. Without this sheet, Gaius would not have known the elder’s heart, nor that Demetrius could be welcomed. So pen and ink are not second best; they are a bridge, carrying the truth to places where people cannot meet. We must not use these two verses to belittle online fellowships, pastoral care at a distance, or brothers and sisters who cannot be present because of illness, work or distance. “Face to face” is the elder’s hope and invitation, not a threshold: online gatherings carry the truth to us, and meeting in person makes the relationship complete — both are the same love.</p><p>“Peace be to you. The friends greet you. Greet the friends by name.” (1:15) The closing of 2 John speaks of joy “made full” (2 John 1:12); the closing of 3 John says, “Peace be to you.” When the Lord rose and came into the house where the doors were locked, his first words were also, “Peace be to you” (John 20:19). Outside, someone had shut a door; but the elder sends peace to the man whose door is still open.</p><p>Then come the “friends.” The last sentence of John’s letters rests on “friends” and “name.” The Lord said, “Greater love has no one than this, that someone lay down his life for his friends” (John 15:13); and, “But I have called you friends” (John 15:15). John’s community may have called one another “friends”; at Sidon Paul too was given “permission to go to his friends” (Acts 27:3), which can serve as supporting evidence. And the elder asks Gaius to greet them “by name” — not a general “hello everyone” at the end of the meeting, but calling each one by name. In verse 7 the preachers went out for “the Name”; in verse 15 brothers and sisters are greeted “by name”; and the good shepherd “calls his own sheep by name” (John 10:3). With the Lord, every person has a name.</p><p>321 speaks of establishing God’s system. This verse reminds us that God’s system is not an organisation chart but a list of friends, full of names; and in 235, the “2” — the relationship of spiritual companions — also begins with remembering someone’s name.</p>"}]},"serm":{"1":{"min":18,"blocks":[["h","Fellow Workers for the Truth"],["p","Brothers and sisters, peace to you. This chapter is very short — only fifteen verses. Before we begin, I want you to look at two doors."],["p","This is an imagined scene; the text does not record these details. But what happens in this letter happened in front of two doors like these."],["q","Asia Minor. A city. The same evening."],["p","The first door is at the end of a cobbled lane."],["p","It is open. The lamps inside are still lit. On the table there is hot soup, and bread."],["p","A few strangers have just sat down. Dust on their sandals, packs on their backs. They have walked a long way."],["p","The host’s name is Gaius. He has never met these men before."],["q","The second door is on the other side of the city."],["p","It is where the church meets. A bigger building."],["p","A man stands at the door, holding a letter the elder has sent."],["p","He glances at it and puts it aside. Then he shuts the door."],["p","His name is Diotrephes."],["q","Let the picture stop on these two doors."],["p","Behind one door: lamplight, soup, the laughter of strangers."],["p","Behind the other: authority, a seat of honour, and a letter that was never read aloud."],["p","Today I want to ask you a question. Please don’t rush to answer it."],["q","Which door do you live behind?"],["p","Let me say this first: this letter is not given to us so that we can go looking for people."],["p","There are three people in it: Gaius, Diotrephes, Demetrius. They are like three mirrors."],["p","A mirror is for looking at yourself, not for pointing at someone else."],["p","In every one of us there lives a Gaius — and there lives a Diotrephes."],["p","This chapter has three words: walk, welcome, imitate."],["p","We will take three steps: truth walks on our feet; truth opens our door; and between the open door and the shut door."],["q","Step one: truth walks on our feet."],["q","“The elder to Gaius the beloved, whom I love in truth.” (1:1)"],["p","This is a letter to one person. The New Testament has few letters as personal as this."],["p","Where the Chinese Bible says “sincerely,” the Greek says: in truth."],["p","The first verse of 2 John says the same thing. When the elder loves people, he loves them in the truth."],["p","Who was Gaius? The New Testament has at least three men called Gaius. It was a very common name."],["p","Whether any of them is this man, we don’t know — and we don’t need to guess."],["p","We only know that he was a brother the elder called “beloved.”"],["q","“Beloved, I pray that you may prosper in all things and be healthy, even as your soul prospers.” (1:2)"],["p","The first “Beloved” is a prayer."],["p","This is probably the most quoted verse in the letter — and the most often preached wrongly."],["p","Some say: look, God wants every believer to be rich and healthy."],["p","Slow down."],["p","In those days, letters very often began with just this line: first of all, I pray that you are well and in good health."],["p","Many of the papyrus family letters dug up by archaeologists begin this way."],["p","“I pray” is a word of prayer in the Greek. This is a prayer, not a guarantee."],["p","But after this well-worn greeting, the elder adds something that is not well-worn at all."],["q","Even as your soul prospers."],["p","“Prosper” in the Greek means: travelling a good road, all going well."],["p","The elder means: may the road outside go as well for you as the road inside."],["p","The soul comes first."],["p","So if you are ill, or you live on very little, please do not hear this verse saying: your faith is not enough."],["p","Epaphroditus was so sick he nearly died. Trophimus was left ill at Miletus. Paul’s thorn was never taken away."],["p","What the Lord said to Paul was this:"],["q","“My grace is sufficient for you” (2 Cor 12:9)"],["p","But don’t swing to the other side and say that God cares only for the soul and not the body."],["p","The elder prays for Gaius’ health. We too can pray for one another’s health, work and livelihood."],["p","Only, first ask: is my soul prospering?"],["p","How did the elder know Gaius’ soul was prospering?"],["q","“For I rejoiced greatly when brothers came and testified about your truth, even as you walk in truth.” (1:3)"],["p","The elder did not live with Gaius. He heard it."],["p","People had passed by Gaius’ door and eaten at his table. They came back to the elder and told him — again and again."],["p","Where the Chinese Bible says “the truth kept in your heart,” the Greek says simply: your truth."],["p","When the truth came to Gaius, it took on Gaius’ shape."],["p","Then the elder adds: even as you walk in truth."],["p","The truth is first in the heart. Then it walks on the feet."],["p","We are very good at keeping the truth on the bookshelf, in our notes, on the pulpit."],["p","But when people come back to bear witness, they don’t talk about what is on your bookshelf. They talk about what happened at your front door."],["q","“I have no greater joy than this: to hear about my children walking in truth.” (1:4)"],["p","“No greater” — the Greek piles a comparative on top of a comparative. Something like: greater-than-greater."],["p","As if the elder could not find a word big enough to hold his joy."],["p","For an old spiritual father, the greatest joy is not a bigger ministry. It is children walking in the truth."],["p","But I know that some of you sitting here today are parents whose hearts are aching."],["p","Your child has not yet come to faith. Or once believed, and later walked away."],["p","Please hear this clearly: this verse is the elder’s joy, not a report card for parents."],["p","The elder says “hear.” Some joys take a long time to be heard."],["p","Not one of the tears you have shed for your child is wasted before God."],["p","What you can do is love them, live it out in front of them, and pray for them. The outcome is in God’s hands."],["p","Good news you have not heard yet is not the end of the story."],["p","Truth walks on our feet — and as it walks, it comes to a door."],["p","Someone is knocking. This time, it is someone we don’t know."],["q","Step two: truth opens our door."],["q","“Beloved, you do a faithful work in whatever you accomplish for those who are brothers and strangers.” (1:5)"],["p","The second “Beloved” is an affirmation."],["p","“Strangers” — the Greek word means people you don’t know. Gaius was not welcoming old friends."],["p","In that age there were no reliable inns for Christians to stay in. Preachers travelled from one stop to the next, depending on one opened door after another."],["p","The elder says: in doing this, you are being faithful."],["p","Hospitality is not an optional extra kindness. In God’s eyes, it is faithfulness."],["p","We tend to think faithfulness belongs to the pulpit, or to the prayer meeting."],["p","The elder says faithfulness is also a bowl of soup, a bed, opening the door to someone in the middle of the night."],["q","“They have testified about your love before the assembly” (1:6)"],["p","What you did in your own home, you never went out and talked about."],["p","Perhaps at a meeting where the elder was, someone stood up and said: this is how Gaius treated us."],["p","What you did behind closed doors, God’s household remembers."],["q","“You will do well to send them forward on their journey in a way worthy of God” (1:6)"],["p","“Send them forward on their journey” was a technical term in the early church: sending someone off."],["p","Food for the road, things they would need; perhaps someone to walk part of the way; a letter of introduction — so that they could reach the next stop."],["p","What is the standard? Worthy of God."],["p","Not worthy of my reputation, but worthy of the One who sent them out."],["q","“because for the sake of the Name they went out, taking nothing from the Gentiles.” (1:7)"],["p","Where the Chinese Bible says “the Lord’s name,” the Greek has just two words: the Name."],["p","The Name is the name of Jesus."],["p","There is one word here I want you to remember: went out."],["p","2 John says that many deceivers have “gone out” into the world. In the Greek it is the same word."],["p","Plenty of people go out. The difference is whose name they go out for."],["p","They took “nothing.” They did not hold out their hands for money from those who did not yet believe."],["p","In those days some philosophers travelled about and charged a fee for their speeches."],["p","These preachers refused to be taken for that kind of man. The gospel is not a business."],["p","But people still have to eat. So what then?"],["q","“We therefore ought to receive such, that we may be fellow workers for the truth.” (1:8)"],["p","“Ought” in the Greek is the word for owing a debt."],["p","God’s household owes these people a welcome."],["p","“Receive” in the Greek means to take someone up from underneath."],["p","The verse before says they don’t “take.” This verse says we must “take up.” In the Greek it is the same root."],["p","They take nothing from outside, so God’s household takes them up from underneath."],["p","The last phrase is: that we may be fellow workers for the truth."],["q","Fellow workers."],["p","The ones who welcome never stand in the pulpit, yet they work together with the ones who preach."],["p","The Greek can also be read: working together with the truth. The truth is our partner."],["p","This is the high point of the whole letter — and it is our title today."],["p","We are an online fellowship. People in many countries read the Bible together online every day."],["p","Missionaries and co-workers who carry the truth far away and online also need a group of people like Gaius: to pray for them, support them, introduce them to friends, and welcome them."],["p","I am not saying this for the person standing in this pulpit."],["p","So two things need to be said clearly."],["p","First, it is right for preachers to receive support from God’s household. The Lord said:"],["q","“the laborer is worthy of his wages” (Luke 10:7)"],["p","So don’t use “taking nothing” to shame preachers who receive support."],["p","Second, don’t use “ought to receive” to pressure people into giving."],["p","This “ought” is a privilege for God’s household — not a payment reminder."],["p","Those who give support are not sponsors. They are fellow workers."],["p","And the word “such” matters a great deal."],["p","Such people are those who went out for the sake of the Name, taking nothing, in a way worthy of God."],["p","The same elder says in 2 John:"],["q","“don’t receive him into your house” (2 John 1:10)"],["p","That was said about teachers who deny that Jesus Christ came in the flesh."],["p","2 John closes the door; 3 John opens it. The test is not whether we know someone, or whether we like them. It is whether they bring the one Christ."],["p","So welcoming calls for discernment. It does not mean giving without limit to everyone who knocks."],["p","But the open door is the rule. The shut door is the exception."],["p","Gaius’ order is very clear."],["p","First, walking in the truth — that is life. Then, his love was testified to — that is relationship. Finally, fellow workers for the truth — that is ministry."],["p","This reminds us: life first, then relationships, then ministry."],["p","If only the letter stopped here."],["p","But what the elder writes next is that second door."],["q","Step three: between the open door and the shut door."],["q","“I wrote to the assembly, but Diotrephes, who loves to be first among them, doesn’t accept what we say.” (1:9)"],["p","Where the Chinese Bible has “I wrote a little,” the elder had written to that church. That letter was probably never read out."],["p","Which letter was it? Scholars differ, and we don’t need to settle it here."],["p","Beside Diotrephes’ name there are only a few words: loves to be first."],["p","In the Greek it is one word, found only here in the New Testament. Loving to be first. Loving the top seat."],["p","The text does not say he preached false doctrine."],["p","His problem was not in his head. It was in his heart."],["p","He left a servant’s proper place and tried to grasp the first place that belongs only to Christ."],["p","Paul says of Christ:"],["q","“that in all things he might have the preeminence” (Col 1:18)"],["p","“Have the preeminence” and “loves to be first” share the same root in the Greek."],["p","There is only one chair at the head. That chair is the Lord’s."],["p","This reminds us of what we often say: pride is leaving our proper place and grasping power."],["q","“Therefore if I come, I will call attention to his deeds which he does, unjustly accusing us with wicked words.” (1:10)"],["p","Where the Chinese Bible says “talks nonsense against us,” the Greek uses another word found only once in the New Testament: babbling, saying things without foundation."],["q","“Not content with this, neither does he himself receive the brothers, and those who would, he forbids and throws out of the assembly.” (1:10)"],["p","Wicked words. Not receiving. Forbidding. Throwing out. Four things, each heavier than the last."],["p","The last is the bitterest irony: the people who opened their doors are thrown out of the door."],["p","Pride is never content. A self-centred life very often ends up as a locked door."],["p","This is the lowest point of the whole letter."],["p","Now, please turn the mirror around."],["p","I am not asking you to think: who in our church is like Diotrephes? This letter does not give us the right to name names."],["p","I am asking you to ask: is there someone inside me who wants the top seat?"],["p","An idea someone else suggests — because it wasn’t mine, I block it."],["p","Someone new does better than I do, and something in me doesn’t like it."],["p","Someone in the group chat wants to introduce a new friend, and I just don’t reply, and let it go cold."],["p","Diotrephes is not someone far away. Very often he lives in our own hearts."],["p","So how did the elder respond?"],["p","He did not answer insult with insult, and he did not rally Gaius to go after him. He simply wrote down the facts, and then said: if I come."],["p","In person, in the church, he would bring Diotrephes’ deeds into the open."],["p","This reminds us of the order the Lord taught: first go to him alone, then take one or two others, then tell the church."],["p","So this verse is no licence to expose people online, and no excuse to form factions in secret."],["p","But if you have been pushed out by someone abusing their power, or thrown out, please hear this too: you don’t have to suffer it in silence."],["p","The elder did not tell Gaius to keep quiet. You can go to a pastor or a mature believer you trust, and go through the proper process to bring things into the light."],["p","You don’t have to face the one who hurt you alone first. Find a pastor or a church leader you trust to go with you."],["p","If something illegal is involved, going to the police or seeking legal help is not unspiritual."],["p","Then the elder does something beautiful. He turns and says to Gaius:"],["q","“Beloved, don’t imitate that which is evil, but that which is good.” (1:11)"],["p","The third “Beloved” is an exhortation. The most direct command in the whole letter still comes after the tenderest form of address."],["p","The elder does not say: Gaius, go and fight him."],["p","He says: don’t become him."],["p","Pride against pride, and both sides lose. Humility leads to humility, and both sides win."],["p","The best way to deal with someone who loves to be first is not to fight for first place yourself. It is to keep being someone who opens the door."],["p","“Imitate” in the Greek is present tense. Every day we are choosing: today, whom will I learn from?"],["q","“He who does good is of God. He who does evil hasn’t seen God.” (1:11)"],["p","Some hear this and are afraid: I fell only yesterday — does that mean I have never seen God?"],["p","Here, too, the Greek speaks of something ongoing. It is about the direction a person’s whole life takes, not a verdict on one fall."],["p","Our assurance does not rest on whether we have done enough. It rests on Christ, who gave his life for us."],["p","But remember this too: someone who has truly seen God will find their door slowly opening."],["q","“Demetrius has the testimony of all, and of the truth itself; yes, we also testify, and you know that our testimony is true.” (1:12)"],["p","The Chinese Bible adds the words “does good” before Demetrius. The Greek says only: Demetrius has already been testified to by everyone."],["p","Demetrius was very probably the one carrying this letter — perhaps at this very moment on his way to Gaius’ house."],["p","A threefold testimony: everyone, the truth, the elder."],["p","The most remarkable is the one in the middle: the truth itself bears witness to him."],["p","His life matches the truth, so the truth speaks up for him."],["p","Diotrephes holds a seat. Demetrius carries a testimony."],["p","In the end, people don’t remember who sat in the top seat. They remember whose life the truth spoke for."],["q","“I had many things to write to you, but I am unwilling to write to you with ink and pen;” (1:13)"],["q","“but I hope to see you soon. Then we will speak face to face.” (1:14)"],["p","“Face to face” — the Greek says: mouth to mouth. Just like the ending of 2 John."],["p","We are an online fellowship. Hearing this, some of you may feel a tightness inside: does what we do count?"],["p","Look at what the elder himself is doing. He is shepherding Gaius with ink and pen."],["p","This letter is itself pastoral care at a distance."],["q","Ink and pen are a bridge, not second best."],["p","Those who cannot be there because of illness, work or distance have not received less of the truth."],["p","Face to face is a hope and an invitation, not a barrier."],["q","“Peace be to you. The friends greet you. Greet the friends by name.” (1:15)"],["p","Peace be to you. This reminds us that after the Lord rose, in a room with the doors locked, the first thing he said to the disciples was also “Peace be to you” (John 20:19)."],["p","The last sentence of John’s letters rests on two words: friends, and name."],["p","The Lord said:"],["q","“I have called you friends” (John 15:15)"],["p","And the elder says: by name. Greet them one by one."],["p","This reminds us of the Good Shepherd:"],["q","“He calls his own sheep by name” (John 10:3)"],["p","In verse 7, they went out for the sake of the Name. In verse 15, every one of them is remembered by name."],["p","God’s system is people, one by one, called by name — and joined together."],["q","Let’s look once more at those two doors."],["p","The meeting-house door is still shut. But the door at the end of the lane — its light has stayed on."],["p","Demetrius, letter in hand, knocks. Gaius opens the door, just as he always does."],["p","Brothers and sisters, when you finish this letter, please don’t remember Diotrephes more, and don’t admire the elder’s skill more."],["p","Remember the One more."],["p","The first place is his. Yet he did not stay seated there."],["p","He came from heaven, and even counted himself among the strangers: “I was a stranger, and you took me in” (Matt 25:35)."],["p","He also said: I have given you an example."],["p","The Lord said:"],["q","“Whoever of you wants to become first among you, shall be bondservant of all” (Mark 10:44)"],["p","To let Jesus be King is to give that chair back to him, and go and be a servant yourself."],["p","So today — which door do you live behind?"],["p","This week, think about it: who is someone you could welcome, take up, and work alongside?"],["p","Whose name have you not spoken for a long time?"],["p","Perhaps a preacher serving far away. Perhaps a friend who hasn’t come to the fellowship in a long while. Perhaps your own child."],["p","With the Lord, every one of us has a name."],["p","Make a phone call. Say one sentence: I remember you."],["p","Let us bow our heads together and pray."]]}},"issues":[{"id":"ISS00_1","t":"Author, recipient and setting: who are the elder, Gaius, Diotrephes and Demetrius?","r":"1:1; 1:9–12; Rom 16:23","ch":[],"why":"1. One elder, one friend, and a door that has been shut — position 1 of these notes for the whole book (carrying over the 1 John Study Notes’ issue “Author, date and setting: who wrote it, and in what circumstances?”; this volume adds to it). Third John has only fifteen verses, yet it names three people: Gaius, who receives the letter; Diotrephes, who loves to be first in the church; and Demetrius, who has the testimony of all. The writer still calls himself only “the elder.” If we do not settle at the outset who these people are and what situation the letter falls into, the whole book is easily preached off course: some will research Gaius into one particular co-worker of Paul, as if it had to be so; some will treat Diotrephes as the villain of a story and match him to someone they know; and many more, not seeing how first-century itinerant preachers moved forward one stop at a time, carried by believers’ homes, will not understand why “receiving” is the heart of this letter.","pos":[["[1] What the text is asking","","<p>The opening of the letter follows almost the same pattern as 2 John: “The elder to Gaius the beloved, whom I love in truth.” (1:1) The Greek Ὁ πρεσβύτερος has the article — “the elder”: the reader knew at a glance who was meant; no name was needed, and he does not call himself an apostle. Γάϊος, the recipient, was an extremely common name in the Roman world. Two more names appear in the letter: “Diotrephes, who loves to be first among them” (1:9), and “Demetrius has the testimony of all” (1:12) — the Chinese Union Version adds the words ‘does good’ for Demetrius in small type; the Greek simply says that concerning Demetrius testimony has been given by all.</p><p>The skeleton of the letter is a road: brothers have come back from Gaius and reported that he walks “in truth” (1:3); these brothers are itinerant preachers who “for the sake of the Name … went out” (1:7), and the elder asks Gaius “to send them forward on their journey” (1:6). On the other hand, the elder once “wrote to the assembly” (1:9), but Diotrephes would not receive him. <strong>The text asks: who is the elder who writes? Who is Gaius? What kind of men are Diotrephes and Demetrius? Into what kind of church situation does this letter fall?</strong></p>"],["The apostle John view (the elder is John the son of Zebedee)","","<p>From the second century onward, 1 John was generally attributed to the apostle John (Irenaeus and others); 2 John was already being quoted in the second century, while the early witness to 3 John is thinner. By the fourth century, church tradition generally attributed all three letters to the apostle John. The vocabulary of the three letters is very close to that of John’s Gospel — “truth,” “love,” “testify,” “walk in truth”; verse 12, “you know that our testimony is true” (1:12), is almost the sentence at the end of John’s Gospel: “We know that his witness is true” (John 21:24). It is not strange for an apostle in old age to call himself “elder”: Peter, too, calls himself “a fellow elder” (1 Pet 5:1). The strength of this view is that it has early tradition and internal evidence behind it, and it explains why the elder speaks to a church with such weight — when he says “if I come” (1:10), things will be dealt with.</p><p><strong>Difficulty:</strong> the letter never calls its writer an apostle; and Diotrephes dared to refuse “what we say” (1:9) — so some ask: if this elder was one of the Twelve, how could a local leader dare to treat him this way? Yet Paul, an apostle, was also looked down on and challenged in Corinth; authority being resisted does not mean the authority does not exist.</p>"],["The John the Elder view (the other John mentioned by Papias)","","<p>In the fourth century, Eusebius (Ecclesiastical History 3.39) quotes a passage from the second-century writer Papias that mentions, besides the apostle John, a “John the Elder.” On this basis some scholars argue that the author of 2 and 3 John was this John the Elder, a disciple of the apostle and a respected pastor in the region of Ephesus. The strength of this view is that it explains the self-designation “the elder,” and also why the early church hesitated for a time over the authorship of 2 and 3 John.</p><p><strong>Difficulty:</strong> Papias’ passage can itself be read as speaking of two men, or of one man mentioned twice; and the vocabulary and theology of the three letters run in a single line with John’s Gospel, so forcing them apart into two authors means explaining a great many more similarities.</p>"],["The Johannine community view (one leader, one circle)","","<p>Some modern scholars see John’s Gospel and the three letters as the work of a “Johannine community”: a circle that traced itself back to the apostle John and moved between several churches in Asia Minor, with a leader called “the elder” writing its letters. The strength of this view is that it sees the network inside the letter: the elder’s church, Gaius’ home, Diotrephes’ church, the travelling brothers coming and going, Demetrius carrying the letter, and at the end “the friends” (1:15) — a group of people who knew one another and bore witness to one another.</p><p><strong>Difficulty:</strong> “community” is a reconstructed model that the text does not state directly; it easily moves the focus from one witness to an invisible group.</p>"],["Gaius, Diotrephes and Demetrius (some guesses about three names)","","<p><strong>Gaius</strong>: the New Testament has at least Gaius of Macedonia (Acts 19:29), Gaius of Derbe (Acts 20:4), and the Corinthian — “Gaius, my host and host of the whole assembly” (Rom 16:23) — probably the same one whom Paul baptised (1 Cor 1:14). The Corinthian Gaius was also known for hospitality, which easily brings 3 John to mind; but the time and place are far apart, and the name is too common. The later Apostolic Constitutions say that John appointed Gaius bishop of Pergamum; this is a fourth-century tradition. <strong>Diotrephes</strong>: the name means “nourished by Zeus”; it is not a common name and is found mostly in families of standing. In that church he “loves to be first” (1:9), holds real power, and can throw people “out of the assembly” (1:10). <strong>Demetrius</strong>: very probably the man who carried this letter, or one of the next group of travelling preachers to reach Gaius’ home. The silversmith Demetrius of Ephesus who made silver shrines of Artemis (Acts 19:24) — whose name the Chinese Union Version spells differently — being the same man is only a guess.</p><p><strong>Difficulty:</strong> all three names may have more of a story behind them, but the text gives us only what it means to give: Gaius’ door is open, Diotrephes shuts the door, and Demetrius has the truth as his witness. The livelier the research becomes, the easier it is to forget that a mirror is for looking at yourself.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: on authorship we carry over the 1 John Study Notes — the apostle John, with the John the Elder view and the Johannine community view set out alongside; from the pulpit either “the elder says” or “John says” is fine. On who Gaius was, the three possibilities are set side by side with no verdict; from the pulpit we say only “a brother named Gaius.”</strong></p><p>The setting must be laid out first. In first-century Asia Minor (tradition: the region of Ephesus, about AD 85–95), the gospel spread one stop at a time through itinerant preachers; there were no reliable inns for Christians to stay in, and preachers depended on believers’ homes for food and lodging, for provisions for the road and for letters of introduction. προπέμψας, “to send them forward on their journey,” is a technical term of the early church: “being sent on their way by the assembly” (Acts 15:3), “to be helped on my way there by you” (Rom 15:24), “Send Zenas, the lawyer, and Apollos on their journey speedily, that nothing may be lacking for them” (Titus 3:13). The elder’s letter to the church was most likely suppressed by Diotrephes; so the elder wrote to Gaius instead, very probably sending it with Demetrius.</p><p><strong>This letter and 2 John belong together.</strong> Second John is written to a household, telling her not to give a teacher who denies Christ a platform (2 John 10); 3 John is written to a friend, telling him to go on receiving the brothers who went out for the sake of the Name (1:8), and rebuking the one who shut the door (1:10). The same elder, the same standard: whether the door opens or closes depends on the one Christ.</p>"],["[4] Should this affect your faith?","","<p>Not knowing which Gaius this was, or whether the elder was the apostle John or another John, does not lessen the weight of this letter. The early church did not keep this short letter because it tells an anecdote about a famous person, but because it describes a kind of life very clearly: a person who walks in truth will open his door; a person who loves to be first will shut the church’s door.</p><p>The question to ask yourself is this: <strong>if the elder wrote to me today, what would he call me in his letter?</strong> “Beloved,” “walking in truth,” “you do a faithful work” — or someone whose “deeds” must be called to attention? We do not need to know Gaius’ life story, but every one of us will be written into some letter.</p>"]],"con":[],"say":"Where these notes stand for the whole book: on authorship we carry over the 1 John Study Notes (the apostle John; with the John the Elder view and the Johannine community view set out alongside). On who Gaius was, three readings are set side by side with no verdict; Diotrephes and Demetrius are presented only as the text presents them, with nothing added. The setting is itinerant preachers who were received and sent on their way by believers’ homes (Acts 15:3; Rom 15:24; Titus 3:13); this volume and 2 John belong together: 2 John closes the door and 3 John opens it, and in both the standard is the one Christ.","care":"In the pews there will be brothers and sisters who open their homes to others and feel that no one notices; there will also be people who were once pushed aside by a church leader and think of a particular person the moment they hear the name “Diotrephes.” When pastors preach on these three people, let those who open their doors be affirmed and those who have been hurt be comforted — but do not, from the pulpit, compare any real person to Diotrephes; and do not turn the research on the author and on Gaius into a threshold for faith. The congregation does not need to remember Papias; they only need to remember to be people who open their doors."},{"id":"ISS00_2","t":"Prospering and the soul: is “prosper in all things and be healthy” a promise from God?","r":"1:2; Phil 2:27; 2 Tim 4:20; 2 Cor 12:9","ch":[],"why":"2. A prayer, not a contract — position 2 of these notes for the whole book (newly established in this volume). “I pray that you may prosper in all things and be healthy” may be the most quoted — and the most misused — greeting in the whole New Testament. It is printed on cards and stuck on shop doors, and some pulpits use it as proof that “God promises every believer wealth and health”; on the other hand, some people, to steer clear of prosperity teaching, simply skip the verse, as if God cared only for the soul and not for the body. Both ways of preaching it wound people: the first leaves faithful brothers and sisters who are chronically ill or poor thinking their faith is not enough; the second leaves those struggling with their bodies and their livelihoods feeling that God does not care. This question must be settled at the outset: what this sentence was in the first century, and what John changed in it.","pos":[["[1] What the text is asking","","<p>The text says: “Beloved, I pray that you may prosper in all things and be healthy, even as your soul prospers.” (1:2) εὔχομαι, “I pray,” means to pray, to wish; εὐοδοῦσθαι, “prosper,” literally means “to have a good journey, to travel on a good road” (εὖ “good” + ὁδός “road”). The New Testament uses it again when Paul asks that “now at last I may be prospered by the will of God to come to you” (Rom 1:10), and for setting money aside week by week, “as he may prosper” (1 Cor 16:2); ὑγιαίνειν, “be healthy,” means bodily health. The second half, καθὼς εὐοδοῦταί σου ἡ ψυχή, “even as your soul prospers,” is explained by the “For” of the next verse — how the elder knew: brothers came and testified that Gaius walks “in truth” (1:3).</p><p><strong>The text asks: is this a promise God makes to all believers, or the elder’s prayer for a friend? Does “prosper in all things” include wealth? Is “even as your soul” a condition, a comparison or a standard?</strong></p>"],["The promise view (God promises every believer prosperity and health)","","<p>The “Word of Faith” and prosperity-teaching movements that arose in the twentieth century often use this verse as a core text: since the elder “prays” that Gaius may prosper in all things and be healthy, God’s will is for every believer to be wealthy and healthy; if they are not yet, it is because their faith, their declarations or their giving are not enough. The strength of this view is the reminder that God is not a God who cares only for the soul: he made the body and provides daily bread, and believers may ask him for health and a livelihood.</p><p><strong>Difficulty:</strong> this verse is one person’s prayer for another, not a contract God has signed; drawing from it the conclusion that “all who are not wealthy and healthy lack faith” turns a blessing into a report card. The New Testament is full of faithful saints who were ill: Epaphroditus “was sick, nearly to death” (Phil 2:27); Paul says, “I left Trophimus at Miletus sick” (2 Tim 4:20); the thorn in Paul’s flesh was not removed, yet the Lord said to him, “My grace is sufficient for you” (2 Cor 12:9). Read this verse as a promise, and these passages make no sense.</p>"],["The formality view (just the standard opening of a letter, nothing to expound)","","<p>Another view reads it in the light of ancient letter-writing: many papyrus family letters unearthed in Egypt open with a greeting such as “Before all things I pray that you are in good health” — rather like today’s “How have you been?” or “Wishing you good health.” So verse 2 is mere courtesy with no theological content, and the pulpit can pass over it. The strength of this view is that it reads the setting: the elder is not issuing a doctrine but writing a real letter.</p><p><strong>Difficulty:</strong> it sees the formula but misses that the elder changed the formula. An ordinary letter says only “I pray that you are in good health”; John adds “even as your soul prospers” — outward wellbeing is to be “even as” inward wellbeing. And the first real content of the whole letter is the elder praying for a friend; skip this verse and you skip the elder’s heart.</p>"],["The soul-as-standard view (the prayer is real; the standard is the soul)","","<p>The third view holds on to both sides: verse 2 really is the letter formula, and it really is a sincere prayer; but John has added a standard to the formula — “even as your soul prospers.” The elder knows that Gaius’ soul is prospering, because he walks “in truth” (1:3); so he asks God to let the wellbeing of Gaius’ body and days keep pace with the wellbeing of his soul. The order puts the soul first: the prospering of the soul is something known for certain; outward prospering is something asked for. The strength of this view is that it neither turns a prayer into a contract nor treats the body as unimportant.</p><p><strong>Difficulty:</strong> ψυχή, “soul,” in the New Testament often refers to a person’s whole life, not only to a “spirit” set against the body; when presenting this view, take care not to make it say “the body doesn’t matter, only the soul does” — the elder clearly prays for Gaius’ body too.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we take the soul-as-standard view — verse 2 is a greeting and a prayer, not a promise; John changed the letter formula into “even as your soul prospers,” putting the soul first. God cares about the body, but God does not owe us a contract of wealth and health.</strong></p><p><strong>Does “prosper in all things” include wealth?</strong> περὶ πάντων is rendered “in all things” (Chinese Union Version: “in everything”); a good number of commentators think it corresponds to the letter formula πρὸ πάντων, “above all, most important” — the elder is saying “first of all I pray for you,” not “I want you to flourish in everything.” Even if it is read “in all things,” it is still a prayer: the elder prays for Gaius’ livelihood, for his strength to keep welcoming guests and for all his days, and God is glad to hear such prayers; but the text does not promise that every believer will become wealthy, still less does it measure faith by wealth.</p><p>Three things must be said clearly from the pulpit. First, we may pray this way for one another: the elder prayed for Gaius’ body, and we too may ask God for our brothers’ and sisters’ illnesses, work and livelihoods; God saw “everything that he had made, and, behold, it was very good” (Gen 1:31), and the body is not second-class. Second, we must not turn a prayer into a contract: to say “if your faith is enough you will be healthy” or “you are ill because your faith is not enough” is to put the lie of prosperity teaching into an elder’s prayer. Third, see the order: the elder first knows for certain that Gaius’ soul is prospering, and then asks for outward wellbeing to catch up — a person may prosper outwardly in everything while his soul is dry; or he may be weak in body, with hard days, while his soul is prospering.</p><p>321 says change your viewpoint: <strong>from the world’s viewpoint to God’s viewpoint</strong> — the world measures a person by outward success; the elder measures a person by walking “in truth.”</p>"],["[4] Should this affect your faith?","","<p>If you have kept praying and your illness has not gone, or your work has not picked up, do not doubt that God loves you just because someone uses this verse to tell you, “Your faith isn’t enough.” Epaphroditus, Trophimus and Paul all went through this. God’s grace is made perfect in weakness; he has not left the sickbed, nor has he left the person who has lost a job.</p><p>If your days are going well, ask yourself as well: <strong>are my body and my career running ahead of my soul?</strong> The elder prayed that Gaius’ outward life would be “even as” his soul; some of us need to pray the other way round — Lord, let my soul catch up with my house, my position, my bank account.</p>"]],"con":[],"say":"Where these notes stand for the whole book: verse 2 is the greeting and prayer of an ancient letter (εὔχομαι), not a promise that God will make every believer wealthy and healthy; John changed the formula into “even as your soul prospers” — the soul comes first. God cares about the body, and we may pray for health and livelihood; but we do not teach prosperity theology, and we do not say that illness or poverty means a lack of faith (Phil 2:27; 2 Tim 4:20; 2 Cor 12:9).","care":"In the pews there will be brothers and sisters who have been ill for years and still pray every day; people who have just lost their jobs, or whose small businesses keep struggling to survive; and people who were hurt in another church when they were told, “You’re ill because your faith isn’t enough.” When pastors preach this verse, let them first hear the elder’s tenderness: he prayed for his friend’s body. Do not say from the pulpit, “If your faith is enough you will get better,” and do not link illness or poverty to any person’s sin; if someone is ill right now, invite the church to pray for them, visit them and help them in practical ways — that is the heart of verse 2."},{"id":"ISS00_3","t":"Opening the door and closing it: what is the standard for hospitality in 2 John and 3 John?","r":"1:5–10; 2 John 1:10–11; Luke 10:7; 1 Cor 9:14","ch":[],"why":"3. The same elder: one letter tells people to close the door, another tells them to open it — position 3 of these notes for the whole book (newly established in this volume, following on from the 2 John Study Notes’ issue “Welcome, greeting and boundaries: what did verses 10–11 mean in the first century, and how should we apply them today?”). Second John says, “don’t receive him into your house”; 3 John says, “We therefore ought to receive such.” Read only 2 John, and a church easily becomes suspicious and closed; read only 3 John, and a church easily opens its purse and its pulpit to anyone who claims to be a preacher, and may even be exploited. The deeper danger is Diotrephes’ way: using power to decide who may come through the door. This question must read the two letters together, settle the standard for opening and closing the door, and also settle both the rightness and the limits of God’s household supporting its preachers.","pos":[["[1] What the text is asking","","<p>Second John says: “If anyone comes to you, and doesn’t bring this teaching, don’t receive him into your house, and don’t welcome him,” (2 John 10) Third John says: “because for the sake of the Name they went out, taking nothing from the Gentiles.” (1:7) “We therefore ought to receive such, that we may be fellow workers for the truth.” (1:8) And of Diotrephes it says, “neither does he himself receive the brothers, and those who would, he forbids and throws out of the assembly” (1:10).</p><p>The two letters use the same verb, “went out”: 2 John says, “many deceivers have gone out into the world” (2 John 7), and 3 John says these brothers “for the sake of the Name … went out” (1:7) — in the Greek both are ἐξῆλθον (SBLGNT; the Byzantine manuscripts, RP, read εἰσῆλθον, “entered,” in 2 John 7). Many people go out; some go out for the Name, some to deceive. <strong>The text asks: what is the standard for opening and closing the door? Who are “such” people? What does receiving include — a meal, a bed, a pulpit, money for the road? And where does it land today?</strong></p>"],["The relationship view (receive those we know and trust)","","<p>The most natural approach is to look at the relationship: receive those we know, those someone has introduced, those we get on with; be careful with strangers. The strength of this view is that it is practical: the travelling brothers of the first century mostly carried letters of introduction (this reminds us of Acts 18:27, where the brothers “wrote to the disciples to receive him,” and of Rom 16:1–2, where Paul commends Phoebe), and in verse 12 the elder bears witness to Demetrius — in effect, a letter of recommendation.</p><p><strong>Difficulty:</strong> the people Gaius received were precisely strangers — “you do a faithful work in whatever you accomplish for those who are brothers and strangers” (1:5); the Greek says “and that, strangers” — he did not know them. If we look only at relationships, Gaius’ faithfulness would not count; and a church that receives only its own people soon becomes a small clique.</p>"],["The authority view (church leaders decide who may come in)","","<p>Another view holds that, to protect the congregation, who may stand in the pulpit, who may stay in believers’ homes and who may raise funds should be decided centrally by church leaders. The strength of this view is that it takes pastoral responsibility seriously: Paul, too, told Titus that the mouths of some “must be stopped: men who overthrow whole houses, teaching things which they ought not, for dishonest gain’s sake” (Titus 1:11).</p><p><strong>Difficulty:</strong> this is exactly what Diotrephes did — he had authority, but he used it to keep out the people the elder sent, to forbid the brothers from receiving them, and to throw out those who opened their doors. Authority itself is not the problem; the problem is what standard the authority uses. If the standard is “will this threaten my position?”, guarding the door becomes seizing it.</p>"],["The Christ-as-standard view (do they bring the one Christ?)","","<p>The third view reads the two letters together: the standard for closing the door is 2 John’s “doesn’t bring this teaching” — not confessing that Jesus Christ came in the flesh (2 John 1:7); the standard for opening it is 3 John’s “for the sake of the Name,” “worthy of God,” “taking nothing” (1:6–7). The early church set rules in the same direction: the Didache, chapters 11–12, says that a travelling apostle is to be received as the Lord, but is to stay only one day, two if necessary; if he stays three days, or asks for money, he is a false prophet; a brother passing through is to be helped, but if he wants to settle he must work. Receiving on one hand, discerning on the other. The strength of this view is that it puts opening and closing the door on the same measuring line — and that measure is Christ.</p><p><strong>Difficulty:</strong> “do they bring Christ?” requires the church to work hard at the truth, and it takes time to observe a life; it cannot be reduced to a checklist, nor left to any one person to decide.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we take the Christ-as-standard view — 2 John closes the door and 3 John opens it; the standard is not whether we know someone or like them, nor who holds power, but whether the one who comes brings the one Christ. Opening the door is the norm; closing it is the exception; a church that only knows how to close the door has set out on Diotrephes’ road.</strong></p><p>“Such” people (1:8) bear three marks: they go out for the Name, not for their own name; they take “nothing from the Gentiles” — the gospel is not a business; and they are to be sent forward “in a way worthy of God” — the standard is the One who sends them. Those who receive them are therefore not sponsors but fellow workers: “that we may be fellow workers for the truth” (1:8).</p><p><strong>Supporting preachers is right.</strong> The Lord said, “the laborer is worthy of his wages” (Luke 10:7); Paul says, “Even so the Lord ordained that those who proclaim the Good News should live from the Good News” (1 Cor 9:14), and, “let him who is taught in the word share all good things with him who teaches” (Gal 6:6). So we must not shame preachers who receive support from God’s household. But “ought” (ὀφείλομεν) is a privilege of God’s household, not a payment demand: verse 8 must not be used to manipulate giving or to manufacture guilt; nor is it without limits or discernment — this verse does not say that everyone who knocks at the door must be supported; the question is whether they went out for the Name.</p>"],["[4] Should this affect your faith?","","<p>Churches differ in how they receive and support preachers, and this should not shake your faith. Every view agrees that God’s household is to receive those who work for the Lord, and also to discern those who use the gospel for gain (this reminds us of 2 Pet 2:3).</p><p>But ask yourself: <strong>my home, my purse, my share button — whom do they open for, and whom do they close on?</strong> Kingdom 321 Online Fellowship passes on the truth online, and it too needs a group of “Gaiuses” — to pray for its co-workers, support them, connect them and welcome them. At the same time, when we see someone using the Lord’s name to extract money from brothers and sisters, we should raise it through proper channels, not share it on and not endorse it. Opening the door and closing it are both for that One.</p>"]],"con":[],"say":"Where these notes stand for the whole book: 2 John closes the door and 3 John opens it; the standard is neither relationships nor power, but whether the one who comes brings the one Christ; opening the door is the norm, closing it the exception. “Such” people are those who go out for the Name, take nothing and are sent on in a way worthy of God; those who receive them are fellow workers (1:8). Supporting preachers is right (Luke 10:7; 1 Cor 9:14; Gal 6:6) — they must not be shamed, and verse 8 must not be used to manipulate giving; receiving requires discernment, not unlimited support without discernment. Read together with the 2 John Study Notes’ issue “Welcome, greeting and boundaries: what did verses 10–11 mean in the first century, and how should we apply them today?”.","care":"In the pews there will be brothers and sisters who have opened their homes for years and have been exploited and grown cold; co-workers in ministry who live on the congregation’s support and feel ashamed whenever they hear “preachers want money”; and people who were once pressured into giving and tense up the moment they hear the word “ought.” Pastors must protect all three at once: affirm the faithfulness of those who open their homes, acknowledge the wound of those who were exploited, let preachers receive support with dignity, and let giving return to being willing. Do not name any preacher or organisation from the pulpit, and do not turn verse 8 into a payment demand."},{"id":"ISS00_4","t":"“Loves to be first”: how do we tell church authority from spiritual abuse?","r":"1:9–10; 1:11; Matt 18:15–17; Mark 10:44","ch":[],"why":"4. The problem is not in the head but in the heart — position 4 of these notes for the whole book (newly established in this volume). Diotrephes is one of the few church leaders in the New Testament criticised by name, and his problem is written right beside his name: he “loves to be first.” These two verses are most easily preached in two wrong ways: one uses Diotrephes as a weapon, insinuating from the pulpit or online that he stands for a certain pastor or church; the other, to uphold authority, calls every reminder to a leader “rebellion” and tells those who have been abused or thrown out to suffer in silence. This question must settle where Diotrephes went wrong, how the elder responded, how today’s church can tell authority from abuse of authority — and it must turn the mirror on ourselves.","pos":[["[1] What the text is asking","","<p>The text says: “I wrote to the assembly, but Diotrephes, who loves to be first among them, doesn’t accept what we say.” (1:9) φιλοπρωτεύων, “loves to be first,” occurs only here in the New Testament; it is formed from φίλος, “love,” and πρῶτος, “first”: loving to be first, loving the top seat; it is a present participle — this is what he is like, not a momentary lapse. Then come four things: “unjustly accusing us with wicked words,” “neither does he himself receive the brothers,” “those who would, he forbids,” and he “throws out of the assembly” (1:10). The elder’s response is: “Therefore if I come, I will call attention to his deeds which he does” (1:10), and then he immediately says to Gaius: “don’t imitate that which is evil, but that which is good.” (1:11)</p><p><strong>The text asks: is Diotrephes’ problem doctrine or character? What kind of dealing is the elder’s “call attention”? How can today’s church tell real authority from spiritual abuse? What should those who have been thrown out do?</strong></p>"],["The heresy view (Diotrephes taught false doctrine)","","<p>Some commentators read 3 John straight after 2 John: 2 John warns against deceiving teachers, so Diotrephes in 3 John was probably one of that party, which is why he rejected the elder and the brothers the elder sent. The strength of this view is that it links the two letters, and reminds us that false teaching is often bound up with power.</p><p><strong>Difficulty:</strong> the text does not say a single word against Diotrephes’ doctrine. In 2 John the elder speaks very plainly about those who deny Christ (2 John 1:7); if Diotrephes were one of them, the elder could simply have said so; yet 3 John says only that he “loves to be first,” gossips, refuses to receive and throws people out. To call him a heretic is to add a charge to the text.</p>"],["The power-struggle view (a leader resisting the apostle and seizing control of the local church)","","<p>Most commentators think Diotrephes was the man with real power in that church, who would not acknowledge the elder’s authority and wanted to make the church a place where he alone decided. ἐπιδέχεται, “doesn’t accept,” can also mean not acknowledging someone’s authority; he suppressed the elder’s letter and kept out the people the elder sent. The strength of this view is that it stays close to the text: the problem is power and character, not doctrine.</p><p><strong>Difficulty:</strong> if it is seen only as a power struggle, it is easy to present the elder and Diotrephes as two men fighting over a seat, as if whoever wins is right; in fact the elder did not answer with the same tactics, and his response is itself the contrast to Diotrephes.</p>"],["The institutional-transition view (tension between travelling apostles and local overseers)","","<p>A social-historical reading holds that at the end of the first century the church was moving from leadership by travelling apostles and prophets to leadership by local elders and overseers; Diotrephes may represent an early “single overseer” model and have felt that travellers from outside were interfering with the local church. The strength of this view is the reminder that church structures change, that there is real tension between different styles of leadership, and that not every conflict is a battle between good and evil.</p><p><strong>Difficulty:</strong> a change of structure can explain tension, but it cannot excuse “unjustly accusing us with wicked words” and throwing people out of the church; the elder does not say, “Your system is wrong,” but speaks of “his deeds which he does.”</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: the text’s only description of Diotrephes is that he “loves to be first” — his problem is not in his head but in his heart; not a problem of doctrine but of life. Church authority is real, and abuse of authority is real too; the test is not how high the position is, but whether the position is used to open doors or to close them.</strong></p><p>This is exactly what 321 says: <strong>pride is leaving our proper place and grasping power</strong> — leaving the place proper to a human being and grasping the power that belongs to God. In the church, that means taking the first place that belongs to Christ alone: “that in all things he might have the preeminence” (Col 1:18); πρωτεύων and φιλοπρωτεύων share the same root. The Lord said just the opposite: “Whoever of you wants to become first among you, shall be bondservant of all.” (Mark 10:44)</p><p><strong>The elder’s response bears three marks.</strong> First, in person: “if I come” — not firing shots from a distance, not exposing someone online. Second, within the church and through proper process: he will “call attention to his deeds”; ὑπομνήσω means to bring to remembrance, to set out the facts. This reminds us of the Lord’s teaching — first in private, then with one or two others, then tell the church (Matt 18:15–17) — and also of “Don’t receive an accusation against an elder, except at the word of two or three witnesses” (1 Tim 5:19). Third, not repaying evil with evil: the elder does not answer “wicked words” with wicked words, nor does he tell Gaius to fight Diotrephes for first place; he says only, “but that which is good” (1:11). So those who are abused, pushed aside or thrown out today need not suffer in silence; they may seek help, through proper process, from the wider church, from trusted spiritual elders; but they should not deal with it by exposing, putting on trial by social media or forming factions — that would only be another Diotrephes.</p>"],["[4] Should this affect your faith?","","<p>A Diotrephes appearing in a church does not mean the church is false, nor that the faith is false. There was one in the elder’s day; he did not leave the church because of it, nor did he tell Gaius to leave; he committed the matter to “if I come,” and turned his friend’s eyes towards the good.</p><p>Even more, ask yourself: <strong>what does the Diotrephes in me look like?</strong> Do I also want the first place, refuse to accept those who threaten my position, gossip behind people’s backs, and hinder others from doing good things that I did not start? This mirror is not for pointing at others. John the Baptist said, “He must increase, but I must decrease.” (John 3:30) May we all learn to give up that seat.</p>"]],"con":[],"say":"Where these notes stand for the whole book: Diotrephes’ problem is that he “loves to be first” — a problem of life and character; the text makes no doctrinal charge. Church authority is real, and abuse of authority is real too; the elder’s response is in person, within the church and through proper process (Matt 18:15–17; 1 Tim 5:19), not repaying evil with evil, and turning to “but that which is good.” We do not stick the label Diotrephes on any real person, and we do not deal with such matters by exposing people online; those who are abused may seek help through proper process. 321: pride is leaving our proper place and grasping power.","care":"In the pews there will be people who have been humiliated or pushed aside by church leaders, even “asked to leave”; there will also be pastors and co-workers who are leading and are worn out because the congregation misjudges them as a Diotrephes. When pastors preach these two verses, do not name any person or church, and do not let those who have been hurt feel that their wounds do not count; explain clearly the channels and processes through which they can seek help. At the same time, turn the mirror on ourselves and on those in the pulpit: the first person who should ask “Do I love to be first?” is the one holding the microphone. If sexual abuse, violence or other illegal acts are involved, help the person concerned seek legal and professional help; such matters cannot be handled only inside the church."},{"id":"ISS00_5","t":"Doing good and seeing God: does “he who does evil hasn’t seen God” mean we can lose our salvation?","r":"1:11; 1 John 3:6; 1 John 1:9","ch":[],"why":"5. The direction of a road, not a verdict on one fall — position 5 of these notes for the whole book (carrying over the 1 John Study Notes’ issue “Sin and assurance: how can ‘If we say that we have no sin’ and ‘whoever is born of God doesn’t commit sin’ both be true?”). “He who does evil hasn’t seen God” is a heavy sentence. Sensitive believers read it and are afraid: I lost my temper yesterday and said things I should not have said — does that prove I have never seen God? Others go the other way and use the verse to judge people: so-and-so did this, so he cannot be a real Christian. This question must settle what John means by “does good” and “does evil,” how this relates to assurance, and it must be read together with 1 John.","pos":[["[1] What the text is asking","","<p>The text says: “Beloved, don’t imitate that which is evil, but that which is good. He who does good is of God. He who does evil hasn’t seen God.” (1:11) μιμοῦ, “imitate,” is a present imperative: keep choosing whom to imitate; ἀγαθοποιῶν, “he who does good,” and κακοποιῶν, “he who does evil,” are both present participles; “is of God” is literally “is from God”; οὐχ ἑώρακεν, “hasn’t seen,” is perfect tense: has not seen, and still has not. This verse stands between Diotrephes (1:9–10) and Demetrius (1:12), like a hinge.</p><p>First John says the same: “Whoever remains in him doesn’t sin. Whoever sins hasn’t seen him and doesn’t know him.” (1 John 3:6) Yet the same letter also says: “If we say that we have no sin, we deceive ourselves, and the truth is not in us.” (1 John 1:8) <strong>The text asks: do Christians still do evil? Does a single evil act prove that a person has not seen God? Where does assurance rest?</strong></p>"],["The verdict-by-deeds view (doing evil proves you are not saved)","","<p>Some read it literally: whoever does evil has not seen God and is not of God; so if a Christian does something evil, it proves he is not a real believer, or that he has lost his salvation. The strength of this view is its seriousness: John really does not allow anyone to claim to know God while living in evil (this reminds us of 1 John 1:6).</p><p><strong>Difficulty:</strong> read this way, John contradicts himself. He says, “If anyone sins, we have a Counselor with the Father, Jesus Christ, the righteous” (1 John 2:1), and, “If we confess our sins, he is faithful and righteous to forgive us the sins” (1 John 1:9). If one sin proved that a person had not seen God, these words would be written to no one. This reading leaves sensitive people living in fear, and lets others use it to judge.</p>"],["The direction-of-life view (present participles describe the pattern of a life)","","<p>Most commentators read it grammatically: the present participles “he who does good” and “he who does evil” describe the ongoing direction and pattern of a life, as if to say “the one who lives by doing good,” “the one who lives by doing evil.” The “doesn’t sin” of 1 John 3:9 is also present tense, speaking of not living on in sin. So verse 11 does not say “anyone who has done evil once has not seen God,” but “if the direction of a person’s life is evil, it shows that he has not seen God.” The strength of this view is that it holds on to both John’s seriousness and John’s comfort.</p><p><strong>Difficulty:</strong> grammar alone cannot carry the whole interpretation; the present tense can also be a simple general description. And if “direction” is taken too loosely, people can use it to excuse long-term evil: “I only do it now and then.”</p>"],["The pattern-to-imitate view (the point is imitation, not judgement)","","<p>A third view reads it from the context: the first half of verse 11 is a command, “don’t imitate that which is evil, but that which is good,” and the second half is the reason; the elder has just written about Diotrephes’ evil and is about to write about Demetrius’ good, so the purpose of this verse is to have Gaius choose the right pattern, not to give him a ruler for measuring whether others are saved. The strength of this view is that it hears the pastoral tone of the text — it begins with “Beloved.”</p><p><strong>Difficulty:</strong> if it speaks only of imitation, it may play down the weight of the second half; “hasn’t seen God” is not mere rhetoric but a real warning from John.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we combine the last two views — the present participles of verse 11 speak of the direction of a life, not a verdict on one fall; the verse is there to make people choose to imitate the good, not to hand anyone a ruler for measuring whether others are saved. Assurance rests on Christ; we carry over the position of the 1 John Study Notes, “Sin and assurance: how can ‘If we say that we have no sin’ and ‘whoever is born of God doesn’t commit sin’ both be true?”.</strong></p><p>John says two things at once. First, a person who has truly seen God has the direction of his life changed: he becomes more and more like the God who is good, he opens doors and welcomes people; a life given over to evil, without repentance, shows that it has not known God. Second, those who have seen God still fall, and when they fall they have a Counselor; when they confess, they are forgiven; their assurance does not rest on how well they did today, but on this: “you who believe in the name of the Son of God, that you may know that you have eternal life” (1 John 5:13).</p><p>So verse 11 must not be used to manufacture fear of losing salvation, nor, the other way round, to say that it does not matter what we do. In 321 terms the point lands on “humility overcomes pride”: the best way to deal with evil is not to judge others first, but to choose to imitate the good ourselves — not answering pride with pride.</p>"],["[4] Should this affect your faith?","","<p>If you are afraid when you read this verse, because you clearly remember what you did wrong recently, that fear is itself a sign: you care about God, and you do not want to leave him. Go back to the cross and confess to the Lord; he is faithful. Your assurance does not depend on whether you slipped today, but on the Lord who died and rose again for you.</p><p>But ask yourself honestly as well: <strong>what is the direction of my life? Whom am I imitating?</strong> If I find myself becoming more like Diotrephes step by step — loving the first place, gossiping, shutting doors — I should stop and turn back. The elder begins with “Beloved” precisely because he is waiting for us to turn back.</p>"]],"con":[],"say":"Where these notes stand for the whole book: “he who does good” and “he who does evil” in verse 11 are present participles that speak of the direction of a life, not a verdict on one fall; the verse is there to make us choose to imitate the good, not to judge others. Assurance rests on Christ (1 John 1:9; 2:1; 5:13); we carry over the 1 John Study Notes’ issue “Sin and assurance: how can ‘If we say that we have no sin’ and ‘whoever is born of God doesn’t commit sin’ both be true?”. We do not manufacture fear of losing salvation, nor say that it does not matter what we do.","care":"In the pews there will be people with especially sensitive consciences who doubt whether they are saved every time they slip; and there will be people whose family members have done something deeply hurtful, and who are heartbroken because someone has declared, “He can’t be a Christian.” When pastors preach this verse, speak of assurance first, then of direction; do not say from the pulpit, “Christians who sin lose their salvation,” and do not use this verse to pass a verdict on anyone. To those struggling in the middle of repentance, give the cross and time; to those still living in evil, give the truth and a way back."},{"id":"ISS00_6","t":"Date and place: when and where was 3 John written?","r":"1:1–15","ch":[],"why":"6. Knowing roughly when it was written lets us see the road — position 6 of these notes for the whole book (common to the whole book). Third John gives no date and no place. Date and place do not change its message, but they do affect how we picture the situation: which roads the travelling brothers walked, which church the elder was in, how far Diotrephes’ church was from him. This question briefly sets out the main views and explains why these notes do not spend much effort here.","pos":[["[1] What the text is asking","","<p>The text gives few clues: the elder says, “I wrote to the assembly” (1:9), and, “Therefore if I come” (1:10), and at the end, “but I hope to see you soon. Then we will speak face to face.” (1:14) — so the elder, Gaius and Diotrephes’ church were not too far apart and could be in contact, and a group of travelling brothers moved between several churches (1:3, 5–7). The letter mentions no temple, no Roman emperor and no event that could date it.</p><p><strong>The text asks: roughly when was this letter written, and where was it sent from? How much can these clues tell us?</strong></p>"],["The late Ephesian view (about AD 85–95)","","<p>Tradition holds that the apostle John lived in Ephesus in his old age and shepherded the churches of Asia Minor from there; 1, 2 and 3 John and John’s Gospel were written about AD 85–95. The situation of 3 John — an old man with influence among several churches in a region, travelling brothers coming and going, a local church leader beginning to wield power of his own — fits this period well. The strength of this view is that it has the support of early church tradition (Irenaeus, Eusebius) and agrees with the contents of the three letters.</p><p><strong>Difficulty:</strong> this date rests mainly on tradition and inference; 3 John itself offers no direct evidence.</p>"],["The earlier view (before AD 70)","","<p>A few scholars think John’s letters may have been written earlier, at the same time as Paul’s later letters; they point out that itinerant preaching and household hospitality were already very common in Paul’s day (Acts 15:3; Rom 15:24). The strength of this view is the reminder that the culture of hospitality described in 3 John did not appear only late.</p><p><strong>Difficulty:</strong> the relationship of the three letters to John’s Gospel, and the elder’s standing in a region, fit a later period better; the early evidence does not support so early a date.</p>"],["The agnostic view (the text doesn’t say, so don’t fix it)","","<p>A third view holds that since the letter contains no clues for dating, we should honestly say “we don’t know” and put our effort into its contents. The strength of this view is its humility, and it keeps debates about dates from obscuring the message.</p><p><strong>Difficulty:</strong> saying nothing at all about the setting leaves readers without a map for their imagination; some reasonable inference still helps us understand itinerant preaching and hospitality.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: we adopt the traditional late Ephesian view — about AD 85–95, in the region of Asia Minor; but we acknowledge that this is inference and do not make it a basis for faith.</strong></p><p>This setting helps us see three things: an aged elder still praying for a distant friend and still hoping to go in person; a group of unknown brothers walking the Roman roads for the sake of the Name, moving forward through one opened door after another; and a local church in which someone has already appeared who wants to seize power for himself. Today’s church recognises all three.</p>"],["[4] Should this affect your faith?","","<p>Not knowing the exact year does not make this letter any less true. The elder writes about a friend, a door and a man who loves to be first — things we can recognise without a year.</p><p>Rather, ask: <strong>if this letter were written to me today, where would it be sent?</strong> To my home, asking whether I have opened my door; to my church, asking whether anyone among us is grabbing for first place; to my phone, asking whom I have recently greeted by name.</p>"]],"con":[],"say":"Where these notes stand for the whole book: we adopt the late Ephesian view, about AD 85–95, in the region of Asia Minor, but acknowledge that it is tradition and inference and do not make it a basis for faith; from the pulpit we use it only to help the congregation picture itinerant preaching and hospitality, without going into research.","care":"Some brothers and sisters grow uneasy as soon as they hear “the date is uncertain,” as if the Bible were unreliable; others love to dig into dates and neglect the door the text asks them to open. Pastors should keep this question short, let people know that every view lies within the faith, and then bring attention back to the content of the letter: the truth must be walked out, and doors must be opened for the sake of the Name."},{"id":"ISS00_7","t":"How are 1, 2 and 3 John related? Which letter is “I wrote something to the assembly”?","r":"1:9; 2 John 1:7; 2 John 1:12","ch":[],"why":"7. Three letters, one voice — position 7 of these notes for the whole book (common to the whole book). Third John mentions that the elder “wrote to the assembly,” and many people immediately ask: was that letter 2 John? The order of the three letters and how they relate to one another also affect how we read 2 John’s “closing the door” and 3 John’s “opening the door.” This question briefly sets out the views and settles how these notes read the three letters together.","pos":[["[1] What the text is asking","","<p>The text says: “I wrote to the assembly, but Diotrephes, who loves to be first among them, doesn’t accept what we say.” (1:9) The Chinese Union Version renders it ‘I wrote a little to the church’; the Greek is τι, “something, a little”; the majority of Byzantine manuscripts lack the word. That letter was probably suppressed by Diotrephes, so the elder wrote to Gaius instead.</p><p>The three letters have much in common: 2 and 3 John both call their writer “the elder,” both open with “whom I love in truth” (1:1; 2 John 1), and both close by saying the writer does not want to use paper and ink, or ink and pen, but hopes to speak face to face (1:13–14; 2 John 1:12); 1 John and 3 John both say something like “he who does evil hasn’t seen God” (1:11; 1 John 3:6). <strong>The text asks: which letter is the one in verse 9? In what order were the three letters written? How are 2 and 3 John related?</strong></p>"],["The 2 John view (the letter in verse 9 is 2 John)","","<p>Some scholars think that the letter the elder wrote to “the assembly” is 2 John, written to “the chosen lady”; if the “lady” of 2 John refers to a church, the fit is even closer. The strength of this view
