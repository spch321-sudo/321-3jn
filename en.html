is that it joins the two short letters into one story.</p><p><strong>Difficulty:</strong> the theme of 2 John is not receiving teachers who deny Christ, whereas the letter mentioned in 3 John seems to have asked the church to receive the brothers the elder sent; the two point in different directions. If 2 John were that letter, what Diotrephes rejected would not look much like the contents of 2 John.</p>"],["The lost-letter view (a letter that no longer exists)","","<p>Most commentators think the letter was probably a short note introducing the travelling brothers, which Diotrephes suppressed and which was not handed down. The early church wrote many letters, and not every one was preserved; Paul, too, mentions an earlier letter to the Corinthians (1 Cor 5:9). The strength of this view is that it fits verses 9–10 most closely: the issue is precisely hospitality.</p><p><strong>Difficulty:</strong> a letter that does not exist cannot be tested; this can only be a reasonable conjecture.</p>"],["The 1 John view (it was 1 John)","","<p>A few think the letter was 1 John. First John is long, like a sermon written to a group of churches, and it too speaks of loving the brothers and of discernment. The strength of this view is that it sees the common language of the three letters.</p><p><strong>Difficulty:</strong> 1 John does not look like a letter sent to one particular church that one man could suppress, and “a little,” “something,” does not fit the length of 1 John.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: which letter verse 9 refers to is set out under three views with no verdict, the lost-letter view fitting the context best; the three letters come from the same voice, and the order is probably 1 John first, with 2 and 3 John being short letters written to a particular household and a particular person.</strong></p><p>More important is that 2 and 3 John form a pair: 2 John is written to a household, telling her not to give a teacher who denies Christ a pulpit or a blessing; 3 John is written to a friend, telling him to go on receiving the brothers who went out for the sake of the Name, and rebuking the one who shut the door. Even their vocabulary is in conversation: the deceivers in 2 John who have “gone out” and the brothers in 3 John who “went out” are both ἐξῆλθον in the SBLGNT (2 John 7; 1:7; the Byzantine manuscripts read εἰσῆλθον in 2 John 7). Read 2 John without 3 John, and the church becomes closed; read 3 John without 2 John, and the church loses its discernment (see “Opening the door and closing it: what is the standard for hospitality in 2 John and 3 John?”). See also the 1 John Study Notes’ issue “How are 1, 2 and 3 John related?”</p>"],["[4] Should this affect your faith?","","<p>We do not know what that suppressed letter said, and this is actually a comfort: a man who loves to be first can stop a letter, but he cannot stop the truth. The elder wrote another one, to Gaius, and that letter is in our hands today.</p><p>You can ask yourself: <strong>have I ever suppressed a “letter”?</strong> A reminder, a suggestion, a good thing someone else wanted to do — left sitting on my desk because it was not my idea. May we be people who pass letters on, not people who block them.</p>"]],"con":[],"say":"Where these notes stand for the whole book: which letter “I wrote to the assembly” in verse 9 refers to — the 2 John view, the lost-letter view and the 1 John view are set out side by side; the lost-letter view fits the context best, and we give no verdict. The three letters come from the same voice. Second John and 3 John must be read together: 2 John closes the door and 3 John opens it, and in both the standard is the one Christ (2 John 7, 10; 1:7–8).","care":"This question easily turns into a game of research. Pastors need only let the congregation know that the three letters are one family, and that 2 and 3 John must be read together; do not let “which letter was it?” take up pulpit time, and do not make any view a threshold for faith."},{"id":"ISS00_8","t":"Why was this short personal letter received into the canon?","r":"1:1–15","ch":[],"why":"8. Why is a short letter to a friend the word of God? — position 8 of these notes for the whole book (common to the whole book). Third John is the shortest book of the New Testament; it contains not a single sentence directly about the content of the gospel, and the names “Jesus” and “Christ” do not even appear; it is a personal letter that mentions three names and a conflict in a church. So some ask: why was such a letter received into the Bible? This question briefly describes the early church’s discussion and explains how these notes view the letter’s standing.","pos":[["[1] What the text is asking","","<p>Of the letter’s fifteen verses, the sentence closest to the gospel is “because for the sake of the Name they went out” (1:7) — in the Greek simply “the Name,” as the Chinese Union Version’s footnote explains (‘the original is “the Name”’), since the Chinese reads ‘for the Lord’s name’; and also, “He who does good is of God. He who does evil hasn’t seen God.” (1:11) The letter ends: “Peace be to you. The friends greet you. Greet the friends by name.” (1:15)</p><p><strong>The text asks: why did the early church accept so short and so personal a letter as canon? How do we read its authority today?</strong></p>"],["Voices of hesitation (short, from a writer calling himself an elder, not widely circulated)","","<p>The early church did hesitate over 2 and 3 John. Eusebius (Ecclesiastical History 3.25.3) lists them among the books that are “disputed, yet familiar to most”; some regions came to use them generally only later. The reasons were practical: they were short, seldom quoted, their writer called himself only an elder, and their contents were very personal. The strength of this view is its honesty: the canon took shape through a history; it was not a list that fell from heaven.</p><p><strong>Difficulty:</strong> hesitation is not rejection; most of the hesitation arose because the letters were not widely circulated, not because of any problem with their contents.</p>"],["Reasons for acceptance (the same voice, early witness, general use in the church)","","<p>In the end the church generally accepted this letter, for three reasons: it comes from the same voice as 1 John and John’s Gospel; what it bears witness to is the apostles’ teaching itself — that truth must be lived out, that those who work for the Lord must be received, and that the pride of loving to be first must be refused; and it was used in the churches, shepherding one generation after another. The church councils of the fourth century and Athanasius’ letter (AD 367) all list it among the twenty-seven books of the New Testament.</p><p><strong>Difficulty:</strong> “being generally used” is not itself the source of authority; authority comes from God, and the church only recognises it.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: 3 John is canon inspired by God, with the same authority as the other books of the New Testament; the early church’s hesitation is history, and a witness to the church’s careful discernment — not a reason to lessen the letter.</strong></p><p>Though this letter does not write out the name “Jesus,” he is everywhere in it: those who go out for the Name, receiving as working together, “don’t imitate that which is evil, but that which is good,” the truth itself bearing witness, greeting friends by name — this reminds us of the Good Shepherd, who “calls his own sheep by name” (John 10:3). By putting a short personal letter into the Bible, God tells us that the gospel is not only in the pulpit but also in a door, a meal and a name.</p>"],["[4] Should this affect your faith?","","<p>Knowing that the early church once hesitated can actually set our minds at rest: the church did not take in just any letter, but did so through time and discernment.</p><p>You can ask yourself: <strong>if God put a letter written to a friend into the Bible, do the messages I write to people also carry truth and love?</strong> A greeting, a “beloved,” a remembering “by name” — any of these may be a door God uses to build his system.</p>"]],"con":[],"say":"Where these notes stand for the whole book: 3 John is canon inspired by God, with the same authority as the other books of the New Testament; the early church’s hesitation (it was short, not widely circulated, and its writer called himself an elder) is history, and in the end it was generally accepted. Though it does not write out the name of Jesus, it bears witness everywhere to “the Name.”","care":"Some people are shaken when they hear that “the canon was once disputed,” and some use it to doubt the whole Bible. Pastors should handle this question calmly: explain the history and explain why the church accepted the letter; do not present the history of the canon from the pulpit as a conspiracy, and do not present it as though it never happened. Bring the focus back to the door this letter asks us to open."},{"id":"ISS00_9","t":"Should these debates affect a person’s faith?","r":"1:1–15","ch":[],"why":"9. Debates belong in the study; the door has to be opened today — position 9 of these notes for the whole book (common to the whole book). A fifteen-verse letter, and yet so many debates: who the author is, who Gaius is, whether verse 2 is a promise, which letter is meant, what kind of man Diotrephes was, whether verse 11 says we can lose our salvation. Some hear all this, feel the Bible is too hard and simply stop reading; others enjoy circling around the debates and forget what the text asks them to do. This question gathers up the debates of the whole book and explains how these notes regard them.","pos":[["[1] What the text is asking","","<p>The clearest commands in this letter are only a few sentences: “We therefore ought to receive such” (1:8), “don’t imitate that which is evil, but that which is good” (1:11), “Greet the friends by name” (1:15). None of these is hard to understand.</p><p><strong>The text asks: will the details we cannot settle stop us doing the things that are perfectly clear? Where do the debates belong?</strong></p>"],["The avoidance view (we don’t need to know these things; just believe)","","<p>Some hold that the pulpit need not mention any debates, so as not to unsettle the congregation; simply believe and obey. The strength of this view is that it protects the weak and puts the emphasis on obedience.</p><p><strong>Difficulty:</strong> if the debates are never mentioned, as soon as members see other views online they think the church has been hiding something; and some debates (such as verse 2 and prosperity teaching), if not explained clearly, will hurt the simplest believers most.</p>"],["The total-doubt view (so many debates — the Bible must be unreliable)","","<p>Another reaction is: if we cannot even be sure of the author and the recipient, can this letter be trusted? The strength of this view is that it faces the problems honestly and does not pretend there are no difficulties.</p><p><strong>Difficulty:</strong> what is uncertain is the details, not the message; scholars differ over who Gaius was, but there is no debate about “for the sake of the Name” or “but that which is good.” Enlarging uncertainty about details into the unreliability of the whole Bible is a leap in logic.</p>"],["[3] Where these notes stand","","<p><strong>Where these notes stand: debates are to be set out honestly, letting readers see the grounds and difficulties of each view, followed by the judgement of these notes; but the debates belong in the study, not at the door — details we cannot settle must not block commands that are perfectly clear.</strong></p><p>Every debate in this volume comes with “Where these notes stand”: on authorship we carry over the apostle John, with the John the Elder view and the Johannine community view set out alongside; on who Gaius was, views are set side by side with no verdict; verse 2 is a prayer, not a promise; opening and closing the door have Christ as their standard; Diotrephes’ problem is that he loves to be first; verse 11 speaks of the direction of a life; on the date we follow tradition; on the letter in verse 9 the lost-letter view fits best; the letter’s standing as canon is settled. All these judgements are open to discussion, but not one of them needs to be resolved before we can receive a brother who went out for the sake of the Name.</p>"],["[4] Should this affect your faith?","","<p>No, it should not. The hardest thing about this letter is not scholarship but life: opening the door is hard, not grabbing for first place is hard, remembering people by name is hard. If someone sorts out every debate and still loves to be first, he is further from God than a Gaius who understands none of the debates but opens his door every day.</p><p>You can ask yourself: <strong>am I using debates to escape the commands, or using study to obey more deeply?</strong> May we, like Gaius, keep the truth in our hearts and walk in truth with our feet.</p>"]],"con":[],"say":"Where these notes stand for the whole book: debates are to be set out honestly, with the grounds and difficulties of each view, followed by the judgement of these notes; but the debates belong in the study, not at the door — details we cannot settle must not block commands that are perfectly clear: we ought to receive such (1:8), imitate that which is good (1:11), greet the friends by name (1:15).","care":"In the pews there will be people who love to ask questions and are easily trapped by them, and people who tense up as soon as they hear of a debate. Pastors should set both at ease: asking questions is not irreverent, and study is not transgressing; at the same time, bring them back to this letter’s simplest commands — go and open a door today, and greet someone by name."},{"id":"ISS01_1","t":"Who was Gaius? Is he the same Gaius as in Paul’s letters?","r":"1:1; Rom 16:23; 1 Cor 1:14; Acts 19:29; Acts 20:4","ch":[1],"why":"3 John is written to someone with a name: “The elder to Gaius the beloved” (1:1). Readers naturally want to know who he was — was he the Gaius in Corinth who was host “of the whole assembly”? The question looks like mere historical detective work, but it affects the pulpit: some stitch the lives of several men called Gaius into one person and tell a story the text does not tell; others turn Gaius into a great figure and forget that what the elder praises in him is simply an open door. So we must first separate what can be known from what cannot.","pos":[["[1] What the text is asking","","<p>3 John tells us only a few things: Gaius is the one of whom the elder says, “whom I love in truth” (1:1; the Chinese Union Version renders it “whom I love sincerely”); brothers came and testified that he walks in truth (1:3); he welcomed brothers who were strangers, and “you do a faithful work” (1:5); where he lived there was a church, and in that church was a Diotrephes who loved to be first (1:9). The letter does not say which city he lived in, what office he held, or whether the elder led him to faith. Γάϊος was one of the commonest names in the Roman world. The text is not asking “Which famous man was he?” but this: how does someone who walks in the truth keep opening the door in a church where someone has shut it?</p>"],["The same person as one of the men called Gaius in Paul’s letters and Acts","","<p>The New Testament has at least three other men called Gaius: “Gaius and Aristarchus, men of Macedonia, Paul’s companions in travel” (Acts 19:29); “Gaius of Derbe,” who accompanied Paul to Asia (Acts 20:4); the Gaius in Corinth — “Gaius, my host and host of the whole assembly, greets you” (Rom 16:23) — and the one of whom Paul says, “I baptized none of you, except Crispus and Gaius” (1 Cor 1:14); the last two are probably the same man. Some think the Gaius of 3 John is the Corinthian one: both are known for hospitality, both open their homes for the church to come in.</p><p><strong>Difficulty: </strong>The Gaius in Corinth was Paul’s contemporary; 3 John was probably written at the end of the first century (traditionally about AD 85–95), in Asia Minor. Thirty or forty years apart, and with the Aegean between them, the same name need not mean the same man. Hospitality was a virtue shared by many households in the early church; it cannot by itself lay one man on top of the other.</p>"],["A later tradition: John made him bishop of Pergamum","","<p>The fourth-century Apostolic Constitutions (7.46) lists bishops appointed by the apostles, and says that John appointed a Gaius in Pergamum. If the tradition is reliable, the Gaius of 3 John later became a leader of a local church, and the elder’s commendation in this letter also carries a charge.</p><p><strong>Difficulty: </strong>The Apostolic Constitutions is late, and its list contains a good deal of guesswork; its author may well have read 3 John and placed Gaius in the list for that reason. Such a tradition may be mentioned, but it cannot serve as a footnote to the text.</p>"],["A brother who appears only in this letter","","<p>Most commentators think the Gaius of 3 John was a believer in the network of churches the elder shepherded, and that the New Testament does not mention him anywhere else. The elder may have led him to faith (“my children” in verse 4 may include him), or he may simply have been a brother the elder knew and valued. The strength of this reading is its honesty: we say as much as the text gives us.</p><p><strong>Difficulty: </strong>This reading is really another way of saying “we don’t know”; it rests on the New Testament’s silence. It does not rule out the first two readings; it simply goes no further.</p>"],["[3] Where these notes stand","","<p><strong>These notes set the three possibilities side by side without a ruling; in the pulpit we say only “a brother named Gaius.”</strong> We do not stitch the Gaius of Corinth or the Pergamum tradition into the text of 3 John, nor invent for him an identity the text does not give. What we can say is only what the text says: he walks in truth, he opens his home to brothers he did not know, and his love was spoken of before the church. For the position of these notes on the whole letter, see the issue “Author, recipient and setting: who are the elder, Gaius, Diotrephes and Demetrius?”.</p><p>This question is really a mirror: God remembers faithfulness, not titles. What the elder wants Gaius to remember is not who he is, but that what he does is “a faithful work” (1:5).</p>"],["[4] Should this affect your faith?","","<p>No. We do not know where Gaius lived or what office he held, but we know clearly how he lived. Many names in the Gospels and letters appear only once, yet God wrote them into the canon. In other people’s eyes you may be just “an ordinary brother or sister,” but every door you open for the sake of the Name has a name before God — and that is exactly what the last line of this letter says: “Greet the friends by name.” (1:15)</p>"]],"con":[],"say":"Where these notes stand: the text does not tell us who Gaius was; identifying him with the Gaius of Corinth, or with the later tradition of a bishop of Pergamum, is only a possibility, and the three views are set side by side without a ruling. In the pulpit we say only “a brother named Gaius,” and keep the focus on what the text says: he walks in truth, and he opens his home to brothers who are strangers.","care":"When teaching this question, do not turn historical detail into a display of learning, and do not invent a life story for Gaius that the text does not give just because it makes a better story. The pews are full of brothers and sisters with no titles, whose names nobody remembers — they drive people to and fro, cook and host, clean the meeting place. Let them hear this: God remembers faithfulness, not titles; your name is known to him."},{"id":"ISS01_2","t":"“Prosper in all things and be healthy”: is this a promise from God?","r":"1:2; 1:3; Phil 2:27; 2 Tim 4:20; 2 Cor 12:9; Jas 5:14","ch":[1],"why":"This is the most misused verse in the letter. Some take it as God’s guarantee to every believer: believe enough and you will prosper and be healthy; others go the other way and say it is only a polite formula — God cares about the soul, not the body. Both readings hurt people: the first makes brothers and sisters who are chronically ill or poor blame themselves, and the second makes people afraid to pray about their bodies and their livelihoods. The position on the whole letter already deals with the prosperity gospel; this chapter takes one step further: since this is a prayer, how can we pray for one another in the same way today?","pos":[["[1] What the text is asking","","<p>The Greek verb is εὔχομαι, “to pray, to wish”: “Beloved, I pray that you may prosper in all things and be healthy, even as your soul prospers.” (1:2) Ancient family letters often opened with a line like “First of all I pray that you are in good health”; John uses this format but adds a comparison: outward well-being is to be “even as” inward well-being. εὐοδόω literally means “to have a good journey, to be on a good road,” and the same word appears in Paul’s prayer: “if by any means now at last I may be prospered by the will of God to come to you.” (Rom 1:10) Then verse 3, with γάρ (“for”), explains how the elder knows Gaius’ soul is prospering: brothers came and testified that “you walk in truth” (1:3). The text asks: is this sentence a promise, a polite formula, or a sincere prayer?</p>"],["The prosperity reading: God promises believers prosperity in all things","","<p>This reading treats verse 2 as God’s will and promise: since the elder prayed like this, God wants every believer to prosper in everything and be healthy; if not, something is wrong with their faith or their giving. Its supporters often pair it with “My God will supply every need of yours according to his riches in glory in Christ Jesus.” (Phil 4:19)</p><p><strong>Difficulty: </strong>This is an elder’s wish for one person, not a contract God has signed with everyone; its measure is the soul, not a bank account. The New Testament has faithful saints who fell ill (Phil 2:27; 2 Tim 4:20; 2 Cor 12:9), as the position on the whole letter sets out in detail.</p>"],["The mere-formula reading: only a polite opening","","<p>This reading stresses the format of ancient letters: “I hope you are well and in good health” was a line every letter writer used, like signing off “with best wishes” today, and no theology should be read into it. Its strength is that it pulls up the prosperity gospel by the roots.</p><p><strong>Difficulty: </strong>John rewrote the formula, adding “even as your soul prospers” — a mere pleasantry would not carry a comparison like that. And reading it as only a formula easily slides to the opposite extreme: as if God cared only for the soul and not the body, and prayer could only be about spiritual things. James, though, says, “Is any among you sick? Let him call for the elders of the assembly” (Jas 5:14) — praying for the sick is the church’s duty.</p>"],["A sincere prayer with the soul as its measure (the reading of these notes)","","<p>This reading accepts both things at once: its format is a letter formula, and its content is a sincere prayer. The elder truly prays for Gaius’ body and for “all things” — his travels, his household, everything needed to welcome travellers; but he sets the measure in the soul, because he has already heard that Gaius walks in truth: “even as you walk in truth” (1:3). This gives our prayers today an order: we can pray for one another’s health, work and livelihood, and pray specifically; and at the same time remember that the prosperity most worth giving thanks for is a person walking on the road of truth.</p><p><strong>Difficulty: </strong>This reading needs a sense of proportion: prayer must not be preached as a transaction, nor bodily needs as unspiritual. The pulpit has to say two things at once, which is harder than saying only one.</p>"],["[3] Where these notes stand","","<p><strong>These notes take the third reading: verse 2 is a sincere prayer with the soul as its measure — not a promise God has signed, and not an empty formula.</strong> So these notes do not use this verse to teach the prosperity gospel or health-and-wealth teaching, nor do they say God does not care about the body. We can learn to pray for people the way the elder did: first give thanks that they are walking in the truth; then ask specifically for their body, their work and their livelihood — name the illness, the job, the bill; and finally do more than pray: keep them company — a phone call, going with them to the doctor, a meal. For the position of these notes on the whole letter, see the issue “Prospering and the soul: is “prosper in all things and be healthy” a promise from God?”.</p><p>This reminds us of what 321 often says about changing our point of view: from a worldly point of view (prosperity means outward success) to God’s point of view (the soul prospers first). This does not make light of the body; it places the body’s needs in the hands of a God who loves us.</p>"],["[4] Should this affect your faith?","","<p>It should not make you doubt God’s love. If you are ill right now, or money is tight, verse 2 is not pointing at you and saying, “Your faith is not enough”; it is an elder’s prayer for someone he loves, and today it can be your brothers’ and sisters’ prayer for you. God’s grace is sufficient for you, and he hears every cry you make for your body and your household. True prosperity is to keep walking in the truth in any circumstance.</p>"]],"con":[],"say":"Where these notes stand: 1:2 is the elder’s sincere prayer with the soul as its measure — neither a promise that every believer will be rich and healthy, nor an empty formula. We do not teach the prosperity gospel, nor say that God does not care about the body; following it, we can pray specifically for one another’s souls, bodies and livelihoods.","care":"In the pews there are elderly folk who have been bedridden for years, fathers out of work, families worried about medical bills. What we must most avoid in preaching this verse is a line like “Just believe, and you’ll get better” — that line will crush them. Let them hear this: your illness is not proof that your faith is too small; the church will pray for you, and will also go with you to the doctor and walk through it with you. God sees your soul more clearly than your accounts."},{"id":"ISS01_3","t":"“My children”: people the elder led to faith, or people he shepherded?","r":"1:4; 2 John 1:4; 1 Cor 4:15; Gal 4:19; 1 John 2:1","ch":[1],"why":"“I have no greater joy than this: to hear about my children walking in truth.” (1:4) is the tenderest sentence in the letter, and the one parents and pastors quote most often. Who “my children” are affects how we hear this joy: is it the joy of an evangelist seeing his spiritual offspring, or of a pastor seeing his flock? More important still, this verse is often held up against our own families — and parents whose children do not yet believe often hear it not as joy but as pain.","pos":[["[1] What the text is asking","","<p>The Greek is τὰ ἐμὰ τέκνα, with the emphatic possessive adjective: “my own” children. μειζοτέραν is a double comparative, as though the elder could not find a word big enough for this joy. ἀκούω is present tense: he hears again and again — the elder did not live beside these children, and relied on brothers coming and going to bring news. Both short letters share this joy: “I rejoice greatly that I have found some of your children walking in truth, even as we have been commanded by the Father.” (2 John 1:4) The text asks: who are these “children”? What is the elder’s relationship to them?</p>"],["People the elder himself led to faith","","<p>This reading follows Paul’s usage: “in Christ Jesus, I became your father through the Good News” (1 Cor 4:15); he calls Onesimus “my child, whom I have become the father of in my chains” (Phlm 1:10); and he says, “My little children, of whom I am again in travail until Christ is formed in you” (Gal 4:19). On this reading Gaius may well have been led to faith by the elder, and the elder’s joy is that of a spiritual father watching the children he brought to birth grow up.</p><p><strong>Difficulty: </strong>John’s writings use “children” and “little children” very broadly: “My little children, I write these things to you” (1 John 2:1) is addressed to a whole body of readers, and it is hard to say that all of them were brought to faith by him personally. From verse 4 alone we cannot tell whether Gaius was the elder’s spiritual son.</p>"],["The people the elder shepherded","","<p>This reading takes “my children” to be the believers in the network of churches the elder shepherded — the way an old pastor calls his whole congregation “children.” 1 John addresses its whole readership the same way: “I write to you, little children, because your sins are forgiven you for his name’s sake.” (1 John 2:12) On this reading the elder’s joy is a shepherd’s joy: hearing that the flock in many places are “walking in truth.”</p><p><strong>Difficulty: </strong>τὰ ἐμὰ, “my own,” carries intimacy; reading it as a general form of address may thin that intimacy out.</p>"],["Both: a spiritual family","","<p>Many commentators think the two readings need not be set against each other: in his old age the elder had a spiritual family around him — some he had led to faith, some he had shepherded for years — and he called all of them “my children.” Read this way, verse 4 describes a relationship, not a list of names.</p><p><strong>Difficulty: </strong>This reading is the broadest and the least likely to go wrong, but also the hardest to make concrete in the pulpit; we must take care not to turn it into a vague “we are all one family.”</p>"],["[3] Where these notes stand","","<p><strong>These notes set the three readings side by side without a ruling; in the pulpit we can say “the elder’s spiritual children — those he led to faith, those he shepherded.”</strong> What matters more is the nature of this verse: <strong>it is the joy of a spiritual father, not a report card for parents.</strong> These notes do not use verse 4 to rebuke parents whose children do not yet believe or have left the faith, nor do they infer that children not “walking in truth” prove that their parents have failed.</p><p>321 speaks of the relationship between spiritual parents and children; this verse reminds us of the deepest joy in that relationship. The joy the elder “hears” is sometimes only heard after many years — parents who weep for their children: your tears have not been wasted before God.</p>"],["[4] Should this affect your faith?","","<p>It should not make you blame yourself. If you are a father or a mother whose child has not yet come back to the Lord, this verse is not rubbing salt in your wound; it gives you hope: one day you too may “hear” — from a phone call, a friend, a place you never expected. Keep praying for them, keep loving them; place them in the hands of the Father who loves them more than you do.</p>"]],"con":[],"say":"Where these notes stand: “my children” may be people the elder led to faith, people he shepherded, or both; the three readings are set side by side without a ruling. 1:4 is the joy of a spiritual father, not a report card for parents; we do not use it to rebuke parents whose children do not yet believe, but keep room for their comfort, hope and intercession.","care":"In the pews there are parents heartbroken over their children — children who no longer come to church, no longer pray, perhaps even oppose the faith. When preaching this verse, do not say, “Good parents’ children always walk in the truth.” Pray with them, and tell them: the elder’s joy is something he “hears,” and some hearing comes only after a long time; your prayers have not fallen to the ground, and God has not given up on your child."},{"id":"ISS01_4","t":"“Send them forward on their journey in a way worthy of God”: what is the standard for welcoming travelling preachers?","r":"1:6; 1:5; 1:7; 2 John 1:10; Acts 15:3; Titus 3:13; 1 Thess 2:12","ch":[1],"why":"The elder asks Gaius to “send them forward on their journey,” and “in a way worthy of God” (1:6). This sentence is a rule of sending and receiving in the early church, and also a question every church faces today: who knocks at the door, who comes asking for money, who says he is a preacher — how should we receive them? How far should our hospitality go? And who sets the standard? If this question is handled badly, one side will make churches close the door on genuine preachers, and the other will let brothers and sisters be exploited by impostors.","pos":[["[1] What the text is asking","","<p>The Greek is οὓς καλῶς ποιήσεις προπέμψας ἀξίως τοῦ θεοῦ: “You will do well to send them forward on their journey in a way worthy of God” (1:6). καλῶς ποιήσεις, “you will do well,” is a courteous request in letters; προπέμπω is a technical term in the early church, meaning to send someone on their way and supply what they need for the road — “being sent on their way by the assembly” (Acts 15:3), “Send Zenas, the lawyer, and Apollos on their journey speedily, that nothing may be lacking for them” (Titus 3:13). ἀξίως τοῦ θεοῦ, “worthily of God,” is the same expression Paul uses: “that you should walk worthily of God, who calls you into his own Kingdom and glory” (1 Thess 2:12). The text asks: does “worthy of God” describe the manner of welcoming, or the people being welcomed?</p>"],["The standard lies in the manner: worthy of the God who sent them","","<p>This reading puts the emphasis on how Gaius sends them off: since these people went out for God’s Name, sending them should be like serving God — not brushing them off, but sending them generously and thoughtfully, so that they can reach the next stop. This reminds us of the Lord’s words, “He who receives you receives me” (Matt 10:40). On this reading, “worthy of God” raises the quality of the welcome.</p><p><strong>Difficulty: </strong>If we look only at the manner and not at the people, this clashes with 2 John, where the same elder says, “If anyone comes to you, and doesn’t bring this teaching, don’t receive him into your house” (2 John 1:10). Generous hospitality cannot do without discernment.</p>"],["The standard lies in the people received: they went out for the Name, taking nothing","","<p>This reading notices the “because” in verse 7: those whom Gaius is to send on are the ones of whom it is said, “because for the sake of the Name they went out, taking nothing from the Gentiles.” (1:7) “Worthy of God” has first filtered the people: they went out for the Name, not for their own name; they took no money from unbelievers and did not treat the gospel as a business. The early church’s Didache (chapters 11–12) discerned in the same way: a travelling apostle should be welcomed for a day or two; if he stays three days, or asks for money, he is a false prophet.</p><p><strong>Difficulty: </strong>ἀξίως τοῦ θεοῦ is an adverb; grammatically it modifies the act of “sending forward,” not the people being sent; the basis for filtering the people actually comes from the “because” of verse 7. And if we stress only filtering, the church easily becomes suspicious, checking and doubting everyone who comes first, and forgetting that the people Gaius welcomed were precisely “strangers,” brothers he had not known before (1:5).</p>"],["Both together: first discern the people, then send them generously (the reading of these notes)","","<p>This reading joins verses 5 to 7 together: the people must be discerned — have they gone out for the Name, do they preach the one Christ, are they taking nothing for themselves? — and the manner must be generous — sending them forward as if serving God. Opening the door is the norm and closing it the exception; but before we open the door, we should know who is standing outside.</p><p><strong>Difficulty: </strong>Today there are no letters of recommendation written by apostles; discernment takes time, takes pastors, takes a community judging together. That is more trouble than a simple rule, but it is closer to the text.</p>"],["[3] Where these notes stand","","<p><strong>These notes take the third reading: the standard for hospitality has two sides — the people must be “for the sake of the Name,” and the manner must be “worthy of God.”</strong> So these notes do not tell brothers and sisters to give without limit and without discernment, nor tell churches to shut the door on every unfamiliar preacher. Today’s application can be very concrete: sending and receiving go through the church, not only through individuals; find out what the visitor preaches and for whose name he has gone out; supply what is needed for the road, so that “nothing may be lacking for them,” rather than letting anyone make a profit out of hospitality. For the position of these notes on the whole letter, see the issue “Opening the door and closing it: what is the standard for hospitality in 2 John and 3 John?”.</p><p>Here 2 John and 3 John come together into one door: the same elder writes one letter telling people to close the door and another telling them to open it; the test is not whether we know someone, nor who holds power, but whether the one who comes brings the one Christ.</p>"],["[4] Should this affect your faith?","","<p>It should not make you afraid of hospitality. If you have been taken advantage of, lent money that was never paid back, or been deceived by an impostor, that does not mean your love was wrong; it means discernment needs to be done together, as a community. Next time, open the door with your pastor and with the church beside you. God still values every door opened for the sake of the Name.</p>"]],"con":[],"say":"Where these notes stand: the standard for hospitality in 1:6 has two sides — those received are people who “for the sake of the Name … went out, taking nothing,” and the manner of welcome is to be “worthy of God”; opening the door is the norm and closing it the exception; hospitality calls for discernment, and is read together with 2 John 1:10. We do not tell people to give without limit or without discernment, nor to close the door on every brother they do not know.","care":"In the church are brothers and sisters who have been taken advantage of — money lent and never returned, guests who turned out to be swindlers; since then they no longer dare to open the door. There are also warm-hearted elderly folk who give to anyone who comes. When preaching this verse, care for both: do not shame those who were deceived, and do not leave the warm-hearted to manage on their own; put hospitality back into the community, so that pastors and co-workers discern together and send people on together."},{"id":"ISS01_5","t":"“Taking nothing from the Gentiles”: may ministers today receive support?","r":"1:7–8; Luke 10:7; 1 Cor 9:14; Gal 6:6; 1 Thess 2:9; Acts 18:3","ch":[1],"why":"Verse 7 says these preachers went out “taking nothing from the Gentiles,” and verse 8 goes on, “We therefore ought to receive such.” Both verses are often used by both sides: some say a truly spiritual preacher should take no money, and use this to shame co-workers who receive support from the church; others use the word “ought” to put pressure on the congregation, as though not giving were a debt owed to God. Both readings leave the setting of the text, and both hurt people.","pos":[["[1] What the text is asking","","<p>“because for the sake of the Name they went out, taking nothing from the Gentiles.” (1:7) In the New Testament ἐθνικός means “Gentile, unbeliever”; μηδὲν λαμβάνοντες is a present participle — they took nothing all along the way. Then: “We therefore ought to receive such, that we may be fellow workers for the truth.” (1:8) ὀφείλομεν, “ought,” is a word for “owing, being under obligation”; ὑπολαμβάνειν literally means “to take up from underneath,” and shares its root with λαμβάνοντες, “taking,” in verse 7: they take nothing from the Gentiles, so God’s household takes them up. The text asks: whose money is it that the preachers do not take? And what is it that God’s household “ought” to do? “Taking nothing” can be read two ways: they did not raise funds from unbelievers; or they did not accept even what unbelievers offered of their own accord, lest the gospel be seen as a trade. Both readings make the same point: what they do not take is the Gentiles’ money; those who take them up are God’s household.</p>"],["Preachers should support themselves and accept no support","","<p>This reading takes Paul as its model: in Corinth “by trade they were tent makers” (Acts 18:3), and “working night and day, that we might not burden any of you, we preached to you the Good News of God” (1 Thess 2:9). On this reading the purest ministry depends on no one, and “taking nothing” in 3 John is praise for such self-support.</p><p><strong>Difficulty: </strong>Verse 7 says they took nothing “from the Gentiles,” not nothing from God’s household; verse 8 is precisely asking God’s household to receive them. Paul also says he laid down this right “not because we don’t have the right” (2 Thess 3:9). To preach self-support as the only spiritual way is to contradict the text.</p>"],["It is right for God’s household to support preachers","","<p>This reading takes verses 7 and 8 together: the preachers take nothing from unbelievers precisely because believers are to take them up. When the Lord sent out his disciples he said, “for the laborer is worthy of his wages” (Luke 10:7); Paul says, “Even so the Lord ordained that those who proclaim the Good News should live from the Good News” (1 Cor 9:14), and also, “let him who is taught in the word share all good things with him who teaches” (Gal 6:6). On this reading, 3 John protects two things: the gospel is not seen as a business, and preachers are not left stranded on the road.</p><p><strong>Difficulty: </strong>If we say only “they ought to be supported,” without saying “for the sake of the Name” and “worthy of God,” this reading can be abused — some, in the name of ministry, demand endless giving from the congregation.</p>"],["Those who support are fellow workers, not sponsors (the reading of these notes)","","<p>This reading notices the purpose of verse 8: “that we may be fellow workers for the truth.” (1:8) συνεργοί means “fellow workers.” Those who welcome and support do not stand in the pulpit, yet they work together with those who go out; support is not a transaction but a shared part in the work. So “ought” is not a payment demand but a privilege for God’s household: we have a share in the work by which the Name goes out.</p><p><strong>Difficulty: </strong>A fellow-worker relationship needs openness on both sides: how preachers use support, and how the congregation takes part, must both be honest before God; this needs good structures in the church, and cannot rely on feeling alone.</p>"],["[3] Where these notes stand","","<p><strong>These notes take the third reading, on the basis of the second: it is right for God’s household to support those who go out for the Name, and those who support them are fellow workers.</strong> So these notes do not use verse 7 to shame preachers who receive support from the church, nor verse 8 to manipulate giving or manufacture guilt. “Taking nothing” protects the purity of the gospel — no fees charged to unbelievers, no treating faith as a business; “ought to receive” protects those who go out — so that nothing is lacking for them. For the position of these notes on the whole letter, see the issue “Opening the door and closing it: what is the standard for hospitality in 2 John and 3 John?”.</p><p>This reminds us of what 321 often says about selflessness: for Jesus, for others, not for ourselves. Those who go out take nothing for themselves, and those who welcome them keep nothing for themselves — selflessness on both sides is what makes them “fellow workers” together.</p>"],["[4] Should this affect your faith?","","<p>It should not put pressure on your heart, nor make you look down on preachers. If you give, you are a fellow worker, not someone buying insurance; if for now you cannot give, your prayers, your hospitality, a meal you cook, are also fellow work. If you are a preacher, receiving support from God’s household is no shame; use it for the Name, and it is worthy of God.</p>"]],"con":[],"say":"Where these notes stand: “taking nothing” in 1:7 means taking nothing from unbelievers, which protects the gospel from being treated as a business; “ought to receive” in 1:8 means God’s household taking up those who go out for the Name, and those who support them are fellow workers. We do not use these two verses to shame preachers who receive support, nor to manipulate giving or manufacture guilt.","care":"In the church are people on low incomes who feel they give too little and stay away from meetings because of it, and there are co-workers in ministry who have lost heart because people say behind their backs, “He’s on the payroll.” When preaching these two verses, do not use “ought” to press people down, nor “taking nothing” to needle anyone. Let the congregation know: every act of taking someone up is fellow work; let preachers know: God’s household taking you up is God’s own intention."},{"id":"ISS01_6","t":"“I wrote something to the assembly”: which letter was it?","r":"1:9; 1:10; 2 John 1:1; 2 John 1:10","ch":[1],"why":"The elder says, “I wrote to the assembly” (1:9; the Chinese Union Version, following the Greek τι, reads “I wrote briefly to the church”), and then that Diotrephes would not receive them. This sentence makes people curious: what did that letter say? Is it one of the books of the New Testament? Why did it have no effect? The overall relationship of the three letters is dealt with in the position on the whole letter; this chapter deals only with the few extra things this sentence raises: the little word τι, what became of that letter, and why the elder wrote to Gaius instead.","pos":[["[1] What the text is asking","","<p>The Greek is Ἔγραψά τι τῇ ἐκκλησίᾳ, “I wrote something to the church”; τι is an indefinite pronoun, “something, a little,” which the Chinese Union Version renders “briefly.” The majority of Byzantine manuscripts (RP) lack τι, giving simply “I wrote to the church” — which is what WEB has. Immediately after comes “but Diotrephes, who loves to be first among them, doesn’t accept what we say” (1:9; the Chinese Union Version: “does not receive us”) — the “but” shows that the letter was blocked. The text asks: which letter was it? Where did it go?</p>"],["It was 2 John","","<p>This reading takes “wrote to the church” to mean writing to “the chosen lady and her children” (2 John 1:1) — that is, 2 John; the two letters are of similar length and end in almost the same words, as if written at the same time.</p><p><strong>Difficulty: </strong>2 John tells people to close the door on teachers who deny that Christ came in the flesh: “don’t receive him into your house” (2 John 1:10); the letter the elder mentions in verse 9, however, asks the church to welcome the brothers he sent — the opposite direction.</p>"],["A letter that has been lost","","<p>Most commentators think it was a letter that has not survived, very likely a letter of introduction or request the elder wrote on behalf of the travelling brothers. Because Diotrephes would not receive the elder, he would not let this letter be read out in the church, and perhaps for that reason the letter was not passed down. So the elder wrote to Gaius instead, asking him to receive them privately, and warning, “Therefore if I come, I will call attention to his deeds which he does” (1:10).</p><p><strong>Difficulty: </strong>This reading is a conjecture drawn from a gap in the text; there is no direct evidence. It is simply the explanation that best fits the context.</p>"],["It was 1 John","","<p>A few think the letter written to the church was 1 John: a long letter to a network of churches.</p><p><strong>Difficulty: </strong>1 John has no letter opening or greeting, says nothing about receiving travelling brothers, and does not fit the “something, a little” of τι; this is less likely.</p>"],["[3] Where these notes stand","","<p><strong>These notes set the three readings side by side without a ruling, leaning toward “a lost letter” as the best explanation of the context.</strong> The pulpit need not spend time guessing what the letter said; it only needs to see one thing: an elder’s letter can be suppressed, but God’s work cannot — the elder wrote instead to a brother who was willing to open his door, and this short letter was received into the canon. For the position of these notes on the whole letter, see the issue “How are 1, 2 and 3 John related? Which letter is “I wrote something to the assembly”?”.</p><p>τι, “a little,” also shows the elder’s restraint: that letter was probably short, a request or an introduction, not a long piece of teaching. Once it was blocked, the elder did not write another to the same church to force the issue, but wrote to a brother who would open the door, and left dealing with it face to face to “if I come” — he took another road and kept working for the truth.</p>"],["[4] Should this affect your faith?","","<p>No. The New Testament mentions several letters that have not survived, and the canon is not lacking anything because of it; God has preserved the words he wants the church to read. If you have ever written a letter or spoken a word only to have it blocked, this verse reminds you: there is no need to answer pride with pride; find another open door and keep going.</p>"]],"con":[],"say":"Where these notes stand: whether the letter of “I wrote to the assembly” was 2 John, a lost letter, or 1 John, the three readings are set side by side without a ruling, leaning toward a lost letter as the best explanation of the context; the point is not what the letter said, but that the elder, once blocked, did not answer with pride, and wrote instead to a brother willing to open his door.","care":"In the church are co-workers who once made a suggestion or wrote a letter, only to have it blocked or quietly ignored, and they carry a store of hurt. When preaching this verse, do not encourage them to fight or to rake up old scores, nor tell them to swallow the hurt and pretend nothing happened. Walk with them in learning from the elder: leave the matter for the right time and the right setting, and meanwhile keep looking for an open door to serve through."},{"id":"ISS01_7","t":"Diotrephes: a heretic, a local leader resisting the apostle, or a power struggle?","r":"1:9–10; 1:11; 2 John 1:10; Mark 10:44; 1 Pet 5:3","ch":[1],"why":"Diotrephes is one of the few negative characters named in the New Testament, and the easiest one for the pulpit to use as a pretext for a point of its own. What exactly he did wrong decides how we preach these two verses: if he was a heretic, this is a doctrinal dispute; if he was a leader abusing power, it is a dispute about character; if it was only the strain of a changing church structure, these two verses are not so black and white. The position on the whole letter has dealt with authority and abuse; this chapter simply sets out the three readings about Diotrephes himself.","pos":[["[1] What the text is asking","","<p>The text describes Diotrephes with only one word: “who loves to be first,” φιλοπρωτεύων, loving to be first (1:9); it occurs only here in the New Testament. Then come four things: “unjustly accusing us with wicked words,” “neither does he himself receive the brothers,” “and those who would, he forbids,” “and throws out of the assembly” (1:10). The elder does not say he taught anything false, nor does he describe him with words like the “deceivers” of 2 John. The text asks: was Diotrephes’ problem doctrine, authority, or church structure?</p>"],["He was a heretic","","<p>This reading holds that Diotrephes belonged to, or at least leaned toward, the group 1 and 2 John speak of, who had gone out from the church; he would not receive the elder because of a different theology.</p><p><strong>Difficulty: </strong>The text makes no doctrinal accusation at all. If Diotrephes had been preaching another Christ, the elder could have said, as in 2 John, “don’t receive him into your house” (2 John 1:10), but he does not; he speaks only of Diotrephes’ character and conduct. To infer heresy from the text’s silence is to make the text say what it does not say.</p>"],["He was a local leader who resisted the apostle’s authority and wanted the church for himself","","<p>This is the reading of most commentators: Diotrephes held real power in that church (“among them”), would not acknowledge the elder’s authority, and gave the people the elder sent no foothold in the church. Besides “receive,” ἐπιδέχομαι can also mean “accept, acknowledge.” His problem is written beside his name: he wanted the first place. This reminds us of the Lord’s words, “Whoever of you wants to become first among you, shall be bondservant of all” (Mark 10:44), and of Peter urging elders to serve “not as lording it over those entrusted to you, but making yourselves examples to the flock” (1 Pet 5:3).</p><p><strong>Difficulty: </strong>We hear only the elder’s side; if Diotrephes had reasons of his own, the text does not record them. So the pulpit must keep to the boundaries of the text and not add charges against him.</p>"],["The strain of a changing church structure","","<p>Some scholars read it in terms of social history: at the end of the first century the church was moving from leadership by apostles and travelling co-workers to government by local overseers and elders; Diotrephes may have been a local leader who wanted to protect his congregation from outsiders, and came into conflict with the elder’s travelling network.</p><p><strong>Difficulty: </strong>This reading helps us see the setting, but it easily softens the text’s judgement — the elder says plainly that he was “unjustly accusing us with wicked words” and threw those who welcomed the brothers “out of the assembly”; this is not simply a difference over structure, but harm done to people. The next verse, “don’t imitate that which is evil,” also places his conduct on the side of “evil.”</p>"],["[3] Where these notes stand","","<p><strong>These notes take the second reading: Diotrephes’ problem was not in his head but in his heart — the only description the text gives of him is “loves to be first”; it is a problem of life, not of doctrine.</strong> At the same time, these notes do not add charges the text does not make, nor pin him on any real pastor, elder, church or denomination. These two verses must first be held up to ourselves: inside every one of us lives someone who wants the first seat. For the position of these notes on the whole letter, see the issue ““Loves to be first”: how do we tell church authority from spiritual abuse?”.</p><p>Diotrephes’ “loves to be first” reminds us of what 321 often says: pride is leaving our proper place and grasping power — leaving the servant’s proper place and grasping the first place that belongs to Christ alone; and the elder’s response is not to answer pride with pride.</p>"],["[4] Should this affect your faith?","","<p>It should not make you despair of the church. From the first century on there have been people in the church who love to be first; Scripture does not hide this, but writes it down — and sets Gaius and Demetrius beside him. God’s church does not stand because there are no Diotrephes in it, but because of the Lord who has first place in all things. If you have ever been hurt by such a person, these two verses prove it: God saw.</p>"]],"con":[],"say":"Where these notes stand: the only description the text gives of Diotrephes is “loves to be first,” with no doctrinal accusation of any kind; his problem was one of life, not doctrine. These notes add no charges the text does not make, nor pin the name Diotrephes on any real person, church or denomination, but first turn the mirror on ourselves.","care":"When teaching this question, a particular face easily rises in the congregation’s minds — a certain leader, a certain pastor, a certain former church. Do not let the pulpit become a place for naming names. Let the congregation first ask themselves: at home, in my small group, in the co-workers’ meeting, do I want the first seat? And let those who have been hurt know: their wounds are real, God has seen them, and the church is willing to walk with them through a proper process."},{"id":"ISS01_8","t":"“Throws out of the assembly”: how do we tell church discipline from spiritual abuse?","r":"1:10; Matt 18:15–17; 1 Cor 5:13; 1 Tim 5:19; John 9:34","ch":[1],"why":"The New Testament has church discipline: “Put away the wicked man from among yourselves.” (1 Cor 5:13) Diotrephes, though, threw “those who would” receive the brothers out of the church. Both are throwing out — one is the church’s duty, the other an abuse of power. Today many who have been hurt ask: I was pushed out by a church — was that a Diotrephes? And some leaders worry: once we talk about abuse, no one will dare to exercise discipline. This question needs to be made clear, and people need to be protected.","pos":[["[1] What the text is asking","","<p>The Greek is ἐκ τῆς ἐκκλησίας ἐκβάλλει, “he throws them out of the church”; ἐκβάλλω is a strong word, which John’s Gospel uses of the man born blind being driven out: “Then they threw him out.” (John 9:34) The present tense can also be read “tries to throw out.” Those thrown out are not people who had sinned, but “those who would” receive the brothers — people who did what the elder considered right. The elder’s response is: “Therefore if I come, I will call attention to his deeds which he does” (1:10). The text asks: how do we tell biblical discipline from spiritual abuse?</p>"],["A formal expulsion: Diotrephes used the church’s discipline","","<p>This reading holds that Diotrephes really had the authority to expel people, and removed those who welcomed the brothers from the meetings, perhaps even from the Lord’s Supper. This would show that the early church already had procedures for discipline, and that Diotrephes used them in the wrong place.</p><p><strong>Difficulty: </strong>We do not know whether house churches at the end of the first century already had a formal procedure for expulsion, or whether one person could carry it out.</p>"],["A conative present: he was trying to drive people out","","<p>This reading notes that the Greek present tense can express an attempt, “trying to”: Diotrephes was finding ways to squeeze people out — freezing them out, putting pressure on them, spreading evil talk, making it impossible for them to stay in the church. This is more common than formal expulsion, and harder to detect.</p><p><strong>Difficulty: </strong>Grammatically both readings work, and we cannot be sure; but the result of both is the same: those willing to open the door are pushed outside by the one who shuts it.</p>"],["No need to choose: three questions for discernment drawn from the text (the reading of these notes)","","<p>This reading does not take sides between the two grammatical options, but draws questions for discernment from the text: (1) Is the person being dealt with guilty of sin, or have they done what is right? Diotrephes was throwing out those who welcomed the brothers. (2) Is the process face to face, within the church, with witnesses — or evil talk and private pressure? The process the Lord gave is first in private, then with one or two others, then telling the church (Matt 18:15–17), and Paul says, “Don’t receive an accusation against an elder, except at the word of two or three witnesses.” (1 Tim 5:19) (3) Is the motive to protect the flock, or to protect one’s own position? Beside Diotrephes’ name is written “loves to be first.”</p><p><strong>Difficulty: </strong>These three questions can only be seen clearly in community and over time; in the moment, the person who has been hurt and the person exercising discipline often tell different stories.</p>"],["[3] Where these notes stand","","<p><strong>These notes take the third reading: church discipline is real, and abuse is real too; discernment looks at three things — whether the person dealt with has sinned; whether the process is face to face, within the church, with witnesses; whether the motive is to protect the flock.</strong> The elder’s own response is the model: “if I come” — face to face, within the church, through proper process; he did not answer evil words with evil words, nor tell Gaius to form a faction in private. So these notes do not use verse 10 to justify exposing people online, public shaming or forming factions in private; nor do they tell those who have suffered abuse of authority or been driven out to suffer in silence: they need discernment, protection, and help sought through proper process. For the position of these notes on the whole letter, see the issue ““Loves to be first”: how do we tell church authority from spiritual abuse?”.</p>"],["[4] Should this affect your faith?","","<p>If you have been pushed out by a church, or driven out in the name of spirituality, your pain is real, and you need not pretend it never happened; this verse proves that God sees such things and does not approve of them. But do not leave the Lord because of it. Find a pastor or a mature believer you can trust, and bring the matter into the open through proper process; at the same time give your heart to the Lord, and do not let bitterness reign inside you.</p>"]],"con":[],"say":"Where these notes stand: church discipline and spiritual abuse are both real; discernment looks at whether the person dealt with has sinned, whether the process is face to face, within the church, with witnesses, and whether the motive is to protect the flock. The elder’s “call attention to his deeds” in 1:10 is face to face, within the church, through proper process — not exposing people online or forming factions in private; those who suffer abuse of authority or are driven out must be protected, and may seek help through proper process.","care":"In the pews there may be people hurt by a previous church who have come carrying their grievances, and co-workers who are exercising discipline under heavy pressure. When preaching this verse, care for both: do not call all discipline abuse, nor tell the hurt simply to “submit and be done with it.” The church needs channels where people can raise complaints and be heard, so that those who are hurt know they do not have to go online — there is a place where they can speak."},{"id":"ISS01_9","t":"“He who does evil hasn’t seen God”: do Christians still do evil?","r":"1:11; 1 John 3:6; 1 John 3:9; 1 John 1:8; 1 John 4:12; John 1:18","ch":[1],"why":"“He who does good is of God. He who does evil hasn’t seen God.” (1:11) A tender conscience reading this is afraid: I still sin, still lose my temper, still have evil thoughts — does that mean I have never seen God? Others use this sentence to judge people: “If he did that, he can’t be saved.” The position on the whole letter has already dealt with sin and assurance; this chapter only takes one more step: what does “seeing God” mean in John’s language?","pos":[["[1] What the text is asking","","<p>Both subjects in the Greek are present participles: ὁ ἀγαθοποιῶν, “the one who does good,” and ὁ κακοποιῶν, “the one who does evil” — they describe a person’s ongoing pattern. οὐχ ἑώρακεν τὸν θεόν is perfect tense: “has not seen, and still has not seen, God.” The same author says, “No one has seen God at any time. The one and only Son, who is in the bosom of the Father, has declared him.” (John 1:18), and again, “No one has seen God at any time. If we love one another, God remains in us” (1 John 4:12). The text asks: if no one has ever seen God, what does “having seen God” mean?</p>"],["Spiritual knowledge: to have seen God is truly to know God","","<p>This reading follows the parallel in 1 John: “Whoever sins hasn’t seen him and doesn’t know him.” (1 John 3:6) — “seeing” and “knowing” stand side by side. “Having seen God” is not seeing with the eyes but knowing God in Christ; a person whose life is steadily directed toward evil shows that he has not truly known God.</p><p><strong>Difficulty: </strong>Without care, this reading can be heard as “anyone who does any evil has not known God”; yet the same author also says, “If we say that we have no sin, we deceive ourselves” (1 John 1:8).</p>"],["The direction of a life: a pattern, not a single failure","","<p>This reading stresses the present participles: the elder is describing two directions of life — one whose pattern is doing good, one whose pattern is doing evil. Just as 1 John says, “Whoever is born of God doesn’t commit sin” (1 John 3:9), speaking of the direction of a life, not that a believer will never stumble once; for the same letter also says, “If we confess our sins, he is faithful and righteous to forgive us the sins” (1 John 1:9).</p><p><strong>Difficulty: </strong>Pushed too far, this reading can make people feel that whatever they do does not matter; but the tone of the text is serious: the direction is real, and the fruit will show.</p>"],["A warning aimed at Diotrephes","","<p>This reading puts verse 11 back into its context: it comes right after Diotrephes’ four deeds and right before Demetrius. The elder is telling Gaius: do not assume that someone who sits in the first seat in the church must know God; look at his fruit. This reminds us of the Lord’s words, “Therefore by their fruits you will know them.” (Matt 7:20)</p><p><strong>Difficulty: </strong>This reading easily leads people to use verse 11 to judge whether others are saved; but the elder’s aim in saying it was to tell Gaius, “don’t imitate that which is evil,” not to have him pass judgement on Diotrephes’ soul.</p>"],["[3] Where these notes stand","","<p><strong>These notes read the three together: “having seen God” is truly knowing God in Christ; the present participles describe the direction of a life; and the context is a reminder to Gaius to choose whom he will imitate.</strong> So these notes do not use verse 11 to create fear of losing salvation, nor to judge whether a particular person is saved; assurance rests on Christ, not on our never stumbling. At the same time, these notes do not make it mean that whatever we do does not matter — the direction is real, and loving the brothers and doing good are the natural fruit of those who have seen God. For the position of these notes on the whole letter, see the issue “Doing good and seeing God: does “he who does evil hasn’t seen God” mean we can lose our salvation?”.</p><p>This reminds us of what 321 often says about the focus being on Jesus: to have seen God is to have seen “the one and only Son, who is in the bosom of the Father”; the more we see him, the more the direction of our life turns toward the good.</p>"],["[4] Should this affect your faith?","","<p>If you are afraid because of your own weakness and willing to come back to the Lord, that very sensitivity is a sign of the Holy Spirit at work in you. Confess your sin to the Lord; he is faithful; and then choose once more to imitate what is good. Your assurance does not lie in how well you have done today, but in the Lord who died and rose again for you.</p>"]],"con":[],"say":"Where these notes stand: “having seen God” in 1:11 is truly knowing God in Christ; the present participles describe the direction of a life, not a verdict on a single fall. We do not use this verse to create fear of losing salvation or to judge whether others are saved; assurance rests on Christ, and at the same time the direction is real — doing good is the fruit of those who have seen God.","care":"In the pews there are people with especially tender consciences who often doubt whether they are saved, and there are people who like to use verses to judge others. When preaching this verse, comfort the first group first, and take them to the promise of 1 John 1:9; gently remind the second group that the elder told Gaius, “don’t imitate that which is evil,” not to pronounce who has not seen God."}],"terrain":{"points":[[0.6,70,2,"even as your soul prospers",null],[0.733,92,4,"I have no greater joy than this","top"],[0.8,74,5,"you do a faithful work",null],[0.933,80,7,"for the sake of the Name they went out",null],[1.0,96,8,"fellow workers for the truth","top"],[1.067,14,9,"Diotrephes, who loves to be first among them, doesn’t accept what we say","bot"],[1.133,6,10,"throws out of the assembly","bot"],[1.2,90,11,"but that which is good","top"],[1.267,84,12,"you know that our testimony is true",null],[1.467,94,15,"Greet the friends by name","top"]]},"tracks":[{"gk":"ἀλήθεια","tr":"alētheia","gl":"truth (CUV 1:1 renders it “sincerely”)","code":"G225","root":"ἀλήθεια — what is real and true, truth; the root idea is “not covered over, nothing hidden.” It occurs six times in fifteen verses, together with the adjective ἀληθής (“true”) once. John says almost nothing about the “content” of the truth; he speaks only of its footsteps: loving in truth, walking in truth, working for the truth, the truth bearing witness","ins":"At the first stop, truth is where love lives: where the Chinese Union Version has “whom I love sincerely,” the Greek reads “whom I love in truth” (1:1, ἐν ἀληθείᾳ) — word for word the same as the first verse of 2 John. At the second stop, the truth comes to rest on one person, and in two layers: the brothers testified about “your truth” (σου τῇ ἀληθείᾳ; the Chinese Union Version fills it out as “the truth kept in your heart”), and the elder adds, “even as you walk in truth” (1:3) — the truth is first in the heart, then in the feet. At the third stop, the truth becomes the way a whole family walks: “to hear about my children walking in truth” (1:4); περιπατοῦντα is a present participle — walking is an ongoing way of life. The fourth stop is the first reversal: the truth needs fellow workers — “that we may be fellow workers for the truth” (1:8). τῇ ἀληθείᾳ can be read “for the truth” or “together with the truth”: those who welcome the travellers are not merely helping the preachers; they are working alongside the truth itself. The fifth stop is the second reversal: until now people have borne witness to the truth, but in verse 12 the truth itself speaks — Demetrius has the testimony “of the truth itself” (1:12). The truth moves from being where love lives, to what is kept in the heart and walked out by the feet, to the partner we work with, and finally it becomes a witness. Those whom the truth has found are, in the end, recognised by the truth.","stops":[["1:1","whom I love in truth",""],["1:3","when brothers came and testified about your truth, even as you walk in truth","top"],["1:4","to hear about my children walking in truth",""],["1:8","that we may be fellow workers for the truth","top"],["1:12","and of the truth itself","top"]]},{"gk":"μαρτυρέω／μαρτυρία","tr":"martyreō / martyria","gl":"testify, bear witness; testimony","code":"G3140","root":"μαρτυρέω — to bear witness, to testify; μαρτυρία — testimony, evidence. One of John’s favourite words (more than thirty times in his Gospel). This letter comes from a world with no telephone and no internet, where people knew one another through the spoken testimony of those who came and went: brothers came and testified, they testified before the church, all testify, the truth testifies, we testify","ins":"At the first stop, testimony comes back along the road: “when brothers came and testified about your truth” (1:3) — ἐρχομένων καὶ μαρτυρούντων are present participles: the brothers kept coming, group after group, and kept telling. The elder did not know everything that happened in Gaius’ home; he learned it from those who had passed through that door and come back. At the second stop, the testimony is spoken in front of the whole congregation: “They have testified about your love before the assembly” (1:6) — Gaius welcomed strangers in his own house, yet his love was told openly in another church; hidden hospitality is remembered in God’s household. At the third stop, the testimony is stacked three layers deep: Demetrius “has the testimony of all, and of the truth itself; yes, we also testify” (1:12) — this reminds us of the law: “at the mouth of two witnesses, or at the mouth of three witnesses, shall a matter be established” (Deut 19:15). What the elder gives Demetrius is not merely a letter of introduction but a threefold guarantee; μεμαρτύρηται is a perfect passive — the testimony has been given and still stands. The fourth stop is the reversal: “you know that our testimony is true” (1:12) — the one who testifies must himself be attested. This reminds us of the end of John’s Gospel: “We know that his witness is true” (John 21:24). Others testify for Gaius and for Demetrius; at the end the elder asks Gaius to testify to the elder’s testimony — a community of truth is a people who bear true witness to one another.","stops":[["1:3","when brothers came and testified about your truth",""],["1:6","They have testified about your love before the assembly","top"],["1:12","Demetrius has the testimony of all, and of the truth itself; yes, we also testify","top"],["1:12","you know that our testimony is true","top"]]},{"gk":"ὑπολαμβάνω／ἐπιδέχομαι／ἐκβάλλω","tr":"hypolambanō / epidechomai / ekballō","gl":"receive, welcome; (the reverse) refuse to accept, throw out","code":"G1926","root":"ὑπολαμβάνω — to take up from underneath, to support, to receive as guests; ἐπιδέχομαι — to receive, to welcome, also “to acknowledge someone’s authority”; ἐκβάλλω — to throw out, to drive out. The Chinese Union Version renders them all as “receive”; the Greek uses two words: in verse 8 the elder speaks of “taking up from underneath,” in verses 9–10 Diotrephes “does not accept,” and in the end he “throws out”","ins":"At the first stop, the door opens: “We therefore ought to receive such” (1:8) — ὑπολαμβάνειν means “to take up from underneath,” and it shares its root with λαμβάνοντες in the previous verse (“taking nothing”): those who go out take nothing from the Gentiles, so God’s household takes them up. At the second stop, the door closes — and the one shut out is the elder: “Diotrephes, who loves to be first among them, doesn’t accept what we say” (1:9). ἐπιδέχεται is present tense: not once, but continually; in letters of the time the word could also mean refusing to acknowledge someone’s authority. At the third stop, the man who shuts his own door shuts other people’s doors too: “neither does he himself receive the brothers, and those who would, he forbids” (1:10). The fourth stop is the reversal: “and throws out of the assembly” (1:10) — those who opened their doors are thrown out of the door. The one who most wants to be first ends up turning the church into a place with only one door, which only he can open. This track must be read alongside 2 John: 2 John says, “don’t receive him into your house” (2 John 10); 3 John says, “We therefore ought to receive such” (1:8). The same elder writes one letter telling people to close the door and another telling them to open it; the test is not whether we know someone, nor who holds power, but whether the one who comes brings the one Christ.","stops":[["1:8","We therefore ought to receive such","top"],["1:9","but Diotrephes, who loves to be first among them, doesn’t accept what we say",""],["1:10","neither does he himself receive the brothers, and those who would, he forbids",""],["1:10","and throws out of the assembly",""]]},{"gk":"ἀγαπητός／ἀγαπάω／ἀγάπη","tr":"agapētos / agapaō / agapē","gl":"beloved, love (verb), love (noun)","code":"G27","root":"ἀγαπητός — loved, beloved; ἀγαπάω — to love; ἀγάπη — love. Every time the elder turns to a new section, he first says Ἀγαπητέ, “Beloved” (verses 2, 5 and 11 — the Chinese Union Version adds “brother” in small type). The skeleton of this letter is three calls of “Beloved”","ins":"At the first stop, the letter opens with love twice: “to Gaius the beloved, whom I love in truth” (1:1) — ἀγαπητῷ and ἀγαπῶ stand side by side; Gaius is “beloved,” and he is the one the elder “loves in truth.” At the second stop, the first “Beloved” introduces a prayer: “Beloved, I pray that you may prosper in all things” (1:2). At the third stop, the second “Beloved” introduces an affirmation: “Beloved, you do a faithful work in whatever you accomplish for those who are brothers and strangers” (1:5). At the fourth stop, the elder loves, and Gaius too is loving others: “They have testified about your love before the assembly” (1:6) — the one who is loved has become one who loves. The fifth stop is the reversal: the most direct command in the whole letter is still introduced by the tenderest form of address — “Beloved, don’t imitate that which is evil, but that which is good” (1:11). The elder has just listed the four things Diotrephes does, yet his tone has not hardened; he does not say to Gaius, “Stand up and fight him,” only, “Beloved, don’t imitate him.” The three calls of “Beloved” form a line — prayer, affirmation, exhortation: in 3 John, truth and love still walk hand in hand.","stops":[["1:1","to Gaius the beloved, whom I love in truth",""],["1:2","Beloved, I pray that you may prosper in all things",""],["1:5","Beloved, you do a faithful work in whatever you accomplish for those who are brothers and strangers",""],["1:6","They have testified about your love before the assembly",""],["1:11","Beloved, don’t imitate that which is evil, but that which is good","top"]]}],"lesson":{"1":{"no":1,"vol":"321 3 John Study Notes · Lesson 1 · 3 John 1","title":"Fellow Workers for the Truth — First Place, Taking Up, Names","chars":4468,"min":60,"deep":8,"dchars":1382,"tchars":1375,"blocks":[["h","1. A Few Words Beside a Name"],["p","Brothers and sisters, peace to you. When you were a child and first wanted to come top of the class, what was it for? For a certificate? So that Mum and Dad would have something to say in front of the relatives? Or because you did not want to be asked one more time, “So where did you come this time?” Many of us grew up hearing that question. Coming first gets you seen; the one who comes second is often forgotten."],["p","Let me describe a situation. Zhiming grew up in Singapore. After every exam, the first thing he was asked when he got home was where he had come in the class. Later he came to faith, served eagerly, and became a small-group leader. The group did well, but slowly everything in it had to go through him: who would share, who would lead the singing, whether to invite newcomers — he decided it all. Once a sister who was new to the group suggested visiting a group member in hospital. He did not say no; he only said, “Let’s see,” and there the matter stopped. He could not have told you why. He just felt uncomfortable inside: this was not my idea."],["p","There is a very short letter in the New Testament that, when it comes to one man, puts only one short phrase beside his name — in the Greek a single word, in the Chinese Union Version just three characters: “but Diotrephes, who loves to be first among them, doesn’t accept what we say.” (1:9) Loves to be first. The text does not say he preached false doctrine, nor that he lacked zeal; beside his name it says only that he loved to be first."],["p","That is 3 John: one chapter, fifteen verses — counted by the number of words in the Greek, the shortest book in the New
