Testament. There are three people in the letter: it is written to a brother called Gaius, it mentions a leader called Diotrephes, and it recommends a man called Demetrius. The three are like three mirrors — but let us be clear from the start: a mirror is for looking at yourself, not for pointing at someone else. In this lesson we will teach the letter through three words: first place, taking up, names."],["h","2. Walk: The Truth Walks in Our Own Feet First"],["p","“The elder to Gaius the beloved, whom I love in truth.” (1:1) As for “the elder,” this series keeps the position of the 1 John Study Notes: the apostle John. Where the Chinese Union Version has “whom I love sincerely,” the Greek reads “in truth”; “whom I love in truth” is almost the same sentence as the first verse of 2 John — only there the elder loves a group of people, and here one person. Who was Gaius? There are at least three men called Gaius in the New Testament; it was a very common name at the time. Whether any of them is this Gaius we do not know, and we need not guess."],["p","Verse 2 is the most quoted verse in the whole letter — and the one most often preached wrongly: “Beloved, I pray that you may prosper in all things and be healthy, even as your soul prospers.” (1:2) Think about our own habits when we write letters or cards: they often begin or end with “wishing you good health and every success.” No one treats that line as a contract and holds the person who wrote the card responsible for it. The elder is using exactly that line from the letter-writing of his own day. Many interpreters also think that the two Greek words rendered “in all things” correspond to the letter formula “above all”: the elder is saying, “First of all, I pray for you.” So this is a greeting and a prayer, not a contract signed by God guaranteeing every believer wealth and health. The difference is that after the formula the elder adds a line of his own: “even as your soul prospers.” The standard is set by the soul."],["p","So if anyone in this class is going through chemotherapy, or has just lost a job, please do not hear in this verse that your faith is not enough. To an apostle who prayed three times and still did not have the thorn in his flesh removed, the Lord said, “My grace is sufficient for you” (2 Cor 12:9). Nor should we turn it the other way round and say that God cares only for the soul and not for the body. The elder prays for Gaius’ body; we too can ask for one another’s health, work and livelihood — and we can go to see a doctor."],["p","How did the elder know? “For I rejoiced greatly when brothers came and testified about your truth, even as you walk in truth.” (1:3) Notice his source of information: not a report Gaius wrote about himself, but guests who had stayed in his home. What they reported back was not how much Gaius knew, but how he lived. The truth is first in the heart, and then in the feet."],["p","“I have no greater joy than this: to hear about my children walking in truth.” (1:4) This is the joy of a spiritual father; the children the elder speaks of are the spiritual children he has brought up in the faith. If you are a parent whose children have not yet come to faith, or have walked away, and reading this gives you a stab of pain, please set that pain down for now. In section 6 we will come back to you especially, with Sister Meiling’s story."],["d",["“I pray that you may prosper in all things and be healthy”: doesn’t God promise that Christians will be healthy and wealthy?","The word for “prosper,” εὐοδοῦσθαι (euodousthai), is made up of “good” and “road”; literally it means “to be on a good road,” but by New Testament times it usually just meant “to go well, to succeed.” Paul uses the same word when he prays to go to Rome: “if by any means now at last I may be prospered by the will of God to come to you” (Rom 1:10). Paul did reach Rome in the end — but in chains. The smooth road God gives is not always a comfortable road. So when we pray for someone who is ill, we can ask: Lord, please heal them, and be with them on this road; rather than saying: if only your faith is strong enough, you will get better. The first prayer leaves the outcome with God; the second puts the burden back on the sick person. This week, when you pray for someone who is ill, you could first ask them: What would you most like me to ask God for you?"]],["h","3. Welcome and Imitate: A Door Opened for the Name, a Door Shut by the First Place"],["p","“Beloved, you do a faithful work in whatever you accomplish for those who are brothers and strangers.” (1:5) “Strangers” means exactly that — people you have never met. Imagine: nine o’clock at night, a preacher you have never seen stands at your door holding a letter of introduction. Gaius opened the door. The elder calls this faithfulness: faithfulness is not only keeping faith with people we know, but also keeping faith with strangers God has sent."],["p","“They have testified about your love before the assembly. You will do well to send them forward on their journey in a way worthy of God,” (1:6) “Send them forward on their journey” was a technical term in the early church: seeing travellers off, giving them food and supplies for the road, perhaps writing a letter of introduction, so that they could reach the next stop. The standard is “worthy of God” — worthy of the One who sent them out."],["p","“because for the sake of the Name they went out, taking nothing from the Gentiles.” (1:7) The Chinese Union Version says “for the Lord’s name”; the Greek, like the World English Bible, simply says “the Name.” They did not hold out their hands to people who did not yet believe, so that the gospel would not be taken for a business. Then what did they live on along the way? “We therefore ought to receive such, that we may be fellow workers for the truth.” (1:8) This verse is the title of this lesson. “Ought” is a word for owing a debt: God’s household owes these people a welcome. Those who welcome them never stand in the pulpit, yet they become fellow workers."],["p","Two things must be kept distinct. First, it is right for preachers to receive support from God’s household (Luke 10:7). Do not use “taking nothing” to shame preachers who receive support, and do not use “ought to receive” to pressure people into giving; “ought” is the privilege of God’s household, not a payment reminder. Second, “such” people are those who went out for the sake of the Name, in a way worthy of God. The same elder says in 2 John, “don’t receive him into your house” (2 John 1:10) — about teachers who deny that Jesus Christ came in the flesh. 2 John closes the door and 3 John opens it, and the test is whether the one who comes brings the one Christ. Hospitality calls for discernment; it does not mean supplying without limit everyone who knocks."],["p","Then there is the second door. Please take a pen and underline the actions in verse 10: “Therefore if I come, I will call attention to his deeds which he does, unjustly accusing us with wicked words. Not content with this, neither does he himself receive the brothers, and those who would, he forbids and throws out of the assembly.” (1:10) How many did you underline? Accusing with wicked words, not receiving the brothers himself, forbidding others to receive them, throwing those who did out of the assembly: four actions, each pushing further outward than the last. The ones pushed out of the door in the end are the very people who opened theirs."],["p","How does the elder respond? He says, “if I come”: in person, within the church, setting out the facts. This reminds us of the order the Lord taught: “If your brother sins against you, go, show him his fault between you and him alone.” (Matt 18:15) First speak alone, then take one or two others, then tell the church. This is not a licence to expose people online."],["p","Then the elder turns and says to Gaius: “Beloved, don’t imitate that which is evil, but that which is good. He who does good is of God. He who does evil hasn’t seen God.” (1:11) What the elder writes next is not a counter-attack on Diotrephes but an exhortation to Gaius. This is the most direct command in the whole letter; what concerns the elder is not who wins, but whether Gaius, in the middle of this storm, might slowly become another Diotrephes himself."],["p","Finally the elder recommends someone. Please write three lines on the whiteboard: all, the truth, we. “Demetrius has the testimony of all, and of the truth itself; yes, we also testify, and you know that our testimony is true.” (1:12) All three lines speak for Demetrius; this reminds us that the law required a matter to be established at the mouth of two or three witnesses (Deut 19:15). The Chinese Union Version adds, in small type, the words “does good”; the Greek simply says he has the testimony. Think about it: what will be written beside your name?"],["p","The letter ends very briefly: “I had many things to write to you, but I am unwilling to write to you with ink and pen;” (1:13) “but I hope to see you soon. Then we will speak face to face.” (1:14) Tasks can be written down; people have to be seen. “Face to face” is literally “mouth to mouth.” Yet the elder himself is shepherding Gaius with ink and pen; this letter is itself long-distance pastoral care. Ink and pen are a bridge, not second best. Those who, because of illness, work or distance, can only meet online have not received a single bit less of the truth; “face to face” is a hope and an invitation, not a threshold."],["d",["May preachers receive offerings? Does “taking nothing” mean they should not accept money?","The New Testament is very direct about supporting preachers: “Even so the Lord ordained that those who proclaim the Good News should live from the Good News.” (1 Cor 9:14) First Timothy also quotes the Lord’s words: “The laborer is worthy of his wages.” (1 Tim 5:18) So the question is not whether they may receive, but how those who give support become fellow workers. What does a fellow worker look like? First, knowing their needs: ask the preacher what they need most this month — books, travel money, or someone to go visiting with them. Second, praying regularly: write their name in your prayer book and pray once a week, not only when you happen to think of it. Third, giving gladly and without fanfare: not for face, with no strings attached, and without thinking that because you have given you may now direct them. The preachers of verse 7 do not hold out their hands to those who do not yet believe; the household of God in verse 8 reaches out its own hands. This is not charity; it is working together."]],["d",["2 John says “don’t receive him into your house,” and 3 John says “ought to receive”: should we open the door or close it?","Both letters were written by the same elder, and the standard is the same. In 2 John the door is closed to teachers who deny that Jesus Christ came in the flesh and go out to spread another Christ; what is forbidden is giving them a pulpit, lodging and endorsement. In 3 John the door is opened to brothers who went out for the sake of the Name, taking nothing, worthy of God. So the test is not whether we know them or whether they are “our people,” nor who holds power in the church, but whether they bring the one Christ. The early church’s Didache also welcomed and discerned at the same time: it was fine for travellers to stay a day or two, but one who stayed a third day, or asked for money, was a false prophet. Opening the door is the norm and closing it is the exception; Diotrephes’ error was to turn the exception into the norm."]],["h","4. Light from the Greek: Loving to Be First, Taking Up from Underneath, By Name"],["p","Back to our opening question: coming first. Let us take apart three pieces of Greek together."],["p","The first word: φιλοπρωτεύων (philoprōteuōn), which the World English Bible renders “who loves to be first” and the Chinese Union Version renders with three characters meaning “fond of being head.” It occurs only here in the New Testament. The first half means “love,” the second “to be first”: to love being first, to love the first seat. It shares its root with the line in Colossians about Christ: “that in all things he might have the preeminence” (Col 1:18). The church has only one first place, and that seat was taken long ago. We say that pride is leaving our proper place and grasping power; Diotrephes left his proper place as a servant and reached out for the chair that belongs to Christ alone. The words of the Lord Jesus are its exact opposite: “Whoever of you wants to become first among you, shall be bondservant of all.” (Mark 10:44)"],["p","The second is a pair of words: λαμβάνοντες (lambanontes) and ὑπολαμβάνειν (hypolambanein). Verse 7 says the preachers took nothing — “taking” is the first word; verse 8 says we ought to receive them — “receive” is the second, and it literally means to take up from underneath. They share a root, and the elder seems deliberately to let the two words echo each other: those who go out do not hold out their hands, so God’s household reaches out its hands and takes them up. The one who loves to be first stands above and looks down; those who welcome crouch below and lift up."],["p","The third: κατʼ ὄνομα (kat' onoma), by name. The last sentence of the letter: “Peace be to you. The friends greet you. Greet the friends by name.” (1:15) “The Name” in verse 7 and “name” in verse 15 are the same Greek word, ὄνομα: the letter sets out from the Lord’s name and comes to rest on the names of friends."],["p","This reminds us of the Good Shepherd: “He calls his own sheep by name, and leads them out.” (John 10:3) The same phrase is used there. With the Lord there is no first place and then everyone else; there are only people, one by one, called by name."],["p","So here is the answer: what Diotrephes wanted was first place; what the elder gave Gaius was a name. The one who loves to be first wants to be seen; the one who takes others up is, in the end, remembered by name."],["d",["Was Diotrephes a heretic? Why is the elder so severe?","The text makes no doctrinal accusation against Diotrephes at all; it says only that he loved to be first, that he accused with wicked words, refused to receive, forbade others to receive, and threw those who did out of the church. Scholars hold three views, set side by side on the issue page. These notes take the view that his problem was not in his head but in his heart — see the issue “““Loves to be first”: how do we tell church authority from spiritual abuse?”.” Nor does the elder curse him; he only says that if he comes he will call attention to the things Diotrephes does: face to face, within the church, stating the facts. Church authority is real, and so is abuse of authority; what tells the two apart is whether a person is protecting the sheep or protecting their own position."]],["d",["Verse 11 says “he who does evil hasn’t seen God.” I still fall again and again — does that mean I have never seen God at all?","No. “He who does good” and “he who does evil” are both present participles in the Greek; they describe the direction and pattern of a whole life, not a verdict on one fall. 1 John says on the one hand that whoever sins has not seen him, and on the other: “If anyone sins, we have a Counselor with the Father, Jesus Christ, the righteous.” (1 John 2:1) Our assurance does not rest on whether we have done enough, but on Christ who laid down his life for us. But do not turn it the other way round and say that it does not matter what we do; a person who has truly seen God will gradually turn towards what is good. Where these notes stand: see the issue ““Doing good and seeing God: does “he who does evil hasn’t seen God” mean we can lose our salvation?”.” Tonight before you sleep you could do one thing: tell God specifically about one fall today, and then thank him for his forgiveness."]],["h","5. Several Distortions We Must Learn to Recognise"],["p","The first distortion is to treat this letter as a lesson in church personnel management, with the focus on how the elder handled Diotrephes, forgetting that the centre of the letter is the One whose Name they went out for. Only when there is walking in the truth, and people who go out for the sake of the Name, can we talk about how to treat others."],["p","The second distortion is to misuse verse 2 to teach the prosperity gospel; it is a greeting and a prayer, and the standard is the soul."],["p","The third distortion is to pin Diotrephes on a real pastor, elder, church or denomination, or to use verse 10 to justify exposing people online or forming factions in private. This letter gives us no right to name names; the elder’s “call attention” is face to face, within the church, through proper process — and he turns at once to imitating what is good."],["p","The fourth distortion is to misuse verses 7–8 to shame preachers who receive support, to create pressure to give, or to demand that we supply without limit everyone who knocks at the door; the discernment of 2 John still stands."],["p","The fifth distortion is to misuse verse 11 to frighten those who have fallen, or verse 4 to blame parents whose children have not yet come to faith; verse 11 speaks of the direction of a whole life, and assurance rests in Christ; verse 4 is the joy of a spiritual father."],["h","6. Two Real Questions from Chinese Contexts"],["p","The first question: what should I do when I meet someone in the church who loves to be first? First tell the difference between a small friction and real abuse of authority. Go back to Zhiming’s small group: the sister’s suggestion of a visit was put on hold. That is a small friction; there is no need to make it into a matter of principle. In fact she had a very simple way forward: invite two group members and go to the hospital herself. Gaius welcomed the brothers without waiting for Diotrephes’ permission. Afterwards she could invite Zhiming for a cup of tea and say gently, “That visit was good; next time let’s go together.” Among Chinese people, saving face matters a great deal, and we often prefer to speak behind someone’s back rather than to their face; but the elder says, “if I come” — face to face."],["p","But if you really have suffered abuse of authority, been pushed out, or been thrown out of a fellowship, that is not a small friction. You do not have to endure it in silence, and you do not have to go and face the person with power on your own first; first find a pastor or mature believer you trust to go with you, and deal with it through the church’s proper process. If personal safety or anything illegal is involved, seek legal and professional help. That is not unspiritual, and it is not disobedience."],["p","The second question: parents whose children do not believe. Sister Meiling’s son works in Taipei. As a child he memorised Bible verses in Sunday school; as an adult he stopped coming. Reading verse 4, she thought: the elder’s children all walk in the truth — and what about me? Please hear this clearly first: the children the elder speaks of are the spiritual children he brought up in the faith; this verse is not there to be compared with your family. Chinese parents very easily treat their children’s faith as their own report card, and they dread being asked, “Is your son still going to church?” The text says no such thing. Verse 4 is the elder’s joy, not a parent’s exam paper; faith is not inherited from parents — it is God himself who goes looking for people. What parents can do is to love, to live it out and to pray; the outcome is in God’s hands. The elder says he “hears”; Sister Meiling is still waiting for that news, and while she waits she can phone her son once a week — a call with no preaching in it."],["d",["If I have been pushed out or suffered abuse of authority in the church, may I make it public online?","When the elder faced Diotrephes, he did not write an open letter denouncing him, nor rally others to go after him; he said “if I come”: face to face, dealing with it in that church. This reminds us of the order the Lord taught: first go and speak alone, then take one or two others, then tell the church (Matt 18:15–17). So the first step is not to go online, but to find a pastor or mature believer you trust and set out the facts clearly. If the process within the church does not work, you can seek help from a wider church body or other trustworthy sources. If personal safety or anything illegal is involved, seek legal and professional protection directly — that is not unspiritual. Not encouraging trial by social media is not telling the wounded to keep quiet; it is letting the truth be dealt with in the right place."]],["h","7. Living Out 321 — One Chair, One Door"],["p","Only when the text has had its full say do we recognise 321 at the end of it."],["p","Jesus is my role model: “don’t imitate that which is evil, but that which is good” (1:11). Imitate whom? In the end, that One — he said we must be servants of all, and he himself first took the towel and washed his disciples’ feet. We do not overcome the love of being first by willpower, but by keeping our eyes on him."],["p","The Bible is my standard: “even as you walk in truth” (1:3). The standard is not kept on a bookshelf; it is seen by others in daily life, seven days a week."],["p","The Holy Spirit is my guide: “and of the truth itself” (1:12). This reminds us that 1 John calls the Spirit the truth (1 John 5:6). The text does not mention the Spirit directly; yet the One who makes a person’s life bear witness for them is the One who lives within."],["p","Let Jesus be King: “because for the sake of the Name they went out” (1:7). They went out for his name, not for their own; that first place belongs only to the One who “in all things he might have the preeminence” (Col 1:18). To let him be King is to return to our own proper place as servants. Humility is laying down power and returning to our proper place: let people be people, and let God be God."],["p","Let Jesus receive all the glory: “He who does good is of God.” (1:11) Good deeds belong to God, not to the one who does them; those who welcome others do not try to make a name for themselves either — yet the elder wrote Gaius’ name into Scripture."],["p","Establish God’s system: “that we may be fellow workers for the truth” (1:8). God’s system is a network joined together by one open door after another; Gaius’ order is life first, then relationships, then ministry. Kingdom 321 Online Fellowship is scattered across many countries; those who pass on the truth online also need a group of people like Gaius."],["d",["We are an online fellowship, and the elder says, “we will speak face to face.” Do our meetings still count?","They count. The elder himself is shepherding Gaius with ink and pen; this letter is long-distance pastoral care, carrying the truth to that household without losing a word. Ink and pen are a bridge, not second best. “Face to face” is literally “mouth to mouth”; it is a hope and an invitation, not a threshold. Those who, because of illness, work or distance, cannot be there in person have not received a single bit less of the truth. Online carries the truth there; meeting in person makes the relationship more complete; both are the same love. So here is one concrete thing you can do: this month, arrange a visit or a long phone call for a brother or sister in your group whom you have only ever seen on a screen, and begin by calling them by name."]],["h","8. Four Kinds of Heart, Each Wanting a Chair"],["p","The proud heart is like Zhiming: everything has to go through me, and I feel uncomfortable when someone else has a good idea. Or the other way round: using this letter to hunt for the Diotrephes in the church, and feeling that I am Gaius. Verse 9 exposes the same sickness in both: both want to sit in that chair. But the first place belongs only to the One who “in all things he might have the preeminence” (Col 1:18). Today, please take your hand off that chair."],["p","The fearful heart is afraid of being used, so it dares not open the door to anyone; and it is afraid of offending people, so it dares not turn anyone away. Listen to the standard in verse 6: worthy of God. Hospitality does not depend on how brave you are, but on the One who sent the visitor; you can guard the door together with fellow workers, and you can open it together with them."],["p","The ashamed heart may once have been the very person who blocked someone else’s suggestion, or said harsh words in a group chat; or may once have turned and walked away from a church. Please remember: the most direct command of verse 11 is still introduced with “Beloved”; “imitate” is a present tense in the Greek — you can choose again every day. A door you once closed, you can go and knock on today; assurance rests in Christ who laid down his life for us, not in whether you did enough in the past."],["p","The wounded heart may once have been pushed out by someone who loved to be first, called disobedient, even thrown out of a fellowship; or may be a parent who has wept for a child for years, or someone who can only join the meeting on a screen because of illness. This letter is not asking you to swallow those wounds; the elder did not tell Gaius to keep quiet, nor did he count those who are far away as second best. If the weight on your heart is keeping you awake at night, please find someone you trust to walk with you, and seek professional help if needed."],["h","9. Things You Can Do This Week"],["p","For each of the following five things, please write down a time, a place and a name before we leave."],["p","First, read 1:5–8 every morning, and stop when you reach “fellow workers for the truth” and say to the Lord: I want to be someone who takes others up from underneath."],["p","Second, think of someone whose suggestion you recently blocked, or a good thing that made you uncomfortable because it was not your idea. This week, find that person and say: That idea of yours is good — let’s do it together."],["p","Third, do one concrete thing for a preacher or missionary: write a thank-you letter, pray for them at a set time, or gladly give a gift of support in God’s household — not for face, and not under pressure."],["p","Fourth, if you are holding a grudge against someone in the church, this week do not talk about it in the group chat or behind their back; pray for them for three days first, and then decide whether to go and speak with them privately as Matthew 18 teaches. If you are the one who has been hurt, first find a pastor you trust to go with you."],["p","Fifth, this month, for someone in your small group who can only meet online, arrange a visit or a long phone call; write a card that begins by calling them by name."],["p","Then let us say four sentences out loud together."],["p","I declare: the first place has only one chair, and it is the Lord’s; I return to my proper place as a servant."],["p","I declare: I will walk in truth, and let the truth walk in my own feet first."],["p","I declare: my door is open to those who go out for the sake of the Name, and I will be a fellow worker with them for the truth."],["p","I declare: with the Lord, I and the people I love all have names."],["d",["I think I am the group leader who wants to be in charge. How can I start to change this week?","First, congratulations: being able to see yourself in the mirror is already a step. You can begin with three small things. First, at least once in your group this week, hand over a decision: ask someone else to choose the songs or lead the sharing, and simply encourage them. Second, at the next group meeting, wait until three people have spoken before giving your own opinion. Third, when you pray each morning, say: Lord, the first place is yours; today I return to my proper place as a servant. Do not let self-blame take the place of change; the most direct command of verse 11 is still introduced with “Beloved”; “imitate” is a present tense — just take one step towards what is good."]],["h","10. Closing Word"],["p","This lesson began with coming first. What Diotrephes wanted was first place, and in the end he shut the church’s door and threw out those who opened theirs. Later Zhiming did a small thing in his group: he phoned that sister and said, “Let’s go to the hospital together.” On the day of the visit, nobody cared who the group leader was; all the group member in the hospital bed remembered was that several people called him by name as they prayed for him."],["p","The focus of this lesson is not how skilfully the elder handled a personnel matter, nor how bad Diotrephes was; the focus is the One for whom “for the sake of the Name they went out” (1:7). It is his name that sends people out, and so we welcome them (1:8) and become fellow workers for the truth; it is he who sits in the first place, so we need not fight for that chair but only imitate what is good (1:11); and at the end we are greeted by name (1:15), which reminds us of the Good Shepherd who calls his own sheep by name. May what we remember as we leave not be the drama of Diotrephes, but the Lord who became the servant of all."],["p","Let us bow our heads together and pray. Heavenly Father, thank you that the chair in the first place belongs to your Son, and we no longer need to fight for it. Forgive the one inside us who wants to be first; teach us to return to our proper place as servants, and to take up from underneath those who run errands for your name. Comfort the brothers and sisters who have been hurt by someone who loved to be first; and go yourself to find the children who have not yet come home, so that the parents who are waiting may one day hear good news. Let those who can only meet online know that they have not received a single bit less of your truth. And let us one day meet face to face, and greet one another by name. In the name of the Lord Jesus Christ we pray. Amen."],["h","11. Small-Group Discussion: the Three Transformations"],["p","The small group is not a contest to see who is most humble, nor a search for whoever is like Diotrephes; it is a place for each person to say which chair they want to sit in, the one person they will take up this week, and the one name they will call. Group leaders, please lead the three Transformations below in order."],["m","Leader’s note: the lesson’s main thread is first place, taking up, names. Around the table there may be people who have been hurt by a church, parents weeping over their children, and people who can only take part online. Please read the leader’s reminder in Transformation Two first. No one in the group is to be compared to Diotrephes."],["m","Priority markers: ★★★ = top priority — when time is short, discuss at least this question in each Transformation; ★★ = second priority; ★ = discuss if time allows. The multiplication task marked [Must do] may not be skipped, but it can be completed at home."],["s","Transformation One | Internalise — until it becomes mindset (about 20 minutes)"],["m","Purpose: to be able to articulate three mindsets: verse 2 is a prayer, not a contract, and the soul comes first; welcoming those who go out for the sake of the Name makes us fellow workers, and welcoming calls for discernment; the first place belongs to Christ alone, and the way to meet the love of being first is to imitate what is good."],["n","1. ★ When you were a child and first wanted to come top, what was it for? Back then, whose question “Where did you come in the class?” did you dread most?"],["n","2. ★★★ In your own words, explain: why is “I pray that you may prosper in all things and be healthy” in verse 2 a prayer and not a promise? Where does “even as your soul prospers” set the standard?"],["n","3. ★★ “Taking” in verse 7 and “receive” in verse 8 share a root in the Greek. What is the elder saying with these two words? How does this change the way you think about supporting preachers?"],["n","4. ★★ 2 John says “don’t receive him into your house”; 3 John says “we therefore ought to receive such.” Is the standard the same in both letters? Say what that standard is."],["m","Leader’s reminder: questions such as who Gaius was, which letter verse 9 refers to, or whether Diotrephes was a heretic point in one sentence to the issue pages of the notes; don’t debate them in the group. Don’t name any pastor, church or member of the group."],["s","Transformation Two | Digest — until it becomes life (about 35 minutes · the lesson’s main thread)"],["m","Purpose: for each person to say which chair they most want to sit in, or who has shut them out, and to name the small step they will take this week."],["t","[See] See yourself"],["n","5. ★★★ Among the three mirrors — Gaius, Diotrephes, Demetrius — which one have you been most like recently? Name one specific thing: whose door you opened, or whose good idea you blocked."],["t","[Listen] Listen to God"],["n","6. ★★ Please read 1:9–11 slowly, twice. Which phrase made you stop: “who loves to be first,” “not content with this,” “Beloved,” or “but that which is good”?"],["t","[Think] Think through the sticking point"],["n","7. ★★★ Which chair do you most want to sit in deep down: being seen, having the say, being praised, or never being surpassed? When did that chair start to matter so much to you?"],["t","[Speak] Say it out loud"],["n","8. ★★ Please say one true sentence to the group: “The chair I most want to sit in is ____.” The others reply with just one sentence: “The Lord knows you by name.” No comments, no advice."],["t","[Do] Take one step"],["n","9. ★★★ Write down the small step you will take this week: which day, with which person, which decision you will hand over, or which preacher you will take up. If you are being hurt by something in the church right now, this step can simply be arranging to talk with a pastor you trust."],["m","Leader’s reminder: this Transformation may touch wounds from being pushed out, abused by authority or thrown out of a fellowship in a church; harm within families; the pain of children leaving the faith; and long-term hopelessness. Do not probe for details, do not require anyone to forgive anyone, do not require reconciliation, do not say “you need to have faith” to someone who is weeping, do not say that a child’s unbelief is because you did not do well enough, and do not let anyone criticise others by name in the group. Do not deal with it in the group; care for the person individually afterwards, and help them seek professional help if needed."],["s","Transformation Three | Transform — until it becomes daily living (about 25 minutes)"],["m","Purpose: to put this lesson into the diary: a decision handed over, a gift of support for a preacher, a phone call that begins with a name, the “2” in 920, a friend."],["n","10. ★★ This week, in your group, at home or at work, which decision will you hand over to someone else? Say who and which day."],["n","11. ★★ This month, what concrete thing will you do for a preacher or missionary: a thank-you letter, a regular time of prayer, or a glad gift of support? Say their name and the date."],["n","12. ★ Is there someone in your group who can only meet online? Which day this week will you phone them, and begin by calling them by name?"],["n","13. ★★★ This is the lesson’s 920 practice: find your “2” — perhaps a fellow worker whose idea you once blocked, a friend who has walked away, or a child still on the way. Say it now; you may say the name, or just a description (for example, “the sister who is new to our group,” “my younger son”). Say which day this week and in what way (meeting, phone call, handwritten card) you will share this lesson with them. If that person once hurt you, this week it is enough simply to pray for them."],["n","14. ★★★ [Must do] Multiplication task: tell this lesson to a friend outside the church in three sentences. First: two thousand years ago there was a very short letter about a man who loved to be first, and beside his name there is just one short phrase: “who loves to be first.” Second: the elder who wrote it did not tell anyone to fight him; he only said, “don’t imitate that which is evil, but that which is good.” Third: I am learning not to fight for first place, because I believe God knows me by name — and knows you too. Say who this friend is and which day you will tell them, and next time report back on how they responded."],["m","Leader’s reminder: be specific about time, place and name; do not accept answers like “I will be more humble.” The person for 920 can be referred to by description; do not force anyone to say a name, especially not the name of someone who has hurt them. When church wounds, family harm, children leaving the faith or long-term hopelessness come up, do not probe for details, do not require forgiveness, do not say “you need to have faith” to someone who is weeping; care for the person individually afterwards, and help them seek professional help if needed."],["s","Closing (5 minutes)"],["p","Ask each person to say in one sentence: the one decision they will hand over this week, and the one name they will call."],["p","Then pray for one another, praying by name for three kinds of people: a brother or sister who has been hurt or pushed out in a church — ask the Lord to heal them and lead them to someone trustworthy to walk with them; a parent whose children have not yet come to faith — ask the Lord to comfort them, and to go himself to find that child; a preacher out on the road for the sake of the Lord’s name — ask the Lord to take them up through us."],["p","Finally, the group leader reads slowly, once: “We therefore ought to receive such, that we may be fellow workers for the truth.” (1:8)"]]}}}</script>

sys": " Audience: a teenager (about 12–18). Be funny, witty and real — like a cool older brother or sister chatting, never lecturing or talking down. Use pictures from their world: phone at 1% battery, game levels, binge-watching, likes and followers, exams, peer pressure, sports. A light joke or current slang now and then is welcome, but NEVER joke about God, Jesus or Scripture itself, and never be flippant about sin or pain; after the laugh, land firmly on the truth. Keep it short, put the main point first, use short paragraphs, and end with one small challenge they can try today. If they mention being hurt, bullied, or wanting to harm themselves, answer gently and encourage them to tell a trusted adult (parent, teacher, pastor) right away.", "write": "\nThe reader is a teenager: light, witty, like a friend chatting; a little humour is fine, but never preachy, flippant, or joking about God or Scripture. No emoji.", "style": "Style: the questions and explanations are funny and witty, like friendly banter; the options may be playful, but the correct answer must be unambiguous, and never joke about God or Scripture itself.", "res": ["Slippery one! Read it again and you’ll own the next round.", "Not bad! A few more rounds and you can challenge your friends.", "Boss-level run! You’re a Bible pro."], "q": ["How does this passage connect to my everyday life — school, friends, my phone?", "If this passage were a message from God to me, what would it say?", "Everyone is doing it — is it weird if I don’t? What does Scripture say?", "Can you explain this passage with a game or a movie?", "What’s surprising or little-known about this passage?", "Exam stress is huge — what strength does this passage give me?", "I can’t forgive someone. How does this passage help?", "Does God really see me? What makes me worth loving?"], "fu": [["🏫", "School", "Using what you just said, help me think through how to use it at school and with my studies — give me one small move I can try today."] ence of explanation, with at most one cute emoji.", "res": ["That’s okay! Let’s read the story again and play once more! 🌱", "Great job! You remembered so much! 🌟", "Wow, amazing! God is so happy! 🎉"], "q": ["What is this story about? Tell it to me.", "What did God do in this story?", "Does Jesus love me? How do I know?", "Who is the bravest in this story? Why?", "How can I be like the people in this story?", "Teach me one short verse I can remember.", "I had a fight with my best friend. What would Jesus do?", "Can you teach me a little prayer?"], "fu": [["🏠", "At home", "About what you just said — what can I do at home? Please tell me in simple words."], ["🏫", "At school", "About what you just said — what can I do at school? Please tell me in simple words."], ["🤝", "With friends", "About what you just said — what can I do with my friends? Please tell me in simple words."], ["🙏", "Little prayer", "Please teach me a very short little prayer I can say to Jesus."], ["📖", "Story", "Can you tell me another little story about this?"]]}, "seeker": {"sys": " Audience: a seeker — a friend who is not yet a believer and is exploring the Christian faith. Stand fully in their shoes: they may never have read the Bible, do not know church language, and may have questions or reservations. (1) Start from their real situation, feelings or question, then bring in the passage, so they feel \"this is about me\". (2) Use plain everyday words; the 321 vision is only your inner compass — never use insider words like \"selfless\", \"let Jesus reign\", \"overcomer\" or \"spiritual\", and no church or theological jargon; if a word like grace, sin or salvation is unavoidable, explain it at once in everyday terms. (3) Be honest and respectful — no preaching, no pressure, no demand to believe now, no judging; doubts and objections are normal, so acknowledge the weight of the question first, then answer it honestly. (4) State clearly what the Bible says about it (what God is like, what Jesus did ased on your answer, explain how to apply it to being with my child and parenting, and give me one concrete step I can take this week."], ["💰", "Money", "Based on your answer, explain how to apply it to pressure over money and time, and give me one concrete step I can take this week."], ["🤝", "Help", "Based on your answer, explain how to apply it to asking brothers, sisters or the church for help, and give me one concrete step I can take this week."], ["🌤️", "Hope", "Based on your answer, explain how to apply it to seeing God’s presence and hope in this season, and give me one concrete step I can take this week."], ["🙏", "Prayer", "Please turn the key point of your answer into a short prayer I can finish in five minutes in the middle of a busy day."]]}, "single": {"sys": " Audience: a single person (never married, divorced, widowed, or still waiting — do not assume they want or do not want to marry). Never describe being single as a lack, a \"preparation stage\" or \"life not yet begun\", and never use a pushy-about-marriage tone. Speak of an identity in Christ that is already whole and loved; of connecting with God, friends and fellowship in loneliness; of using time, money and gifts for a purpose; of trusting while waiting; of wisdom in dating and marriage and of purity in heart and body, respectfully and without judging. Be sincere, equal and light. End with one step they can take this week. If they mention loneliness so deep they want to harm themselves, answer gently and encourage them to contact someone they trust or professional help right away.", "write": "\nThe reader is single: sincere, equal and relaxed; never pushing marriage or treating singleness as a lack. No emoji.", "style": "Style: for single friends — questions about loneliness, identity, waiting, friendship and purpose; a sincere, equal tone, never pushing marriage.", "res": ["That is okay — take your time; another read will make it clearer.", "Nice! You have caught the main points of this chapte function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}

/* cloze for review: blank out about 30% of the words (words of four letters or more) */
function blank(t, seed){
  const parts = String(t).split(/(\s+)/), idx = [];
  parts.forEach((w, i) => { if (/[A-Za-z]{4,}/.test(w)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (idx.length && pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return parts.map((w, i) => {
    if (!pick.has(i)) return esc(w);
    const m = w.match(/^([^A-Za-z]*)([A-Za-z\u2019'-]*[A-Za-z])(.*)$/);
    return m ? esc(m[1]) + '<i>' + '_'.repeat(Math.max(3, m[2].length)) + '</i>' + esc(m[3]) : esc(w);
  }).join('');
}

/* ===== Terrain map ===== */
/* English labels are much longer than the Chinese ones, so the small map shows a shortened
   label and keeps the full wording in a tooltip. */
const tShort = s => {
  s = String(s || '');
  if (s.length <= 30) return s;
  const cut = s.slice(0, 30), k = cut.lastIndexOf(' ');
  return (k > 10 ? cut.slice(0, k) : cut).replace(/[\s,;:—]+$/, '') + '…';
};
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 1;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // c is the position within the chapter (integer = chapter center)
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // -- Label layout: two-dimensional collision avoidance with boxes; push outward when there is no room --
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 6 ? 6.4 : 7.4;           // English labels are long: a smaller size than the Chinese edition
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // the dots and the "you are here" ring are obstacles too, so labels never sit on the line
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = tShort(p[3]);
    const w = txt.length * fs * 0.6;                       // monospace labels: about 0.6em per character
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy, txt });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle"><title>${esc(String(o.p[3] || ''))}</title>${esc(o.txt)}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // the viewBox grows to fit the actual content, so no label is clipped
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="Terrain map of 3 John">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">Walk · Welcome · Imitate</p></div>`;
}

/* ===== Verse exposition (six layers) ===== */
let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>3 John ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ Key passage &nbsp;·&nbsp; ' : ''}Chapter ${v.ch}</p>
    ${L(1, 'World English Bible', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, 'Greek', v.grk, 'grk') : ''}
    ${v.lit ? L(3, 'Literal rendering', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, 'Key words', v.key) : ''}
    ${v.gram ? L(5, 'Grammar', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, 'Exposition', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ Previous</button>` : ''}
    ${next ? `<button class="btn" onclick="openV('${v.ch}:${next.a}')">Next ›</button>` : ''}
    <button class="btn" onclick="sayV('${ref}')">🔊 Read aloud</button>
    <button class="btn" onclick="askXz(blkPlain('${ref}'))">✨ Ask Xiaozhi</button>
    <button class="btn" onclick="go('course',${v.ch})">Whole chapter</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';
  const t = D.txt[v.ch] || []; let c = '';
  for (let i = v.a; i <= v.z; i++) c += (t[i - 1] || '') + ' ';
  return c + '\n' + (v.lit || '').replace(/<[^>]+>/g, ' ') + '\n' + (v.exp || '').replace(/<[^>]+>/g, ' '); }
function sayV(ref){ const v = VMAP[ref]; if (!v) return;
  speak(blkPlain(ref), '3 John ' + v.ch + ':' + v.a); }
function sayMV(n){ const m = meta(n); speak(m.mv.t + ' ' + m.mv.r + '.', 'Memory verse'); }
function tglL(i, ref){ OPENL[i] = OPENL[i] ? 0 : 1; openV(ref); }

/* -- Lesson read-aloud: skip the book title, teleprompter and contents, and start with the body --
   Section headings, “Think deeper” and the Three Transformations are all introduced conversationally,
   so it sounds like a teacher speaking, not a screen reading out its layout. */
const DEEP_LEAD = [
  'Let’s think a little deeper here. Someone may ask: ',
  'Let me add one more word here. Perhaps someone is asking right now: ',
  'I know some of you will stop here and ask: ',
  'Let’s take this one step further. Someone asks: ',
  'Here is a question worth pausing over: ',
  'Perhaps you are wondering: ',
];
const DEEP_ANS = ['Here is my answer. ', 'This is how I see it. ', 'We can think of it this way. ', 'This is how I would answer. ',
  'Let me put it this way. ', 'The answer is right there in the text. '];
const NUMW = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve',
  'thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENSW = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
/* a number spoken as a word (used for "Part one", "Question fourteen") */
function numWord(n){
  n = parseInt(n, 10);
  if (!(n >= 0)) return String(n);
  if (n < 20) return NUMW[n];
  if (n < 100) return TENSW[Math.floor(n / 10)] + (n % 10 ? '-' + NUMW[n % 10] : '');
  return String(n);
}
/* split plain text into sentences (exactly the same rule as the tappable .mks sentences on screen, so the two line up) */
const plainSents = s => splitHTML(esc(s)).map(x =>
  x.replace(/<[^>]+>/g, '').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&'));
const endDot = s => /[.!?…”’)]$/.test(String(s).trim()) ? String(s).trim() : String(s).trim() + '.';

/* Read-aloud units: one per sentence, each remembering which block and which sentence it is on screen
   { t:text to speak, i:block index, part:'t'|'a', j:sentence index (-1 = the whole block) }  */
function lesSpeakUnits(n){
  const L = (D.lesson || {})[n];
  if (!L) return [];
  const out = [];
  let di = 0, qi = 0;
  const push = (t, i, part, j) => { if (String(t).trim()) out.push({ t:String(t), i, part, j }); };
  /* a whole block: the first sentence gets the spoken lead-in, the rest are read as they are, indexed like the screen */
  const block = (raw, i, part, lead, drop) => {
    const ss = plainSents(raw);
    ss.forEach((s, j) => {
      let x = s;
      if (j === 0){ if (drop) x = x.replace(drop, ''); x = (lead || '') + x; }
      push(x, i, part, j);
    });
  };
  L.blocks.forEach((b, i) => {
    const t = b[1];
    switch (b[0]){
      case 'h': {                                   // "1. A Letter with No Signature" -> "Part one. A Letter with No Signature."
        const m = String(t).match(/^(\d+)\.\s*(.*)$/);
        push(m ? `Part ${numWord(m[1])}. ${endDot(m[2])}` : endDot(t), i, 't', -1);
        break;
      }
      case 'd':                                     // “Think deeper”: a question and its answer
        push(DEEP_LEAD[di % DEEP_LEAD.length] + t[0], i, 'q', -1);
        block(t[1], i, 'a', DEEP_ANS[di % DEEP_ANS.length]);
        di++;
        break;
      case 's': {                                   // a Three Transformations heading (the minutes in parentheses are not read)
        const s = String(t).replace(/\s*\([^)]*\)/g, '').replace(/\s*\|\s*/g, ': ').trim();
        push(/^Closing/i.test(s) ? 'Let’s close.' : `Next comes ${endDot(s)}`, i, 't', 0);
        break;
      }
      case 't': {                                   // [See] [Listen] [Think] [Speak] [Do]
        const m = String(t).match(/^\[(.+?)\]\s*(.*)$/);
        push(m ? `This step is ‘${m[1]}’: ${endDot(m[2])}` : endDot(t), i, 't', 0);
        break;
      }
      case 'm':                                     // leader's guide / leader's note: already labelled in the text
        if (/^Priority markers/i.test(String(t))) break;   // the stars are marks on paper; reading them aloud means nothing
        block(t, i, 't');
        break;
      case 'n': {                                   // "1. ★★★ question" -> "Question one. question"
        const m = String(t).match(/^(\d+)\./);
        qi = m ? +m[1] : qi + 1;
        const must = /\[(?:Must do|Required)\]/.test(String(t));
        block(t, i, 't', `Question ${numWord(qi)}. ${must ? 'This one is a must-do. ' : ''}`, /^\d+\.\s*(★+)?\s*(\[(?:Must do|Required)\])?\s*/);
        break;
      }
      default:
        block(t, i, 't');
    }
  });
  return out;
}
/* Merge units into the pieces fetched as one audio request: within a block, keep merging until a piece
   reaches about 180 characters. Too small and playback keeps waiting on the network; too large and it is
   slow to start. Each piece remembers which on-screen sentences it covers. */
function lesSegs(n){
  const us = lesSpeakUnits(n), segs = [];
  us.forEach(u => {
    const last = segs[segs.length - 1];
    if (last && last.i === u.i && last.part === u.part && last.j0 >= 0 && u.j >= 0
        && last.t.length < 180 && last.t.length + u.t.length <= 600){
      last.t += (/\s$/.test(last.t) ? '' : ' ') + u.t; last.js.push(u.j);
    } else {
      segs.push({ t:u.t, i:u.i, part:u.part, j0:u.j, js:u.j >= 0 ? [u.j] : [] });
    }
  });
  segs.forEach(s => { s.t = sanitize(s.t); });
  return segs.filter(s => s.t);
}
const lesSpeakText = n => lesSpeakUnits(n).map(u => u.t).join('\n');
function lesTitle(n){
  const L = (D.lesson || {})[n];
  return L ? `Lesson ${n} · ${titleMain(L.title)}` : 'Lesson';
}
function lesSpeak(n){
  if (SPK.on) return stopSpeak();
  const segs = lesSegs(n);
  if (!segs.length) return toast('No teaching lesson for this chapter yet');
  playSegs(segs, lesTitle(n), n);
}
/* Download ahead: store the whole lesson's audio in IndexedDB so it can be played offline */
async function lesDownload(n){
  const segs = lesSegs(n);
  if (!segs.length) return toast('No teaching lesson for this chapter yet');
  if (!S.set.human) return toast('You’re using the device voice; there’s nothing to download');
  const b = $('#lesDl' + n);
  const chunks = segs.map(s => s.t);
  let done = 0, fail = 0;
  const paint = () => { if (b) b.textContent = `⤓ Downloading ${done}/${chunks.length}`; };
  paint();
  const CONC = 6; let next = 0;
  await new Promise(res => {
    let running = 0;
    const pump = () => {
      if (!chunks.length) return res();
      while (running < CONC && next < chunks.length){
        running++;
        ttsFetch(chunks[next++]).catch(() => { fail++; }).then(() => {
          running--; done++; paint();
          if (done === chunks.length) res(); else pump();
        });
      }
    };
    pump();
  });
  if (b) b.textContent = fail ? '⤓ Download for offline' : '✓ Downloaded';
  toast(fail ? `${fail} ${fail === 1 ? 'piece' : 'pieces'} didn’t download; please try again` : 'The whole lesson’s audio is on this device; you can listen offline');
}
/* On entering a lesson page, check whether this lesson has already been downloaded */
function lesDlCheck(n){
  const b = $('#lesDl' + n);
  if (!b || !S.set.human) return;
  const segs = lesSegs(n); if (!segs.length) return;
  const keys = segs.map(s => voiceName() + '|' + rateAttr() + '|' + s.t);
  ttsCount(keys, got => {
    const el = $('#lesDl' + n); if (!el) return;
    el.textContent = got >= keys.length ? '✓ Downloaded'
      : got ? `⤓ Download for offline (${got}/${keys.length} saved)` : '⤓ Download for offline';
  });
}

const TTS_DB = 'r321_tts-en';
function ttsDB(cb){
  try {
    if (!window.indexedDB) return cb(null);
    const r = indexedDB.open(TTS_DB, 1);
    r.onupgradeneeded = () => { try { if (!r.result.objectStoreNames.contains('a')) r.result.createObjectStore('a'); } catch(e){} };
    r.onsuccess = () => cb(r.result);
    r.onerror = () => cb(null);
  } catch(e){ cb(null); }
}
function ttsGet(k, cb){
  ttsDB(db => { if (!db) return cb(null);
    try { const q = db.transaction('a').objectStore('a').get(k);
      q.onsuccess = () => cb(q.result || null); q.onerror = () => cb(null);
    } catch(e){ cb(null); } });
}
function ttsPut(k, blob){
  ttsDB(db => { if (!db) return;
    try { db.transaction('a', 'readwrite').objectStore('a').put(blob, k); } catch(e){} });
}
function ttsCount(keys, cb){
  if (!keys.length) return cb(0);
  ttsDB(db => { if (!db) return cb(0);
    try {
      const st = db.transaction('a').objectStore('a');
      let n = 0, done = 0;
      keys.forEach(k => {
        const q = st.getKey ? st.getKey(k) : st.count(k);
        q.onsuccess = () => { if (q.result !== undefined && q.result !== 0) n++; if (++done === keys.length) cb(n); };
        q.onerror   = () => { if (++done === keys.length) cb(n); };
      });
    } catch(e){ cb(0); } });
}
async function ttsClear(){
  return new Promise(res => ttsDB(db => { if (!db) return res();
    try { const t = db.transaction('a', 'readwrite'); t.objectStore('a').clear(); t.oncomplete = () => res(); t.onerror = () => res(); }
    catch(e){ res(); } }));
}

const voiceName = () => (TTS_VOICES[S.set.voice] || TTS_VOICES.andrew).name;
const rateAttr  = () => (S.set.rate >= 0 ? '+' : '') + (S.set.rate * 5) + '%';

/* The English voices cannot pronounce Greek or Hebrew script.
   If a transliteration follows in parentheses, read only the transliteration; if there is none,
   skip the original word entirely, so each word is read once and never twice. */
const ORIG_CH  = '\\u0590-\\u05FF\\u0370-\\u03FF\\u1F00-\\u1FFF';
const ORIG_RUN = '[' + ORIG_CH + '][' + ORIG_CH + "\\s'\u2019\\-\u05be\u05f3\u05f4\u00b7]*";
const RE_ORIG_ROMAN = new RegExp(ORIG_RUN + "\\s*\\(\\s*([A-Za-z\u00c0-\u024f][A-Za-z\u00c0-\u024f'\u2019\\- ]*)\\s*\\)", 'g');
const RE_ORIG_RUN   = new RegExp(ORIG_RUN, 'g');

/* Pronunciation fixes: change only the text sent to the voice, never the text on screen.
   Add a row here whenever a word is read wrongly. */
const TTS_SAY = [
  [/\bLXX\b/g, 'Septuagint'],
  [/\be\.g\.,?\s*/g, 'for example, '],
  [/\bi\.e\.,?\s*/g, 'that is, '],
  [/\bcf\.\s*/g, 'compare '],
  [/\bvv\.\s*(?=\d)/g, 'verses '],
  [/\bv\.\s*(?=\d)/g, 'verse '],
  [/\bchs?\.\s*(?=\d)/g, 'chapter '],
];
/* SBL book abbreviations that appear before a reference, spoken in full */
const BOOKS_SAY = { Gen:'Genesis', Exod:'Exodus', Lev:'Leviticus', Num:'Numbers', Deut:'Deuteronomy',
  Josh:'Joshua', Judg:'Judges', Sam:'Samuel', Kgs:'Kings', Chr:'Chronicles', Neh:'Nehemiah', Ps:'Psalm',
  Pss:'Psalms', Prov:'Proverbs', Isa:'Isaiah', Jer:'Jeremiah', Ezek:'Ezekiel', Dan:'Daniel', Hab:'Habakkuk',
  Hag:'Haggai', Mal:'Malachi', Matt:'Matthew', Mk:'Mark', Lk:'Luke', Jn:'John', Rom:'Romans',
  Cor:'Corinthians', Gal:'Galatians', Eph:'Ephesians', Phil:'Philippians', Col:'Colossians',
  Thess:'Thessalonians', Tim:'Timothy', Tit:'Titus', Phlm:'Philemon', Heb:'Hebrews', Jas:'James',
  Pet:'Peter', Rev:'Revelation' };
const RE_BOOK = new RegExp('\\b(' + Object.keys(BOOKS_SAY).join('|') + ')\\.?\\s+(?=\\d)', 'g');

/* Clean up text before it is read aloud */
function sanitize(t){
  t = String(t || '').replace(/<[^>]+>/g, ' ');
  t = t.replace(/&nbsp;/g, ' ').replace(/&amp;/g, ' and ').replace(/&lt;|&gt;/g, ' ')
       .replace(/&quot;/g, '"').replace(/&#39;/g, '\u2019');
  // the original language is read once: the transliteration if there is one, otherwise nothing
  t = t.replace(RE_ORIG_ROMAN, ' $1 ').replace(RE_ORIG_RUN, '\u0000');
  t = t.replace(/\(\s*\u0000\s*\)/g, '\u0000');
  t = t.replace(/\s*\u0000\s*/g, ' ');
  t = t.replace(/\(\s*[,;]?\s*\)/g, ' ');
  // markdown and symbols
  t = t.replace(/\*\*/g, '').replace(/[\[\]]/g, '');
  t = t.replace(/^[ \t]*#{1,6}[ \t]*/gm, '').replace(/^[ \t]*>[ \t]?/gm, '');
  t = t.replace(/\s+·\s+/g, ', ');
  t = t.replace(/★|⚠|✓|❌|🟢|🟡|🔴|📋|📖|⚖|▸|▾|◆|💡|·/g, ' ');
  t = t.replace(/\s*\|\s*/g, ': ');
  // references spoken naturally: Heb 1:3 -> Hebrews 1 verse 3; 1:1–4 -> 1 verse 1 to 4
  t = t.replace(RE_BOOK, (m, b) => BOOKS_SAY[b] + ' ');
  t = t.replace(/\b(\d{1,3}):(\d{1,3})(?:\s*[\u2013\u2014-]{1,2}\s*(\d{1,3})(?::(\d{1,3}))?)?/g, (m, a, b, c, d) =>
    a + ' verse ' + b + (c ? (d ? ' to ' + c + ' verse ' + d : ' to ' + c) : ''));
  t = t.replace(/(\d)\s*[\u2013]\s*(\d)/g, '$1 to $2');
  t = t.replace(/\b321\b/g, 'three-two-one').replace(/\b920\b/g, 'nine-two-zero').replace(/\b235\b/g, 'two-three-five');
  TTS_SAY.forEach(r => { t = t.replace(r[0], r[1]); });
  t = t.replace(/\s+([,.!?;:])/g, '$1');
  return t.replace(/[ \t]{2,}/g, ' ').replace(/\s{2,}/g, ' ').trim();
}
/* Split for synthesis: break after . ! ? ; once a chunk reaches about 220 characters; never longer than 500 */
function ttsChunks(t){
  t = sanitize(t); if (!t) return [];
  const out = []; let buf = '';
  for (let i = 0; i < t.length; i++){
    const ch = t[i]; buf += ch;
    if ((/[.!?;]/.test(ch) && (i + 1 >= t.length || /\s/.test(t[i + 1])) || ch === '\n') && buf.length >= 220){
      out.push(buf.trim()); buf = '';
    }
  }
  if (buf.trim()) out.push(buf.trim());
  const fin = [];
  out.forEach(s => {
    while (s.length > 500){
      let k = s.lastIndexOf(' ', 500); if (k < 200) k = 500;
      fin.push(s.slice(0, k).trim()); s = s.slice(k).trim();
    }
    if (s) fin.push(s);
  });
  return fin.length ? fin : [t];
}

async function ttsFetch(piece){
  const key = voiceName() + '|' + rateAttr() + '|' + piece;
  const cached = await new Promise(r => ttsGet(key, r));
  if (cached) return cached;
  const res = await fetch(SVC.tts, { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ voice:voiceName(), rate:rateAttr(), sil:TTS_SIL.s, silc:TTS_SIL.c, sile:TTS_SIL.e, text:piece }) });
  if (!res.ok) throw new Error('TTS ' + res.status);
  const blob = await res.blob();
  ttsPut(key, blob);
  return blob;
}

function playSegs(segs, title, lesson){

         try:new Array(segs.length).fill(0),
         i:0, cur:0, lesson:lesson || 0, fail:0, running:0 };
  const els = audioPair();
  els.forEach(a => { try { a.pause(); a.removeAttribute('src'); a.load(); } catch(e){} });
  els.forEach(a => { try { a.src = SILENT_MP3; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch(e){} });
  setTimeout(() => els.forEach(a => { try { if (a !== els[0]) a.pause(); } catch(e){} }), 0);

function plFetch(k){
  if (!PL || PL.tok !== SPK.tok) return;

  PL.pend[k] = 1; PL.running++;
  ttsFetch(PL.segs[k].t).then(b => { if (PL && PL.tok === SPK.tok) PL.blobs[k] = b; },

    .then(() => {

  if (!PL || PL.tok !== SPK.tok) return;

    const ready = PL.blobs[0] && (PL.blobs[1] || PL.segs.length < 2);
    if (ready) return plPlay(0);
    if (PL.fail >= 3 && !PL.blobs[0]){
      const txt = PL.segs.map(s => s.t).join('\n');

/* Split into sentences. HTML tags are never cut, and a closing quote or bracket stays with its
   sentence. English rule: break after . ! ? (plus any closing quotes/brackets) when whitespace
   follows, except after common abbreviations and initials, or when the next word starts in
   lower case (e.g. "?” he asked"). A colon never breaks, so "1:3" stays whole.
   This one function serves both the tappable sentences and the read-aloud units. */
const SENT_ABBR = /(?:^|[\s(\u201c\u2018"'\[])(?:e\.g|i\.e|cf|vs|viz|al|ca|approx|ibid|Mr|Mrs|Ms|Dr|Rev|St|Jr|Sr|ch|chs|v|vv|ff|pp|lit|Gen|Exod|Ex|Lev|Num|Deut|Josh|Judg|Sam|Kgs|Chr|Neh|Esth|Ps|Pss|Prov|Eccl|Isa|Jer|Lam|Ezek|Dan|Hos|Obad|Mic|Nah|Hab|Zeph|Hag|Zech|Mal|Matt|Mk|Lk|Jn|Rom|Cor|Gal|Eph|Phil|Col|Thess|Tim|Tit|Phlm|Heb|Jas|Pet|Jud|Macc|Sir|Wis|[A-HJ-Z])\.$/;
const SENT_CLOSE = ['\u201d', '\u2019', ')', ']', '"', "'", '&quot;', '&#39;'];
function splitHTML(html){
  const out = []; let cur = '', depth = 0, inTag = false, tag = '';
  for (let i = 0; i < html.length; i++){
    const ch = html[i];
    if (!inTag && ch === '<'){ inTag = true; tag = '<'; cur += ch; continue; }
    if (inTag){
      cur += ch; tag += ch;
      if (ch === '>'){
        inTag = false;
        if (/^<\//.test(tag)) depth--;
        else if (!/\/>$/.test(tag) && !/^<(br|img|hr|input|wbr)\b/i.test(tag)) depth++;
      }
      continue;
    }
    cur += ch;
    if (depth !== 0) continue;                       // never split inside a tag
    if (ch !== '.' && ch !== '!' && ch !== '?') continue;
    if (ch === '.' && SENT_ABBR.test(cur.slice(-14).replace(/<[^>]*>/g, ''))) continue;
    if (ch === '.' && /^\s*\d{1,3}\.$/.test(cur.replace(/<[^>]*>/g, ''))) continue;   // list numbering "1. " at the start
    // take any closing quotes or brackets with the sentence
    let k = i + 1, tail = '';
    for (let more = true; more && k < html.length; ){
      more = false;
      for (const c of SENT_CLOSE) if (html.startsWith(c, k)){ tail += c; k += c.length; more = true; break; }
    }
    // a sentence ends only where whitespace (or the end) follows
    if (k < html.length && !/\s/.test(html[k])) continue;
    let w = k; while (w < html.length && /\s/.test(html[w])) w++;
    if (w < html.length && /[a-z]/.test(html[w])) continue;   // "?” he asked" / "e.g. this"
    cur += tail; i = k - 1;
    while (i + 1 < html.length && (html[i + 1] === ' ' || html[i + 1] === '\n')){ i++; cur += html[i]; }
    out.push(cur); cur = '';
  }
  if (cur.replace(/<[^>]*>|\s|&nbsp;/g, '').length) out.push(cur);
  else if (cur && out.length) out[out.length - 1] += cur;
  return out.length ? out : [html];
}

function sentsOf(html){

}

      x[0] === 'q' ? `<p class="qq">${esc(x[1])}</p>` :
      x[0] === 'w' ? `<p class="pause">Pause <b>${x[1]}</b> seconds</p>` :

  } else {

      (p.tip ? `<div class="tipbox"><b>💡 Leader’s note</b><br>${esc(p.tip)}</div>` : '');

function fClock(){
  const s = Math.max(0, Math.round(F.left)), over = F.left < 0;
  const t = (over ? '-' : '') + String(Math.floor(Math.abs(F.left) / 60)).padStart(2, '0') + ':' +
            String(Math.floor(Math.abs(F.left) % 60)).padStart(2, '0');
  const c = $('#fclock'); c.textContent = t; c.classList.toggle('over', F.left < 0);
}
function fTick(){
  clearInterval(FT);
  FT = setInterval(() => { if (!F) return clearInterval(FT); if (F.run) F.left--; fClock(); }, 1000);
}
function fGo(d){
  if (!F) return;

}

/* ===== Search ===== */
function vSearch(){
  setTitle('Search', false);
  const q = (R.q || '').trim();
  let h = `<div class="sect"><p class="eyebrow">Search</p>
    <input class="sbox" id="sq" placeholder="Verse, Greek, key word… (e.g. 1:8, receive, φιλοπρωτεύων)" value="${esc(q)}">
    <p class="xs muted" style="margin:8px 0 0">Searches the chapter study, the lesson manuscripts, the verse expositions, the word tracks and the contested questions.</p></div>`;
  if (q.length >= 1){
    /* English search ignores case */
    const ql = q.toLowerCase();
    const hit = (t) => !!t && String(t).toLowerCase().indexOf(ql) >= 0;
    const qre = new RegExp(esc(q).replace(/[.*+?^$(){}|[\]\\]/g, '\\$&'), 'gi');
    const mk = (t) => esc(t).replace(qre, x => '<mark>' + x + '</mark>');
    let r = '';
    // verses
    const vs = [];
    Object.keys(D.txt).forEach(c => (D.txt[c] || []).forEach((t, i) => {
      const ref = c + ':' + (i + 1);
      if (hit(t) || hit(ref)) vs.push([ref, t]);
    }));
    const ex = [];
    Object.keys(BLK).forEach(c => BLK[c].forEach(b => {
      if (hit(b.exp) || hit(b.gram) || hit(b.grk) || hit(b.key) || hit(b.lit)) ex.push(b);
    }));
    if (vs.length){ r += `<h3 class="sec">Scripture · ${vs.length}</h3>`;
      vs.slice(0, 15).forEach(v => r += `<button class="chrow" onclick="openV('${v[0]}')">
        <span class="chn">${esc(v[0])}</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(v[1])}</b></span></button>`);
      if (vs.length > 15) r += `<p class="xs muted">(Showing the first 15)</p>`; }
    const my = Object.keys(S.mk).filter(k => hit(mkText(k)) || hit(mkNote(k)));
    if (my.length){ r += `<h3 class="sec">My highlights · ${my.length}</h3>`;
      my.slice(0, 10).forEach(k => r += `<button class="chrow" onclick="mkSheet('${k}')">
        <span class="chn">✍</span><span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(mkText(k).slice(0, 110))}…</b>
        ${mkNote(k) ? `<span class="s">${mk(mkNote(k).slice(0, 90))}</span>` : ''}</span></button>`); }
    if (ex.length){ r += `<h3 class="sec">Exposition · ${ex.length}</h3>`;
      ex.slice(0, 12).forEach(b => r += `<button class="chrow" onclick="openV('${b.ch}:${b.a}')">
        <span class="chn">${b.ch}:${b.a === b.z ? b.a : b.a + '–' + b.z}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${mk(((D.txt[b.ch] || [])[b.a - 1] || '').slice(0, 90))}…</b></span></button>`);
      if (ex.length > 12) r += `<p class="xs muted">(Showing the first 12)</p>`; }
    // chapters
    const chs = CH.filter(c => hit(c.t) || hit(c.sub) || hit(c.truth) || hit(c.self) ||
      c.card.some(x => hit(x)) || c.grp.some(x => hit(x)) || c.safe.some(x => hit(x)) || hit(c.mv.t));
    if (chs.length){ r += `<h3 class="sec">Chapter studies · ${chs.length}</h3>`;
      chs.forEach(c => r += `<button class="chrow" onclick="go('course',${c.n})">
        <span class="chn">${String(c.n).padStart(2,'0')}</span>
        <span style="flex:1"><b>${mk(c.t)}</b><span class="s">${mk(c.truth)}</span></span></button>`); }
    // lesson manuscripts
    const ls = [];
    Object.keys(D.lesson || {}).forEach(k => {
      const L = D.lesson[k];
      if (hit(L.title)) { ls.push([k, L.title]); return; }
      for (const x of L.blocks){
        const parts = Array.isArray(x[1]) ? x[1] : [x[1]];   // “Think deeper” is a question and an answer
        const p = parts.find(y => hit(y));
        if (p) { ls.push([k, p]); break; }
      }
    });
    if (ls.length){ r += `<h3 class="sec">Lessons · ${ls.length}</h3>`;
      ls.slice(0, 12).forEach(x => {
        /* show the part of the paragraph around the match */
        const at = Math.max(0, String(x[1]).toLowerCase().indexOf(ql) - 40);
        const piece = String(x[1]).slice(at, at + 130);
        r += `<button class="chrow" onclick="go('course',${x[0]},'lesson')">
        <span class="chn">${String(x[0]).padStart(2,'0')}</span>
        <span style="flex:1"><b style="font-weight:400;font-size:15px;line-height:1.7">${at ? '…' : ''}${mk(piece)}${String(x[1]).length > at + 130 ? '…' : ''}</b></span></button>`; });
      if (ls.length > 12) r += `<p class="xs muted">(Showing the first 12)</p>`; }
    // word tracks
    const tk = D.tracks.filter(t => hit(t.gk) || hit(t.gl) || hit(t.tr) || hit(t.ins) || hit(t.head));
    if (tk.length){ r += `<h3 class="sec">Word tracks · ${tk.length}</h3>`;
      tk.forEach(t => r += `<button class="chrow" onclick="go('tools',0,'tracks')">
        <span class="chn">α</span><span style="flex:1"><b>${mk(t.gk)}</b><span class="s">${mk(t.gl)} &nbsp;·&nbsp; ${mk(t.ins)}</span></span></button>`); }
    // contested questions
    const is = D.issues.filter(i => hit(i.t) || hit(i.why) || hit(i.say));
    if (is.length){ r += `<h3 class="sec">Contested questions · ${is.length}</h3>`;
      is.forEach(i => r += `<button class="chrow" onclick="openIssue('${i.id}')">
        <span class="chn">⚖</span><span style="flex:1"><b>${mk(i.t)}</b><span class="s">3 John ${esc(i.r)}</span></span></button>`); }
    h += r || `<p class="sm muted" style="margin-top:18px">Nothing found for “${esc(q)}”. Try a verse (1:8), a Greek word (φιλοπρωτεύων) or a key word (receive, fellow workers, friends).</p>`;
  }
  return h;
}

      if (sh) sh.classList.remove('on');

    };
    if (typeof window.mkCard !== 'function') window.mkCard = window.mkSpanCard;
  } else if (typeof window.mkRef === 'function') {

    const REF0 = window.mkRef;
    window.mkRef = function (k) {
      const r = REF0(k);
      if (k[0] !== 'v' || sp(k) < 2) return r;
      const ks = keysOf(k), a = ks[0].split('|')[1].split(':'), z = ks[ks.length - 1].split('|')[1].split(':');
      return r.replace(/\s\S+$/, ' ' + a[0] + ':' + a[1] + (z[1] !== a[1] ? '-' + z[1] : ''));
    };
  }
  function rowHTML(k) {
    const isV = k[0] === 'v';
    return `<div class="hlrow mkspan"><span class="lb">${('Range')}</span>
      <button class="spb" data-sp="back" title="${('Add the sentence before')}">${('↑ Prev')}</button>
      <button class="spb" data-sp="-1" aria-label="One sentence fewer">−</button>
      <span class="spn" id="mkSpn">${(sp(k) + '')}</span>
      <button class="spb" data-sp="1" aria-label="One sentence more">+</button>
      ${isV ? '<button class="spb" data-sp="v">' + ('Verse') + '</button>' : ''}
      <button class="spb" data-sp="p" title="${isV ? ('The verses this exegesis covers') : ('This paragraph')}">${('Passage')}</button></div>
      <div class="mkspan-hint">${('Tap + to add the next sentence or “↑ Prev” to add the one before, so one highlight can cover a whole passage.' + (isV ? ' “Passage” covers the verses of this exegesis section.' : ''))}</div>`;
  }
  window.mkSheet = function (k) {
    MKS_SHEET(k);
    const box = $('#sheet'); if (!box) return;
    const row = box.querySelector('.hlrow') || box.querySelector('.mkq');
    if (row && !box.querySelector('.mkspan')) row.insertAdjacentHTML('afterend', rowHTML(k));
    const q0 = box.querySelector('#mkq') || box.querySelector('.mkq');
    if (q0 && sp(k) > 1) q0.textContent = clip(window.mkText(k), 400);
    box.querySelectorAll('button').forEach(b => {
      if (window.GXS && /Make a card/.test(b.textContent)) b.onclick = e => { e.stopPropagation(); window.mkSpanCard(k); };
    });
    box.querySelectorAll('[data-sp]').forEach(b => b.onclick = e => { e.stopPropagation(); spanAct(k, b.dataset.sp); });
  };
  function refresh(k, ta) {
    const box = $('#sheet');
    const q = box && (box.querySelector('#mkq') || box.querySelector('.mkq')); if (q) q.textContent = clip(window.mkText(k), 400);
    const n = box && box.querySelector('#mkSpn'); if (n) n.textContent = (sp(k) + '');
    mkKeep(k, render);
    if (ta != null) { const t = $('#mkin'); if (t) t.value = ta; }
  }
  function spanAct(k, a) {
    if (!mkHas(k)) return;
    const ta = ($('#mkin') || {}).value;
    const m = S.mk[k], was = sp(k), L = seq(k), i = L.findIndex(x => x.k === k);
    if (a === 'back') {
      if (i <= 0) return toast(('Nothing before this'));
      const pk = L[i - 1].k;
      if (mkHas(pk)) return toast(('The sentence before is already highlighted'));
      const own = document.querySelector('[data-k="' + pk + '"][data-own]');
      if (own) return toast(('The sentence before belongs to another highlight'));
      if (ta != null) m.n = ta.trim();
      S.mk[pk] = Object.assign({}, m, { sp: was + 1, at: Date.now() });
      delete S.mk[k]; save();
      mkKeep(pk, render);
      window.mkSheet(pk);
      const t = $('#mkin'); if (t) { t.value = S.mk[pk].n || ''; setTimeout(() => { try { t.blur(); } catch (e) {} }, 80); }
      toast(('Added — ' + (was + 1) + ' sentences'));
      return;
    }
    let n;
    if (a === 'v' || a === 'p') {
      n = spanTo(k, a);
      toast(n === was ? (a === 'v' ? ('The whole verse is already highlighted') : ('The whole passage is already highlighted'))
